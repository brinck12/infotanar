description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Egy **emelkedő szakasz** egymás melletti elemek olyan sorozata, amelyben minden elem szigorúan nagyobb az előzőnél (egy elem is szakasz). Írd ki a leghosszabb emelkedő szakasz hosszát (`Hossz: ...`) és az első elemének helyét 1-től számozva (`Kezdet: ...`). Egyenlő hosszúságú szakaszok közül az első számít.

  Példa bemenet:

  ```
  8
  3 5 6 2 4 7 9 1
  ```

  Kimenet:

  ```
  Hossz: 4
  Kezdet: 4
  ```

  Tipp: számold az aktuális szakasz hosszát; ha nem emelkedik a sorozat, a hossz újra 1. Közben tartsd nyilván a legjobb eddigi szakasz hosszát és kezdetét.
