  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Ut
    {
        public string Bicikli;
        public int Nap;
        public string Indulas;
        public string Erkezes;
        public int Tav;

        public Ut(string sor)
        {
            string[] r = sor.Split(';');
            Bicikli = r[0];
            Nap = int.Parse(r[1]);
            Indulas = r[2];
            Erkezes = r[3];
            Tav = int.Parse(r[4]);
        }

        public static int Percben(string ido)
        {
            string[] r = ido.Split(':');
            return int.Parse(r[0]) * 60 + int.Parse(r[1]);
        }

        public int Perc()
        {
            return Percben(Erkezes) - Percben(Indulas);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Ut> utak = new List<Ut>();
            foreach (string sor in File.ReadAllLines("utak.txt"))
            {
                utak.Add(new Ut(sor));
            }
            string bicikli = Console.ReadLine().Trim();
            List<Ut> valogatott = new List<Ut>();
            foreach (Ut u in utak)
            {
                if (u.Bicikli == bicikli)
                {
                    valogatott.Add(u);
                }
            }
            Console.WriteLine("4. feladat: " + bicikli);
            if (valogatott.Count == 0)
            {
                Console.WriteLine("Nincs ilyen bicikli.");
            }
            else
            {
                int osszeg = 0;
                foreach (Ut u in valogatott)
                {
                    Console.WriteLine(u.Nap + ". nap " + u.Indulas + "-" + u.Erkezes + " (" + u.Tav + " m)");
                    osszeg += u.Tav;
                }
                Console.WriteLine("Osszesen: " + valogatott.Count + " ut, " + osszeg + " m");
            }
        }
    }
