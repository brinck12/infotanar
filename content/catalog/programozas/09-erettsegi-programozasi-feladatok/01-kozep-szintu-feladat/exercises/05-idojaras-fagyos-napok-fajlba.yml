description: "Egy meteorológiai állomás egy hónap napi méréseit a `homerseklet.txt` fájlba mentette. Az első sor a napok száma (`n`), utána soronként egy nap adatai következnek, tabulátorral tagolva: a nap sorszáma (1-től), a napi legalacsonyabb hőmérséklet (°C), a napi legmagasabb hőmérséklet (°C) és a csapadék mennyisége (mm). Minden érték egész szám, a fájl legalább egy napot tartalmaz.\n\nMinden részfeladat kimenete a feladat sorszámával kezdődik (`N. feladat`). A kimenetben ne használj ékezetes betűt (az ékezetmentes kiírás az érettségin is elfogadott). Ahol a feladat bevitelt kér, a kérdést írd ki egy külön sorba, és csak utána olvass be.\n\nGyűjtsd ki a fagyos napokat (ahol a legalacsonyabb hőmérséklet 0 °C-nál kisebb), és írd a `fagyos.txt` fájlba soronként egy napot: a nap sorszámát és a legalacsonyabb hőmérsékletet tabulátorral elválasztva, az eredeti sorrendben. Mivel a futtatás csak a képernyőre írt kimenetet értékeli, olvasd vissza a fájlt: írd ki a `fagyos.txt tartalma:` sort,\
  \ utána a fájl sorait, végül az összes fagyos nap számát:\n\n```\nfagyos.txt tartalma:\n<nap><TAB><fok>\n...\nOsszesen: <db> nap\n```\n\nKimenet a mellékelt mintafájllal:\n\n```\n5. feladat\nfagyos.txt tartalma:\n3\t-1\n4\t-1\n10\t-3\nOsszesen: 3 nap\n```\n\nTipp: a kiválogatás eredményét előbb listába gyűjtheted, aztán írhatod ki fájlba; a tabulátor jele `\"\\t\"`.\n"
