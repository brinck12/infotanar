  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("6. feladat");
            Console.WriteLine("Az elso nap a het hanyadik napja (1-7)?");
            int elso = int.Parse(Console.ReadLine());
            int sorokSzama = (elso - 1 + napok.Count + 6) / 7;
            int[,] tabla = new int[sorokSzama, 7];
            for (int i = 0; i < sorokSzama; i++)
            {
                for (int j = 0; j < 7; j++)
                {
                    tabla[i, j] = -1;
                }
            }
            foreach (Nap n in napok)
            {
                int k = (elso - 1) + (n.Sorszam - 1);
                tabla[k / 7, k % 7] = n.Csapadek;
            }
            int[] oszlopossz = new int[7];
            for (int i = 0; i < sorokSzama; i++)
            {
                string sor = "";
                int het = 0;
                for (int j = 0; j < 7; j++)
                {
                    int v = tabla[i, j];
                    if (v < 0)
                    {
                        sor += "   -";
                    }
                    else
                    {
                        sor += v.ToString().PadLeft(4);
                        het += v;
                        oszlopossz[j] += v;
                    }
                }
                Console.WriteLine((i + 1) + ". het:" + sor + " | " + het);
            }
            int legjobb = 0;
            for (int j = 0; j < 7; j++)
            {
                if (oszlopossz[j] > oszlopossz[legjobb])
                {
                    legjobb = j;
                }
            }
            Console.WriteLine("Legcsapadekosabb hetnap: " + (legjobb + 1) + ". (" + oszlopossz[legjobb] + " mm)");
        }
    }
