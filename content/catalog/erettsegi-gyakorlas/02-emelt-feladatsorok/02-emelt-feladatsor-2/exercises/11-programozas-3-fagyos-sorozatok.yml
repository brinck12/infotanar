description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **3. feladat** (7 pont). Egy napot **fagyosnak** nevezünk, ha a minimuma 0 °C alatti. Írja ki a fagyos napok számát, majd a leghosszabb, egymást követő fagyos napokból álló sorozat hosszát és első-utolsó napját! Holtversenynél a korábbi sorozat számít. Ha nem volt fagyos nap, a kimenet a `Nem volt fagyos nap.` sor (a darabszám sor ekkor is megjelenik).

  A mintafájlra a kimenet:

  ```text
  3. feladat
  Fagyos napok szama: 3
  Leghosszabb fagyos sorozat: 3 nap (5. nap - 7. nap)
  ```

  Tipp: menet közben tartsd számon az éppen futó sorozat hosszát: fagyos napnál nő, egyébként nullázódik. Ha az aktuális hossz meghaladja az eddigi legjobbat, jegyezd fel a sorozat utolsó napját is; a kezdőnap ebből és a hosszból számolható.
