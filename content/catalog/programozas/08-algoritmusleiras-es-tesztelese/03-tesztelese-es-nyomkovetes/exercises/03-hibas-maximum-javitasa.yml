slug: hibas-maximum-javitasa
title: "Hibás maximum javítása"
position: 2
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Az alábbi program a legnagyobb számot keresi, de nem mindig jó. Futtasd a `3`, majd `-4`, `-2`, `-9` bemenetre: `-2` helyett `0`-t ír ki. Keresd meg és javítsd a hibát!

  Bemenet: az első sorban `N` (`1 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: a legnagyobb szám.

  Példa: `3`, majd `-4`, `-2`, `-9` esetén a kimenet `-2`.

  Tipp: gondold végig, mi legyen a maximum kezdőértéke, ha minden szám negatív lehet.
starter_code:
  python: |
    n = int(input())
    maxi = 0
    for _ in range(n):
        szam = int(input())
        if szam > maxi:
            maxi = szam
    print(maxi)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int max = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > max)
                {
                    max = szam;
                }
            }
            Console.WriteLine(max);
        }
    }
sample_solutions:
  python: |
    n = int(input())
    maxi = int(input())
    for _ in range(n - 1):
        szam = int(input())
        if szam > maxi:
            maxi = szam
    print(maxi)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int max = int.Parse(Console.ReadLine());
            for (int i = 1; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > max)
                {
                    max = szam;
                }
            }
            Console.WriteLine(max);
        }
    }
tests:
  - { stdin: "3\n-4\n-2\n-9\n", expected: "-2\n", hidden: false }
  - { stdin: "1\n-5\n", expected: "-5\n", hidden: true }
  - { stdin: "4\n3\n9\n2\n9\n", expected: "9\n", hidden: true }
  - { stdin: "2\n0\n-1\n", expected: "0\n", hidden: true }
  - { stdin: "3\n7\n7\n7\n", expected: "7\n", hidden: true }
