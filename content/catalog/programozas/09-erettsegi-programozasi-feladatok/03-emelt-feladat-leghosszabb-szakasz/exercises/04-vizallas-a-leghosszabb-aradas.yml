description: |
  Egy folyó vízállását naponta egyszer mérik. A `vizallas.txt` fájl első sora fejléc (`datum`, `allas`), utána minden sor egy mérés, tabulátorral tagolva: a dátum (`ÉÉÉÉ-HH-NN` alakban) és a vízállás centiméterben (egész szám). A sorok időrendben, hézag nélkül követik egymást: minden sor az előző napot követő nap mérése. A fájl legalább egy mérést tartalmaz.

  A programban egy mérést rekordként (osztályként) érdemes tárolni: dátum, vízállás. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Áradásnak nevezzük az egymást követő napok olyan szakaszát, amelyben a vízállás **minden nap nagyobb**, mint az előző napon (az első nap magában is 1 napos szakasz). Keresd meg a leghosszabb ilyen szakaszt. Hossza a napok száma, a kimenetben az első és az utolsó napja szerepel. Több egyforma hosszú szakasz esetén az előbb kezdődő számít.

  ```
  Leghosszabb emelkedes: <hossz> nap (<elso nap> - <utolso nap>)
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  4. feladat
  Leghosszabb emelkedes: 6 nap (2024-03-09 - 2024-03-14)
  ```

  Tipp: haladj végig a napokon, és tartsd számon az aktuális szakasz hosszát: ha a mai nap nagyobb a tegnapinál, növeld, különben kezdd újra 1-ről. Közben jegyezd a legjobb hosszat és a kezdőindexét.
