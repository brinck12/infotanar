slug: pontsorrend
title: Pontsorrend
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
  Az `ORDER BY` sorba rendezi az eredményt: alapból növekvő (`ASC`), a `DESC` csökkenő sorrendet ad. A rendezés a lekérdezés legvégén áll.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki a diákok **nevét és pontszámát** a **pontszám szerint csökkenő** sorrendben! A sorok sorrendje számít.

  Tipp: `ORDER BY pont DESC`
starter_code:
  sql: |
    SELECT nev, pont
    FROM diak
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT nev, pont
    FROM diak
    ORDER BY pont DESC;
