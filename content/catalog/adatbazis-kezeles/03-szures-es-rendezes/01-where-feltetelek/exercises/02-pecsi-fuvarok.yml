slug: pecsi-fuvarok
title: Pécsi fuvarok
position: 1
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Szöveget az `=` jellel hasonlítunk össze, a szöveget aposztróf közé kell tenni.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki a **Pecs** városba tartó fuvarok **rendszámát és megtett távolságát** (`km`)! A sorok sorrendje nem számít.

  Tipp: `WHERE cel = 'Pecs'` (a szöveg nagybetűit is pontosan írd).
starter_code:
  sql: |
    SELECT rendszam, km
    FROM taxi
    WHERE ;
sample_solutions:
  sql: |
    SELECT rendszam, km
    FROM taxi
    WHERE cel = 'Pecs';
