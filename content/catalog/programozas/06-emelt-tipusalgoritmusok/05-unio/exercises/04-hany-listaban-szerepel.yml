published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora a listák száma (K, legalább 1), majd K sor, mindegyikben egy nem üres, szóközzel elválasztott egész számokból álló lista. Egy listán belül egy érték többször is szerepelhet, de egy listát **egy előfordulásnak** számítunk. Írd ki az uniójukban szereplő minden értéket növekvő sorrendben, soronként `ertek: db` alakban, ahol `db` azon listák száma, amelyekben az érték szerepel.

  Példa bemenet:

  ```
  3
  1 2 3
  2 3 4
  3 3 9
  ```

  Kimenet:

  ```
  1: 1
  2: 2
  3: 3
  4: 1
  9: 1
  ```

  Tipp: minden listából készíts halmazt (így az ismétlődés nem számít), és szótárban számold, hány halmazban fordul elő az érték. A kiíráshoz rendezd a kulcsokat.
