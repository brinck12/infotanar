description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Biztosan van köztük páros szám. Írd ki az **első páros szám sorszámát** (az első szám sorszáma 1)!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám; legalább az egyik páros.

  ### Kimenet

  Egyetlen sorban az első páros szám sorszáma.

  ### Példa

  Bemenet: `5`, majd `3`, `7`, `8`, `2`, `5`. Kimenet: `3`

  Tipp: kiválasztásnál a találat biztos, ezért nem kell külön kezelni a "nincs" esetet. Az első találatnál lépj ki a ciklusból.
