name: CI

on:
  push:
  pull_request:

# Ugyanarra az ágra érkező újabb push szakítsa félbe a korábbi futást.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Típusellenőrzés
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  tests:
    name: Tesztek (Playwright E2E + API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: PHP 8.3 beállítása
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, zip, intl, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Backend függőségek telepítése
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Frontend függőségek telepítése
        working-directory: frontend
        run: npm ci

      - name: Teszt függőségek telepítése
        working-directory: tests
        run: npm ci

      - name: Tesztkód típusellenőrzése és lintelése
        working-directory: tests
        run: npm run check

      - name: Playwright böngésző telepítése
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # Egyetlen konfiguráció (tests/playwright.config.ts), három projekt:
      #   e2e-mocked      - buildelt frontend, route interceptionnel mockolt API
      #   api             - valódi helyi backend (sqlite fixture) + Judge0 mock
      #   api-rate-limit  - az "api" után, mert kimeríti a közös kvótát
      # A szükséges szervereket a Playwright webServer indítja (config/web-servers.ts).
      # Egy futtatás = egy közös HTML/JUnit riport minden projektről.
      - name: Playwright tesztek (E2E + API)
        working-directory: tests
        run: npm test

      - name: Playwright riport feltöltése
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
