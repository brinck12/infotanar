description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Döntsd el, hogy **mindegyik szám pozitív-e**! A nulla nem pozitív. A ciklusból lépj ki, amint találsz egy nem pozitív számot.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban `IGEN`, ha minden szám pozitív, egyébként `NEM`.

  ### Példa

  Bemenet: `3`, majd `4`, `1`, `7`. Kimenet: `IGEN`. Bemenet: `3`, majd `4`, `0`, `2`. Kimenet: `NEM`.

  Tipp: a "minden-e" kérdésnél az ellenpéldát keresd: a logikai változó kezdetben `True`/`true`, és az első ellenpéldánál `False`/`false` lesz, utána a ciklus `break`-kel megszakítható.
