description: |
  Az `indulasok.txt` a repülőtér egy havi (30 napos) forgalmát tartalmazza, soronként egy indulással, pontosvesszővel elválasztva: `járatszám;célállomás;távolság km;nap;indulás;utasok;késés`. A járatszám két betűből és négy számjegyből áll (pl. `MA1017`), a nap a hónap napja (1–30), az indulás `ÓÓ:PP` alakú, a késés percben értendő (0, ha pontosan indult). Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz, a sorok nincsenek sorrendben, és egy járat egy napon egy időpontban legfeljebb egyszer szerepel.

  **4. feladat.** Kérjen be egy járatszámot! Ha a járat indult a hónapban, írja ki a `4. feladat:` sort, alá az indulásait **időrendben** (nap, majd indulási idő szerint) `nap indulás utasok késés` alakban, soronként egyet. Ha nincs ilyen járat, a kimenet egyetlen sor: `4. feladat: Nincs ilyen jarat!`

  Minta (a billentyűzetről beolvasott sor):

  ```text
  MA3104
  ```

  A mintafájlra a kimenet:

  ```text
  4. feladat:
  7 06:15 155 47
  9 07:40 87 14
  20 09:05 72 50
  23 13:20 102 0
  25 20:25 167 65
  ```

  Tipp: válogasd ki a járat indulásait egy listába, majd rendezd nap és indulási idő szerint (az `ÓÓ:PP` szöveg ábécérendje megegyezik az időrenddel).
