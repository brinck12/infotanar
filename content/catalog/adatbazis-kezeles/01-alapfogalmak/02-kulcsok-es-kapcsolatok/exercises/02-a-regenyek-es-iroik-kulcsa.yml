slug: a-regenyek-es-iroik-kulcsa
title: A regények és íróik kulcsa
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A `regeny` tábla nem az író nevét tárolja, hanem az `iro_id` idegen kulcsot, amely az `iro` tábla egy rekordjára mutat. Így egy író neve csak egyszer szerepel az adatbázisban, hiába írt több regényt (1:N kapcsolat).

  A `iro` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletesi_ev` | egész |

  A `regeny` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `iro_id` | egész, idegen kulcs: `iro.id` |
  | `oldal` | egész |

  Listázd ki a `regeny` tábla minden sorából a **regény címét és az író azonosítóját** (`iro_id`), ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: csak a `regeny` táblát kell lekérdezned, az `iro` táblához nem kell nyúlnod.
starter_code:
  sql: |
    SELECT
    FROM regeny;
sample_solutions:
  sql: |
    SELECT cim, iro_id
    FROM regeny;
tests:
  - stdin: "CREATE TABLE iro (id INTEGER PRIMARY KEY, nev TEXT, szuletesi_ev INTEGER);\nINSERT INTO iro VALUES\n(1, 'Varga Dora', 1964),\n(2, 'Nagy Peter', 1960),\n(3, 'Szabo Reka', 1930),\n(4, 'Horvath Mate', 1929);\nCREATE TABLE regeny (id INTEGER PRIMARY KEY, cim TEXT, iro_id INTEGER, oldal INTEGER, FOREIGN KEY (iro_id) REFERENCES iro(id));\nINSERT INTO regeny VALUES\n(1, 'Szeleso ter', 3, 146),\n(2, 'Nyari vihar', 2, 552),\n(3, 'A tenger fiai', 3, 436),\n(4, 'Csendes folyo', 1, 448);\n"
    expected: "cim,iro_id\nSzeleso ter,3\nNyari vihar,2\nA tenger fiai,3\nCsendes folyo,1\n"
