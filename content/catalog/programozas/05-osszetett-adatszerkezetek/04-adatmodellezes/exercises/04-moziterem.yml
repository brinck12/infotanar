description: |
  Egy moziterem R sorból és soronként C székből áll. A bemenet első sora `R C`, a másodiké a már eladott jegyek száma (K), majd K sor: `sor szek` (mindkettő 1-től számozott, a helyek különbözők). Írd ki a szabad helyek számát (`Szabad: ...`), majd azt a sort, amelyben a legtöbb szabad hely van (`Legtobb szabad hely a(z) X. sorban: Y`). Egyenlőség esetén a kisebb sorszámú sor számít.

  Példa bemenet:

  ```
  3 4
  5
  1 1
  1 2
  2 4
  3 1
  3 3
  ```

  Kimenet:

  ```
  Szabad: 7
  Legtobb szabad hely a(z) 2. sorban: 3
  ```

  Tipp: a terem természetes modellje egy R × C-s `bool` rács, ahol az igaz érték a foglalt széket jelenti. A bemenet 1-től számoz, a rács 0-tól: igazítsd az indexet.
