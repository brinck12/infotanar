slug: keszlet-erteke
title: Készlet értéke
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A `SELECT` után nemcsak mezőnevet, hanem kifejezést is írhatunk: `+`, `-`, `*` és zárójelek használhatók. A kiszámított oszlop neve alapból a kifejezés lenne, ezért érdemes aliast adni.

  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `kategoria` | szöveg |
  | `ar` | egész (Ft) |
  | `keszlet` | egész (db) |

  Listázd ki minden termék **nevét** és a készlet értékét (`ar` szorozva a `keszlet`-tel) `ertek` néven! A sorok sorrendje nem számít.

  Tipp: `ar * keszlet AS ertek`
starter_code:
  sql: |
    SELECT
    FROM termek;
sample_solutions:
  sql: |
    SELECT nev, ar * keszlet AS ertek
    FROM termek;
