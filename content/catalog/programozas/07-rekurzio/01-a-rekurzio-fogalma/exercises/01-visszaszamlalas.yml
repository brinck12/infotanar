description: |
  Olvass be egy `N` egész számot (`N ≥ 0`), és írd ki **rekurzióval** a számokat `N`-től 1-ig, mindegyiket külön sorba, majd az utolsó sorba az `Indulas!` szöveget.

  Példa: ha `N = 3`, a kimenet: `3`, `2`, `1`, `Indulas!` külön sorokban. Ha `N = 0`, csak az `Indulas!` jelenik meg.

  Tipp: az alapeset az `n == 0`; az elágazás másik ágában írd ki `n`-et, majd hívd a függvényt `n - 1`-gyel.
