sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    db = 0
    for _ in range(n):
        szam = int(input())
        if szam > 0:
            osszeg += szam
            db += 1
    if db == 0:
        print("NINCS")
    else:
        print(f"{osszeg / db:.2f}")
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            int db = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > 0)
                {
                    osszeg += szam;
                    db++;
                }
            }
            if (db == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine((osszeg / (double)db).ToString("F2", CultureInfo.InvariantCulture));
            }
        }
    }
