sample_solutions:
  python: |
    def prim(n):
        if n < 2:
            return False
        i = 2
        while i * i <= n:
            if n % i == 0:
                return False
            i += 1
        return True

    for _ in range(3):
        szam = int(input())
        print("igen" if prim(szam) else "nem")
  csharp: |
    using System;

    class Program
    {
        static bool Prim(int n)
        {
            if (n < 2)
            {
                return false;
            }
            for (int i = 2; (long)i * i <= n; i++)
            {
                if (n % i == 0)
                {
                    return false;
                }
            }
            return true;
        }

        static void Main()
        {
            for (int k = 0; k < 3; k++)
            {
                int szam = int.Parse(Console.ReadLine());
                Console.WriteLine(Prim(szam) ? "igen" : "nem");
            }
        }
    }
tests:
