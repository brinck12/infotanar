sample_solutions:
  python: |
    n = int(input())
    d = 2
    while n % d != 0:
        d += 1
    print(d)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int d = 2;
            while (n % d != 0)
            {
                d++;
            }
            Console.WriteLine(d);
        }
    }
