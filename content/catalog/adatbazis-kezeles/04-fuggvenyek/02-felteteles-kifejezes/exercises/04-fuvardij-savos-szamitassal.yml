slug: fuvardij-savos-szamitassal
title: Fuvardíj sávos számítással
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    A taxi díja 700 Ft induló díj és kilométerenként 300 Ft. A 10 kilométernél hosszabb fuvaroknál az **egész útra** kilométerenként már csak 250 Ft jár (az induló díj ugyanannyi). Számold ki minden fuvar díját a megtett kilométerekből: add meg a fuvar azonosítóját (`id`) és a számított díjat (`szamolt_dij`).

    A `fuvar` tábla:

    | `id` | `rendszam` | `indulas` | `km` | `dij` | `fizetes` | `ertekeles` |
    |---|---|---|---|---|---|---|
    | 1 | ABC-123 | 2025-01-05 08:15:00 | 5 | 2200 | keszpenz | 5 |
    | 2 | DEF-456 | 2025-01-05 21:40:00 | 12 | 4300 | kartya | 4 |
    | 3 | ABC-123 | 2025-01-17 23:05:00 | 20 | 6700 | kartya | NULL |
    | 4 | GHI-789 | 2025-02-03 06:30:00 | 8 | 3100 | keszpenz | 3 |
    | 5 | DEF-456 | 2025-02-14 19:55:00 | 3 | 1600 | kartya | 5 |
    | 6 | ABC-123 | 2025-02-20 02:10:00 | 15 | 5200 | kartya | NULL |
    | 7 | GHI-789 | 2025-01-28 12:00:00 | 10 | 3700 | kartya | 4 |
    | 8 | DEF-456 | 2025-01-30 10:20:00 | 7 | 2800 | keszpenz | 2 |

    Az eredmény ezekre az adatokra:

    | `id` | `szamolt_dij` |
    |---|---|
    | 1 | 2200 |
    | 2 | 3700 |
    | 3 | 5700 |
    | 4 | 3100 |
    | 5 | 1600 |
    | 6 | 4450 |
    | 7 | 3700 |
    | 8 | 2800 |

    Tipp: a `CASE` ágaiban számítás is állhat, nem csak állandó érték.
starter_code:
  sql: |
    SELECT id,
      CASE
        -- ide jönnek az ágak
      END AS szamolt_dij
    FROM fuvar;
sample_solutions:
  sql: |
    SELECT id,
      CASE
        WHEN km <= 10 THEN 700 + km * 300
        ELSE 700 + km * 250
      END AS szamolt_dij
    FROM fuvar;
