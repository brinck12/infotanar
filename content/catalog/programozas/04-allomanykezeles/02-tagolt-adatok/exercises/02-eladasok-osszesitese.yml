sample_solutions:
  python: |
    with open("eladas.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    darab = 0
    bevetel = 0
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        db = int(mezok[1])
        ar = int(mezok[2])
        darab += db
        bevetel += db * ar
    print("Darab:", darab)
    print("Bevetel:", bevetel)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("eladas.txt");
            int darab = 0;
            int bevetel = 0;
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                int db = int.Parse(mezok[1]);
                int ar = int.Parse(mezok[2]);
                darab += db;
                bevetel += db * ar;
            }
            Console.WriteLine("Darab: " + darab);
            Console.WriteLine("Bevetel: " + bevetel);
        }
    }
