slug: atlagnal-olcsobb-pekaruk-torlese
title: Átlagnál olcsóbb pékáruk törlése
position: 3
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `kategoria` | `VARCHAR(20)` |
  | `ar` | `INT` (Ft) |
  | `keszlet` | `INT` (darab) |

  Töröld azokat a `pek` kategóriájú termékeket, amelyek ára **kisebb az összes termék átlagos áránál**! A többi `pek` termék és a többi kategória maradjon. Az átlagot a `DELETE` feltételében, allekérdezéssel add meg.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `DELETE FROM termek WHERE kategoria = 'pek' AND ar < (SELECT AVG(ar) FROM termek);` – az allekérdezés a törlés megkezdése előtt kiszámolja az átlagot.
starter_code:
  sql: |
    -- Ide írd a DELETE utasítást.

    SELECT id, nev, kategoria, ar FROM termek ORDER BY id;
sample_solutions:
  sql: |
    DELETE FROM termek WHERE kategoria = 'pek' AND ar < (SELECT AVG(ar) FROM termek);

    SELECT id, nev, kategoria, ar FROM termek ORDER BY id;
