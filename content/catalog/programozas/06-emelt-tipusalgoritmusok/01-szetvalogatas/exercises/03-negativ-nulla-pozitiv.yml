description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Válogasd három csoportba őket az eredeti sorrendet megtartva: negatívak, nullák, pozitívak. Három sort írj ki: `Negativ: ...`, `Nulla: ...`, `Pozitiv: ...`; üres csoportnál `-` álljon.

  Példa bemenet:

  ```
  7
  3 -1 0 5 -8 0 2
  ```

  Kimenet:

  ```
  Negativ: -1 -8
  Nulla: 0 0
  Pozitiv: 3 5 2
  ```

  Tipp: három lista és egy `if / elif / else`. A három lista elemszáma együtt N kell legyen.
