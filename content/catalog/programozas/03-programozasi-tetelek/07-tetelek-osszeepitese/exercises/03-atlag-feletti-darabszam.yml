description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Számold meg, **hány szám nagyobb a számok átlagánál**!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban az átlagnál szigorúan nagyobb számok darabszáma.

  ### Példa

  Bemenet: `5`, majd `1`, `2`, `3`, `4`, `10`. Kimenet: `1` (az átlag 4, csak a 10 nagyobb)

  Tipp: az átlagot csak az összes szám ismeretében tudod, ezért két menet kell: először olvasd be a számokat egy listába és összegezz, aztán a listán számold meg az átlag felettieket. A tizedes törtet elkerülheted: `szam * n > osszeg` ugyanazt jelenti, mint `szam > osszeg / n`.
