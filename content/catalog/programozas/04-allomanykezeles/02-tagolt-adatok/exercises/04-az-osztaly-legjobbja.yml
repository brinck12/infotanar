description: |
  A `tanulok.txt` fájl tabulátorral tagolt, az első sora fejléc (`nev`, `osztaly`, `pont`). A felhasználó megad egy osztályt (pl. `9a`). Írd ki, hány tanuló jár ebbe az osztályba, és ki érte el közülük a legtöbb pontot:

  ```
  Letszam: 2
  Legjobb: Csilla (91)
  ```

  Holtverseny esetén a fájlban korábbi tanuló számít. Ha nincs ilyen osztály, csak ezt írd ki: `Nincs ilyen osztaly`.

  Tipp: a legjobb keresését (maximum) csak az adott osztály sorain végezd; a létszámot számláld közben.
