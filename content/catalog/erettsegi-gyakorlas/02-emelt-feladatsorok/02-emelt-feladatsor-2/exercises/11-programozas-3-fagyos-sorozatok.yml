  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("3. feladat");
            int fagyos = 0;
            int hossz = 0;
            int legjobb = 0;
            int vege = 0;
            foreach (Nap n in napok)
            {
                if (n.Min < 0)
                {
                    fagyos++;
                    hossz++;
                    if (hossz > legjobb)
                    {
                        legjobb = hossz;
                        vege = n.Sorszam;
                    }
                }
                else
                {
                    hossz = 0;
                }
            }
            Console.WriteLine("Fagyos napok szama: " + fagyos);
            if (legjobb == 0)
            {
                Console.WriteLine("Nem volt fagyos nap.");
            }
            else
            {
                Console.WriteLine("Leghosszabb fagyos sorozat: " + legjobb + " nap (" + (vege - legjobb + 1) + ". nap - " + vege + ". nap)");
            }
        }
    }
