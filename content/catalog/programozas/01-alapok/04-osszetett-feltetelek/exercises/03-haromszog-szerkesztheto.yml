slug: haromszog-szerkesztheto
title: Háromszög szerkeszthető
position: 2
kind: code
level: kozep
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Olvasd be három szakasz hosszát (pozitív egész számok, mindegyik külön sorban). Írd ki, hogy szerkeszthető-e belőlük háromszög: `igen` vagy `nem`.

  A háromszög-egyenlőtlenség szerint háromszög akkor szerkeszthető, ha bármely két oldal összege **nagyobb**, mint a harmadik oldal. (Ha egyenlő, a háromszög elfajul, ezért az nem szerkeszthető.)

  Példa: a `3`, `4`, `5` bemenetre `igen`; a `1`, `2`, `3` bemenetre `nem` a kimenet.

  Tipp: mindhárom egyenlőtlenséget ellenőrizni kell, és mindháromnak teljesülnie kell: kapcsold őket `és`-sel.
starter_code:
  python: |
    a = int(input())
    b = int(input())
    c = int(input())
    # innen folytasd
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int a = int.Parse(Console.ReadLine());
            int b = int.Parse(Console.ReadLine());
            int c = int.Parse(Console.ReadLine());
            // innen folytasd
        }
    }
sample_solutions:
  python: |
    a = int(input())
    b = int(input())
    c = int(input())
    if a + b > c and a + c > b and b + c > a:
        print("igen")
    else:
        print("nem")
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int a = int.Parse(Console.ReadLine());
            int b = int.Parse(Console.ReadLine());
            int c = int.Parse(Console.ReadLine());
            if (a + b > c && a + c > b && b + c > a)
            {
                Console.WriteLine("igen");
            }
            else
            {
                Console.WriteLine("nem");
            }
        }
    }
tests:
  - { stdin: "3\n4\n5\n", expected: "igen\n", hidden: false }
  - { stdin: "1\n2\n3\n", expected: "nem\n", hidden: true }
  - { stdin: "10\n1\n1\n", expected: "nem\n", hidden: true }
  - { stdin: "1\n10\n1\n", expected: "nem\n", hidden: true }
  - { stdin: "1\n1\n10\n", expected: "nem\n", hidden: true }
  - { stdin: "5\n5\n5\n", expected: "igen\n", hidden: true }
  - { stdin: "2\n2\n3\n", expected: "igen\n", hidden: true }
