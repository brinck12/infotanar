sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    m = int(input())
    b = [int(x) for x in input().split()]
    unio = []
    for x in a:
        if x not in unio:
            unio.append(x)
    for x in b:
        if x not in unio:
            unio.append(x)
    print("Unio: " + " ".join(str(x) for x in unio))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<int> Beolvas()
        {
            Console.ReadLine();
            var lista = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                lista.Add(int.Parse(s));
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            var unio = new List<int>();
            foreach (int x in a)
            {
                if (!unio.Contains(x))
                {
                    unio.Add(x);
                }
            }
            foreach (int x in b)
            {
                if (!unio.Contains(x))
                {
                    unio.Add(x);
                }
            }
            Console.WriteLine("Unio: " + string.Join(" ", unio));
        }
    }
