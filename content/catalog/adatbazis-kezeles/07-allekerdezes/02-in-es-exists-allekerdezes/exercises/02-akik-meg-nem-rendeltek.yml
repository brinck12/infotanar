slug: akik-meg-nem-rendeltek
title: Akik még nem rendeltek
position: 1
kind: sql
level: emelt
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `vevo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `varos` | szöveg |

  A `rendeles` tábla (a `vevo_id` a `vevo` tábla `id` oszlopára mutat):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `vevo_id` | egész, idegen kulcs |
  | `osszeg` | egész (Ft) |

  Listázd ki azoknak a vevőknek a nevét és városát (**nev, varos**), akik **még egyszer sem rendeltek**! Használj `NOT IN` operátort allekérdezéssel. A sorok sorrendje nem számít.

  Tipp: `WHERE id NOT IN (SELECT vevo_id FROM rendeles)`
starter_code:
  sql: |
    SELECT nev, varos
    FROM vevo
    WHERE id  (SELECT vevo_id FROM rendeles);
sample_solutions:
  sql: |
    SELECT nev, varos
    FROM vevo
    WHERE id NOT IN (SELECT vevo_id FROM rendeles);
