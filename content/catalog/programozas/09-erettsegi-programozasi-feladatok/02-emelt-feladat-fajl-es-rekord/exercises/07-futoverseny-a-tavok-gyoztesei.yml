description: "Egy atlétikai versenyen a futók eredményeit a `verseny.txt` fájl tartalmazza. Az első sor fejléc (`nev`, `orszag`, `tav`, `ido`), utána minden sor egy eredmény, tabulátorral tagolva: a versenyző neve (ékezet nélkül, szóközt tartalmazhat), az országkód (három nagybetű), a táv méterben (100, 200 vagy 400) és az elért idő másodpercben, két tizedesjegyes tizedestörtként (pontokkal, pl. `11.52`). Egy versenyző több távon is indulhatott, ezért a neve többször szerepelhet, mindig ugyanazzal az országkóddal és különböző távval. A fájl legalább egy eredményt tartalmaz.\n\nA programban egy eredményt rekordként (osztályként) érdemes tárolni: név, ország, táv, idő. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.\n\nMinden távhoz keresd meg a győztest (a legkisebb idő; holtversenynél az előbb szereplő). A győzteseket írd a `gyoztesek.txt` fájlba a\
  \ távok fájlbeli első előfordulásának sorrendjében, soronként: táv, név, országkód, idő (két tizedesjegy), tabulátorral elválasztva. Olvasd vissza a fájlt, és írd ki:\n\n```\ngyoztesek.txt tartalma:\n<tav><TAB><nev><TAB><orszag><TAB><ido>\n...\n```\n\nKimenet a mellékelt mintafájllal:\n\n```\n7. feladat\ngyoztesek.txt tartalma:\n200\tFekete Mark\tHUN\t21.04\n400\tFarkas Gabor\tITA\t46.30\n100\tKovacs Adam\tGER\t10.15\n```\n\nTipp: a szótár kulcsa a táv, értéke az eddigi legjobb eredmény; a fájl sorrendjéhez a szótár beszúrási sorrendje (Python) vagy egy külön lista (C#) kell.\n"
