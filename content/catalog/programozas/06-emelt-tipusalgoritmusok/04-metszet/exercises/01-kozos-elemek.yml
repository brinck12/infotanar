            // gyűjtsd ki a közös elemeket
        }
    }
sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    m = int(input())
    b = [int(x) for x in input().split()]
    kozos = []
    for x in a:
        if x in b and x not in kozos:
            kozos.append(x)
    if len(kozos) == 0:
        print("Kozos: -")
    else:
        print("Kozos: " + " ".join(str(x) for x in kozos))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<int> Beolvas()
        {
            Console.ReadLine();
            var lista = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                lista.Add(int.Parse(s));
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            var kozos = new List<int>();
            foreach (int x in a)
            {
                if (b.Contains(x) && !kozos.Contains(x))
                {
                    kozos.Add(x);
                }
            }
            if (kozos.Count == 0)
            {
                Console.WriteLine("Kozos: -");
            }
            else
            {
                Console.WriteLine("Kozos: " + string.Join(" ", kozos));
            }
        }
    }
tests:
  - { stdin: "5\n4 1 7 4 9\n4\n9 4 6 1\n", expected: "Kozos: 4 1 9\n", hidden: false }
  - { stdin: "1\n5\n1\n5\n", expected: "Kozos: 5\n", hidden: true }
  - { stdin: "3\n1 2 3\n3\n4 5 6\n", expected: "Kozos: -\n", hidden: true }
  - { stdin: "6\n3 3 3 2 2 1\n4\n2 2 3 3\n", expected: "Kozos: 3 2\n", hidden: true }
  - { stdin: "3\n-1 0 1\n3\n1 0 -1\n", expected: "Kozos: -1 0 1\n", hidden: true }
