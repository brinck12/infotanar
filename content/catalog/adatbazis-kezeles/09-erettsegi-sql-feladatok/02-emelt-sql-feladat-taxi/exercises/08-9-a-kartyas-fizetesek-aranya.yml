slug: 9-a-kartyas-fizetesek-aranya
title: 9. A kártyás fizetések aránya
position: 7
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletes` | egész, a születési év |
  | `angol` | egész: 1, ha beszél angolul, különben 0 |
  | `nemet` | egész: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | egész, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `sofor_id` | egész, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | szöveg, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `km` | egész, a megtett út kilométerben |
  | `ar` | egész, a fuvar ára forintban |
  | `fizetes` | szöveg: `kartya` vagy `keszpenz` |

  **9. feladat.** Adja meg lekérdezéssel, hogy hány fuvar volt **kártyával fizetve**, és ez az összes fuvar hány **százaléka**, **egész százalékra kerekítve**! Az eredmény két oszlop legyen ebben a sorrendben: `kartyas` és `szazalek`. A feltételes számláláshoz használja a `CASE` kifejezést.
starter_code:
  sql: |
    SELECT SUM(CASE WHEN  THEN 1 ELSE 0 END) AS kartyas,
           CAST(ROUND(100.0 * ) AS INTEGER) AS szazalek
    FROM fuvar;
sample_solutions:
  sql: |
    SELECT SUM(CASE WHEN fizetes = 'kartya' THEN 1 ELSE 0 END) AS kartyas,
           CAST(ROUND(100.0 * SUM(CASE WHEN fizetes = 'kartya' THEN 1 ELSE 0 END) / COUNT(*)) AS INTEGER) AS szazalek
    FROM fuvar;
