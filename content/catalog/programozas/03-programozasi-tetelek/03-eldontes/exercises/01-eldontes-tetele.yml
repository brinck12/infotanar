sample_solutions:
  python: |
    n = int(input())
    van = False
    for _ in range(n):
        szam = int(input())
        if szam < 0:
            van = True
    print('IGEN' if van else 'NEM')
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            bool van = false;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam < 0)
                {
                    van = true;
                }
            }
            Console.WriteLine(van ? "IGEN" : "NEM");
        }
    }
