sample_solutions:
  python: |
    n = int(input())
    mind = True
    for _ in range(n):
        szam = int(input())
        if szam <= 0:
            mind = False
            break
    print('IGEN' if mind else 'NEM')
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            bool mind = true;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam <= 0)
                {
                    mind = false;
                    break;
                }
            }
            Console.WriteLine(mind ? "IGEN" : "NEM");
        }
    }
