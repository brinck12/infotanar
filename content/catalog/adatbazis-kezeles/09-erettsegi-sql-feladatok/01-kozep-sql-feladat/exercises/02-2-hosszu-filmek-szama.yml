slug: 2-hosszu-filmek-szama
title: 2. Hosszú filmek száma
position: 1
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages:
- sql
description: |
  Egy filmadatbázis két táblából áll.

  A `mufaj` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` (pl. `vigjatek`, `drama`, `akcio`, `scifi`, `animacio`) |

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `cim` | `VARCHAR(50)` |
  | `ev` | `INT`, a bemutató éve |
  | `hossz` | `INT`, a játékidő percben |
  | `mufaj_id` | `INT`, a `mufaj` tábla `id` oszlopára mutat |
  | `ertekeles` | `INT`, 1 és 10 között |

  **2. feladat.** Adja meg lekérdezéssel, hogy hány film **hosszabb 120 percnél**! A lekérdezés egyetlen oszlopot adjon, amelynek neve `darab`.
starter_code:
  sql: |
    SELECT  AS darab
    FROM film
    WHERE ;
sample_solutions:
  sql: |
    SELECT COUNT(*) AS darab
    FROM film
    WHERE hossz > 120;
