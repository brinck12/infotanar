slug: uj-e-mail-cim
title: Új e-mail-cím
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Az iskola e-mail-tartománya `@suli.hu`-ról `@iskola.hu`-ra változik. A tárolt címek vegyesen írtak (pl. `Kiss.Anna@SULI.hu`). Listázd a diák nevét (`nev`) és az új címét (`ujcim`): a teljes cím legyen kisbetűs, és a `@suli.hu` végződés helyett `@iskola.hu` álljon.

    A `diak` tábla:

    | `id` | `nev` | `email` | `osztaly` | `atlag` | `pont_elozo` | `pont_most` |
    |---|---|---|---|---|---|---|
    | 1 | Kiss Anna | Kiss.Anna@SULI.hu | 10.A | 4.567 | 62 | 75 |
    | 2 | Nagy Bela | Nagy.Bela@SULI.hu | 10.B | 3.842 | 70 | 66 |
    | 3 | Toth Csaba | Toth.Csaba@SULI.hu | 10.A | 3.125 | 55 | 41 |
    | 4 | Szabo Dora | Szabo.Dora@SULI.hu | 11.A | 4.918 | 80 | 92 |

    Az eredmény ezekre az adatokra:

    | `nev` | `ujcim` |
    |---|---|
    | Kiss Anna | kiss.anna@iskola.hu |
    | Nagy Bela | nagy.bela@iskola.hu |
    | Toth Csaba | toth.csaba@iskola.hu |
    | Szabo Dora | szabo.dora@iskola.hu |

    Tipp: előbb alakítsd kisbetűssé a címet, és a kapott szövegben cserélj: függvény a függvényben is állhat.
starter_code:
  sql: |
    SELECT nev,
      AS ujcim
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev, REPLACE(LOWER(email), '@suli.hu', '@iskola.hu') AS ujcim
    FROM diak;
