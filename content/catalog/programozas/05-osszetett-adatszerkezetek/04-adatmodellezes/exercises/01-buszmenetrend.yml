sample_solutions:
  python: |
    from dataclasses import dataclass

    def percre(ido):
        resz = ido.split(":")
        return int(resz[0]) * 60 + int(resz[1])

    @dataclass
    class Jarat:
        szam: str
        indulas: int
        erkezes: int

        def menetido(self):
            return self.erkezes - self.indulas

    n = int(input())
    jaratok = []
    for _ in range(n):
        resz = input().split(";")
        jaratok.append(Jarat(resz[0], percre(resz[1]), percre(resz[2])))
    leghosszabb = jaratok[0]
    osszes = 0
    for j in jaratok:
        osszes += j.menetido()
        if j.menetido() > leghosszabb.menetido():
            leghosszabb = j
    print("Leghosszabb: " + leghosszabb.szam + " (" + str(leghosszabb.menetido()) + " perc)")
    print("Osszes menetido: " + str(osszes) + " perc")
  csharp: |
    using System;
    using System.Collections.Generic;

    class Jarat
    {
        public string Szam;
        public int Indulas;
        public int Erkezes;

        public int Menetido()
        {
            return Erkezes - Indulas;
        }
    }

    class Program
    {
        static int Percre(string ido)
        {
            string[] resz = ido.Split(':');
            return int.Parse(resz[0]) * 60 + int.Parse(resz[1]);
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var jaratok = new List<Jarat>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                jaratok.Add(new Jarat { Szam = resz[0], Indulas = Percre(resz[1]), Erkezes = Percre(resz[2]) });
            }
            var leghosszabb = jaratok[0];
            int osszes = 0;
            foreach (var j in jaratok)
            {
                osszes += j.Menetido();
                if (j.Menetido() > leghosszabb.Menetido())
                {
                    leghosszabb = j;
                }
            }
            Console.WriteLine("Leghosszabb: " + leghosszabb.Szam + " (" + leghosszabb.Menetido() + " perc)");
            Console.WriteLine("Osszes menetido: " + osszes + " perc");
        }
    }
