description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Minden szám beolvasása után írd ki a **eddigi számok összegét**, külön sorba. Az eredmény így `N` sor lesz.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  `N` sor: az `i`-edik sorban az első `i` szám összege.

  ### Példa

  Bemenet: `4`, majd `3`, `1`, `4`, `1`. Kimenet: `3`, `4`, `8`, `9` (külön sorokban).

  Tipp: az összegző változót ne a ciklus után, hanem a ciklusmagban is írd ki.
