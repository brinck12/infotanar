        static List<int> Beolvas()
        {
            Console.ReadLine();
            var lista = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                lista.Add(int.Parse(s));
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            // két mutatóval keresd a közös elemeket, és számold az összehasonlításokat
        }
    }
sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    m = int(input())
    b = [int(x) for x in input().split()]
    i = 0
    j = 0
    osszehasonlitas = 0
    kozos = []
    while i < n and j < m:
        osszehasonlitas += 1
        if a[i] == b[j]:
            kozos.append(a[i])
            i += 1
            j += 1
        elif a[i] < b[j]:
            i += 1
        else:
            j += 1
    if len(kozos) == 0:
        print("Kozos: -")
    else:
        print("Kozos: " + " ".join(str(x) for x in kozos))
    print("Osszehasonlitas:", osszehasonlitas)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<int> Beolvas()
        {
            Console.ReadLine();
            var lista = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                lista.Add(int.Parse(s));
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            int i = 0;
            int j = 0;
            int osszehasonlitas = 0;
            var kozos = new List<int>();
            while (i < a.Count && j < b.Count)
            {
                osszehasonlitas++;
                if (a[i] == b[j])
                {
                    kozos.Add(a[i]);
                    i++;
                    j++;
                }
                else if (a[i] < b[j])
                {
                    i++;
                }
                else
                {
                    j++;
                }
            }
            if (kozos.Count == 0)
            {
                Console.WriteLine("Kozos: -");
            }
            else
            {
                Console.WriteLine("Kozos: " + string.Join(" ", kozos));
            }
            Console.WriteLine("Osszehasonlitas: " + osszehasonlitas);
        }
    }
tests:
