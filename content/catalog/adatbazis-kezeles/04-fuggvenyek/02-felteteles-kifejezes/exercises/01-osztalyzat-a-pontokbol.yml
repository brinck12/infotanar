slug: osztalyzat-a-pontokbol
title: Osztályzat a pontokból
position: 0
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    A `dolgozat` táblában a diákok pontszáma 0 és 100 között van. Add meg minden diák nevét (`nev`) és jegyét (`jegy`): 85 ponttól 5-ös, 70-től 4-es, 55-től 3-as, 40-től 2-es, az alatt 1-es.

    A `dolgozat` tábla:

    | `id` | `nev` | `pont` |
    |---|---|---|
    | 1 | Kiss Anna | 92 |
    | 2 | Nagy Bela | 70 |
    | 3 | Toth Csaba | 54 |
    | 4 | Szabo Dora | 40 |
    | 5 | Varga Fanni | 23 |

    Az eredmény ezekre az adatokra:

    | `nev` | `jegy` |
    |---|---|
    | Kiss Anna | 5 |
    | Nagy Bela | 4 |
    | Toth Csaba | 2 |
    | Szabo Dora | 2 |
    | Varga Fanni | 1 |

    Tipp: a `CASE` az első igaz `WHEN` ágat választja, ezért a feltételeket felülről lefelé, szigorúbbtól a lazább felé írd.
starter_code:
  sql: |
    SELECT nev,
      CASE
        WHEN pont >= 85 THEN 5
        -- folytasd
      END AS jegy
    FROM dolgozat;
sample_solutions:
  sql: |
    SELECT nev,
      CASE
        WHEN pont >= 85 THEN 5
        WHEN pont >= 70 THEN 4
        WHEN pont >= 55 THEN 3
        WHEN pont >= 40 THEN 2
        ELSE 1
      END AS jegy
    FROM dolgozat;
tests:
  - stdin: |
      CREATE TABLE dolgozat (id INTEGER PRIMARY KEY, nev TEXT, pont INTEGER);
      INSERT INTO dolgozat VALUES (1, 'Kiss Anna', 92);
      INSERT INTO dolgozat VALUES (2, 'Nagy Bela', 70);
      INSERT INTO dolgozat VALUES (3, 'Toth Csaba', 54);
      INSERT INTO dolgozat VALUES (4, 'Szabo Dora', 40);
      INSERT INTO dolgozat VALUES (5, 'Varga Fanni', 23);
    expected: |
      nev,jegy
      Kiss Anna,5
      Nagy Bela,4
      Toth Csaba,2
      Szabo Dora,2
      Varga Fanni,1
