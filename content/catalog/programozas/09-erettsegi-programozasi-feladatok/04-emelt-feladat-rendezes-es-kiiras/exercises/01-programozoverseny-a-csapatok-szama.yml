description: |
  Egy iskolai programozóversenyen a csapatok eredményeit a `csapatok.txt` fájl tartalmazza. Az első sor fejléc (`csapat`, `varos`, `megoldott`, `buntetes`), utána minden sor egy csapat, tabulátorral tagolva: a csapat neve (ékezet nélkül, szóközt tartalmazhat), a város neve (ékezet nélkül, egyetlen szó), a megoldott feladatok száma és a büntetőpercek száma (mindkettő egész szám). Egy csapat egyszer szerepel. A fájl legalább egy csapatot tartalmaz.

  A **rangsorban** az a csapat áll előbb, amelyik több feladatot oldott meg; azonos számú megoldás esetén a kevesebb büntetőperces; ha ez is azonos, a fájlban előbb szereplő. A programban egy csapatot rekordként (osztályként) érdemes tárolni. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Írd ki a csapatok számát, a fájl első és utolsó csapatának nevét és városát.

  ```
  Csapatok szama: <db>
  Elso csapat: <nev> (<varos>)
  Utolso csapat: <nev> (<varos>)
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  1. feladat
  Csapatok szama: 12
  Elso csapat: Alfa Kod (Szeged)
  Utolso csapat: Lusta Lambda (Debrecen)
  ```

  Tipp: a sorok száma a fejléc nélkül a csapatok száma; a lista első és utolsó elemét indexszel éred el.
starter_code:
  python: |
    class Csapat:
        def __init__(self, nev, varos, megoldott, buntetes):
            self.nev = nev
            self.varos = varos
            self.megoldott = megoldott
            self.buntetes = buntetes
    print("1. feladat")
    with open("csapatok.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    csapatok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        csapatok.append(Csapat(r[0], r[1], int(r[2]), int(r[3])))
    # ide írd a megoldást
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("1. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            // ide írd a megoldást
        }
    }
