slug: nagy-rendelest-leado-vevok
title: Nagy rendelést leadó vevők
position: 2
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  A `vevo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `varos` | szöveg |

  A `rendeles` tábla (a `vevo_id` a `vevo` tábla `id` oszlopára mutat):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `vevo_id` | egész, idegen kulcs |
  | `osszeg` | egész (Ft) |

  Listázd ki azoknak a vevőknek a nevét (**nev**), akiknek van **20 000 Ft-nál nagyobb** értékű rendelésük! Használj `EXISTS` operátort **korrelált** allekérdezéssel: az allekérdezés a külső lekérdezés aktuális vevőjére hivatkozik. Minden vevő legfeljebb egyszer szerepeljen. A sorok sorrendje nem számít.

  Tipp: `WHERE EXISTS (SELECT 1 FROM rendeles WHERE rendeles.vevo_id = vevo.id AND osszeg > 20000)`
starter_code:
  sql: |
    SELECT nev
    FROM vevo
    WHERE EXISTS (SELECT 1 FROM rendeles WHERE );
sample_solutions:
  sql: |
    SELECT nev
    FROM vevo
    WHERE EXISTS (SELECT 1 FROM rendeles WHERE rendeles.vevo_id = vevo.id AND osszeg > 20000);
