slug: masolas-lekerdezesbol
title: Másolás lekérdezésből
position: 3
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  A `kiemelt` táblában (`id` egész elsődleges kulcs, `nev` szöveg, `pont` egész) a legjobb diákokat gyűjtjük, kezdetben üres. Másold bele az `INSERT INTO ... SELECT ...` formával a `diak` tábla azon sorait (**nev, pont**), ahol a pontszám **legalább 80**! Az `id`-t az adatbázis adja.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `INSERT INTO kiemelt (nev, pont) SELECT nev, pont FROM diak WHERE ...;` – itt nincs `VALUES`.
starter_code:
  sql: |
    -- Ide írd az INSERT utasítást.

    SELECT nev, pont FROM kiemelt ORDER BY id;
sample_solutions:
  sql: |
    INSERT INTO kiemelt (nev, pont)
    SELECT nev, pont FROM diak WHERE pont >= 80;

    SELECT nev, pont FROM kiemelt ORDER BY id;
