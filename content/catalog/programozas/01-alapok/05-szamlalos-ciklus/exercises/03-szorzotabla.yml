slug: szorzotabla
title: Szorzótábla
position: 2
kind: code
level: kozep
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Olvass be egy egész számot (`n`), és írd ki a szorzótábláját 1-től 10-ig, soronként egyet, pontosan ebben a formában:

  ```
  n * i = szorzat
  ```

  Példa: ha a bemenet `3`, a kimenet első két sora:

  ```
  3 * 1 = 3
  3 * 2 = 6
  ```

  és így tovább, `3 * 10 = 30`-ig. A szám lehet nulla vagy negatív is.

  Tipp: a szöveget összefűzheted a számokkal; Pythonban a számot előbb `str(...)`-rel alakítsd szöveggé.
starter_code:
  python: |
    n = int(input())
    # ide írd a megoldást
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            var n = int.Parse(Console.ReadLine());
            // ide írd a megoldást
        }
    }
sample_solutions:
  python: |
    n = int(input())
    for i in range(1, 11):
        print(str(n) + " * " + str(i) + " = " + str(n * i))
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            var n = int.Parse(Console.ReadLine());
            for (int i = 1; i <= 10; i++)
            {
                Console.WriteLine($"{n} * {i} = {n * i}");
            }
        }
    }
