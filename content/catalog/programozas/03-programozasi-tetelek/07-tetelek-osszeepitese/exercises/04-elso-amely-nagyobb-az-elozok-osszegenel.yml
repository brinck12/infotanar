description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Keresd meg az **első olyan számot a második helytől kezdve, amely nagyobb az előtte álló összes szám összegénél**, és írd ki a sorszámát (az első szám sorszáma 1)! Ha nincs ilyen szám, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a sorszám, vagy `NINCS`.

  ### Példa

  Bemenet: `5`, majd `5`, `2`, `1`, `9`, `30`. Kimenet: `4` (a 9 nagyobb, mint `5 + 2 + 1 = 8`)

  Tipp: ez összegzés és keresés egy ciklusban. Minden szám vizsgálata után add hozzá az összeghez, de **előbb** hasonlítsd az eddigi összeghez.
