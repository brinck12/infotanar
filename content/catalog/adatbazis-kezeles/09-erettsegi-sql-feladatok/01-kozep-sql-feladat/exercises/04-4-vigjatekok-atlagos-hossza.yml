slug: 4-vigjatekok-atlagos-hossza
title: 4. Vígjátékok átlagos hossza
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy filmadatbázis két táblából áll.

  A `mufaj` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg (pl. `vigjatek`, `drama`, `akcio`, `scifi`, `animacio`) |

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `ev` | egész, a bemutató éve |
  | `hossz` | egész, a játékidő percben |
  | `mufaj_id` | egész, a `mufaj` tábla `id` oszlopára mutat |
  | `ertekeles` | egész, 1 és 10 között |

  **4. feladat.** Adja meg lekérdezéssel a **vígjátékok** (`vigjatek` műfajú filmek) átlagos játékidejét percben, **egész számra kerekítve**! A lekérdezés egyetlen oszlopot adjon, amelynek neve `atlag`. A műfaj nevét a `mufaj` táblából kell kiolvasni, ezért kapcsolja össze a két táblát!
starter_code:
  sql: "SELECT CAST(ROUND(AVG(film.hossz)) AS INTEGER) AS atlag\nFROM film INNER JOIN mufaj ON \nWHERE ;\n"
sample_solutions:
  sql: |
    SELECT CAST(ROUND(AVG(film.hossz)) AS INTEGER) AS atlag
    FROM film INNER JOIN mufaj ON film.mufaj_id = mufaj.id
    WHERE mufaj.nev = 'vigjatek';
