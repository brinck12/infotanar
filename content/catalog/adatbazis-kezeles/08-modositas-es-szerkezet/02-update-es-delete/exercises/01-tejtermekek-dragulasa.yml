slug: tejtermekek-dragulasa
title: Tejtermékek drágulása
position: 0
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `kategoria` | `VARCHAR(20)` |
  | `ar` | `INT` (Ft) |
  | `keszlet` | `INT` (darab) |

  A `tej` kategóriájú termékek ára **10%-kal nő**. Írj `UPDATE` utasítást, amely csak ezeknek a soroknak az árát módosítja! Az árak mind tízzel oszthatók, ezért az `ar * 110 / 100` pontosan egész szám (a `/` osztás tizedes eredményt adhat, de itt nincs maradék).

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `UPDATE termek SET ar = ar * 110 / 100 WHERE ...;` – ha elhagyod a `WHERE`-t, minden sor megváltozik!
starter_code:
  sql: |
    -- Ide írd az UPDATE utasítást.

    SELECT id, nev, kategoria, ar, keszlet FROM termek ORDER BY id;
sample_solutions:
  sql: |
    UPDATE termek SET ar = ar * 110 / 100 WHERE kategoria = 'tej';

    SELECT id, nev, kategoria, ar, keszlet FROM termek ORDER BY id;
