sample_solutions:
  python: |
    def beker(kerdes, also, felso):
        while True:
            szam = int(input(kerdes))
            if also <= szam <= felso:
                return szam
            print("Hibas adat!")

    print("1. feladat")
    n = beker("Hany jegye van (1-5)? ", 1, 5)
    print("2. feladat")
    osszeg = 0
    for i in range(1, n + 1):
        osszeg = osszeg + beker(str(i) + ". jegy (1-5): ", 1, 5)
    print("3. feladat")
    print(f"Az atlag: {osszeg / n:.2f}")
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static int Beker(string kerdes, int also, int felso)
        {
            while (true)
            {
                Console.Write(kerdes);
                int szam = int.Parse(Console.ReadLine());
                if (szam >= also && szam <= felso)
                {
                    return szam;
                }
                Console.WriteLine("Hibas adat!");
            }
        }

        static void Main()
        {
            Console.WriteLine("1. feladat");
            int n = Beker("Hany jegye van (1-5)? ", 1, 5);
            Console.WriteLine("2. feladat");
            int osszeg = 0;
            for (int i = 1; i <= n; i++)
            {
                osszeg = osszeg + Beker(i + ". jegy (1-5): ", 1, 5);
            }
            Console.WriteLine("3. feladat");
            double atlag = (double)osszeg / n;
            Console.WriteLine(string.Format(CultureInfo.InvariantCulture, "Az atlag: {0:F2}", atlag));
        }
    }
