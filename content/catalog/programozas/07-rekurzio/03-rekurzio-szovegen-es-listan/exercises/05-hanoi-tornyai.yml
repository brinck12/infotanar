sample_solutions:
  python: |
    def hanoi(n, honnan, hova, seged):
        if n == 0:
            return
        hanoi(n - 1, honnan, seged, hova)
        print(honnan, "->", hova)
        hanoi(n - 1, seged, hova, honnan)

    hanoi(int(input()), "A", "C", "B")
  csharp: |
    using System;

    class Program
    {
        static void Hanoi(int n, string honnan, string hova, string seged)
        {
            if (n == 0)
            {
                return;
            }
            Hanoi(n - 1, honnan, seged, hova);
            Console.WriteLine(honnan + " -> " + hova);
            Hanoi(n - 1, seged, hova, honnan);
        }

        static void Main()
        {
            Hanoi(int.Parse(Console.ReadLine()), "A", "C", "B");
        }
    }
