slug: fuvar-haszna
title: Fuvar haszna
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  Egy fuvar kilométerenként 120 Ft költséget jelent a taxisnak. A haszon a díj és a költség különbsége.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki a fuvarok **rendszámát** és a hasznát (`dij` mínusz `km` * 120) `haszon` néven! A sorok sorrendje nem számít.

  Tipp: a szorzás előbb hajtódik végre, mint a kivonás: `dij - km * 120`.
starter_code:
  sql: |
    SELECT
    FROM taxi;
sample_solutions:
  sql: |
    SELECT rendszam, dij - km * 120 AS haszon
    FROM taxi;
