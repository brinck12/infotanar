description: |
  Két rendezvény résztvevői érkeznek: az elsőn részt vevők száma (N, legalább 1), majd N sor, soronként egy név (ékezet nélkül); a másodikon részt vevők száma (M, legalább 1), majd M név. Egy rendezvény névsorában a nevek különbözők. Írd ki három sorban: hány különböző ember vett részt legalább az egyik rendezvényen (`Unio: x`), hányan vettek részt mindkettőn (`Metszet: y`), és hányan csak az elsőn (`Csak az elsoben: z`).

  Példa bemenet:

  ```
  3
  Anna
  Bence
  Csilla
  3
  Csilla
  David
  Anna
  ```

  Kimenet:

  ```
  Unio: 4
  Metszet: 2
  Csak az elsoben: 1
  ```

  Tipp: a metszet méretét meghatározva az unió mérete `N + M - metszet`, az "csak az elsőn" pedig `N - metszet`. Közvetlenül is összeszámolhatod, de az összefüggéssel ellenőrizheted magad.
