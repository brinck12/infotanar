    adat = input().split()
    s = int(adat[0])
    o = int(adat[1])
    if s < 1 or s > n or o < 1 or o > m:
        print("Terkepen kivul.")
    else:
        i = s - 1
        j = o - 1
        if terkep[i][j] == "#":
            print("Mezo: fold")
        else:
            print("Mezo: viz")
        szomszed = 0
        for di, dj in ((-1, 0), (1, 0), (0, -1), (0, 1)):
            a = i + di
            b = j + dj
            if 0 <= a < n and 0 <= b < m and terkep[a][b] == "#":
                szomszed += 1
        print("Szomszedos fold:", szomszed)
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("4. feladat");
            Console.WriteLine("Add meg a sort es az oszlopot:");
            string[] adat = Console.ReadLine().Split(' ');
            int s = int.Parse(adat[0]);
            int o = int.Parse(adat[1]);
            if (s < 1 || s > n || o < 1 || o > m)
            {
                Console.WriteLine("Terkepen kivul.");
            }
            else
            {
                int i = s - 1;
                int j = o - 1;
                if (terkep[i][j] == '#')
                {
                    Console.WriteLine("Mezo: fold");
                }
                else
                {
                    Console.WriteLine("Mezo: viz");
                }
                int[] di = { -1, 1, 0, 0 };
                int[] dj = { 0, 0, -1, 1 };
                int szomszed = 0;
                for (int k = 0; k < 4; k++)
                {
                    int a = i + di[k];
                    int b = j + dj[k];
                    if (a >= 0 && a < n && b >= 0 && b < m && terkep[a][b] == '#')
                    {
                        szomszed++;
                    }
                }
                Console.WriteLine("Szomszedos fold: " + szomszed);
            }
        }
    }
