slug: szamok-osszege-hibas-sorokkal
title: Számok összege hibás sorokkal
position: 2
kind: code
level: kozep
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  A program sorokat olvas be egészen addig, amíg a `vege` szót nem kapja (ezt a sort már nem kell feldolgozni). Minden sor egy egész szám lehet, de néha hibás adat érkezik (például `abc`, tizedestört vagy üres sor). A hibás sorokat ne számold bele az összegbe, hanem csak számold meg őket. A végén írd ki két sorban:

  ```
  Osszeg: <a jó számok összege>
  Ervenytelen: <a hibás sorok száma>
  ```

  Példa: az `5`, `abc`, `7`, `vege` bemenetre (külön sorokban):

  ```
  Osszeg: 12
  Ervenytelen: 1
  ```

  Tipp: Pythonban `try` / `except ValueError`, C#-ban `int.TryParse` kezeli a hibás szöveget. A `vege` ellenőrzése az átalakítás előtt történjen.
