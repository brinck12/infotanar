description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **6. feladat** (8 pont). A hónap csapadékát egy **kétdimenziós táblázatba** (mátrixba) kell rendezni: egy sor egy hét, egy oszlop egy hétköznap (hétfő = 1. oszlop, vasárnap = 7. oszlop). Kérje be, hogy a hónap első napja a hét hányadik napja (1-7)! A kérdést (`Az elso nap a het hanyadik napja (1-7)?`) külön sorban írja ki, csak utána olvasson be. A hónap napjait folyamatosan, a megadott oszloptól kezdve töltse a táblázatba: a sorok száma annyi, ahány hétre a hónap kiterjed.

  Írja ki a táblázatot soronként: `N. het:`, utána hét, 4 karakter szélességre jobbra igazított cella (a nap csapadéka mm-ben, vagy `-`, ha abban a cellában nincs a hónaphoz tartozó nap), majd ` | `, végül a hét csapadékösszege. A táblázat után írja ki, melyik hétköznap (oszlop) volt a legcsapadékosabb összesen (holtversenynél az első).

  Minta (3-as bevitellel, a mintafájlra):

  ```text
  6. feladat
  Az elso nap a het hanyadik napja (1-7)?
  1. het:   -   -  15  10   3   0   8 | 36
  2. het:   0   0   9   0   0   0   0 | 9
  3. het:   0  24   0   6   3  15  25 | 73
  4. het:   0  18  11  12  11   0   0 | 52
  5. het:   0   2   0   0   -   -   - | 2
  Legcsapadekosabb hetnap: 2. (44 mm)
  ```

  Tipp: a nap helye a táblázatban: ha a nulla alapú sorszám `k = (elso - 1) + (nap - 1)`, akkor a sor `k // 7`, az oszlop `k % 7`. A hiányzó cellákat tölts fel `-1`-gyel, és az összegzésnél hagyd ki őket. A cella kiírása 4 karakter szélességre: Pythonban `f"{v:4d}"`, C#-ban `v.ToString().PadLeft(4)`.
