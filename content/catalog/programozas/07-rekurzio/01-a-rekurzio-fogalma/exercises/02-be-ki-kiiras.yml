slug: be-ki-kiiras
title: "Be-ki kiírás"
position: 1
kind: code
level: emelt
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Olvass be egy `N` egész számot (`N ≥ 0`). Egy rekurzív eljárás írja ki a hívási lánc lefelé és visszafelé haladását:

  - lefelé menet, a rekurzív hívás előtt: `be K`,
  - visszafelé menet, a rekurzív hívás után: `ki K`,

  ahol `K` az aktuális paraméter. Az eljárás `n = 0` esetén nem ír ki semmit.

  Példa: ha `N = 2`, a kimenet: `be 2`, `be 1`, `ki 1`, `ki 2` külön sorokban. Ha `N = 0`, a kimenet üres.

  Tipp: a rekurzív hívás után is lehet utasítás; az csak visszalépéskor fut le.
