description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **1. feladat** (5 pont). Olvassa be a fájlt, majd írja ki a napok számát, az átlagos középhőmérsékletet (egy nap középhőmérséklete a minimum és a maximum átlaga; a havi átlag a napi középhőmérsékletek átlaga, két tizedesjegyre kerekítve), valamint a legmelegebb napot (a legnagyobb maximumot, holtversenynél a korábbit) és a leghidegebb éjszakát (a legkisebb minimumot, holtversenynél a korábbit)!

  A mintafájlra a kimenet:

  ```text
  1. feladat
  Napok szama: 30
  Atlagos kozephomerseklet: 11.93 C
  Legmelegebb nap: 19. nap (25 C)
  Leghidegebb ejszaka: 7. nap (-4 C)
  ```

  Tipp: a minimum- és maximumkiválasztásnál szigorú összehasonlítást (`>` illetve `<`) használj, így holtversenynél az első marad. Az átlaghoz elég a `min + max` összegét összeadni, és a végén osztani `2 * napok számával`.
