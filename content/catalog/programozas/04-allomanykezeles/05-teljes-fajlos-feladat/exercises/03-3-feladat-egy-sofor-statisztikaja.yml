description: |
  Az `ut.txt` fájl egy fuvarozó cég útjait tartalmazza, tabulátorral tagolva. Az első sor fejléc (`datum`, `sofor`, `km`, `perc`); minden további sor egy út: a dátum (`EEEE-HH-NN` alakban), a sofőr neve (ékezet nélkül, szóköz nélkül), a megtett kilométerek és az út ideje percben (egész számok). A fájl legalább egy utat tartalmaz.

  A felhasználó megad egy sofőrnevet. Írd ki a `3. feladat` szöveget, majd a sofőr útjainak számát és kilométereinek összegét:

  ```
  3. feladat
  Utak szama: 4
  Osszes km: 330
  ```

  Ha a sofőr nem szerepel a fájlban, a második és harmadik sor helyett ezt írd: `Nincs ilyen sofor`. A névben a kis- és nagybetű számít.

  Tipp: a nevet a program elején kérd be; a feladat számlálás és összegzés egyszerre.
