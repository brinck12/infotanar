description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a **pozitív számok összegét**! A nulla és a negatív számok nem számítanak bele.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a pozitív számok összege (ha nincs pozitív szám, `0`).

  ### Példa

  Bemenet: `5`, majd `4`, `-2`, `7`, `-1`, `3`. Kimenet: `14`

  Tipp: ez feltételes összegzés: csak akkor növeld az összeget, ha a feltétel teljesül.
