sample_solutions:
  python: |
    def osszeg(lista, i):
        if i == len(lista):
            return 0
        return lista[i] + osszeg(lista, i + 1)

    n = int(input())
    lista = []
    for _ in range(n):
        lista.append(int(input()))
    print(osszeg(lista, 0))
  csharp: |
    using System;

    class Program
    {
        static int Osszeg(int[] lista, int i)
        {
            if (i == lista.Length)
            {
                return 0;
            }
            return lista[i] + Osszeg(lista, i + 1);
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] lista = new int[n];
            for (int i = 0; i < n; i++)
            {
                lista[i] = int.Parse(Console.ReadLine());
            }
            Console.WriteLine(Osszeg(lista, 0));
        }
    }
