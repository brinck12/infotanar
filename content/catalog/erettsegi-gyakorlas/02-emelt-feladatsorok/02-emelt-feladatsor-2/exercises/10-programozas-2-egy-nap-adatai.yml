description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **2. feladat** (6 pont). Kérjen be a felhasználótól egy nap sorszámát! A kérdést (`Adja meg a nap sorszamat:`) külön sorban írja ki, csak utána olvasson be. Ha van ilyen nap, írja ki a minimumát, maximumát és a napi ingadozást (maximum mínusz minimum) a mintának megfelelően, ha nincs, a `Nincs ilyen nap.` sort. Ezután, a bevitel eredményétől függetlenül, írja ki a hónap legnagyobb napi ingadozását is (holtversenynél a korábbi nap számít).

  Minta (17-es bevitellel, a mintafájlra):

  ```text
  2. feladat
  Adja meg a nap sorszamat:
  17. nap: min 12 C, max 18 C, ingadozas 6 C
  Legnagyobb ingadozas: 15. nap (10 C)
  ```

  Tipp: a keresést ciklussal végezd: ha nem találtál napot, a keresett érték marad `None` / `null`. A bevitel `input()` / `Console.ReadLine()` után egész számmá alakítandó.
