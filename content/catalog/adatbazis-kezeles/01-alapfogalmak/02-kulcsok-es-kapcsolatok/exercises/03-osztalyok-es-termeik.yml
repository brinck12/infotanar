slug: osztalyok-es-termeik
title: Osztályok és termeik
position: 2
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Az `osztaly` tábla minden osztályról tárolja a jelét és a termet, ahol tanulnak. Az `id` itt is az elsődleges kulcs; a `diak` táblában egy `osztaly_id` idegen kulcs hivatkozna rá.

  A `osztaly` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `jel` | szöveg |
  | `terem` | egész |
  | `letszam` | egész |

  Listázd ki az osztályok **jelét és termét**, ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: az `id` és a `letszam` mezőre most nincs szükség, ne kérd le őket.
starter_code:
  sql: |
    SELECT
    FROM osztaly;
sample_solutions:
  sql: |
    SELECT jel, terem
    FROM osztaly;
