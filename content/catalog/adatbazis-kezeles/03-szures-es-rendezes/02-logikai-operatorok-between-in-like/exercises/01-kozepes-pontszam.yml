slug: kozepes-pontszam
title: Közepes pontszám
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A `BETWEEN a AND b` mindkét határt beleérti: `pont BETWEEN 50 AND 80` ugyanaz, mint `pont >= 50 AND pont <= 80`.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki azokat a diákokat (**nev, pont**), akiknek a pontszáma **50 és 80 között** van, a határokat is beleértve! A sorok sorrendje nem számít.

  Tipp: `WHERE pont BETWEEN 50 AND 80`
starter_code:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE ;
sample_solutions:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont BETWEEN 50 AND 80;
