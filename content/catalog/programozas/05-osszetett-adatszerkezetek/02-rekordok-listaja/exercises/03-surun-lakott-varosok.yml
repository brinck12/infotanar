slug: surun-lakott-varosok
title: "Sűrűn lakott városok"
position: 2
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Városok adatai: az első sor a városok száma (N, legalább 1), majd N sor: `varos;lakos;terulet`, ahol a lakosok száma és a terület (km2) egész szám. Egy város **sűrűn lakott**, ha a népsűrűsége nagyobb, mint 1000 fő/km2, vagyis `lakos > 1000 * terulet`.

  Az első sorba `Darab: k` kerüljön (a sűrűn lakott városok száma), utána soronként a nevük a bemenet sorrendjében.

  Példa bemenet:

  ```
  3
  Budapest;1700000;525
  Szeged;160000;281
  Vac;32000;12
  ```

  Kimenet:

  ```
  Darab: 2
  Budapest
  Vac
  ```

  Tipp: ez kiválogatás rekordokon; a feltétel két mezőből áll. A szorzással elkerülheted az osztást.
