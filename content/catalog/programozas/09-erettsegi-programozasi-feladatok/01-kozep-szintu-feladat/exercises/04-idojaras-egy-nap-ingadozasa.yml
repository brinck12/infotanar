description: |
  Egy meteorológiai állomás egy hónap napi méréseit a `homerseklet.txt` fájlba mentette. Az első sor a napok száma (`n`), utána soronként egy nap adatai következnek, tabulátorral tagolva: a nap sorszáma (1-től), a napi legalacsonyabb hőmérséklet (°C), a napi legmagasabb hőmérséklet (°C) és a csapadék mennyisége (mm). Minden érték egész szám, a fájl legalább egy napot tartalmaz.

  Minden részfeladat kimenete a feladat sorszámával kezdődik (`N. feladat`). A kimenetben ne használj ékezetes betűt (az ékezetmentes kiírás az érettségin is elfogadott). Ahol a feladat bevitelt kér, a kérdést írd ki egy külön sorba, és csak utána olvass be.

  A program kérje be egy nap sorszámát (`Add meg a nap sorszamat:` felirattal, külön sorban), majd írja ki, mekkora volt aznap a hőmérséklet-ingadozás, vagyis a legmagasabb és a legalacsonyabb érték különbsége. A megadott sorszámú nap biztosan szerepel a fájlban.

  ```
  Az ingadozas: <fok> fok
  ```

  Bemenet a mintaadatokhoz (amit a felhasználó begépel):

  ```
  7
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  4. feladat
  Add meg a nap sorszamat:
  Az ingadozas: 5 fok
  ```

  Tipp: a kért napot kereséssel találod meg; a kérdést a beolvasás előtt írd ki.
