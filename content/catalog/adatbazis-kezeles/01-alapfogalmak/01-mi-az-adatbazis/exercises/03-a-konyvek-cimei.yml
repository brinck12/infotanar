slug: a-konyvek-cimei
title: A könyvek címei
position: 2
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Az iskolai könyvtár katalógusa a `konyv` táblában van. A teljes tábla helyett gyakran csak egyetlen mezőre van szükség.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `szerzo` | szöveg |
  | `ev` | egész (a kiadás éve) |
  | `oldal` | egész |
  | `ar` | egész (Ft) |
  | `mufaj` | szöveg |

  Listázd ki **csak a könyvek címét**! A lekérdezés eredménye egyetlen oszlop legyen. A sorok sorrendje nem számít.

  Tipp: a `*` helyére írd a mező nevét: `SELECT mezo FROM tabla;`
starter_code:
  sql: |
    SELECT
    FROM konyv;
sample_solutions:
  sql: |
    SELECT cim
    FROM konyv;
