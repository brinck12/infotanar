  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Kolcsonzes
    {
        public string Olvaso;
        public string Kod;
        public int Ki;
        public int Be;
    }

    class Program
    {
        static List<Kolcsonzes> kolcsonzesek = new List<Kolcsonzes>();

        static int Honap(int nap)
        {
            int[] hossz = { 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31 };
            for (int h = 0; h < 12; h++)
            {
                if (nap <= hossz[h])
                {
                    return h + 1;
                }
                nap -= hossz[h];
            }
            return 12;
        }

        static void Main()
        {
            string[] sorok = File.ReadAllLines("kolcsonzes.txt");
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Kolcsonzes k = new Kolcsonzes();
                k.Olvaso = r[0];
                k.Kod = r[1];
                k.Ki = int.Parse(r[2]);
                k.Be = int.Parse(r[3]);
                kolcsonzesek.Add(k);
            }
            Console.WriteLine("6. feladat");
            int[] darab = new int[13];
            foreach (Kolcsonzes k in kolcsonzesek)
            {
                darab[Honap(k.Ki)]++;
            }
            for (int h = 1; h <= 12; h++)
            {
                if (darab[h] > 0)
                {
                    Console.WriteLine(h + ". honap: " + darab[h]);
                }
            }
        }
    }
