description: |
  ## Feladat

  Olvass be egy sort, és írd ki, **hány magánhangzó** van benne! Magánhangzónak az `a`, `e`, `i`, `o`, `u` betűket tekintjük, kis- és nagybetűt egyaránt. A bemenet csak ékezet nélküli betűket és szóközöket tartalmaz.

  ### Bemenet

  Egyetlen sor szöveg (legfeljebb 200 karakter).

  ### Kimenet

  Egyetlen sorban a magánhangzók száma.

  ### Példa

  Bemenet: `Informatika`. Kimenet: `5`

  Tipp: alakítsd a szöveget kisbetűssé, és számold meg azokat a karaktereket, amelyek benne vannak az `"aeiou"` szövegben.
