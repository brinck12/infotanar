description: |
  Az `indulasok.txt` a repülőtér egy havi (30 napos) forgalmát tartalmazza, soronként egy indulással, pontosvesszővel elválasztva: `járatszám;célállomás;távolság km;nap;indulás;utasok;késés`. A járatszám két betűből és négy számjegyből áll (pl. `MA1017`), a nap a hónap napja (1–30), az indulás `ÓÓ:PP` alakú, a késés percben értendő (0, ha pontosan indult). Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz, a sorok nincsenek sorrendben, és egy járat egy napon egy időpontban legfeljebb egyszer szerepel.

  **3. feladat.** Összegezze célállomásonként a felszállt utasokat, és írja ki a célállomásokat az utasszám szerint **csökkenő** sorrendben! Azonos utasszámnál a célállomás neve szerinti ábécésorrend döntsön. Írja ki a `3. feladat:` sort, alá soronként `célállomás: utasok fo` alakban az eredményt.

  A mintafájlra a kimenet:

  ```text
  3. feladat:
  Roma: 752 fo
  Paris: 707 fo
  Becs: 614 fo
  Dubaj: 466 fo
  Athen: 444 fo
  Oslo: 347 fo
  Lisszabon: 169 fo
  London: 167 fo
  Newark: 111 fo
  Berlin: 46 fo
  Madrid: 35 fo
  ```

  Tipp: először összegzés (szótár vagy két párhuzamos lista), utána rendezés két kulccsal. Használhatod a beépített rendezést, de saját rendezést (például kiválasztásos) is írhatsz.
