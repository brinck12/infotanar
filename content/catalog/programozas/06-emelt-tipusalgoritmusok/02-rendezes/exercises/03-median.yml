slug: median
title: "Medián"
position: 2
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Írd ki a számok **mediánját** egy tizedesjeggyel: `Median: ...`. A medián a rendezett sorozat középső eleme, páros elemszámnál a két középső elem átlaga. Használhatod a beépített rendezést.

  Példa bemenet:

  ```
  5
  9 1 5 3 7
  ```

  Kimenet:

  ```
  Median: 5.0
  ```

  Tipp: rendezd a listát, és nézd meg az elemszám paritását. Pythonban az `f"{x:.1f}"`, C#-ban az `x.ToString("F1", CultureInfo.InvariantCulture)` adja az egy tizedesjegyű kiírást (`using System.Globalization;`).
starter_code:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    # rendezd a listát, és számold ki a mediánt
