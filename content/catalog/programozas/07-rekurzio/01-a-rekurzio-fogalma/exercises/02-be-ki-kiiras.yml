sample_solutions:
  python: |
    def be_ki(n):
        if n > 0:
            print("be", n)
            be_ki(n - 1)
            print("ki", n)

    be_ki(int(input()))
  csharp: |
    using System;

    class Program
    {
        static void BeKi(int n)
        {
            if (n > 0)
            {
                Console.WriteLine("be " + n);
                BeKi(n - 1);
                Console.WriteLine("ki " + n);
            }
        }

        static void Main()
        {
            BeKi(int.Parse(Console.ReadLine()));
        }
    }
