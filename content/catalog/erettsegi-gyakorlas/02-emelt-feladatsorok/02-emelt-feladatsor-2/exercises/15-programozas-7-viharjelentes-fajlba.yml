description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **7. feladat** (9 pont). Egy napot **viharosnak** nevezünk, ha a széllökés legalább 60 km/h. Írjon a `viharos.txt` fájlba jelentést: az első sor a fejléc (`nap;szel;csapadek`), utána minden viharos napról egy sor, `nap;szel;csapadek` alakban, a szél szerint csökkenő sorrendben (azonos szélnél a korábbi nap előbb). Ha nincs viharos nap, a fájlban csak a fejléc szerepel. A fájl írása után a program írja ki a viharos napok számát, majd **olvassa vissza a fájlt, és írja ki a tartalmát** a képernyőre, pontosan úgy, ahogy a fájlban áll.

  A mintafájlra a kimenet:

  ```text
  7. feladat
  Viharos napok: 0
  nap;szel;csapadek
  ```

  Tipp: a fájlba írás után zárd le a fájlt (Pythonban `with`, C#-ban `File.WriteAllText`), és csak utána nyisd meg olvasásra. A sorvégeket mindig `\n`-nel írd.
