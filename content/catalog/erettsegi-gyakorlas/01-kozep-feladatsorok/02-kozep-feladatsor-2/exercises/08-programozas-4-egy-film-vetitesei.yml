  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Vetites
    {
        public string Cim;
        public string Mufaj;
        public int Hossz;
        public string Kezdes;
        public int Eladott;
        public int Jegyar;

        public Vetites(string sor)
        {
            string[] r = sor.Split(';');
            Cim = r[0];
            Mufaj = r[1];
            Hossz = int.Parse(r[2]);
            Kezdes = r[3];
            Eladott = int.Parse(r[4]);
            Jegyar = int.Parse(r[5]);
        }

        public int Bevetel()
        {
            return Eladott * Jegyar;
        }
    }

    class Program
    {
        static void Main()
        {
            List<Vetites> vetitesek = new List<Vetites>();
            foreach (string sor in File.ReadAllLines("vetitesek.txt"))
            {
                vetitesek.Add(new Vetites(sor));
            }
            string cim = Console.ReadLine().Trim();
            List<Vetites> talalatok = new List<Vetites>();
            foreach (Vetites v in vetitesek)
            {
                if (v.Cim == cim)
                {
                    talalatok.Add(v);
                }
            }
            if (talalatok.Count == 0)
            {
                Console.WriteLine("4. feladat: Nincs ilyen film!");
            }
            else
            {
                Console.WriteLine("4. feladat:");
                foreach (Vetites v in talalatok)
                {
                    Console.WriteLine(v.Kezdes + " " + v.Eladott);
                }
            }
        }
    }
