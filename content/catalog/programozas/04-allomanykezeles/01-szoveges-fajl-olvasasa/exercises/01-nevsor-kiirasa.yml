description: |
  A `nevek.txt` fájl soronként egy nevet tartalmaz. Olvasd be a fájlt, és írd ki minden nevet a saját sorába, a név elé `- ` (kötőjel és szóköz) téve.

  Példa: ha a fájl sorai `Anna`, `Bela`, `Csilla`, a kimenet:

  ```
  - Anna
  - Bela
  - Csilla
  ```

  Tipp: a sorokat ciklussal járd végig; a fájl sorainak végén lévő sortörést Pythonban a `rstrip("\n")` vagy a `strip()` levágja.
starter_code:
  python: |
    # a fájl neve: nevek.txt
    with open("nevek.txt", encoding="utf-8") as f:
        for sor in f:
            # ide írd a megoldást
            pass
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            foreach (string sor in File.ReadAllLines("nevek.txt"))
            {
                // ide írd a megoldást
            }
        }
    }
sample_solutions:
  python: |
    with open("nevek.txt", encoding="utf-8") as f:
        for sor in f:
            print("- " + sor.strip())
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            foreach (string sor in File.ReadAllLines("nevek.txt"))
            {
                Console.WriteLine("- " + sor);
            }
        }
    }
