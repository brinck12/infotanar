allowed_languages: [python, csharp]
description: |
  A bemenet első sora N, utána egy N × N-es mátrix N sorban, soronként N szóközzel elválasztott egész számmal. Írd ki a főátló és a mellékátló elemeinek összegét: `Fo atlo: ...` és `Mellek atlo: ...`. A mellékátló a jobb felső saroktól a bal alsóig tart. Ha N páratlan, a középső elem mindkét átlóhoz tartozik.

  Példa bemenet:

  ```
  3
  1 2 3
  4 5 6
  7 8 9
  ```

  Kimenet:

  ```
  Fo atlo: 15
  Mellek atlo: 15
  ```

  Tipp: elég egyetlen ciklus. A főátlón a sor- és oszlopindex egyenlő, a mellékátlón az összegük N - 1.
starter_code:
  python: |
    n = int(input())
    matrix = []
    for _ in range(n):
        matrix.append([int(x) for x in input().split()])
    # számold ki az átlók összegét
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[,] matrix = new int[n, n];
            for (int i = 0; i < n; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < n; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            // számold ki az átlók összegét
        }
    }
sample_solutions:
  python: |
    n = int(input())
    matrix = []
    for _ in range(n):
        matrix.append([int(x) for x in input().split()])
    fo = 0
    mellek = 0
    for i in range(n):
        fo += matrix[i][i]
        mellek += matrix[i][n - 1 - i]
    print("Fo atlo:", fo)
    print("Mellek atlo:", mellek)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[,] matrix = new int[n, n];
            for (int i = 0; i < n; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < n; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            int fo = 0;
            int mellek = 0;
            for (int i = 0; i < n; i++)
            {
                fo += matrix[i, i];
                mellek += matrix[i, n - 1 - i];
            }
            Console.WriteLine("Fo atlo: " + fo);
            Console.WriteLine("Mellek atlo: " + mellek);
        }
    }
