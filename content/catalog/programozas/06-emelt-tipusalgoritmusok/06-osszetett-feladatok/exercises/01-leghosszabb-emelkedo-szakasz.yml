sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    hossz = 1
    legjobb = 1
    kezdet = 0
    for i in range(1, n):
        if a[i] > a[i - 1]:
            hossz += 1
        else:
            hossz = 1
        if hossz > legjobb:
            legjobb = hossz
            kezdet = i - hossz + 1
    print("Hossz:", legjobb)
    print("Kezdet:", kezdet + 1)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            int hossz = 1;
            int legjobb = 1;
            int kezdet = 0;
            for (int i = 1; i < n; i++)
            {
                if (a[i] > a[i - 1])
                {
                    hossz++;
                }
                else
                {
                    hossz = 1;
                }
                if (hossz > legjobb)
                {
                    legjobb = hossz;
                    kezdet = i - hossz + 1;
                }
            }
            Console.WriteLine("Hossz: " + legjobb);
            Console.WriteLine("Kezdet: " + (kezdet + 1));
        }
    }
