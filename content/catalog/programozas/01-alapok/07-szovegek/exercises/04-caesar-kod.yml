sample_solutions:
  python: |
    abc = "abcdefghijklmnopqrstuvwxyz"
    k = int(input())
    szoveg = input()
    eredmeny = ""
    for betu in szoveg:
        hely = abc.find(betu)
        if hely == -1:
            eredmeny = eredmeny + betu
        else:
            eredmeny = eredmeny + abc[(hely + k) % 26]
    print(eredmeny)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            var abc = "abcdefghijklmnopqrstuvwxyz";
            var k = int.Parse(Console.ReadLine());
            var szoveg = Console.ReadLine();
            var eredmeny = "";
            foreach (char betu in szoveg)
            {
                var hely = abc.IndexOf(betu);
                if (hely == -1)
                {
                    eredmeny = eredmeny + betu;
                }
                else
                {
                    eredmeny = eredmeny + abc[(hely + k) % 26];
                }
            }
            Console.WriteLine(eredmeny);
        }
    }
tests:
  - { stdin: "3\nabc xyz\n", expected: "def abc\n", hidden: false }
  - { stdin: "0\nhello\n", expected: "hello\n", hidden: true }
  - { stdin: "13\nhello world\n", expected: "uryyb jbeyq\n", hidden: true }
  - { stdin: "25\nb\n", expected: "a\n", hidden: true }
