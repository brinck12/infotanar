slug: elfogyott-vagy-draga
title: Elfogyott vagy drága
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  Az `OR` akkor igaz, ha a két feltétel közül legalább az egyik igaz; az `AND` akkor, ha mindkettő. A `NOT` megfordítja a feltételt.

  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `kategoria` | szöveg |
  | `ar` | egész (Ft) |
  | `keszlet` | egész (db) |

  Listázd ki azokat a termékeket (**nev, ar, keszlet**), amelyekből **elfogyott** (a készlet 0) **vagy** az áruk **1500 Ft-nál nagyobb**! A sorok sorrendje nem számít.

  Tipp: `WHERE keszlet = 0 OR ar > 1500`
starter_code:
  sql: |
    SELECT nev, ar, keszlet
    FROM termek
    WHERE ;
sample_solutions:
  sql: |
    SELECT nev, ar, keszlet
    FROM termek
    WHERE keszlet = 0 OR ar > 1500;
