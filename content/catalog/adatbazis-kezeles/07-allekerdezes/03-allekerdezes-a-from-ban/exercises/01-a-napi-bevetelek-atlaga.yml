slug: a-napi-bevetelek-atlaga
title: A napi bevételek átlaga
position: 0
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Az `eladas` tábla egy bolt eladásait tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `db` | egész, az eladott darabszám |
  | `egysegar` | egész (Ft) |

  Egy eladás értéke `db * egysegar`.

  Add meg a **napi bevételek átlagát** forintra kerekítve, egész számként (**atlag**)! Egy nap bevétele az aznapi eladások értékének összege. Előbb számold ki a napi összegeket (`GROUP BY datum`), majd ezekből az összegekből vegyél átlagot: a `FROM` után álló allekérdezés (származtatott tábla) legyen a külső lekérdezés forrása.

  Tipp: `CAST(ROUND(AVG(napi)) AS INTEGER) AS atlag` – az allekérdezésnek adj nevet, például `FROM (...) AS n`.
starter_code:
  sql: |
    SELECT CAST(ROUND(AVG(napi)) AS INTEGER) AS atlag
    FROM (SELECT datum, SUM(db * egysegar) AS napi
          FROM eladas
          GROUP BY datum) AS n;
sample_solutions:
  sql: |
    SELECT CAST(ROUND(AVG(napi)) AS INTEGER) AS atlag
    FROM (SELECT datum, SUM(db * egysegar) AS napi
          FROM eladas
          GROUP BY datum) AS n;
