description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a legnagyobb számot és azt, hogy **hányadik helyen áll** (az első szám sorszáma 1). Ha a legnagyobb érték többször is előfordul, az első előfordulás helyét add meg.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Két sor: `Legnagyobb: ` és az érték, majd `Helye: ` és a sorszám.

  ### Példa

  Bemenet: `5`, majd `4`, `9`, `2`, `9`, `1`. Kimenet:

  ```
  Legnagyobb: 9
  Helye: 2
  ```

  Tipp: az érték mellé jegyezd meg a helyét is, és mindkettőt frissítsd, ha **szigorúan** nagyobbat találsz.
