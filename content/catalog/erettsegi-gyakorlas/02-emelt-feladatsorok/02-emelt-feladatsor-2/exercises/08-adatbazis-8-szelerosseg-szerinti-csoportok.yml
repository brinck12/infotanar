slug: adatbazis-8-szelerosseg-szerinti-csoportok
title: Adatbázis 8 - Szélerősség szerinti csoportok
position: 7
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |-
  Az adatbázis két táblából áll.

  A `allomas` tábla az időjárás-állomásokat tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg, az állomás neve |
  | `telepules` | szöveg, a település neve |
  | `magassag` | egész, a tengerszint feletti magasság méterben |

  A `meres` tábla a napi méréseket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `allomas_id` | egész, az `allomas` tábla `id` oszlopára mutat |
  | `datum` | szöveg, `ÉÉÉÉ-HH-NN` alakban (pl. `2026-04-14`) |
  | `homerseklet` | valós szám, a napi középhőmérséklet °C-ban |
  | `csapadek` | valós szám, a napi csapadék mm-ben (0, ha nem esett) |
  | `szel` | egész, a legerősebb széllökés km/h-ban |

  **8. feladat.** Osztályozza a méréseket a szél erőssége szerint: 20 km/h alatt `gyenge`, 20 és 49 km/h között `mersekelt`, 50 km/h vagy afelett `eros`. A lekérdezés a kategória nevét (`kategoria`) és a hozzá tartozó mérések számát (`db`) adja, darabszám szerint csökkenő, azonos darabszámnál kategórianév szerint növekvő sorrendben! Csak a ténylegesen előforduló kategóriák jelenjenek meg. (5 pont)

  Tipp: a kategória a `CASE WHEN ... THEN ... END` kifejezés; a csoportosításnál ugyanezt a kifejezést (vagy az oszlop sorszámát) használd. A MariaDB-ben az `IF` is használható, a `CASE` mindkét rendszerben működik.
starter_code:
  sql: |
    SELECT CASE WHEN THEN 'gyenge' END AS kategoria, COUNT(*) AS db
    FROM meres
    GROUP BY 1
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT CASE WHEN szel < 20 THEN 'gyenge' WHEN szel < 50 THEN 'mersekelt' ELSE 'eros' END AS kategoria, COUNT(*) AS db
    FROM meres
    GROUP BY 1
    ORDER BY db DESC, kategoria;
