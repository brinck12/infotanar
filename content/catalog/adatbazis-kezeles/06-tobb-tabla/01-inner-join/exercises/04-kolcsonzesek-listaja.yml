slug: kolcsonzesek-listaja
title: Kölcsönzések listája
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
    Listázd a kölcsönzéseket a könyv címével (`cim`), az olvasó nevével (`olvaso`) és a dátummal (`datum`). A lista dátum szerint növekvő sorrendben legyen; azonos dátumnál cím, majd olvasó szerint.

    A `konyv` tábla:

    | `id` | `cim` | `szerzo` |
    |---|---|---|
    | 1 | Egri csillagok | Gardonyi Geza |
    | 2 | A Pal utcai fiuk | Molnar Ferenc |
    | 3 | Abel a rengetegben | Tamasi Aron |
    | 4 | Tuskevar | Fekete Istvan |

    A `kolcsonzes` tábla:

    | `id` | `konyv_id` | `olvaso` | `datum` |
    |---|---|---|---|
    | 1 | 1 | Kiss Anna | 2025-02-03 |
    | 2 | 2 | Nagy Bela | 2025-02-03 |
    | 3 | 1 | Toth Csaba | 2025-02-10 |
    | 4 | 2 | Kiss Anna | 2025-02-17 |

    Az eredmény ezekre az adatokra (a sorrend is számít):

    | `cim` | `olvaso` | `datum` |
    |---|---|---|
    | A Pal utcai fiuk | Nagy Bela | 2025-02-03 |
    | Egri csillagok | Kiss Anna | 2025-02-03 |
    | Egri csillagok | Toth Csaba | 2025-02-10 |
    | A Pal utcai fiuk | Kiss Anna | 2025-02-17 |

    Tipp: az `ORDER BY` több oszlopot is felsorolhat vesszővel; a későbbi csak az azonosak között dönt.
starter_code:
  sql: |
    SELECT konyv.cim AS cim, kolcsonzes.olvaso AS olvaso, kolcsonzes.datum AS datum
    FROM kolcsonzes
    INNER JOIN konyv ON
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT konyv.cim AS cim, kolcsonzes.olvaso AS olvaso, kolcsonzes.datum AS datum
    FROM kolcsonzes
    INNER JOIN konyv ON kolcsonzes.konyv_id = konyv.id
    ORDER BY kolcsonzes.datum, konyv.cim, kolcsonzes.olvaso;
