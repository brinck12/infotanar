description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Keresd meg az **első olyan számot, amely nagyobb az előtte állónál**, és írd ki a sorszámát (az első szám sorszáma 1)! Ha nincs ilyen, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a sorszám, vagy `NINCS`.

  ### Példa

  Bemenet: `5`, majd `9`, `7`, `7`, `8`, `3`. Kimenet: `4`

  Tipp: az első számnak nincs előzője, ezért az összehasonlítás a másodiknál kezdődik. Egyetlen elem esetén a válasz `NINCS`.
starter_code:
  python: |
    n = int(input())
    elozo = int(input())
    hely = 0
    for i in range(2, n + 1):
        szam = int(input())
        # TODO: ha nagyobb az előzőnél, jegyezd meg a helyét és lépj ki
        elozo = szam
    if hely == 0:
        print('NINCS')
    else:
        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int elozo = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                // TODO: ha nagyobb az előzőnél, jegyezd meg a helyét és lépj ki
                elozo = szam;
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
sample_solutions:
  python: |
    n = int(input())
    elozo = int(input())
    hely = 0
    for i in range(2, n + 1):
        szam = int(input())
        if szam > elozo:
            hely = i
            break
        elozo = szam
    if hely == 0:
        print('NINCS')
    else:
        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int elozo = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > elozo)
                {
                    hely = i;
                    break;
                }
                elozo = szam;
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
