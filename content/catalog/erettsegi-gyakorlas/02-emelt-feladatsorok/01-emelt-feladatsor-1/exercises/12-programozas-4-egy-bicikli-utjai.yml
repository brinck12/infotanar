description: |-
  Az `utak.txt` a kerékpárkölcsönző egy havi (30 napos) forgalmát tartalmazza, soronként egy úttal, pontosvesszővel elválasztva: `bicikli;nap;indulás;érkezés;távolság`. A bicikli azonosítója `B-01` alakú, a nap a hónap napja (1–30), az indulás és az érkezés `ÓÓ:PP` alakú időpont (ugyanazon a napon belül, az érkezés mindig az indulás után van), a távolság méterben egész szám. A sorok nem rendezettek. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **4. feladat.** Kérjen be a billentyűzetről egy bicikli-azonosítót (például `B-03`; **ne írjon ki hozzá kérdést**)! Írja ki a megadott bicikli összes útját **a fájlbeli sorrendben**, majd az utak számát és a megtett távolság összegét méterben. Ha nincs ilyen bicikli, a mintának megfelelő üzenetet írja ki. A fájl mellett a bemenet egyetlen sor: a bicikli azonosítója.

  A mintafájlra és a `B-03` bemenetre a kimenet:

  ```text
  4. feladat: B-03
  2. nap 10:26-12:03 (21440 m)
  2. nap 08:20-08:52 (5438 m)
  9. nap 07:07-07:26 (3265 m)
  10. nap 10:33-11:20 (10898 m)
  10. nap 08:49-09:22 (9314 m)
  11. nap 10:09-10:19 (2588 m)
  11. nap 08:25-09:44 (18780 m)
  20. nap 09:37-10:26 (9728 m)
  22. nap 10:53-11:35 (7080 m)
  22. nap 09:43-10:30 (14762 m)
  25. nap 09:56-11:16 (14579 m)
  26. nap 07:07-07:53 (11269 m)
  Osszesen: 12 ut, 129141 m
  ```

  Tipp: kiválogatás: menj végig a listán, és az azonosító egyezése alapján gyűjtsd az utakat egy külön listába; az összegzést és a darabszámot is ebből számold.
