sample_solutions:
  python: |
    print("2. feladat")
    with open("homerseklet.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = int(sorok[0])
    napok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        napok.append((int(r[0]), int(r[1]), int(r[2]), int(r[3])))
    legjobb = napok[0]
    for nap in napok:
        if nap[2] > legjobb[2]:
            legjobb = nap
    print("Legmelegebb nap: " + str(legjobb[0]) + ". nap, " + str(legjobb[2]) + " fok")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("2. feladat");
            string[] sorok = File.ReadAllLines("homerseklet.txt");
            int db = int.Parse(sorok[0]);
            int[][] napok = new int[db][];
            for (int i = 0; i < db; i++)
            {
                string[] r = sorok[i + 1].Split('\t');
                napok[i] = new int[] { int.Parse(r[0]), int.Parse(r[1]), int.Parse(r[2]), int.Parse(r[3]) };
            }
            int[] legjobb = napok[0];
            foreach (int[] nap in napok)
            {
                if (nap[2] > legjobb[2])
                {
                    legjobb = nap;
                }
            }
            Console.WriteLine("Legmelegebb nap: " + legjobb[0] + ". nap, " + legjobb[2] + " fok");
        }
    }
