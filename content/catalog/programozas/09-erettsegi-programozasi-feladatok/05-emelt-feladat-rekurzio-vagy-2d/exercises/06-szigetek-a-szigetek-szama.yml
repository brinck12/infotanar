description: |
  A `terkep.txt` fájl egy tenger térképét tartalmazza. Az első sorban két egész szám áll szóközzel elválasztva: a sorok száma (`n`) és az oszlopok száma (`m`). Ezután `n` sor következik, mindegyik pontosan `m` karakter: `#` a szárazföld, `.` a víz. Egy **sziget** a vízszintesen vagy függőlegesen (átlósan nem) szomszédos `#` mezők összefüggő csoportja. A sorokat és az oszlopokat a kimenetben 1-től számozd. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Számold meg a térkép szigeteit, és add meg a legnagyobb sziget méretét (mezők száma). Ha nincs sziget, csak a `Nincs sziget.` sort írd ki. Figyelj rá, hogy az átlósan szomszédos földmezők **külön** szigetet alkotnak.

  ```
  Szigetek: <db>
  Legnagyobb: <meret>
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  6. feladat
  Szigetek: 9
  Legnagyobb: 5
  ```

  Tipp: Járd végig a térképet; ha olyan földmezőt találsz, amelyet még nem láttál, új sziget kezdődik: számold meg a rekurzív függvénnyel, és vesd össze az eddigi legnagyobbal.
