description: "A `konyvek.txt` a könyvtár állományát tartalmazza, soronként egy könyvvel, pontosvesszővel elválasztva: `szerző;cím;kiadás éve;oldalszám`. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.\n\n**4. feladat.** Kérjen be egy szerzőnevet! Ha a szerzőnek van könyve a fájlban, írja ki a `4. feladat:` sort, alá pedig a könyveinek címét a fájlbeli sorrendben, soronként egyet. Ha nincs, a kimenet egyetlen sor: `4. feladat: Nincs ilyen szerzo!`\n\nMinta (a billentyűzetről beolvasott sor):\n\n```text\nNemes Anna\n```\n\nA mintafájlra a kimenet:\n\n```text\n4. feladat:\r\nAz elveszett kulcs\r\nEsti mesek\r\n```\n\nTipp: gyűjtsd a találatokat egy listába; a lista hossza dönti el, melyik kiírás kell."
