sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Tetel:
        termek: str
        db: int
        egysegar: int

    n = int(input())
    tetelek = []
    for _ in range(n):
        resz = input().split(";")
        tetelek.append(Tetel(resz[0], int(resz[1]), int(resz[2])))
    osszes = 0
    legjobb = tetelek[0]
    for t in tetelek:
        osszes += t.db * t.egysegar
        if t.db * t.egysegar > legjobb.db * legjobb.egysegar:
            legjobb = t
    print("Osszes ertek:", osszes, "Ft")
    print("Legertekesebb: " + legjobb.termek + " (" + str(legjobb.db * legjobb.egysegar) + " Ft)")
  csharp: |
    using System;
    using System.Collections.Generic;

    class Tetel
    {
        public string Termek;
        public int Db;
        public int Egysegar;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var tetelek = new List<Tetel>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                tetelek.Add(new Tetel { Termek = resz[0], Db = int.Parse(resz[1]), Egysegar = int.Parse(resz[2]) });
            }
            int osszes = 0;
            var legjobb = tetelek[0];
            foreach (var t in tetelek)
            {
                osszes += t.Db * t.Egysegar;
                if (t.Db * t.Egysegar > legjobb.Db * legjobb.Egysegar)
                {
                    legjobb = t;
                }
            }
            Console.WriteLine("Osszes ertek: " + osszes + " Ft");
            Console.WriteLine("Legertekesebb: " + legjobb.Termek + " (" + (legjobb.Db * legjobb.Egysegar) + " Ft)");
        }
    }
