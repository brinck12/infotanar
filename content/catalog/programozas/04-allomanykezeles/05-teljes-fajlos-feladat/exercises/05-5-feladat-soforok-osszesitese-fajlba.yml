description: |
  Az `ut.txt` fájl egy fuvarozó cég útjait tartalmazza, tabulátorral tagolva. Az első sor fejléc (`datum`, `sofor`, `km`, `perc`); minden további sor egy út: a dátum (`EEEE-HH-NN` alakban), a sofőr neve (ékezet nélkül, szóköz nélkül), a megtett kilométerek és az út ideje percben (egész számok). A fájl legalább egy utat tartalmaz.

  Írd ki az `5. feladat` szöveget. Készíts `soforok.txt` néven tabulátorral tagolt összesítő fájlt: az első sor a fejléc (`sofor`, `utak`, `km`), utána sofőrönként egy sor a sofőr nevével, útjainak számával és a kilométerek összegével. A sofőrök sorrendje az, ahogy először feltűnnek az `ut.txt` fájlban. Végül olvasd vissza a fájlt, és írd ki a tartalmát:

  ```
  5. feladat
  sofor<TAB>utak<TAB>km
  Kovacs<TAB>4<TAB>330
  Nagy<TAB>3<TAB>293
  Szabo<TAB>3<TAB>285
  ```

  Tipp: a sofőrönkénti összegeket szótárban (C#-ban `Dictionary`) gyűjtheted, a sorrendhez pedig egy külön listát vezess a nevekről.
