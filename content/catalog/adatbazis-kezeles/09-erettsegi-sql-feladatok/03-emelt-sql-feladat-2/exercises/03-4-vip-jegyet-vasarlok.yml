slug: 4-vip-jegyet-vasarlok
title: 4. VIP jegyet vásárlók
position: 2
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `helyszin` | `VARCHAR(30)` (város) |
  | `datum` | `DATE` |
  | `kapacitas` | `INT`, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `rendezveny_id` | `INT`, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | `VARCHAR(50)`, a vásárló neve |
  | `kategoria` | `VARCHAR(20)`: `allo`, `ules` vagy `vip` |
  | `ar` | `INT`, a jegy ára forintban |
  | `vasarlas` | `DATE`, a vásárlás napja |

  **4. feladat.** Adja meg lekérdezéssel azoknak a vevőknek a nevét (**vevo**), akik **legalább egy `vip` jegyet** vásároltak! Minden név csak egyszer szerepeljen!
starter_code:
  sql: "SELECT \nFROM jegy\nWHERE ;\n"
sample_solutions:
  sql: |
    SELECT DISTINCT vevo
    FROM jegy
    WHERE kategoria = 'vip';
