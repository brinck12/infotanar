description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Válogasd ki a **3-mal osztható számokat egy listába**, majd írd ki őket egyetlen sorban, szóközzel elválasztva, a beolvasás sorrendjében. Ha egyetlen ilyen szám sincs, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sor: a számok szóközzel elválasztva, vagy `NINCS`.

  ### Példa

  Bemenet: `6`, majd `3`, `4`, `9`, `10`, `12`, `7`. Kimenet: `3 9 12`

  Tipp: gyűjtsd a találatokat egy listába. Kiíráshoz Pythonban `" ".join(map(str, lista))`, C#-ban `string.Join(" ", lista)` használható.
