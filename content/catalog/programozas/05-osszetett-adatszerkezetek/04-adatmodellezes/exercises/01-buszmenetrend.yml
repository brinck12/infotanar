description: |
  Egy kisváros buszjáratainak adatai: az első sor a járatok száma (N, legalább 1), majd N sor: `jaratszam;indulas;erkezes`, ahol az időpontok `ó:pp` alakúak (például `6:05` vagy `14:30`), és minden járat ugyanazon a napon érkezik, mint indul (az érkezés később van, mint az indulás).

  Írd ki a leghosszabb menetidejű járat számát és menetidejét (`Leghosszabb: jaratszam (X perc)`; egyenlő menetidőnél a bemenetben előbbi), majd az összes járat menetidejének összegét (`Osszes menetido: Y perc`).

  Példa bemenet:

  ```
  3
  12A;6:05;6:50
  7;7:30;8:45
  12A;14:00;14:45
  ```

  Kimenet:

  ```
  Leghosszabb: 7 (75 perc)
  Osszes menetido: 165 perc
  ```

  Tipp: az időpontokat alakítsd percre (`ó * 60 + pp`), és így tárold; a menetidő az érkezés és az indulás különbsége.
