slug: adatbazis-3-oktoberi-vetitesek
title: Adatbázis 3 - Októberi vetítések
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Az adatbázis két táblából áll.

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `cim` | `VARCHAR(50)`, a film címe |
  | `rendezo` | `VARCHAR(50)` |
  | `ev` | `INT`, a bemutató éve |
  | `hossz` | `INT`, a játékidő percben |
  | `mufaj` | `VARCHAR(20)` (`akcio`, `vigjatek`, `drama`, `animacio`, `scifi`) |

  A `vetites` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `film_id` | `INT`, a `film` tábla `id` oszlopára mutat |
  | `datum` | `DATE` (pl. `2025-10-14`) |
  | `ido` | `VARCHAR(5)`, a kezdés `ÓÓ:PP` alakban |
  | `terem` | `INT`, a terem száma |
  | `eladott` | `INT`, az eladott jegyek száma |
  | `jegyar` | `INT`, egy jegy ára forintban |

  **3. feladat.** Listázza ki az **októberi** (2025-10-01 és 2025-10-31 közötti) vetítéseket! A lekérdezés három oszlopot adjon `cim`, `datum` és `ido` néven; a sorok dátum, azonos dátumnál kezdési idő, azonos időpontnál cím szerint növekvő sorrendben jöjjenek!

  Tipp: a két tábla összekapcsolása `JOIN film ON film.id = vetites.film_id`; a dátum szövegként is összehasonlítható.
starter_code:
  sql: "SELECT film.cim AS cim, vetites.datum AS datum, vetites.ido AS ido\nFROM vetites JOIN film ON \nWHERE \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT film.cim AS cim, vetites.datum AS datum, vetites.ido AS ido
    FROM vetites JOIN film ON film.id = vetites.film_id
    WHERE vetites.datum >= '2025-10-01' AND vetites.datum <= '2025-10-31'
    ORDER BY vetites.datum, vetites.ido, film.cim;
