description: |
  Egy meteorológiai állomás egy hónap napi méréseit a `homerseklet.txt` fájlba mentette. Az első sor a napok száma (`n`), utána soronként egy nap adatai következnek, tabulátorral tagolva: a nap sorszáma (1-től), a napi legalacsonyabb hőmérséklet (°C), a napi legmagasabb hőmérséklet (°C) és a csapadék mennyisége (mm). Minden érték egész szám, a fájl legalább egy napot tartalmaz.

  Minden részfeladat kimenete a feladat sorszámával kezdődik (`N. feladat`). A kimenetben ne használj ékezetes betűt (az ékezetmentes kiírás az érettségin is elfogadott). Ahol a feladat bevitelt kér, a kérdést írd ki egy külön sorba, és csak utána olvass be.

  Írd ki a mérési napok számát és az első nap legmagasabb hőmérsékletét az alábbi formában:

  ```
  Napok szama: <db>
  Az elso nap legmagasabb homerseklete: <fok> fok
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  1. feladat
  Napok szama: 12
  Az elso nap legmagasabb homerseklete: 18 fok
  ```

  Tipp: a beolvasott `napok` listában az első elem az első nap; a legmagasabb hőmérséklet a rekord harmadik mezője.
starter_code:
  python: |
    print("1. feladat")
    with open("homerseklet.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = int(sorok[0])
    napok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        napok.append((int(r[0]), int(r[1]), int(r[2]), int(r[3])))
    # ide írd a megoldást
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("1. feladat");
            string[] sorok = File.ReadAllLines("homerseklet.txt");
            int db = int.Parse(sorok[0]);
            int[][] napok = new int[db][];
            for (int i = 0; i < db; i++)
            {
                string[] r = sorok[i + 1].Split('\t');
                napok[i] = new int[] { int.Parse(r[0]), int.Parse(r[1]), int.Parse(r[2]), int.Parse(r[3]) };
            }
            // ide írd a megoldást
        }
    }
