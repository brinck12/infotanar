slug: adatbazis-3-oktoberi-kolcsonzesek
title: Adatbázis 3 - Októberi kölcsönzések
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |-
  Az adatbázis két táblából áll.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg, a könyv címe |
  | `szerzo` | szöveg |
  | `ev` | egész, a kiadás éve |
  | `oldal` | egész, az oldalszám |
  | `mufaj` | szöveg (`regeny`, `ifjusagi`, `ismeretterjeszto`, `mese`, `vers`) |

  A `kolcsonzes` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `konyv_id` | egész, a `konyv` tábla `id` oszlopára mutat |
  | `olvaso` | szöveg, az olvasó neve |
  | `datum` | szöveg, `ÉÉÉÉ-HH-NN` alakban (pl. `2025-10-14`) |
  | `napok` | egész, a kölcsönzési idő napokban |

  **3. feladat.** Listázza ki a 2025 októberében történt kölcsönzéseket! Az eredmény oszlopai: az olvasó neve `olvaso` néven, a könyv címe `cim` néven és a kölcsönzés dátuma `datum` néven. A sorrend: dátum szerint növekvően, azonos dátumnál cím, majd olvasó neve szerint növekvően.

  Tipp: a két táblát a `konyv_id = id` feltétellel kapcsold össze; a dátum szövegként a `LIKE '2025-10-%'` mintával szűrhető (MariaDB-ben ugyanígy).
starter_code:
  sql: "SELECT k.olvaso AS olvaso, b.cim AS cim, k.datum AS datum\nFROM kolcsonzes k\nJOIN konyv b ON \nWHERE \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT k.olvaso AS olvaso, b.cim AS cim, k.datum AS datum
    FROM kolcsonzes k
    JOIN konyv b ON k.konyv_id = b.id
    WHERE k.datum LIKE '2025-10-%'
    ORDER BY k.datum, b.cim, k.olvaso;
