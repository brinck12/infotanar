description: |
  A felhasználó megad egy pozitív egész számot (`n`). Írd a `negyzetek.txt` fájlba az első `n` négyzetszámot (1, 4, 9, ...), soronként egyet. Ezután olvasd vissza a fájlt, írd ki a sorait, és a végén azt, hány sort olvastál:

  ```
  1
  4
  9
  Sorok: 3
  ```

  (A példa az `n = 3` esetre szól.)

  Tipp: a fájlt előbb be kell zárni az írásból (Pythonban a `with` blokk végén zárul, C#-ban a `using` blokk végén), és csak utána nyisd meg olvasásra.
starter_code:
  python: |
    n = int(input())
    with open("negyzetek.txt", "w", encoding="utf-8") as f:
        # ide írd az írást
        pass
    with open("negyzetek.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    # ide írd a kiírást
