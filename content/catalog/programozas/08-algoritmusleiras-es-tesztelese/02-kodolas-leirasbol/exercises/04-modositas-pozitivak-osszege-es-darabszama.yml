published: false
allowed_languages: [python, csharp]
description: |
  Az eredeti algoritmus az összes szám összegét számolja:

  ```text
  Algoritmus Osszeg
    Be: N
    osszeg := 0
    Ciklus i := 1-től N-ig
      Be: szam
      osszeg := osszeg + szam
    Ciklus vége
    Ki: osszeg
  Algoritmus vége
  ```

  **Módosítsd** úgy, hogy csak a **pozitív** számokat adja össze, és megszámolja, hány pozitív szám volt. A kimenet két sor: először az összeg, utána a darabszám. Kódold le a módosított algoritmust.

  Bemenet: az első sorban `N` (`0 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: két sor.

  Példa: `4`, majd `5`, `-2`, `0`, `7` esetén a kimenet: `12` és `2` külön sorban. A 0 nem pozitív.

  Tipp: két változót kell frissíteni, ezért mindkettőnek kell kezdőérték; a frissítés ugyanahhoz a feltételhez tartozik.
