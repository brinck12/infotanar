  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Indulas
    {
        public string Jarat;
        public string Cel;
        public int Tav;
        public int Nap;
        public string Ido;
        public int Utas;
        public int Keses;

        public Indulas(string sor)
        {
            string[] r = sor.Split(';');
            Jarat = r[0];
            Cel = r[1];
            Tav = int.Parse(r[2]);
            Nap = int.Parse(r[3]);
            Ido = r[4];
            Utas = int.Parse(r[5]);
            Keses = int.Parse(r[6]);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Indulas> indulasok = new List<Indulas>();
            foreach (string sor in File.ReadAllLines("indulasok.txt"))
            {
                indulasok.Add(new Indulas(sor));
            }
            Dictionary<string, int> ossz = new Dictionary<string, int>();
            foreach (Indulas i in indulasok)
            {
                if (!ossz.ContainsKey(i.Cel))
                {
                    ossz[i.Cel] = 0;
                }
                ossz[i.Cel] += i.Utas;
            }
            List<KeyValuePair<string, int>> lista = new List<KeyValuePair<string, int>>(ossz);
            lista.Sort((a, b) =>
            {
                if (a.Value != b.Value)
                {
                    return b.Value.CompareTo(a.Value);
                }
                return string.CompareOrdinal(a.Key, b.Key);
            });
            Console.WriteLine("3. feladat:");
            foreach (KeyValuePair<string, int> p in lista)
            {
                Console.WriteLine(p.Key + ": " + p.Value + " fo");
            }
        }
    }
