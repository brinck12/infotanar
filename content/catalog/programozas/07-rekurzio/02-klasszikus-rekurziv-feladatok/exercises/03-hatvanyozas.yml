description: |
  Olvass be két egész számot külön sorban: az `A` alapot (`1 ≤ A ≤ 10`) és az `N` kitevőt (`0 ≤ N ≤ 15`). Írd ki az `A^N` értékét rekurzív függvénnyel, a `**` operátor és a `Math.Pow` nélkül.

  Példa: `A = 2`, `N = 10` esetén a kimenet `1024`. Ha `N = 0`, a kimenet `1`.

  Tipp: `a^n = a · a^(n-1)`, az alapeset a nulladik hatvány. C#-ban használj `long` típust.
