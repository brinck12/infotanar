sample_solutions:
  python: |
    n = int(input())
    atment = []
    bukott = []
    for _ in range(n):
        resz = input().split(";")
        if int(resz[1]) >= 2:
            atment.append(resz[0])
        else:
            bukott.append(resz[0])

    def sor(lista):
        if len(lista) == 0:
            return "-"
        return ", ".join(lista)

    print("Atment: " + sor(atment))
    print("Bukott: " + sor(bukott))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static string Sor(List<string> lista)
        {
            if (lista.Count == 0)
            {
                return "-";
            }
            return string.Join(", ", lista);
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var atment = new List<string>();
            var bukott = new List<string>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                if (int.Parse(resz[1]) >= 2)
                {
                    atment.Add(resz[0]);
                }
                else
                {
                    bukott.Add(resz[0]);
                }
            }
            Console.WriteLine("Atment: " + Sor(atment));
            Console.WriteLine("Bukott: " + Sor(bukott));
        }
    }
tests:
  - { stdin: "4\nAnna;5\nBence;1\nCsilla;2\nDavid;1\n", expected: "Atment: Anna, Csilla\nBukott: Bence, David\n", hidden: false }
