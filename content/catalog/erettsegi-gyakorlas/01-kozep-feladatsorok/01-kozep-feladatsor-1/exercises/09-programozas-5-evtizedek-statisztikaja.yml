sample_solutions:
  python: |
    with open("konyvek.txt", encoding="utf-8") as f:
        konyvek = [sor.split(";") for sor in f.read().splitlines()]
    stat = {}
    for k in konyvek:
        ev = int(k[2]) // 10 * 10
        stat[ev] = stat.get(ev, 0) + 1
    print("5. feladat:")
    for ev in sorted(stat):
        print(str(ev) + "-es evek:", stat[ev])
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("konyvek.txt");
            Dictionary<int, int> stat = new Dictionary<int, int>();
            foreach (string sor in sorok)
            {
                int ev = int.Parse(sor.Split(';')[2]) / 10 * 10;
                if (!stat.ContainsKey(ev))
                {
                    stat[ev] = 0;
                }
                stat[ev]++;
            }
            List<int> evek = new List<int>(stat.Keys);
            evek.Sort();
            Console.WriteLine("5. feladat:");
            foreach (int ev in evek)
            {
                Console.WriteLine(ev + "-es evek: " + stat[ev]);
            }
        }
    }
