allowed_languages: [python, csharp]
description: |
  A bemenet első sora `R C`, utána R sor, mindegyikben C egész szám szóközzel elválasztva. Írd ki az oszlopok összegét egyetlen sorban, szóközzel elválasztva, balról jobbra.

  Példa bemenet:

  ```
  2 3
  5 1 4
  2 8 3
  ```

  Kimenet:

  ```
  7 9 7
  ```

  Tipp: az oszlopösszegnél a külső ciklus az oszlopokon (`j`) halad, a belső a sorokon (`i`), az elem pedig továbbra is `matrix[i][j]`.
