description: |
  Olvass be egy `N` nemnegatív egész számot (`0 ≤ N ≤ 2000000000`), és írd ki a számjegyeinek összegét **rekurzív** függvénnyel. Szöveggé alakítást ne használj.

  Példa: `N = 352` esetén a kimenet `10`; `N = 0` esetén `0`.

  Tipp: az utolsó számjegy `n % 10`, a többi számjegyből álló szám `n / 10` (egész osztás).
