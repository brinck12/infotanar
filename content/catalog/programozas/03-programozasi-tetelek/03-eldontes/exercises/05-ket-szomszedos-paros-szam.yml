sample_solutions:
  python: |
    n = int(input())
    elozo_paros = False
    van = False
    for _ in range(n):
        szam = int(input())
        paros = szam % 2 == 0
        if paros and elozo_paros:
            van = True
            break
        elozo_paros = paros
    print('IGEN' if van else 'NEM')
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            bool elozoParos = false;
            bool van = false;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                bool paros = szam % 2 == 0;
                if (paros && elozoParos)
                {
                    van = true;
                    break;
                }
                elozoParos = paros;
            }
            Console.WriteLine(van ? "IGEN" : "NEM");
        }
    }
