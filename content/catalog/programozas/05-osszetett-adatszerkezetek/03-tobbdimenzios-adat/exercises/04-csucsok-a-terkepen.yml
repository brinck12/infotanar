  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int[,] terkep = new int[r, c];
            for (int i = 0; i < r; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < c; j++)
                {
                    terkep[i, j] = int.Parse(sor[j]);
                }
            }
            int[] di = { -1, 1, 0, 0 };
            int[] dj = { 0, 0, -1, 1 };
            var csucsok = new List<string>();
            for (int i = 0; i < r; i++)
            {
                for (int j = 0; j < c; j++)
                {
                    bool csucs = true;
                    for (int k = 0; k < 4; k++)
                    {
                        int ni = i + di[k];
                        int nj = j + dj[k];
                        if (ni >= 0 && ni < r && nj >= 0 && nj < c && terkep[ni, nj] >= terkep[i, j])
                        {
                            csucs = false;
                        }
                    }
                    if (csucs)
                    {
                        csucsok.Add((i + 1) + " " + (j + 1));
                    }
                }
            }
            Console.WriteLine("Csucsok: " + csucsok.Count);
            foreach (string s in csucsok)
            {
                Console.WriteLine(s);
            }
        }
    }
