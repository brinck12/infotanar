slug: az-irok-azonositoi
title: Az írók azonosítói
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Az `iro` tábla elsődleges kulcsa az `id`: ennek értéke minden íróé más, ezért egyértelműen azonosítja a rekordot.

  A `iro` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletesi_ev` | egész |

  Listázd ki minden író **azonosítóját és nevét**, ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: két mezőt vesszővel választhatsz el: `SELECT mezo1, mezo2 FROM ...`
starter_code:
  sql: |
    SELECT
    FROM iro;
sample_solutions:
  sql: |
    SELECT id, nev
    FROM iro;
tests:
