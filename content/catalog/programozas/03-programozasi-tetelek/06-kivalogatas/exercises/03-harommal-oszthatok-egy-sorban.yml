sample_solutions:
  python: |
    n = int(input())
    lista = []
    for _ in range(n):
        szam = int(input())
        if szam % 3 == 0:
            lista.append(szam)
    if len(lista) == 0:
        print("NINCS")
    else:
        print(" ".join(map(str, lista)))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> lista = new List<int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam % 3 == 0)
                {
                    lista.Add(szam);
                }
            }
            if (lista.Count == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(string.Join(" ", lista));
            }
        }
    }
