description: |
  Egy város napi középhőmérsékleteit N napon át mérték. A bemenet első sora N (legalább 2), a másodikban N egész szám áll szóközzel elválasztva. Keresd meg azt a két **szomszédos** napot, amelyek között a hőmérséklet különbsége (abszolút értékben) a legnagyobb. Írd ki ezt a különbséget (`Valtozas: ...`) és a két nap sorszámát 1-től számozva (`Napok: i-j`, ahol j = i + 1). Több azonos változásnál az első pár számít.

  Példa bemenet:

  ```
  6
  10 12 7 8 15 14
  ```

  Kimenet:

  ```
  Valtozas: 7
  Napok: 4-5
  ```

  Tipp: maximumkiválasztás a szomszédos elemek különbségén. A bejárás a második elemtől indul; a megtartott érték a különbség és a pár helye.
