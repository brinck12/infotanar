  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("1. feladat");
            Console.WriteLine("Napok szama: " + napok.Count);
            int osszeg = 0;
            Nap legmelegebb = napok[0];
            Nap leghidegebb = napok[0];
            foreach (Nap n in napok)
            {
                osszeg += n.Min + n.Max;
                if (n.Max > legmelegebb.Max)
                {
                    legmelegebb = n;
                }
                if (n.Min < leghidegebb.Min)
                {
                    leghidegebb = n;
                }
            }
            double atlag = osszeg / (2.0 * napok.Count);
            Console.WriteLine("Atlagos kozephomerseklet: " + atlag.ToString("F2", CultureInfo.InvariantCulture) + " C");
            Console.WriteLine("Legmelegebb nap: " + legmelegebb.Sorszam + ". nap (" + legmelegebb.Max + " C)");
            Console.WriteLine("Leghidegebb ejszaka: " + leghidegebb.Sorszam + ". nap (" + leghidegebb.Min + " C)");
        }
    }
