    CREATE TABLE dolgozo (id INTEGER PRIMARY KEY, nev TEXT, reszleg TEXT, fizetes INTEGER);
    INSERT INTO dolgozo VALUES
    (1, 'Varga Orsolya', 'uzlet', 370000),
    (2, 'Nagy Sandor', 'iroda', 390000),
    (3, 'Molnar Lilla', 'iroda', 330000),
    (4, 'Farkas Maria', 'raktar', 290000),
    (5, 'Molnar Anna', 'raktar', 450000),
    (6, 'Farkas Bence', 'raktar', 360000);
  expected: |
