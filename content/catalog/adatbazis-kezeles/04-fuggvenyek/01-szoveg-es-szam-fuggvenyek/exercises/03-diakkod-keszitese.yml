slug: diakkod-keszitese
title: Diákkód készítése
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Minden diákhoz készíts kódot (`kod`): a név első három betűje nagybetűvel, utána kötőjel, majd az osztály jele. Például a `Kiss Anna`, `10.A` diák kódja `KIS-10.A`. Az eredményben a név (`nev`) és a kód (`kod`) szerepeljen.

    A `diak` tábla:

    | `id` | `nev` | `email` | `osztaly` | `atlag` | `pont_elozo` | `pont_most` |
    |---|---|---|---|---|---|---|
    | 1 | Kiss Anna | Kiss.Anna@SULI.hu | 10.A | 4.567 | 62 | 75 |
    | 2 | Nagy Bela | Nagy.Bela@SULI.hu | 10.B | 3.842 | 70 | 66 |
    | 3 | Toth Csaba | Toth.Csaba@SULI.hu | 10.A | 3.125 | 55 | 41 |
    | 4 | Szabo Dora | Szabo.Dora@SULI.hu | 11.A | 4.918 | 80 | 92 |

    Az eredmény ezekre az adatokra:

    | `nev` | `kod` |
    |---|---|
    | Kiss Anna | KIS-10.A |
    | Nagy Bela | NAG-10.B |
    | Toth Csaba | TOT-10.A |
    | Szabo Dora | SZA-11.A |

    Tipp: a `SUBSTR(szöveg, 1, 3)` az első három karaktert adja, a `||` összefűzi a szövegeket (MariaDB-ben ez a `CONCAT`).
starter_code:
  sql: |
    SELECT nev,
      AS kod
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev, UPPER(SUBSTR(nev, 1, 3)) || '-' || osztaly AS kod
    FROM diak;
tests:
  - stdin: |
      CREATE TABLE diak (id INTEGER PRIMARY KEY, nev TEXT, email TEXT, osztaly TEXT, atlag REAL, pont_elozo INTEGER, pont_most INTEGER);
      INSERT INTO diak VALUES (1, 'Kiss Anna', 'Kiss.Anna@SULI.hu', '10.A', 4.567, 62, 75);
      INSERT INTO diak VALUES (2, 'Nagy Bela', 'Nagy.Bela@SULI.hu', '10.B', 3.842, 70, 66);
      INSERT INTO diak VALUES (3, 'Toth Csaba', 'Toth.Csaba@SULI.hu', '10.A', 3.125, 55, 41);
      INSERT INTO diak VALUES (4, 'Szabo Dora', 'Szabo.Dora@SULI.hu', '11.A', 4.918, 80, 92);
    expected: |
      nev,kod
      Kiss Anna,KIS-10.A
      Nagy Bela,NAG-10.B
      Toth Csaba,TOT-10.A
      Szabo Dora,SZA-11.A
