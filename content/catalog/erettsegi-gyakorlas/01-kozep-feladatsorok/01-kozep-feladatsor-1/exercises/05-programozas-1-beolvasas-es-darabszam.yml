  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("konyvek.txt");
            Console.WriteLine("1. feladat: A fajlban " + sorok.Length + " konyv szerepel.");
        }
    }
