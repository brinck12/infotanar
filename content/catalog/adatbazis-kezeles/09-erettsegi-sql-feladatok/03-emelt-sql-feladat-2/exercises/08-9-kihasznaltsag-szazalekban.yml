slug: 9-kihasznaltsag-szazalekban
title: 9. Kihasználtság százalékban
position: 7
kind: sql
level: emelt
difficulty: 5
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `helyszin` | `VARCHAR(30)` (város) |
  | `datum` | `DATE` |
  | `kapacitas` | `INT`, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `rendezveny_id` | `INT`, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | `VARCHAR(50)`, a vásárló neve |
  | `kategoria` | `VARCHAR(20)`: `allo`, `ules` vagy `vip` |
  | `ar` | `INT`, a jegy ára forintban |
  | `vasarlas` | `DATE`, a vásárlás napja |

  **9. feladat.** Adja meg lekérdezéssel rendezvényenként a **kihasználtságot**, vagyis az eladott jegyek számát a kapacitás százalékában, **egész százalékra kerekítve** (**nev, szazalek**)! Csak azok a rendezvények szerepeljenek, amelyekre eladtak legalább egy jegyet. A találatokat rendezze **kihasználtság szerint csökkenően**, azonos értéknél név szerint ábécérendbe!
starter_code:
  sql: "SELECT rendezveny.nev, ROUND(100 * COUNT(jegy.id) / rendezveny.kapacitas) AS szazalek\nFROM rendezveny INNER JOIN jegy ON \nGROUP BY \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT rendezveny.nev, ROUND(100 * COUNT(jegy.id) / rendezveny.kapacitas) AS szazalek
    FROM rendezveny INNER JOIN jegy ON jegy.rendezveny_id = rendezveny.id
    GROUP BY rendezveny.id, rendezveny.nev, rendezveny.kapacitas
    ORDER BY szazalek DESC, rendezveny.nev;
