sample_solutions:
  python: |
    class Meres:
        def __init__(self, datum, allas):
            self.datum = datum
            self.allas = allas
    print("6. feladat")
    with open("vizallas.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meresek = []
    for sor in sorok[1:]:
        r = sor.split("\t")
