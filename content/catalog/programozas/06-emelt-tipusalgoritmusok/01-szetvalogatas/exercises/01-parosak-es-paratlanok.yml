    }
sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    paros = []
    paratlan = []
    for x in a:
        if x % 2 == 0:
            paros.append(x)
        else:
            paratlan.append(x)

    def sor(lista):
        if len(lista) == 0:
            return "-"
        return " ".join(str(x) for x in lista)

    print("Paros: " + sor(paros))
    print("Paratlan: " + sor(paratlan))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static string Sor(List<int> lista)
        {
            if (lista.Count == 0)
            {
                return "-";
            }
            return string.Join(" ", lista);
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            var paros = new List<int>();
            var paratlan = new List<int>();
            foreach (int x in a)
            {
                if (x % 2 == 0)
                {
                    paros.Add(x);
                }
                else
                {
                    paratlan.Add(x);
                }
            }
            Console.WriteLine("Paros: " + Sor(paros));
            Console.WriteLine("Paratlan: " + Sor(paratlan));
        }
    }
tests:
