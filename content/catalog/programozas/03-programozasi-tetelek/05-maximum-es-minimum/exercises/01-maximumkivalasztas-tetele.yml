sample_solutions:
  python: |
    n = int(input())
    legnagyobb = int(input())
    for _ in range(n - 1):
        szam = int(input())
        if szam > legnagyobb:
            legnagyobb = szam
    print(legnagyobb)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int legnagyobb = int.Parse(Console.ReadLine());
            for (int i = 1; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > legnagyobb)
                {
                    legnagyobb = szam;
                }
            }
            Console.WriteLine(legnagyobb);
        }
    }
