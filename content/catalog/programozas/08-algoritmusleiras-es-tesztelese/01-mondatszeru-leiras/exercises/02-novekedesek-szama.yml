sample_solutions:
  python: |
    n = int(input())
    elozo = int(input())
    db = 0
    for i in range(2, n + 1):
        szam = int(input())
        if szam > elozo:
            db = db + 1
        elozo = szam
    print(db)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int elozo = int.Parse(Console.ReadLine());
            int db = 0;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > elozo)
                {
                    db = db + 1;
                }
                elozo = szam;
            }
            Console.WriteLine(db);
        }
    }
