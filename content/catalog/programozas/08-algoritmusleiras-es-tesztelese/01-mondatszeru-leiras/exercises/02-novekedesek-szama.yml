description: |
  Kódold le az alábbi algoritmust.

  ```text
  Algoritmus Novekedes
    Be: N
    Be: elozo
    db := 0
    Ciklus i := 2-től N-ig
      Be: szam
      Elágazás
        szam > elozo esetén: db := db + 1
      Elágazás vége
      elozo := szam
    Ciklus vége
    Ki: db
  Algoritmus vége
  ```

  Bemenet: az első sorban `N` (`1 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: hányszor nagyobb egy szám az előzőnél.

  Példa: `5`, majd `1`, `4`, `2`, `7`, `9` esetén a kimenet `3`. Ha `N = 1`, a kimenet `0`.

  Tipp: a ciklus csak `N - 1` alkalommal fut, mert az első számot a ciklus előtt olvasod be.
