slug: magyaros-datum
title: Magyaros dátum
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Írd ki a vevő nevét (`vevo`) és a rendelés dátumát magyaros alakban, `2025.03.03.` formában (`datum`).

    A `rendeles` tábla:

    | `id` | `vevo` | `rendelve` | `hatarido` | `szallitva` |
    |---|---|---|---|---|
    | 1 | Kiss Anna | 2025-03-03 | 2025-03-10 | 2025-03-07 |
    | 2 | Nagy Bela | 2025-03-08 | 2025-03-15 | 2025-03-17 |
    | 3 | Toth Csaba | 2025-02-26 | 2025-03-05 | 2025-03-05 |

    Az eredmény ezekre az adatokra:

    | `vevo` | `datum` |
    |---|---|
    | Kiss Anna | 2025.03.03. |
    | Nagy Bela | 2025.03.08. |
    | Toth Csaba | 2025.02.26. |

    Tipp: `DATE_FORMAT(dátum, '%Y.%m.%d.')`: az `%Y` az év, az `%m` a kétjegyű hónap, a `%d` a kétjegyű nap; a pontok szövegként maradnak.
starter_code:
  sql: |
    SELECT vevo, DATE_FORMAT(rendelve, '...') AS datum
    FROM rendeles;
sample_solutions:
  sql: |
    SELECT vevo, DATE_FORMAT(rendelve, '%Y.%m.%d.') AS datum
    FROM rendeles;
tests:
  - stdin: |
      CREATE TABLE rendeles (id INT, vevo VARCHAR(30), rendelve DATE, hatarido DATE, szallitva DATE);
      INSERT INTO rendeles VALUES (1, 'Kiss Anna', '2025-03-03', '2025-03-10', '2025-03-07');
      INSERT INTO rendeles VALUES (2, 'Nagy Bela', '2025-03-08', '2025-03-15', '2025-03-17');
      INSERT INTO rendeles VALUES (3, 'Toth Csaba', '2025-02-26', '2025-03-05', '2025-03-05');
    expected: |
      vevo,datum
      Kiss Anna,2025.03.03.
      Nagy Bela,2025.03.08.
      Toth Csaba,2025.02.26.
    hidden: false
  - stdin: |
      CREATE TABLE rendeles (id INT, vevo VARCHAR(30), rendelve DATE, hatarido DATE, szallitva DATE);
