slug: regi-konyvek
title: Régi könyvek
position: 3
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A szám típusú mezőknél a kisebb/nagyobb összehasonlítás természetes.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `szerzo` | szöveg |
  | `ev` | egész (a kiadás éve) |
  | `oldal` | egész |
  | `ar` | egész (Ft) |
  | `mufaj` | szöveg |

  Listázd ki azokat a könyveket (**cim, ev**), amelyeket **1980 előtt** adtak ki (az 1980-as még nem megfelelő)! A sorok sorrendje nem számít.

  Tipp: "előtt" a szigorúan kisebb: `<`.
starter_code:
  sql: |
    SELECT cim, ev
    FROM konyv
    WHERE ;
sample_solutions:
  sql: |
    SELECT cim, ev
    FROM konyv
    WHERE ev < 1980;
