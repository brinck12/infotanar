  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("1. feladat");
            // ide írd a megoldást
        }
    }
