; Kulon php-fpm pool a kodfuttato vegpontoknak (POST /api/v1/run, /api/v1/submissions).
; Telepites: /etc/php/8.3/fpm/pool.d/infotanar-run.conf, majd: systemctl reload php8.3-fpm
; Az nginx ide iranyitja a ket utvonalat (deploy/nginx/snippets/infotanar-run-location.conf.example);
; minden mas keres a fo poolra megy. Igy egy osztalynyi egyidejuleg futtato diak
; (egy futas akar 45 mp-ig tart egy workert) nem allitja le a belepest, a fizetest es
; a vizsga-feltoltest.
[infotanar-run]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-run.sock
listen.owner = www-data
listen.group = www-data

pm = static
; pm.max_children: ennyi futas lehet egyszerre. Legyen >= JUDGE0_MAX_CONCURRENT
; (backend/.env), kulonben a slot-korlat elott telik be a pool; es beferjen a
; memoriaba: max_children x ~80 MB (ellenorzes: ps --no-headers -o rss -C php-fpm8.3).
; A fo pool (www.conf) max_children erteke ettol fuggetlen.
pm.max_children = 20
pm.max_requests = 500

; A futas hatarideje 45 mp; a pool ennel kicsit tovabb engedi, az nginx 60 mp-nel zar.
request_terminate_timeout = 55s
; Lassu kereseket naplozzuk (a kodfuttatas varhatoan lassu, a 30 mp felett gyanus).
request_slowlog_timeout = 30s
slowlog = /var/log/php8.3-fpm-run-slow.log

clear_env = yes
php_admin_value[error_log] = /var/log/php8.3-fpm-run.log
php_admin_flag[log_errors] = on
; PHP2Shell (CVE-2026-109618/109619): az API-nak nincs sessionje. Csak pool-szinten (php_admin_*)
; ervenyes; az ini_set() es a .user.ini nem eleg. A teljes javitas a PHP 8.3.36+ frissites.
php_admin_value[session.upload_progress.enabled] = 0
