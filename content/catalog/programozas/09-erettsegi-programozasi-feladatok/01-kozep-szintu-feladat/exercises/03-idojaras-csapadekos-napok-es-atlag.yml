sample_solutions:
  python: |
    print("3. feladat")
    with open("homerseklet.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = int(sorok[0])
    napok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        napok.append((int(r[0]), int(r[1]), int(r[2]), int(r[3])))
    csapadekos = 0
    osszeg = 0
    for nap in napok:
        osszeg += nap[3]
        if nap[3] > 0:
            csapadekos += 1
    print("Csapadekos napok:", csapadekos)
    print(f"Atlagos csapadek: {osszeg / db:.2f} mm")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("3. feladat");
            string[] sorok = File.ReadAllLines("homerseklet.txt");
            int db = int.Parse(sorok[0]);
            int[][] napok = new int[db][];
            for (int i = 0; i < db; i++)
            {
                string[] r = sorok[i + 1].Split('\t');
                napok[i] = new int[] { int.Parse(r[0]), int.Parse(r[1]), int.Parse(r[2]), int.Parse(r[3]) };
            }
            int csapadekos = 0;
            int osszeg = 0;
            foreach (int[] nap in napok)
            {
                osszeg += nap[3];
                if (nap[3] > 0)
                {
                    csapadekos++;
                }
            }
            Console.WriteLine("Csapadekos napok: " + csapadekos);
            Console.WriteLine("Atlagos csapadek: " + ((double)osszeg / db).ToString("F2", CultureInfo.InvariantCulture) + " mm");
        }
    }
