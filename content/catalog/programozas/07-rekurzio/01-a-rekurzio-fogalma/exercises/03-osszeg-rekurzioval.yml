description: |
  Olvass be egy `N` egész számot (`0 ≤ N ≤ 500`), és számold ki rekurzív függvénnyel az `1 + 2 + ... + N` összeget. Az eredményt egyetlen sorban írd ki. Ciklust ne használj.

  Példa: ha `N = 4`, a kimenet `10`. Ha `N = 0`, a kimenet `0`.

  Tipp: az `osszeg(n)` értéke `n + osszeg(n - 1)`, az alapeset `osszeg(0) = 0`.
