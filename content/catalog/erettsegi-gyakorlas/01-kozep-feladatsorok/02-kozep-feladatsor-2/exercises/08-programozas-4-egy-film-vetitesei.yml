description: |
  A `vetitesek.txt` a mozi vetítéseit tartalmazza, soronként egy vetítéssel, pontosvesszővel elválasztva: `cím;műfaj;játékidő percben;kezdés;eladott jegyek;jegyár`. A kezdés `ÓÓ:PP` alakú. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **4. feladat.** Kérjen be egy filmcímet! Ha a filmnek van vetítése a fájlban, írja ki a `4. feladat:` sort, alá pedig a vetítések kezdési idejét és az eladott jegyek számát a fájlbeli sorrendben, soronként egy vetítést `kezdés eladott` alakban. Ha nincs, a kimenet egyetlen sor: `4. feladat: Nincs ilyen film!`

  Minta (a billentyűzetről beolvasott sor):

  ```text
  A kis robot
  ```

  A mintafájlra a kimenet:

  ```text
  4. feladat:
  18:30 50
  15:15 67
  15:15 61
  17:45 105
  20:00 106
  ```

  Tipp: gyűjtsd a találatokat egy listába; a lista hossza dönti el, melyik kiírás kell.
