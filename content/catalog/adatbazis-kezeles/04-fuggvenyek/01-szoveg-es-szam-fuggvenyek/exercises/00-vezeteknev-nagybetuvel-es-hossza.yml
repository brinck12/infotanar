slug: vezeteknev-nagybetuvel-es-hossza
title: Vezetéknév nagybetűvel és hossza
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
    Listázd a tanulók vezetéknevét (`vezeteknev`), ugyanezt csupa nagybetűvel (`nagybetus`), és azt, hogy hány karakterből áll (`hossz`).

    A `tanulo` tábla:

    | `id` | `vezeteknev` | `keresztnev` | `osztaly` |
    |---|---|---|---|
    | 1 | Kiss | Anna | 10.A |
    | 2 | Nagy | Bela | 10.B |
    | 3 | Toth | Csaba | 10.A |
    | 4 | Szabo | Dora | 11.A |

    Az eredmény ezekre az adatokra:

    | `vezeteknev` | `nagybetus` | `hossz` |
    |---|---|---|
    | Kiss | KISS | 4 |
    | Nagy | NAGY | 4 |
    | Toth | TOTH | 4 |
    | Szabo | SZABO | 5 |

    Tipp: az `UCASE(oszlop)` nagybetűssé alakít, a `CHAR_LENGTH(oszlop)` a karakterek számát adja.
starter_code:
  sql: |
    SELECT vezeteknev,
      ... AS nagybetus,
      ... AS hossz
    FROM tanulo;
sample_solutions:
  sql: |
    SELECT vezeteknev, UCASE(vezeteknev) AS nagybetus, CHAR_LENGTH(vezeteknev) AS hossz
    FROM tanulo;
tests:
  - stdin: |
      CREATE TABLE tanulo (id INT, vezeteknev VARCHAR(30), keresztnev VARCHAR(30), osztaly VARCHAR(5));
      INSERT INTO tanulo VALUES (1, 'Kiss', 'Anna', '10.A');
      INSERT INTO tanulo VALUES (2, 'Nagy', 'Bela', '10.B');
      INSERT INTO tanulo VALUES (3, 'Toth', 'Csaba', '10.A');
      INSERT INTO tanulo VALUES (4, 'Szabo', 'Dora', '11.A');
    expected: |
      vezeteknev,nagybetus,hossz
      Kiss,KISS,4
      Nagy,NAGY,4
      Toth,TOTH,4
      Szabo,SZABO,5
