slug: indulas-es-cel-parosaval
title: Indulás és cél párosával
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
  A `DISTINCT` több oszlopra is vonatkozhat: ilyenkor az egész **sor** számít, tehát azonos értékpárok vonódnak össze.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki a különböző útvonalakat: az `indulas` és a `cel` mező együtt, minden pár csak egyszer! A sorok sorrendje nem számít.

  Tipp: a `DISTINCT` a felsorolt oszlopok összes értékére együtt vonatkozik: `SELECT DISTINCT a, b`.
starter_code:
  sql: |
    SELECT
    FROM taxi;
sample_solutions:
  sql: |
    SELECT DISTINCT indulas, cel
    FROM taxi;
