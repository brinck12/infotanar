    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("2. feladat");
            // ide írd a megoldást
        }
    }
sample_solutions:
  python: |
    with open("terkep.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meret = sorok[0].split()
    n = int(meret[0])
    m = int(meret[1])
    terkep = sorok[1:1 + n]
    print("2. feladat")
    legjobb = 0
    sorszam = 0
    for i in range(n):
        db = terkep[i].count("#")
        if db > legjobb:
            legjobb = db
            sorszam = i + 1
    if legjobb == 0:
        print("Nincs fold.")
    else:
        print("Sor:", sorszam)
        print("Fold:", legjobb)
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("2. feladat");
            int legjobb = 0;
            int sorszam = 0;
            for (int i = 0; i < n; i++)
            {
                int db = 0;
                foreach (char c in terkep[i])
                {
                    if (c == '#')
                    {
                        db++;
                    }
                }
                if (db > legjobb)
                {
                    legjobb = db;
                    sorszam = i + 1;
                }
            }
            if (legjobb == 0)
            {
                Console.WriteLine("Nincs fold.");
            }
            else
            {
                Console.WriteLine("Sor: " + sorszam);
                Console.WriteLine("Fold: " + legjobb);
            }
        }
    }
