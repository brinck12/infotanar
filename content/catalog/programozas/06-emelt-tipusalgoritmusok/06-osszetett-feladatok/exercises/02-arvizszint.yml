description: |
  Egy folyó vízállását N napon át mérték. A bemenet első sora `N T` (a napok száma, legalább 1, és a küszöbérték, cm), a másodikban N egész szám áll szóközzel elválasztva: a napi vízállások. **Küszöbátlépés** az a nap, amelyen a vízállás nagyobb a küszöbnél, az előző napon pedig legfeljebb akkora volt (az első nap nem lehet átlépés, mert nincs előző mérés). Írd ki az első átlépés napját 1-től számozva (`Elso: ...`; ha nincs, `Elso: nincs`), és az átlépések számát (`Atlepes: ...`).

  Példa bemenet:

  ```
  8 300
  250 290 310 320 295 305 300 301
  ```

  Kimenet:

  ```
  Elso: 3
  Atlepes: 3
  ```

  Tipp: a feltétel két szomszédos mérésre vonatkozik, ezért a bejárás a második naptól indul. A keresés és a megszámlálás ugyanazzal a feltétellel dolgozik.
