description: |
  Az `indulasok.txt` a repülőtér egy havi (30 napos) forgalmát tartalmazza, soronként egy indulással, pontosvesszővel elválasztva: `járatszám;célállomás;távolság km;nap;indulás;utasok;késés`. A járatszám két betűből és négy számjegyből áll (pl. `MA1017`), a nap a hónap napja (1–30), az indulás `ÓÓ:PP` alakú, a késés percben értendő (0, ha pontosan indult). Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz, a sorok nincsenek sorrendben, és egy járat egy napon egy időpontban legfeljebb egyszer szerepel.

  **7. feladat.** Rendezze az indulásokat időrendbe (nap, majd indulási idő szerint)! Keresse meg a **leghosszabb olyan folyamatos sorozatot**, amelyben egymás után minden járat késés nélkül (`késés = 0`) indult. Írja ki a sorozat hosszát, valamint az első és az utolsó járatot a napjukkal és idejükkel. Ha több azonos hosszúságú van, az **első** számít. Ha egyetlen járat sem indult késés nélkül, a kimenet: `7. feladat: Nem volt keses nelkuli indulas.`

  A mintafájlra a kimenet:

  ```text
  7. feladat: A leghosszabb keses nelkuli sorozat 2 indulas, MA2059 (2. nap 16:10) es TV7385 (2. nap 17:35) kozott.
  ```

  Tipp: rendezés után számold az egymás utáni jó elemeket; a késéssel induló járat nullázza a számlálót. Csak szigorúan nagyobb hossz frissítse a legjobbat, és jegyezd meg a sorozat kezdőindexét is. A sorozat végén lévő szakaszra is gondolj.
