sample_solutions:
  python: |
    jel = input()
    with open(jel + ".txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    with open(jel + "_jo.txt", "w", encoding="utf-8") as ki:
        ki.write(sorok[0] + "\n")
        for sor in sorok[1:]:
            if int(sor.split("\t")[1]) >= 4:
                ki.write(sor + "\n")
    with open(jel + "_jo.txt", encoding="utf-8") as f:
        kiirt = f.read().splitlines()
    for sor in kiirt:
        print(sor)
    print("Jo tanulok:", len(kiirt) - 1)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string jel = Console.ReadLine();
            string[] sorok = File.ReadAllLines(jel + ".txt");
            using (StreamWriter ki = new StreamWriter(jel + "_jo.txt"))
            {
                ki.WriteLine(sorok[0]);
                for (int i = 1; i < sorok.Length; i++)
                {
                    if (int.Parse(sorok[i].Split('\t')[1]) >= 4)
                    {
                        ki.WriteLine(sorok[i]);
                    }
                }
            }
            string[] kiirt = File.ReadAllLines(jel + "_jo.txt");
            foreach (string sor in kiirt)
            {
                Console.WriteLine(sor);
            }
            Console.WriteLine("Jo tanulok: " + (kiirt.Length - 1));
        }
    }
files:
