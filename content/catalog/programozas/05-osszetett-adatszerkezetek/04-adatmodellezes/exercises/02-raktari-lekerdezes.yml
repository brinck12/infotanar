slug: raktari-lekerdezes
title: "Raktári lekérdezés"
position: 1
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  A raktár készlete: az első sor a tételek száma (N, legalább 1), majd N sor: `cikkszam;db;egysegar` (a cikkszámok különbözők; a darabszám és az ár egész szám). Ezután egy sor a lekérdezések számával (M), majd M sor, mindegyikben egy cikkszám.

  Minden lekérdezésre írj egy sort: `cikkszam: DB db, AR Ft/db`, vagy ha nincs ilyen cikk, `cikkszam: nincs`.

  Példa bemenet:

  ```
  3
  1042;12;350
  0007;5;1200
  2210;0;99
  3
  0007
  1042
  9999
  ```

  Kimenet:

  ```
  0007: 5 db, 1200 Ft/db
  1042: 12 db, 350 Ft/db
  9999: nincs
  ```

  Tipp: a cikkszám legyen szöveg (az elején lévő nullák számítanak), és szótárban tárold: kulcs a cikkszám, érték a rekord.
