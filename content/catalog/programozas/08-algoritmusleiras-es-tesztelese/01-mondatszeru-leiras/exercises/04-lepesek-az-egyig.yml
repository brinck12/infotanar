sample_solutions:
  python: |
    n = int(input())
    db = 0
    while n > 1:
        if n % 2 == 0:
            n = n // 2
        else:
            n = 3 * n + 1
        db = db + 1
    print(db)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            long n = long.Parse(Console.ReadLine());
            int db = 0;
            while (n > 1)
            {
                if (n % 2 == 0)
                {
                    n = n / 2;
                }
                else
                {
                    n = 3 * n + 1;
                }
                db = db + 1;
            }
            Console.WriteLine(db);
        }
    }
