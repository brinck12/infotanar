description: "A `konyvek.txt` a könyvtár állományát tartalmazza, soronként egy könyvvel, pontosvesszővel elválasztva: `szerző;cím;kiadás éve;oldalszám`. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.\n\n**3. feladat.** Kérjen be egy évszámot, és írja ki, hány könyvet adtak ki ebben az évben vagy később, a minta szerint.\n\nMinta (a billentyűzetről beolvasott sor):\n\n```text\n2010\n```\n\nA mintafájlra a kimenet:\n\n```text\n3. feladat: Darab: 4\r\n```\n\nTipp: olvasd be az évszámot (`input()` / `Console.ReadLine()`), és számold meg a nála nem régebbi könyveket."
