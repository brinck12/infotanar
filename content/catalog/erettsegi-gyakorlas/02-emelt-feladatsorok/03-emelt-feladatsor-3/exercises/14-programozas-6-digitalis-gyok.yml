description: |
  Az `indulasok.txt` a repülőtér egy havi (30 napos) forgalmát tartalmazza, soronként egy indulással, pontosvesszővel elválasztva: `járatszám;célállomás;távolság km;nap;indulás;utasok;késés`. A járatszám két betűből és négy számjegyből áll (pl. `MA1017`), a nap a hónap napja (1–30), az indulás `ÓÓ:PP` alakú, a késés percben értendő (0, ha pontosan indult). Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz, a sorok nincsenek sorrendben, és egy járat egy napon egy időpontban legfeljebb egyszer szerepel.

  **6. feladat.** Egy szám *digitális gyökét* úgy kapjuk, hogy összeadjuk a számjegyeit; ha az összeg még legalább kétjegyű, a műveletet az összegre **ismételjük**, amíg egyjegyű számot nem kapunk (például 4129 → 16 → 7). Írjon **rekurzív** függvényt a digitális gyök kiszámítására! A járatszám számjegyeiből (az utolsó négy karakter) alkotott szám digitális gyökét számolja ki, és keresse meg azt a járatszámot, amelynek a **legnagyobb a digitális gyöke**. Ha több ilyen van, a fájlban **először előforduló** járatszám számít.

  A mintafájlra a kimenet:

  ```text
  6. feladat: A legnagyobb digitalis gyoku jaratszam: MA1017 (gyok: 9)
  ```

  Tipp: a számjegyösszeg `n % 10` és `n // 10` ismétlésével adódik; a gyök rekurzív hívása: ha `n < 10`, akkor `n`, különben a számjegyösszeg gyöke. A járatszámokat elég egyszer vizsgálni.
