slug: 8-a-legkisebb-napi-bevetel
title: 8. A legkisebb napi bevétel
position: 6
kind: sql
level: emelt
difficulty: 5
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `szuletes` | `INT`, a születési év |
  | `angol` | `INT`: 1, ha beszél angolul, különben 0 |
  | `nemet` | `INT`: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | `INT`, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `sofor_id` | `INT`, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | `VARCHAR(10)`, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | `DATE` |
  | `km` | `INT`, a megtett út kilométerben |
  | `ar` | `INT`, a fuvar ára forintban |
  | `fizetes` | `VARCHAR(10)`: `kartya` vagy `keszpenz` |

  **8. feladat.** Egy nap bevétele az aznapi fuvarok árának összege. Adja meg lekérdezéssel a **legkisebb napi bevételt**! Az eredmény egyetlen oszlop legyen, `legkisebb` néven.
starter_code:
  sql: |
    SELECT MIN(napi) AS legkisebb
    FROM (SELECT datum, SUM(ar) AS napi
          FROM fuvar
          GROUP BY ) AS n;
sample_solutions:
  sql: |
    SELECT MIN(napi) AS legkisebb
    FROM (SELECT datum, SUM(ar) AS napi
          FROM fuvar
          GROUP BY datum) AS n;
