sample_solutions:
  python: |
    n = int(input())
    for _ in range(n):
        szam = int(input())
        if szam > 10:
            print(szam)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > 10)
                {
                    Console.WriteLine(szam);
                }
            }
        }
    }
