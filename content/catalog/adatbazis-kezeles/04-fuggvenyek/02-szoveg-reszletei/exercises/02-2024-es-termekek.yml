slug: 2024-es-termekek
title: 2024-es termékek
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Listázd annak a termékeknek a nevét (`nev`) és kódját (`kod`), amelyeknek a gyártási éve 2024. A gyártási év a kód 5. karakterétől kezdődő négy karakter.

    A `termek` tábla:

    | `id` | `kod` | `nev` |
    |---|---|---|
    | 1 | LAP-2023-001 | Laptop |
    | 2 | EGE-2024-014 | Vezetek nelkuli eger |
    | 3 | MON-2022-007 | Monitor |
    | 4 | LAP-2024-102 | Jatek laptop |
    | 6 | MON-2024-250 | Ivelt monitor |

    Az eredmény ezekre az adatokra:

    | `nev` | `kod` |
    |---|---|
    | Vezetek nelkuli eger | EGE-2024-014 |
    | Jatek laptop | LAP-2024-102 |
    | Ivelt monitor | MON-2024-250 |

    Tipp: a `SUBSTRING(...)` a `WHERE`-ben is használható. Az eredmény szöveg, ezért aposztróf kell: `= '2024'`.
starter_code:
  sql: |
    SELECT nev, kod
    FROM termek
    WHERE ...;
sample_solutions:
  sql: |
    SELECT nev, kod
    FROM termek
    WHERE SUBSTRING(kod, 5, 4) = '2024';
tests:
  - stdin: |
      CREATE TABLE termek (id INT, kod VARCHAR(12), nev VARCHAR(30));
      INSERT INTO termek VALUES (1, 'LAP-2023-001', 'Laptop');
      INSERT INTO termek VALUES (2, 'EGE-2024-014', 'Vezetek nelkuli eger');
      INSERT INTO termek VALUES (3, 'MON-2022-007', 'Monitor');
      INSERT INTO termek VALUES (4, 'LAP-2024-102', 'Jatek laptop');
      INSERT INTO termek VALUES (6, 'MON-2024-250', 'Ivelt monitor');
    expected: |
      nev,kod
      Vezetek nelkuli eger,EGE-2024-014
      Jatek laptop,LAP-2024-102
      Ivelt monitor,MON-2024-250
