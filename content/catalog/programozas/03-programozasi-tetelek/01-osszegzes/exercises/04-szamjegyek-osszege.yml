sample_solutions:
  python: |
    szoveg = input()
    osszeg = 0
    for jegy in szoveg:
        osszeg += int(jegy)
    print(osszeg)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            string szoveg = Console.ReadLine();
            int osszeg = 0;
            foreach (char jegy in szoveg)
            {
                osszeg += jegy - '0';
            }
            Console.WriteLine(osszeg);
        }
    }
