slug: majusi-szuletesnapok
title: Májusi születésnapok
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Listázd azoknak a tanulóknak a nevét (`nev`) és születési dátumát (`szuletes`), akik májusban születtek, bármelyik évben.

    A `tanulo` tábla:

    | `id` | `nev` | `szuletes` |
    |---|---|---|
    | 1 | Kiss Anna | 2008-05-14 |
    | 2 | Nagy Bela | 2009-11-02 |
    | 3 | Toth Csaba | 2008-05-30 |
    | 4 | Szabo Dora | 2009-02-27 |
    | 5 | Varga Fanni | 2010-05-01 |

    Az eredmény ezekre az adatokra:

    | `nev` | `szuletes` |
    |---|---|
    | Kiss Anna | 2008-05-14 |
    | Toth Csaba | 2008-05-30 |
    | Varga Fanni | 2010-05-01 |

    Tipp: a `strftime` szöveget ad vissza, ezért a hónapot szövegként, kétjegyűen (`'05'`) hasonlítsd.
starter_code:
  sql: |
    SELECT nev, szuletes
    FROM tanulo
    WHERE ;
sample_solutions:
  sql: |
    SELECT nev, szuletes
    FROM tanulo
    WHERE strftime('%m', szuletes) = '05';
tests:
  - stdin: |
      CREATE TABLE tanulo (id INTEGER PRIMARY KEY, nev TEXT, szuletes TEXT);
      INSERT INTO tanulo VALUES (1, 'Kiss Anna', '2008-05-14');
      INSERT INTO tanulo VALUES (2, 'Nagy Bela', '2009-11-02');
      INSERT INTO tanulo VALUES (3, 'Toth Csaba', '2008-05-30');
      INSERT INTO tanulo VALUES (4, 'Szabo Dora', '2009-02-27');
      INSERT INTO tanulo VALUES (5, 'Varga Fanni', '2010-05-01');
    expected: |
      nev,szuletes
      Kiss Anna,2008-05-14
      Toth Csaba,2008-05-30
      Varga Fanni,2010-05-01
