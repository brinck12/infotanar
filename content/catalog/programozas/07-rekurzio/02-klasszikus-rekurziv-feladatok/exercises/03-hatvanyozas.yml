sample_solutions:
  python: |
    def hatvany(a, n):
        if n == 0:
            return 1
        return a * hatvany(a, n - 1)

    a = int(input())
    n = int(input())
    print(hatvany(a, n))
  csharp: |
    using System;

    class Program
    {
        static long Hatvany(long a, int n)
        {
            if (n == 0)
            {
                return 1;
            }
            return a * Hatvany(a, n - 1);
        }

        static void Main()
        {
            long a = long.Parse(Console.ReadLine());
            int n = int.Parse(Console.ReadLine());
            Console.WriteLine(Hatvany(a, n));
        }
    }
