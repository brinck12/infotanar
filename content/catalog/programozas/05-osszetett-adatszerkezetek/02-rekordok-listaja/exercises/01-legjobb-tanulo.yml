sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Tanulo:
        nev: str
        pont: int

    n = int(input())
    tanulok = []
    for _ in range(n):
        resz = input().split(";")
        tanulok.append(Tanulo(resz[0], int(resz[1])))
    legjobb = tanulok[0]
    for t in tanulok:
        if t.pont > legjobb.pont:
            legjobb = t
    print("Legjobb:", legjobb.nev)
    print("Pont:", legjobb.pont)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Tanulo
    {
        public string Nev;
        public int Pont;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var tanulok = new List<Tanulo>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                tanulok.Add(new Tanulo { Nev = resz[0], Pont = int.Parse(resz[1]) });
            }
            var legjobb = tanulok[0];
            foreach (var t in tanulok)
            {
                if (t.Pont > legjobb.Pont)
                {
                    legjobb = t;
                }
            }
            Console.WriteLine("Legjobb: " + legjobb.Nev);
            Console.WriteLine("Pont: " + legjobb.Pont);
        }
    }
