allowed_languages: [python, csharp]
description: |
  Az eredeti algoritmus a 10-nél nagyobb számokat számolja meg:

  ```text
  Algoritmus Megszamol
    Be: N
    db := 0
    Ciklus i := 1-től N-ig
      Be: szam
      Elágazás
        szam > 10 esetén: db := db + 1
      Elágazás vége
    Ciklus vége
    Ki: db
  Algoritmus vége
  ```

  **Módosítsd** úgy, hogy a **3-mal osztható** számokat számolja meg (a 0 és a negatív többszörösök is ide tartoznak). Kódold le a módosított algoritmust.

  Bemenet: az első sorban `N` (`0 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: a 3-mal osztható számok darabszáma.

  Példa: `5`, majd `3`, `4`, `9`, `-6`, `10` esetén a kimenet `3`.

  Tipp: a feltétel `szam % 3 == 0`; a negatív számoknál is működik.
