description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **4. feladat** (7 pont). Írja ki az öt legcsapadékosabb napot csapadék szerint csökkenő sorrendben! Azonos csapadéknál a korábbi nap szerepeljen előbb. Csak olyan nap kerülhet a listára, amelyen esett csapadék (`csapadek > 0`); ha ilyen nap ötnél kevesebb van, az összeset írja ki, ha egy sem, a `Nem esett csapadek.` sort. Végül írja ki az egész hónap összes csapadékát is.

  A mintafájlra a kimenet:

  ```text
  4. feladat
  Legcsapadekosabb napok:
  1. 19. nap: 25 mm
  2. 14. nap: 24 mm
  3. 21. nap: 18 mm
  4. 1. nap: 15 mm
  5. 18. nap: 15 mm
  Osszes csapadek: 172 mm
  ```

  Tipp: a rendezést ne kézzel írd, használd a nyelv rendezőjét: Pythonban a `sorted(..., key=...)` stabil rendezés, C#-ban az `OrderByDescending` is az. Stabil rendezésnél az azonos kulcsú elemek az eredeti sorrendjükben maradnak.
