description: |
  A buszjáratok menetrendje külön fájlokban van, a járat betűjele a fájl neve: `A.txt`, `B.txt`. A fájl tabulátorral tagolt, az első sora fejléc (`megallo`, `perc`); minden további sor egy megállót és az onnan az előző megállótól való menetidőt (percben) adja meg. A felhasználó megadja a járat betűjelét. Írd ki a megállók számát, az összes menetidőt, és a leghosszabb szakasz végállomását:

  ```
  Megallok: 4
  Menetido: 31 perc
  Leghosszabb: Vasutallomas (12 perc)
  ```

  Holtverseny esetén a korábbi megálló számít.

  Tipp: a fájl neve `betujel + ".txt"`; a leghosszabb szakasz keresése maximumkeresés.
starter_code:
  python: |
    jarat = input()
    with open(jarat + ".txt", encoding="utf-8") as f:
