sample_solutions:
  python: |
    with open("konyvek.txt", encoding="utf-8") as f:
        konyvek = [sor.split(";") for sor in f.read().splitlines()]
    legjobb = max(konyvek, key=lambda k: int(k[3]))
    print("2. feladat: Leghosszabb konyv:", legjobb[1], "(" + legjobb[3], "oldal)")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("konyvek.txt");
            string[] legjobb = null;
            int max = -1;
            foreach (string sor in sorok)
            {
                string[] r = sor.Split(';');
                int oldal = int.Parse(r[3]);
                if (oldal > max)
                {
                    max = oldal;
                    legjobb = r;
                }
            }
            Console.WriteLine("2. feladat: Leghosszabb konyv: " + legjobb[1] + " (" + legjobb[3] + " oldal)");
        }
    }
