sample_solutions:
  python: |
    def visszaszamol(n):
        if n == 0:
            print("Indulas!")
        else:
            print(n)
            visszaszamol(n - 1)

    visszaszamol(int(input()))
  csharp: |
    using System;

    class Program
    {
        static void Visszaszamol(int n)
        {
            if (n == 0)
            {
                Console.WriteLine("Indulas!");
            }
            else
            {
                Console.WriteLine(n);
                Visszaszamol(n - 1);
            }
        }

        static void Main()
        {
            Visszaszamol(int.Parse(Console.ReadLine()));
        }
    }
