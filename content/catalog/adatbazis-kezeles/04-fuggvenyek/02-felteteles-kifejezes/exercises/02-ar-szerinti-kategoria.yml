slug: ar-szerinti-kategoria
title: Ár szerinti kategória
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    A boltban a 1000 Ft alatti termék `olcso`, az 1000 és 4999 Ft közötti `kozepes`, az 5000 Ft-os vagy drágább `draga`. Listázd a termék nevét (`nev`), árát (`ar`) és kategóriáját (`kategoria`).

    A `termek` tábla:

    | `id` | `nev` | `ar` | `keszlet` |
    |---|---|---|---|
    | 1 | Fuzet | 250 | 40 |
    | 2 | Hatizsak | 8900 | 0 |
    | 3 | Toll | 990 | 3 |
    | 4 | Szamologep | 4500 | 12 |

    Az eredmény ezekre az adatokra:

    | `nev` | `ar` | `kategoria` |
    |---|---|---|
    | Fuzet | 250 | olcso |
    | Hatizsak | 8900 | draga |
    | Toll | 990 | olcso |
    | Szamologep | 4500 | kozepes |

    Tipp: a szöveges eredményt aposztrófok közé kell tenni; az `ELSE` ág fogja a többit.
starter_code:
  sql: |
    SELECT nev, ar,
      CASE
        -- ide jönnek az ágak
      END AS kategoria
    FROM termek;
sample_solutions:
  sql: |
    SELECT nev, ar,
      CASE
        WHEN ar < 1000 THEN 'olcso'
        WHEN ar < 5000 THEN 'kozepes'
        ELSE 'draga'
      END AS kategoria
    FROM termek;
tests:
  - stdin: |
      CREATE TABLE termek (id INTEGER PRIMARY KEY, nev TEXT, ar INTEGER, keszlet INTEGER);
      INSERT INTO termek VALUES (1, 'Fuzet', 250, 40);
      INSERT INTO termek VALUES (2, 'Hatizsak', 8900, 0);
      INSERT INTO termek VALUES (3, 'Toll', 990, 3);
      INSERT INTO termek VALUES (4, 'Szamologep', 4500, 12);
    expected: |
      nev,ar,kategoria
      Fuzet,250,olcso
      Hatizsak,8900,draga
      Toll,990,olcso
      Szamologep,4500,kozepes
