title: Átlag és átlag feletti elemek
position: 2
kind: code
level: kozep
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Az első sorban egy `N` egész szám áll (`N >= 1`), utána `N` nemnegatív egész szám következik, mindegyik külön sorban. Írd ki két sorban:

  ```
  Atlag: <az átlag egész része>
  Felette: <hány elem nagyobb a valódi átlagnál>
  ```

  Az átlag egész része az összeg és az elemszám **egész osztással** kapott hányadosa. Az "átlag feletti" elemeknél viszont a **pontos** átlagot kell figyelembe venni, nem a kerekítettet.

  Példa: a `3`, `1`, `2`, `2` bemenetre az összeg 5, az átlag 5/3 = 1,67, ezért a kimenet:

  ```
  Atlag: 1
  Felette: 2
  ```

  Tipp: az `x > osszeg / n` helyett használd az `x * n > osszeg` összehasonlítást, így nem kell valós számokkal számolnod.
