description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a **legkisebbet** közülük!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a legkisebb szám.

  ### Példa

  Bemenet: `4`, majd `8`, `3`, `9`, `5`. Kimenet: `3`

  Tipp: a minimumkiválasztás a maximumé tükörképe: a kezdőérték az első szám, és a kisebb számra frissítesz.
constraints:
  require:
  - loop
  forbid:
  - builtin:min
  - builtin:sorted
  - method:sort
