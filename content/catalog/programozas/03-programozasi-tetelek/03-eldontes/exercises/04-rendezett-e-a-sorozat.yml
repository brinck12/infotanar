description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Döntsd el, hogy a sorozat **nem csökkenő-e**, vagyis minden szám legalább akkora-e, mint az előtte álló!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban `IGEN`, ha a sorozat nem csökkenő, egyébként `NEM`. Egyetlen elem esetén a válasz `IGEN`.

  ### Példa

  Bemenet: `4`, majd `1`, `2`, `2`, `5`. Kimenet: `IGEN`. Bemenet: `3`, majd `1`, `3`, `2`. Kimenet: `NEM`.

  Tipp: ez minden-e tétel az egymás melletti párokra. Tárold az előző elemet, és az első olyan párnál, ahol a szám kisebb az előzőnél, állítsd `False`/`false`-ra a jelzőt.
