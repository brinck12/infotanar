slug: atnevezett-oszlopok
title: Átnevezett oszlopok
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  Az `AS` kulcsszóval az eredmény oszlopának új nevet adhatunk (alias): `SELECT mezo AS ujnev`. A tábla maga nem változik, csak a kimenet fejléce.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki a diákok nevét `tanulo`, pontszámát `pontszam` néven! A két oszlop ebben a sorrendben álljon. A sorok sorrendje nem számít.

  Tipp: az alias a mező neve után áll: `nev AS tanulo`.
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev AS tanulo, pont AS pontszam
    FROM diak;
