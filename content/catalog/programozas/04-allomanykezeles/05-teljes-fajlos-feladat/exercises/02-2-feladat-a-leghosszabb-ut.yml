sample_solutions:
  python: |
    print("2. feladat")
    with open("ut.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    legjobb = sorok[1].split("\t")
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        if int(mezok[2]) > int(legjobb[2]):
            legjobb = mezok
    print("Leghosszabb ut: " + legjobb[0] + " " + legjobb[1] + " " + legjobb[2] + " km")
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("2. feladat");
            string[] sorok = File.ReadAllLines("ut.txt");
            string[] legjobb = sorok[1].Split('\t');
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                if (int.Parse(mezok[2]) > int.Parse(legjobb[2]))
                {
                    legjobb = mezok;
                }
            }
            Console.WriteLine("Leghosszabb ut: " + legjobb[0] + " " + legjobb[1] + " " + legjobb[2] + " km");
        }
    }
