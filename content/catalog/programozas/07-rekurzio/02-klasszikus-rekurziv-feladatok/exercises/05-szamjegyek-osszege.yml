sample_solutions:
  python: |
    def szj(n):
        if n == 0:
            return 0
        return n % 10 + szj(n // 10)

    print(szj(int(input())))
  csharp: |
    using System;

    class Program
    {
        static int Szj(int n)
        {
            if (n == 0)
            {
                return 0;
            }
            return n % 10 + Szj(n / 10);
        }

        static void Main()
        {
            Console.WriteLine(Szj(int.Parse(Console.ReadLine())));
        }
    }
