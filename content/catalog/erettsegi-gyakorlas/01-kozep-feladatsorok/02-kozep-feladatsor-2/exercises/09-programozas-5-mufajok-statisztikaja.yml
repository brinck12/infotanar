  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Vetites
    {
        public string Cim;
        public string Mufaj;
        public int Hossz;
        public string Kezdes;
        public int Eladott;
        public int Jegyar;

        public Vetites(string sor)
        {
            string[] r = sor.Split(';');
            Cim = r[0];
            Mufaj = r[1];
            Hossz = int.Parse(r[2]);
            Kezdes = r[3];
            Eladott = int.Parse(r[4]);
            Jegyar = int.Parse(r[5]);
        }

        public int Bevetel()
        {
            return Eladott * Jegyar;
        }
    }

    class Program
    {
        static void Main()
        {
            List<Vetites> vetitesek = new List<Vetites>();
            foreach (string sor in File.ReadAllLines("vetitesek.txt"))
            {
                vetitesek.Add(new Vetites(sor));
            }
            List<string> mufajok = new List<string>();
            foreach (Vetites v in vetitesek)
            {
                if (!mufajok.Contains(v.Mufaj))
                {
                    mufajok.Add(v.Mufaj);
                }
            }
            Console.WriteLine("5. feladat:");
            foreach (string m in mufajok)
            {
                int db = 0;
                int jegy = 0;
                int ar = 0;
                foreach (Vetites v in vetitesek)
                {
                    if (v.Mufaj == m)
                    {
                        db++;
                        jegy += v.Eladott;
                        ar += v.Jegyar;
                    }
                }
                double atlag = (double)ar / db;
                Console.WriteLine(m + ": " + db + " db, " + jegy + " jegy, atlagos jegyar " + atlag.ToString("0.0", System.Globalization.CultureInfo.InvariantCulture) + " Ft");
            }
        }
    }
