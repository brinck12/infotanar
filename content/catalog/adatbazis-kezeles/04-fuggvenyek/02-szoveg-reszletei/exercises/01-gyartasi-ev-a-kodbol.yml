slug: gyartasi-ev-a-kodbol
title: Gyártási év a kódból
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    A termékkód alakja `ABC-2024-017`: a gyártási év a kód 5. karakterétől kezdődő négy karakter. Listázd a termék nevét (`nev`) és a gyártási évet (`ev`).

    A `termek` tábla:

    | `id` | `kod` | `nev` |
    |---|---|---|
    | 1 | LAP-2023-001 | Laptop |
    | 2 | EGE-2024-014 | Vezetek nelkuli eger |
    | 3 | MON-2022-007 | Monitor |

    Az eredmény ezekre az adatokra:

    | `nev` | `ev` |
    |---|---|
    | Laptop | 2023 |
    | Vezetek nelkuli eger | 2024 |
    | Monitor | 2022 |

    Tipp: `SUBSTRING(szöveg, kezdet, hossz)`: a kezdet az első karakternél 1, nem 0.
starter_code:
  sql: |
    SELECT nev, ... AS ev
    FROM termek;
sample_solutions:
  sql: |
    SELECT nev, SUBSTRING(kod, 5, 4) AS ev
    FROM termek;
tests:
  - stdin: |
      CREATE TABLE termek (id INT, kod VARCHAR(12), nev VARCHAR(30));
      INSERT INTO termek VALUES (1, 'LAP-2023-001', 'Laptop');
      INSERT INTO termek VALUES (2, 'EGE-2024-014', 'Vezetek nelkuli eger');
      INSERT INTO termek VALUES (3, 'MON-2022-007', 'Monitor');
    expected: |
      nev,ev
      Laptop,2023
      Vezetek nelkuli eger,2024
      Monitor,2022
