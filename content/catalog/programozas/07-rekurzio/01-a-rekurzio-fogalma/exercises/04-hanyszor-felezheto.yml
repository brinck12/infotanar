description: |
  Olvass be egy `N` pozitív egész számot. Hányszor lehet egész osztással kettővel elosztani, amíg az eredmény 1 vagy kisebb lesz? Számold ki rekurzív függvénnyel.

  A leírás: `lepes(n)` értéke 0, ha `n ≤ 1`; különben `1 + lepes(n osztva 2-vel, egészrész)`.

  Példa: `N = 8` esetén `8 → 4 → 2 → 1`, tehát 3 lépés, a kimenet `3`. `N = 10` esetén `10 → 5 → 2 → 1`, a kimenet `3`.

  Tipp: Pythonban az egész osztás `//`, C#-ban két egész szám `/` jele egész osztás.
