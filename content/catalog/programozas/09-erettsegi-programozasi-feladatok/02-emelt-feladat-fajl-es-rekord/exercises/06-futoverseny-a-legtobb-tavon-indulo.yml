  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Eredmeny
    {
        public string Nev;
        public string Orszag;
        public int Tav;
        public double Ido;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("6. feladat");
            string[] sorok = File.ReadAllLines("verseny.txt");
            List<Eredmeny> eredmenyek = new List<Eredmeny>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Eredmeny e = new Eredmeny();
                e.Nev = r[0];
                e.Orszag = r[1];
                e.Tav = int.Parse(r[2]);
                e.Ido = double.Parse(r[3], CultureInfo.InvariantCulture);
                eredmenyek.Add(e);
            }
            List<string> nevek = new List<string>();
            Dictionary<string, HashSet<int>> tavok = new Dictionary<string, HashSet<int>>();
            foreach (Eredmeny e in eredmenyek)
            {
                if (!tavok.ContainsKey(e.Nev))
                {
                    tavok[e.Nev] = new HashSet<int>();
                    nevek.Add(e.Nev);
                }
                tavok[e.Nev].Add(e.Tav);
            }
            string legjobb = nevek[0];
            foreach (string nev in nevek)
            {
                if (tavok[nev].Count > tavok[legjobb].Count)
                {
                    legjobb = nev;
                }
            }
            Console.WriteLine("Legtobb tavon indult: " + legjobb + " (" + tavok[legjobb].Count + " tav)");
        }
    }
