sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    csere = 0
    volt = True
    while volt:
        volt = False
        for j in range(n - 1):
            if a[j] > a[j + 1]:
                a[j], a[j + 1] = a[j + 1], a[j]
                csere += 1
                volt = True
    print("Rendezve: " + " ".join(str(x) for x in a))
    print("Csere:", csere)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            int csere = 0;
            bool volt = true;
            while (volt)
            {
                volt = false;
                for (int j = 0; j < n - 1; j++)
                {
                    if (a[j] > a[j + 1])
                    {
                        int seged = a[j];
                        a[j] = a[j + 1];
                        a[j + 1] = seged;
                        csere++;
                        volt = true;
                    }
                }
            }
            Console.WriteLine("Rendezve: " + string.Join(" ", a));
            Console.WriteLine("Csere: " + csere);
        }
    }
