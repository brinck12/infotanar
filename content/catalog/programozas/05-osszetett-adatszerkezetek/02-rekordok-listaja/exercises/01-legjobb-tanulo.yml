description: |
  A bemenet első sora a tanulók száma (N, legalább 1), majd N sor: `nev;pont`, ahol a pont egész szám. Írd ki a legtöbb pontot elért tanuló nevét és pontját a `Legjobb: nev` és `Pont: ...` sorokban. Holtverseny esetén az a tanuló számít, aki a bemenetben előbb szerepel.

  Példa bemenet:

  ```
  3
  Anna;42
  Bence;37
  Csilla;45
  ```

  Kimenet:

  ```
  Legjobb: Csilla
  Pont: 45
  ```

  Tipp: hozz létre rekordot a sorokból, és maximumkiválasztásnál a rekordot jegyezd meg, ne csak a pontszámot.
