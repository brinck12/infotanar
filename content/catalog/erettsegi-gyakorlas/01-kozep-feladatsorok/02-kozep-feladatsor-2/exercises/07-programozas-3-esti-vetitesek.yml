  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Vetites
    {
        public string Cim;
        public string Mufaj;
        public int Hossz;
        public string Kezdes;
        public int Eladott;
        public int Jegyar;

        public Vetites(string sor)
        {
            string[] r = sor.Split(';');
            Cim = r[0];
            Mufaj = r[1];
            Hossz = int.Parse(r[2]);
            Kezdes = r[3];
            Eladott = int.Parse(r[4]);
            Jegyar = int.Parse(r[5]);
        }

        public int Bevetel()
        {
            return Eladott * Jegyar;
        }
    }

    class Program
    {
        static void Main()
        {
            List<Vetites> vetitesek = new List<Vetites>();
            foreach (string sor in File.ReadAllLines("vetitesek.txt"))
            {
                vetitesek.Add(new Vetites(sor));
            }
            int db = 0;
            int osszeg = 0;
            foreach (Vetites v in vetitesek)
            {
                if (string.CompareOrdinal(v.Kezdes, "18:00") >= 0)
                {
                    db++;
                    osszeg += v.Bevetel();
                }
            }
            Console.WriteLine("3. feladat: Esti vetitesek: " + db + " db, bevetel: " + osszeg + " Ft");
        }
    }
