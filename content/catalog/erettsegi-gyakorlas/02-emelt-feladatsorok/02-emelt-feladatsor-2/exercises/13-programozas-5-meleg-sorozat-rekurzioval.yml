  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static int Sorozat(List<Nap> napok, int i)
        {
            if (napok[i].Max < 15)
            {
                return 0;
            }
            if (i == 0)
            {
                return 1;
            }
            return 1 + Sorozat(napok, i - 1);
        }

        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("5. feladat");
            int legjobb = 0;
            int utolso = 0;
            for (int i = 0; i < napok.Count; i++)
            {
                int h = Sorozat(napok, i);
                if (h > legjobb)
                {
                    legjobb = h;
                    utolso = napok[i].Sorszam;
                }
            }
            if (legjobb == 0)
            {
                Console.WriteLine("Nem volt meleg nap.");
            }
            else
            {
                Console.WriteLine("Leghosszabb meleg sorozat: " + legjobb + " nap, az utolso napja: " + utolso + ". nap");
            }
        }
    }
