description: |
  A városi könyvtár kölcsönzéseit a `kolcsonzes.txt` fájl tartalmazza. Az első sor fejléc (`olvaso`, `kod`, `ki`, `be`), utána minden sor egy kölcsönzés, tabulátorral tagolva: az olvasó neve (ékezet nélkül, szóközt tartalmazhat), a könyv kódja (pl. `K101`), a kikölcsönzés napja és a visszahozás napja az év napjaként számozva (1–365, az év nem szökőév). A visszahozás napja mindig nagyobb a kikölcsönzés napjánál. Egy olvasó és egy könyv többször is szerepelhet. A fájl legalább egy kölcsönzést tartalmaz. Egy kölcsönzés időtartama `be - ki` nap; a kölcsönzési határidő 14 nap. A programban egy kölcsönzést rekordként (osztályként) érdemes tárolni. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  **(3 pont)** Olvasd be a fájlt, majd írd ki a kölcsönzések számát és az első kölcsönzést végző olvasó nevét (a fájl első adatsora).

  ```
  Kolcsonzesek: <db>
  Elso olvaso: <nev>
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  1. feladat
  Kolcsonzesek: 14
  Elso olvaso: Kiss Anna
  ```

  Tipp: A fejlécsort ne dolgozd fel adatként: a beolvasó ciklus a második sortól indul.
starter_code:
  python: |
    class Kolcsonzes:
        def __init__(self, olvaso, kod, ki, be):
            self.olvaso = olvaso
            self.kod = kod
            self.ki = ki
            self.be = be
    with open("kolcsonzes.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    kolcsonzesek = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        kolcsonzesek.append(Kolcsonzes(r[0], r[1], int(r[2]), int(r[3])))
    print("1. feladat")
    # ide írd a megoldást
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Kolcsonzes
    {
        public string Olvaso;
        public string Kod;
        public int Ki;
        public int Be;
    }

    class Program
    {
        static List<Kolcsonzes> kolcsonzesek = new List<Kolcsonzes>();

        static void Main()
        {
            string[] sorok = File.ReadAllLines("kolcsonzes.txt");
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Kolcsonzes k = new Kolcsonzes();
                k.Olvaso = r[0];
                k.Kod = r[1];
                k.Ki = int.Parse(r[2]);
                k.Be = int.Parse(r[3]);
                kolcsonzesek.Add(k);
            }
            Console.WriteLine("1. feladat");
            // ide írd a megoldást
        }
    }
