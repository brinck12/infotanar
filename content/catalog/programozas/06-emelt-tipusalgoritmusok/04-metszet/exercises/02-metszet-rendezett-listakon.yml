title: "Metszet rendezett listákon"
position: 1
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Két **szigorúan növekvően rendezett** számsorozat érkezik négy sorban: az első elemszáma (N, legalább 1), maga a sorozat szóközzel elválasztva, a második elemszáma (M, legalább 1), majd az is. Határozd meg a közös elemeiket két mutatóval, lineáris lépésszámmal: `Kozos: ...` (növekvő sorrendben, üres eredménynél `-`). Írd ki, hány összehasonlítást végeztél: `Osszehasonlitas: k`. Összehasonlításnak a ciklus minden lépését számítjuk, vagyis azt, amikor az `A[i]` és a `B[j]` elemet összevetetted.

  Példa bemenet:

  ```
  4
  1 3 5 7
  4
  3 4 5 8
  ```

  Kimenet:

  ```
  Kozos: 3 5
  Osszehasonlitas: 5
  ```

  Tipp: a ciklus addig fut, amíg mindkét sorozatban van még elem. Ha egyenlő a két elem, mindkét mutató lép; különben a kisebbet mutató.
