slug: meg-nem-visszahozott-konyvek
title: Még nem visszahozott könyvek
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
  Az üres (NULL) érték nem egyenlő semmivel, még önmagával sem: `visszahozas = NULL` soha nem igaz. A NULL vizsgálata `IS NULL`, illetve `IS NOT NULL`.

  A `kolcsonzes` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `olvaso` | szöveg |
  | `cim` | szöveg |
  | `kivetel` | szöveg (dátum) |
  | `visszahozas` | szöveg (dátum), üres (NULL), ha még nincs visszahozva |

  Listázd ki azoknak a kölcsönzéseknek az **olvasóját, könyvcímét és kivételi dátumát**, amelyek **még nincsenek visszahozva** (`visszahozas` NULL), a kivétel dátuma szerint növekvő sorrendben! (A kivételi dátumok mind különbözők.) A sorok sorrendje számít.

  Tipp: `WHERE visszahozas IS NULL`, a rendezés pedig `ORDER BY kivetel`.
starter_code:
  sql: |
    SELECT olvaso, cim, kivetel
    FROM kolcsonzes
    WHERE ;
sample_solutions:
  sql: |
    SELECT olvaso, cim, kivetel
    FROM kolcsonzes
    WHERE visszahozas IS NULL
    ORDER BY kivetel;
