sample_solutions:
  python: |
    n = int(input())
    hely = 0
    for i in range(1, n + 1):
        szam = int(input())
        if szam % 2 == 0:
            hely = i
            break
    print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 1; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam % 2 == 0)
                {
                    hely = i;
                    break;
                }
            }
            Console.WriteLine(hely);
        }
    }
