slug: 2-nagy-budapesti-rendezvenyek
title: 2. Nagy budapesti rendezvények
position: 0
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `helyszin` | `VARCHAR(30)` (város) |
  | `datum` | `DATE` |
  | `kapacitas` | `INT`, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `rendezveny_id` | `INT`, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | `VARCHAR(50)`, a vásárló neve |
  | `kategoria` | `VARCHAR(20)`: `allo`, `ules` vagy `vip` |
  | `ar` | `INT`, a jegy ára forintban |
  | `vasarlas` | `DATE`, a vásárlás napja |

  **2. feladat.** Adja meg lekérdezéssel a **budapesti** rendezvények nevét és dátumát (**nev, datum**), amelyeknek a **kapacitása legalább 20**! A találatokat rendezze **dátum szerint növekvően**!
starter_code:
  sql: "SELECT nev, datum\nFROM rendezveny\nWHERE \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT nev, datum
    FROM rendezveny
    WHERE helyszin = 'Budapest' AND kapacitas >= 20
    ORDER BY datum;
