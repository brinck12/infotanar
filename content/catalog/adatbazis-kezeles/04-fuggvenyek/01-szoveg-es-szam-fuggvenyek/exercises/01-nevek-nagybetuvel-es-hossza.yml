slug: nevek-nagybetuvel-es-hossza
title: Nevek nagybetűvel és hossza
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
    Listázd a diákok nevét (`nev`), a nevet csupa nagybetűvel (`nagybetus`), és a név karaktereinek számát (`hossz`). A szóköz is karakternek számít.

    A `diak` tábla:

    | `id` | `nev` | `email` | `osztaly` | `atlag` | `pont_elozo` | `pont_most` |
    |---|---|---|---|---|---|---|
    | 1 | Kiss Anna | Kiss.Anna@SULI.hu | 10.A | 4.567 | 62 | 75 |
    | 2 | Nagy Bela | Nagy.Bela@SULI.hu | 10.B | 3.842 | 70 | 66 |
    | 3 | Toth Csaba | Toth.Csaba@SULI.hu | 10.A | 3.125 | 55 | 41 |
    | 4 | Szabo Dora | Szabo.Dora@SULI.hu | 11.A | 4.918 | 80 | 92 |

    Az eredmény ezekre az adatokra:

    | `nev` | `nagybetus` | `hossz` |
    |---|---|---|
    | Kiss Anna | KISS ANNA | 9 |
    | Nagy Bela | NAGY BELA | 9 |
    | Toth Csaba | TOTH CSABA | 10 |
    | Szabo Dora | SZABO DORA | 10 |

    Tipp: az `UPPER(oszlop)` nagybetűssé alakít, a `LENGTH(oszlop)` a karakterek számát adja.
starter_code:
  sql: |
    SELECT nev,
      AS nagybetus,
      AS hossz
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev, UPPER(nev) AS nagybetus, LENGTH(nev) AS hossz
    FROM diak;
