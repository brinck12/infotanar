sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Cikk:
        szam: str
        db: int
        ar: int

    n = int(input())
    keszlet = {}
    for _ in range(n):
        resz = input().split(";")
        keszlet[resz[0]] = Cikk(resz[0], int(resz[1]), int(resz[2]))
    m = int(input())
    for _ in range(m):
        kulcs = input()
        if kulcs in keszlet:
            c = keszlet[kulcs]
            print(kulcs + ": " + str(c.db) + " db, " + str(c.ar) + " Ft/db")
        else:
            print(kulcs + ": nincs")
  csharp: |
    using System;
    using System.Collections.Generic;

    class Cikk
    {
        public string Szam;
        public int Db;
        public int Ar;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var keszlet = new Dictionary<string, Cikk>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                keszlet[resz[0]] = new Cikk { Szam = resz[0], Db = int.Parse(resz[1]), Ar = int.Parse(resz[2]) };
            }
            int m = int.Parse(Console.ReadLine());
            for (int i = 0; i < m; i++)
            {
                string kulcs = Console.ReadLine();
                if (keszlet.ContainsKey(kulcs))
                {
                    var c = keszlet[kulcs];
                    Console.WriteLine(kulcs + ": " + c.Db + " db, " + c.Ar + " Ft/db");
                }
                else
                {
                    Console.WriteLine(kulcs + ": nincs");
                }
            }
        }
    }
tests:
