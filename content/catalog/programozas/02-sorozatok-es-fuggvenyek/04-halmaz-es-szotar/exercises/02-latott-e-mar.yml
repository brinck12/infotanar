allowed_languages: [python, csharp]
description: |
  Az első sorban egy `N` egész szám áll, utána `N` szó következik (kisbetűs, ékezet nélküli), mindegyik külön sorban. Minden szóhoz írd ki külön sorba, hogy `uj` (ha most szerepel először), vagy `mar volt` (ha korábban már szerepelt).

  Példa: az `5`, `alma`, `korte`, `alma`, `szilva`, `korte` bemenetre (külön sorokban):

  ```
  uj
  uj
  mar volt
  uj
  mar volt
  ```

  Tipp: tartsd egy halmazban a már látott szavakat; minden szónál előbb kérdezd meg, benne van-e, aztán tedd bele.
