slug: elteres-a-legkisebb-fizetestol
title: Eltérés a legkisebb fizetéstől
position: 3
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  A `dolgozo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `reszleg` | szöveg |
  | `fizetes` | egész (Ft) |

  Add meg minden dolgozó nevét és azt, hogy mennyivel keres többet a **legkisebb fizetésnél** (**nev, tobblet**)! A legkisebb fizetésű dolgozó tobblete 0. Az allekérdezés itt a `SELECT` listában áll. A sorok sorrendje nem számít.

  Tipp: `fizetes - (SELECT MIN(fizetes) FROM dolgozo) AS tobblet`
starter_code:
  sql: |
    SELECT nev, fizetes - (SELECT ) AS tobblet
    FROM dolgozo;
sample_solutions:
  sql: |
    SELECT nev, fizetes - (SELECT MIN(fizetes) FROM dolgozo) AS tobblet
    FROM dolgozo;
tests:
