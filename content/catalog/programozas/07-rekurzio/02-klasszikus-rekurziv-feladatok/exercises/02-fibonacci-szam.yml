sample_solutions:
  python: |
    def fib(n):
        if n < 2:
            return n
        return fib(n - 1) + fib(n - 2)

    print(fib(int(input())))
  csharp: |
    using System;

    class Program
    {
        static int Fib(int n)
        {
            if (n < 2)
            {
                return n;
            }
            return Fib(n - 1) + Fib(n - 2);
        }

        static void Main()
        {
            Console.WriteLine(Fib(int.Parse(Console.ReadLine())));
        }
    }
