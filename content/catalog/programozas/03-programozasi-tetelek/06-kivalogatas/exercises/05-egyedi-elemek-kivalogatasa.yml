description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Válogasd ki a **különböző értékeket** abban a sorrendben, ahogy először megjelennek, és írd ki őket egyetlen sorban, szóközzel elválasztva.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban az egyedi értékek, az első előfordulás sorrendjében.

  ### Példa

  Bemenet: `6`, majd `3`, `1`, `3`, `2`, `1`, `3`. Kimenet: `3 1 2`

  Tipp: a kiválogatás feltétele itt az, hogy a szám még nincs a listában (`not in`, illetve `!lista.Contains(szam)`).
