description: "A `konyvek.txt` a könyvtár állományát tartalmazza, soronként egy könyvvel, pontosvesszővel elválasztva: `szerző;cím;kiadás éve;oldalszám`. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.\n\n**1. feladat.** Olvassa be a fájlt, és írja ki, hány könyv szerepel benne, a mintának megfelelően.\n\nA mintafájlra a kimenet:\n\n```text\n1. feladat: A fajlban 12 konyv szerepel.\r\n```\n\nTipp: a fájl sorainak száma a könyvek száma."
starter_code:
  python: |
    with open("konyvek.txt", encoding="utf-8") as f:
        konyvek = [sor.split(";") for sor in f.read().splitlines()]
    # ide írd a megoldást
