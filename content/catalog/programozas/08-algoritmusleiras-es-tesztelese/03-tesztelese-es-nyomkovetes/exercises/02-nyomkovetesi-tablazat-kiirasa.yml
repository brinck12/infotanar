allowed_languages: [python, csharp]
description: |
  Olvass be egy `N` számot (`0 ≤ N ≤ 50`), majd `N` egész számot külön sorban. Az összegzés minden lépése után írd ki a nyomkövetési táblázat egy sorát: a lépés sorszámát (1-től), a beolvasott számot és az összeg új értékét, szóközzel elválasztva. Utána, az utolsó sorban `Vege:` és az összeg álljon.

  Példa: `3`, majd `5`, `-2`, `4` esetén a kimenet:

  ```text
  1 5 5
  2 -2 3
  3 4 7
  Vege: 7
  ```

  `N = 0` esetén csak a `Vege: 0` sor jelenik meg.

  Tipp: a kiírás a ciklus belsejébe kerül, a `Vege:` sor a ciklus után.
