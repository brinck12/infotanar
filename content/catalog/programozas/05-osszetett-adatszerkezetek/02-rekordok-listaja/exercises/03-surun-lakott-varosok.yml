sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Varos:
        nev: str
        lakos: int
        terulet: int

    n = int(input())
    varosok = []
    for _ in range(n):
        resz = input().split(";")
        varosok.append(Varos(resz[0], int(resz[1]), int(resz[2])))
    suru = []
    for v in varosok:
        if v.lakos > 1000 * v.terulet:
            suru.append(v)
    print("Darab:", len(suru))
    for v in suru:
        print(v.nev)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Varos
    {
        public string Nev;
        public int Lakos;
        public int Terulet;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var varosok = new List<Varos>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                varosok.Add(new Varos { Nev = resz[0], Lakos = int.Parse(resz[1]), Terulet = int.Parse(resz[2]) });
            }
            var suru = new List<Varos>();
            foreach (var v in varosok)
            {
                if (v.Lakos > 1000 * v.Terulet)
                {
                    suru.Add(v);
                }
            }
            Console.WriteLine("Darab: " + suru.Count);
            foreach (var v in suru)
            {
                Console.WriteLine(v.Nev);
            }
        }
    }
