slug: konyv-kora
title: Könyv kora
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
  A számított mezőt szöveggel is kombinálhatjuk, külön oszlopban.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `szerzo` | szöveg |
  | `ev` | egész (a kiadás éve) |
  | `oldal` | egész |
  | `ar` | egész (Ft) |
  | `mufaj` | szöveg |

  Listázd ki a könyvek **címét** és a kiadás óta eltelt éveket `kor` néven, ahol a kor `2025 - ev`! Ezután még egy oszlop következzen: `cimke` néven az `szerzo`, egy kettőspont és szóköz (`: `) és a cím összefűzve, például `Nagy Peter: Aranykor`. Az oszlopok sorrendje: `cim`, `kor`, `cimke`. A sorok sorrendje nem számít.

  Tipp: három oszlop: `cim`, `2025 - ev AS kor`, és `szerzo || ': ' || cim AS cimke`.
starter_code:
  sql: |
    SELECT
    FROM konyv;
sample_solutions:
  sql: |
    SELECT cim, 2025 - ev AS kor, szerzo || ': ' || cim AS cimke
    FROM konyv;
