sample_solutions:
  python: |
    def lnko(a, b):
        if b == 0:
            return a
        return lnko(b, a % b)

    a = int(input())
    b = int(input())
    print(lnko(a, b))
  csharp: |
    using System;

    class Program
    {
        static int Lnko(int a, int b)
        {
            if (b == 0)
            {
                return a;
            }
            return Lnko(b, a % b);
        }

        static void Main()
        {
            int a = int.Parse(Console.ReadLine());
            int b = int.Parse(Console.ReadLine());
            Console.WriteLine(Lnko(a, b));
        }
    }
