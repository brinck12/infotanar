description: |-
  Az `utak.txt` a kerékpárkölcsönző egy havi (30 napos) forgalmát tartalmazza, soronként egy úttal, pontosvesszővel elválasztva: `bicikli;nap;indulás;érkezés;távolság`. A bicikli azonosítója `B-01` alakú, a nap a hónap napja (1–30), az indulás és az érkezés `ÓÓ:PP` alakú időpont (ugyanazon a napon belül, az érkezés mindig az indulás után van), a távolság méterben egész szám. A sorok nem rendezettek. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **3. feladat.** Számítsa ki minden út **átlagsebességét** km/h-ban (a távolság méterben, az idő percben adott), és adja meg a leggyorsabb utat! Ha több ilyen is van, az először szereplőt írja ki. A sebességet **egy tizedesjegyre kerekítve**, tizedesponttal írja ki.

  A mintafájlra a kimenet:

  ```text
  3. feladat: Leggyorsabb ut: B-02, 11. nap, 19.5 km/h
  ```

  Tipp: a sebesség km/h-ban: `tav / 1000 / (perc / 60)`, vagyis `tav * 60 / 1000 / perc`. Vigyázz az egész osztásra: C#-ban legalább az egyik operandus legyen `double`. Az egy tizedesre kerekített kiíráshoz Pythonban `f"{v:.1f}"`, C#-ban `v.ToString("F1", CultureInfo.InvariantCulture)` való.
