  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            int legjobbHossz = 1;
            int legjobbKezdet = 0;
            int hossz = 1;
            int kezdet = 0;
            for (int i = 1; i < meresek.Count; i++)
            {
                if (meresek[i].Allas > meresek[i - 1].Allas)
                {
                    hossz++;
                }
                else
                {
                    hossz = 1;
                    kezdet = i;
                }
                if (hossz > legjobbHossz)
                {
                    legjobbHossz = hossz;
                    legjobbKezdet = kezdet;
                }
            }
            int vege = legjobbKezdet + legjobbHossz - 1;
            Console.WriteLine("Leghosszabb emelkedes: " + legjobbHossz + " nap (" + meresek[legjobbKezdet].Datum + " - " + meresek[vege].Datum + ")");
        }
    }
