sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Teglalap:
        a: int
        b: int

        def terulet(self):
            return self.a * self.b

        def kerulet(self):
            return 2 * (self.a + self.b)

    t = Teglalap(int(input()), int(input()))
    print("Terulet:", t.terulet())
    print("Kerulet:", t.kerulet())
  csharp: |
    using System;

    class Teglalap
    {
        public int A;
        public int B;

        public int Terulet()
        {
            return A * B;
        }

        public int Kerulet()
        {
            return 2 * (A + B);
        }
    }

    class Program
    {
        static void Main()
        {
            var t = new Teglalap();
            t.A = int.Parse(Console.ReadLine());
            t.B = int.Parse(Console.ReadLine());
            Console.WriteLine("Terulet: " + t.Terulet());
            Console.WriteLine("Kerulet: " + t.Kerulet());
        }
    }
