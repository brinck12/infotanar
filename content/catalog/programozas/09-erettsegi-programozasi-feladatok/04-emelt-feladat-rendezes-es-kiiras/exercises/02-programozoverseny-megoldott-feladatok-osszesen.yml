  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("2. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            int osszeg = 0;
            foreach (Csapat c in csapatok)
            {
                osszeg += c.Megoldott;
            }
            Console.WriteLine("Osszes megoldott feladat: " + osszeg);
            Console.WriteLine("Atlag: " + ((double)osszeg / csapatok.Count).ToString("F2", CultureInfo.InvariantCulture));
        }
    }
