description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Döntsd el, hogy **van-e két egymás mellett álló páros szám**!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban `IGEN`, ha van ilyen pár, egyébként `NEM`.

  ### Példa

  Bemenet: `4`, majd `1`, `2`, `4`, `5`. Kimenet: `IGEN`

  Tipp: a számok beolvasásakor jegyezd meg, hogy az előző szám páros volt-e. Ha a mostani is az, megvan a pár.
