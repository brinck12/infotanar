        {
            // ide írd: add vissza x négyzetét
            return 0;
        }

        static void Main()
        {
            int szam = int.Parse(Console.ReadLine());
            // innen folytasd: hívd meg a metódust és írd ki az eredményt
        }
    }
sample_solutions:
  python: |
    def negyzet(x):
        return x * x

    szam = int(input())
    print(negyzet(szam))
  csharp: |
    using System;

    class Program
    {
        static int Negyzet(int x)
        {
            return x * x;
        }

        static void Main()
        {
            int szam = int.Parse(Console.ReadLine());
            Console.WriteLine(Negyzet(szam));
        }
    }
