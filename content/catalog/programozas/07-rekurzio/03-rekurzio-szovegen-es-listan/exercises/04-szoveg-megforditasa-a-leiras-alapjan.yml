sample_solutions:
  python: |
    def fordit(s):
        if len(s) <= 1:
            return s
        return fordit(s[1:]) + s[0]

    print(fordit(input()))
  csharp: |
    using System;

    class Program
    {
        static string Fordit(string s)
        {
            if (s.Length <= 1)
            {
                return s;
            }
            return Fordit(s.Substring(1)) + s[0];
        }

        static void Main()
        {
            Console.WriteLine(Fordit(Console.ReadLine()));
        }
    }
