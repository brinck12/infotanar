description: |
  ## Feladat

  Olvass be egy `N` számot, majd `N` darab szót (soronként egyet). Írd ki **külön sorokba azokat a szavakat, amelyek legalább 5 betűsek**, a beolvasás sorrendjében!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy szó (ékezet nélkül, szóköz nélkül).

  ### Kimenet

  Soronként egy-egy legalább 5 betűs szó. Legalább egy ilyen szó biztosan van.

  ### Példa

  Bemenet: `4`, majd `alma`, `barack`, `szilva`, `ko`. Kimenet: `barack` és `szilva` külön sorokban.

  Tipp: a szó hosszát a `len(szo)`, illetve a `szo.Length` adja.
