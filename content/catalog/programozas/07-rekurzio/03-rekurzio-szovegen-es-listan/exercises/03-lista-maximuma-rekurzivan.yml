  Az első sorban `N` áll (`1 ≤ N ≤ 100`), a következő `N` sorban egy-egy egész szám (lehet negatív). Írd ki a legnagyobbat **rekurzív** függvénnyel.

  Példa: `4`, majd `3`, `9`, `2`, `9` esetén a kimenet `9`. Csupa negatív számnál is a legnagyobb a jó válasz.

  Tipp: az alapeset az utolsó elem; különben az `i`-edik elem és a maradék maximuma közül a nagyobb a válasz.
