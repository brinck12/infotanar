description: |
  Kódold le az alábbi algoritmust, majd futtasd a megadott bemenetekre.

  ```text
  Algoritmus ParosOsszeg
    Be: N
    osszeg := 0
    Ciklus i := 1-től N-ig
      Be: szam
      Elágazás
        szam páros esetén: osszeg := osszeg + szam
      Elágazás vége
    Ciklus vége
    Ki: osszeg
  Algoritmus vége
  ```

  Bemenet: az első sorban `N` (`0 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: az összeg.

  Példa: `4`, majd `3`, `8`, `5`, `10` esetén a kimenet `18`.

  Tipp: egy szám akkor páros, ha 2-vel osztva a maradék 0.
