sample_solutions:
  python: |
    osztaly = input()
    with open("tanulok.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    letszam = 0
    legjobb_nev = ""
    legjobb_pont = -1
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        if mezok[1] == osztaly:
            letszam += 1
            pont = int(mezok[2])
            if pont > legjobb_pont:
                legjobb_pont = pont
                legjobb_nev = mezok[0]
    if letszam == 0:
        print("Nincs ilyen osztaly")
    else:
        print("Letszam:", letszam)
        print("Legjobb: " + legjobb_nev + " (" + str(legjobb_pont) + ")")
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string osztaly = Console.ReadLine();
            string[] sorok = File.ReadAllLines("tanulok.txt");
            int letszam = 0;
            string legjobbNev = "";
            int legjobbPont = -1;
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                if (mezok[1] == osztaly)
                {
                    letszam++;
                    int pont = int.Parse(mezok[2]);
                    if (pont > legjobbPont)
                    {
                        legjobbPont = pont;
                        legjobbNev = mezok[0];
                    }
                }
            }
            if (letszam == 0)
            {
                Console.WriteLine("Nincs ilyen osztaly");
            }
            else
            {
                Console.WriteLine("Letszam: " + letszam);
                Console.WriteLine("Legjobb: " + legjobbNev + " (" + legjobbPont + ")");
            }
        }
    }
