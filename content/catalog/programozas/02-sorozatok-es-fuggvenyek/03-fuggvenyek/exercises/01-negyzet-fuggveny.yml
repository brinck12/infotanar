description: |
  Írj `negyzet` nevű függvényt, amely egy egész szám négyzetét adja vissza. A főprogram olvasson be egy egész számot, hívja meg a függvényt, és írja ki az eredményt.

  Példa: ha a bemenet `5`, a kimenet `25`.

  Tipp: a függvény `return`-nel adja vissza az értéket, a kiírást a főprogram végezze.
