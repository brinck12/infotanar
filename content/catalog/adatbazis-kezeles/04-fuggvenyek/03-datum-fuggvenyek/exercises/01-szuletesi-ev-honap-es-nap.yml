slug: szuletesi-ev-honap-es-nap
title: Születési év, hónap és nap
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
    A `tanulo` tábla a születési dátumot ISO szövegként (`ÉÉÉÉ-HH-NN`) tárolja. Add meg minden tanuló nevét (`nev`), születési évét (`ev`), hónapját (`honap`) és napját (`nap`) egész számként.

    A `tanulo` tábla:

    | `id` | `nev` | `szuletes` |
    |---|---|---|
    | 1 | Kiss Anna | 2008-05-14 |
    | 2 | Nagy Bela | 2009-11-02 |
    | 3 | Toth Csaba | 2008-05-30 |
    | 4 | Szabo Dora | 2009-02-27 |
    | 5 | Varga Fanni | 2010-05-01 |

    Az eredmény ezekre az adatokra:

    | `nev` | `ev` | `honap` | `nap` |
    |---|---|---|---|
    | Kiss Anna | 2008 | 5 | 14 |
    | Nagy Bela | 2009 | 11 | 2 |
    | Toth Csaba | 2008 | 5 | 30 |
    | Szabo Dora | 2009 | 2 | 27 |
    | Varga Fanni | 2010 | 5 | 1 |

    Tipp: a hónap kódja `%m`, a napé `%d`; a `CAST(... AS INTEGER)` a szövegből számot csinál (a `05` így `5` lesz).
starter_code:
  sql: |
    SELECT nev,
      CAST(strftime('%Y', szuletes) AS INTEGER) AS ev,
      AS honap,
      AS nap
    FROM tanulo;
sample_solutions:
  sql: |
    SELECT nev,
      CAST(strftime('%Y', szuletes) AS INTEGER) AS ev,
      CAST(strftime('%m', szuletes) AS INTEGER) AS honap,
      CAST(strftime('%d', szuletes) AS INTEGER) AS nap
    FROM tanulo;
