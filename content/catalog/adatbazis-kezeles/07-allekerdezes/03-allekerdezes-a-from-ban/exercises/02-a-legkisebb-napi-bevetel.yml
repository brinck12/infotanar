slug: a-legkisebb-napi-bevetel
title: A legkisebb napi bevétel
position: 1
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Az `eladas` tábla egy bolt eladásait tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `db` | egész, az eladott darabszám |
  | `egysegar` | egész (Ft) |

  Egy eladás értéke `db * egysegar`.

  Mennyi volt a **legkisebb napi bevétel**? Egyetlen értéket adj vissza (**legkisebb**)! Nem elég a `MIN` az eladások értékére: a napi összegek közül kell a legkisebbet kiválasztani.

  Tipp: előbb csoportosíts napok szerint egy allekérdezésben, majd a külső lekérdezésben `MIN`-nel vedd a legkisebbet.
starter_code:
  sql: |
    SELECT MIN(napi) AS legkisebb
    FROM (SELECT datum, SUM(db * egysegar) AS napi
          FROM eladas
          );
sample_solutions:
  sql: |
    SELECT MIN(napi) AS legkisebb
    FROM (SELECT datum, SUM(db * egysegar) AS napi
          FROM eladas
          GROUP BY datum) AS n;
