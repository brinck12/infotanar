  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Ut
    {
        public string Bicikli;
        public int Nap;
        public string Indulas;
        public string Erkezes;
        public int Tav;

        public Ut(string sor)
        {
            string[] r = sor.Split(';');
            Bicikli = r[0];
            Nap = int.Parse(r[1]);
            Indulas = r[2];
            Erkezes = r[3];
            Tav = int.Parse(r[4]);
        }

        public static int Percben(string ido)
        {
            string[] r = ido.Split(':');
            return int.Parse(r[0]) * 60 + int.Parse(r[1]);
        }

        public int Perc()
        {
            return Percben(Erkezes) - Percben(Indulas);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Ut> utak = new List<Ut>();
            foreach (string sor in File.ReadAllLines("utak.txt"))
            {
                utak.Add(new Ut(sor));
            }
            Dictionary<string, int> osszeg = new Dictionary<string, int>();
            Dictionary<string, int> darab = new Dictionary<string, int>();
            foreach (Ut u in utak)
            {
                if (!osszeg.ContainsKey(u.Bicikli))
                {
                    osszeg[u.Bicikli] = 0;
                    darab[u.Bicikli] = 0;
                }
                osszeg[u.Bicikli] += u.Tav;
                darab[u.Bicikli]++;
            }
            List<string> rang = new List<string>(osszeg.Keys);
            rang.Sort((a, b) =>
            {
                if (osszeg[a] != osszeg[b])
                {
                    return osszeg[b].CompareTo(osszeg[a]);
                }
                return string.CompareOrdinal(a, b);
            });
            Console.WriteLine("6. feladat:");
            for (int i = 0; i < rang.Count && i < 5; i++)
            {
                string b = rang[i];
                Console.WriteLine((i + 1) + ". " + b + " " + osszeg[b] + " m (" + darab[b] + " ut)");
            }
        }
    }
