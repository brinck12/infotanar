sample_solutions:
  python: |
    def fakt(n):
        if n == 0:
            return 1
        return n * fakt(n - 1)

    print(fakt(int(input())))
  csharp: |
    using System;

    class Program
    {
        static long Fakt(int n)
        {
            if (n == 0)
            {
                return 1;
            }
            return n * Fakt(n - 1);
        }

        static void Main()
        {
            Console.WriteLine(Fakt(int.Parse(Console.ReadLine())));
        }
    }
