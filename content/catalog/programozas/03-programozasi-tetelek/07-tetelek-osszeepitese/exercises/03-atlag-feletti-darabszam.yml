sample_solutions:
  python: |
    n = int(input())
    szamok = []
    osszeg = 0
    for _ in range(n):
        szam = int(input())
        szamok.append(szam)
        osszeg += szam
    db = 0
    for szam in szamok:
        if szam * n > osszeg:
            db += 1
    print(db)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] szamok = new int[n];
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                szamok[i] = int.Parse(Console.ReadLine());
                osszeg += szamok[i];
            }
            int db = 0;
            for (int i = 0; i < n; i++)
            {
                if (szamok[i] * n > osszeg)
                {
                    db++;
                }
            }
            Console.WriteLine(db);
        }
    }
