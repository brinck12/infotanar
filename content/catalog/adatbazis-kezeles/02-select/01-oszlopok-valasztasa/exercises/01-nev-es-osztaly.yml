slug: nev-es-osztaly
title: Név és osztály
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Egy lekérdezés eredménye is tábla; mi döntjük el, mely oszlopok szerepeljenek benne.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki a diákok **nevét és osztályát**! A sorok sorrendje nem számít.

  Tipp: a mezőneveket vesszővel választd el, az utolsó után nincs vessző.
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev, osztaly
    FROM diak;
