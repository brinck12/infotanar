slug: 7-soforonkenti-bevetel
title: 7. Sofőrönkénti bevétel
position: 5
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `szuletes` | `INT`, a születési év |
  | `angol` | `INT`: 1, ha beszél angolul, különben 0 |
  | `nemet` | `INT`: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | `INT`, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `sofor_id` | `INT`, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | `VARCHAR(10)`, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | `DATE` |
  | `km` | `INT`, a megtett út kilométerben |
  | `ar` | `INT`, a fuvar ára forintban |
  | `fizetes` | `VARCHAR(10)`: `kartya` vagy `keszpenz` |

  **7. feladat.** Adja meg lekérdezéssel sofőrönként az összes bevételt (**nev, bevetel**)! A `bevetel` a sofőr fuvarainak árösszege legyen. A találatokat rendezze **bevétel szerint csökkenően**, azonos bevételnél a név szerint ábécérendbe!
starter_code:
  sql: "SELECT sofor.nev, SUM(fuvar.ar) AS bevetel\nFROM sofor INNER JOIN fuvar ON \nGROUP BY \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT sofor.nev, SUM(fuvar.ar) AS bevetel
    FROM sofor INNER JOIN fuvar ON fuvar.sofor_id = sofor.id
    GROUP BY sofor.id, sofor.nev
    ORDER BY bevetel DESC, sofor.nev;
