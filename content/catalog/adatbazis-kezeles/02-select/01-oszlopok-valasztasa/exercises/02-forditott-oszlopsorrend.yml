slug: forditott-oszlopsorrend
title: Fordított oszlopsorrend
position: 1
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Az eredmény oszlopai abban a sorrendben jönnek, ahogy a `SELECT` után felsoroljuk őket.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `szerzo` | szöveg |
  | `ev` | egész (a kiadás éve) |
  | `oldal` | egész |
  | `ar` | egész (Ft) |
  | `mufaj` | szöveg |

  Listázd ki a könyvek **árát, majd címét** (ebben a sorrendben)! A sorok sorrendje nem számít.

  Tipp: előbb az `ar`, utána a `cim` mező következzen.
starter_code:
  sql: |
    SELECT
    FROM konyv;
sample_solutions:
  sql: |
    SELECT ar, cim
    FROM konyv;
tests:
