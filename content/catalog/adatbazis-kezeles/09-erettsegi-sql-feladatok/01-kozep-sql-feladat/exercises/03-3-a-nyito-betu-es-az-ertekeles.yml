slug: 3-a-nyito-betu-es-az-ertekeles
title: 3. A nyitó betű és az értékelés
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  Egy filmadatbázis két táblából áll.

  A `mufaj` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg (pl. `vigjatek`, `drama`, `akcio`, `scifi`, `animacio`) |

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `ev` | egész, a bemutató éve |
  | `hossz` | egész, a játékidő percben |
  | `mufaj_id` | egész, a `mufaj` tábla `id` oszlopára mutat |
  | `ertekeles` | egész, 1 és 10 között |

  **3. feladat.** Adja meg lekérdezéssel azoknak a filmeknek a címét és értékelését (**cim, ertekeles**), amelyek címe **A betűvel kezdődik**, és az értékelésük **legalább 6**!
starter_code:
  sql: |
    SELECT cim, ertekeles
    FROM film
    WHERE ;
sample_solutions:
  sql: |
    SELECT cim, ertekeles
    FROM film
    WHERE cim LIKE 'A%' AND ertekeles >= 6;
