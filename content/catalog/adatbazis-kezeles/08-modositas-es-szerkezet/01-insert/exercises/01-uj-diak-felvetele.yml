slug: uj-diak-felvetele
title: Új diák felvétele
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages:
- sql
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  Vedd fel a táblába az alábbi diákot **minden oszlop értékét megadva**: `id` = 50, `nev` = Kiss Anna, `osztaly` = 9.A, `pont` = 77.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `INSERT INTO diak VALUES (50, 'Kiss Anna', '9.A', 77);`
starter_code:
  sql: |
    -- Ide írd az INSERT utasítást.

    SELECT id, nev, osztaly, pont FROM diak ORDER BY id;
sample_solutions:
  sql: |
    INSERT INTO diak VALUES (50, 'Kiss Anna', '9.A', 77);

    SELECT id, nev, osztaly, pont FROM diak ORDER BY id;
