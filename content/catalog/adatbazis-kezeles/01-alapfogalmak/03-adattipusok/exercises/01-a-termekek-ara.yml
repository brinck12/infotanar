slug: a-termekek-ara
title: A termékek ára
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A `termek` tábla szöveg típusú (`nev`, `kategoria`) és egész típusú (`ar`, `keszlet`) mezőket tárol.

  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `kategoria` | szöveg |
  | `ar` | egész (Ft) |
  | `keszlet` | egész (db) |

  Listázd ki minden termék **nevét és árát**, ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: a szöveg és a szám típusú mező lekérdezése ugyanúgy történik.
starter_code:
  sql: |
    SELECT
    FROM termek;
sample_solutions:
  sql: |
    SELECT nev, ar
    FROM termek;
