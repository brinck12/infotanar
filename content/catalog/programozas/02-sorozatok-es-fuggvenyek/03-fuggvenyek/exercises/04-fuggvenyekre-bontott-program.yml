description: |
  Az első sorban egy `N` egész szám áll (`N >= 1`), utána `N` egész szám következik, mindegyik külön sorban. Írd ki az összegüket és a legnagyobbat:

  ```
  Osszeg: <összeg>
  Legnagyobb: <legnagyobb>
  ```

  A programot bontsd három függvényre: `beolvas(n)` (listát ad vissza), `osszeg(lista)` és `legnagyobb(lista)`. A főprogram csak hívja őket, és kiír. A legnagyobb elemet saját ciklussal keresd, ne a beépített `max` / `Max` használatával.

  Példa: a `4`, `3`, `-1`, `9`, `4` bemenetre (külön sorokban):

  ```
  Osszeg: 15
  Legnagyobb: 9
  ```

  Tipp: a legnagyobb keresésénél a lista első eleméből indulj ki, és minden további elemnél cseréld le, ha az nagyobb.
