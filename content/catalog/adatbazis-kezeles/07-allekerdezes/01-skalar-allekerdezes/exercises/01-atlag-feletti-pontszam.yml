slug: atlag-feletti-pontszam
title: Átlag feletti pontszám
position: 0
kind: sql
level: emelt
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  Listázd ki azokat a diákokat (**nev, pont**), akiknek a pontszáma **nagyobb az összes diák átlagpontszámánál**! Az átlagot ne írd be kézzel: számold ki allekérdezéssel. A sorok sorrendje nem számít.

  Tipp: `WHERE pont > (SELECT AVG(pont) FROM diak)`
starter_code:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont > (SELECT );
sample_solutions:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont > (SELECT AVG(pont) FROM diak);
