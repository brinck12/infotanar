description: |
  Kódold le az alábbi algoritmust.

  ```text
  Algoritmus Haromszog
    Be: N
    szam := 0
    Ciklus i := 1-től N-ig
      szam := szam + i
      Ki: szam
    Ciklus vége
  Algoritmus vége
  ```

  Bemenet: egy `N` egész szám (`0 ≤ N ≤ 20`). Kimenet: az algoritmus kiírásai, soronként egy szám. `N = 0` esetén a kimenet üres.

  Példa: `N = 4` esetén a kimenet: `1`, `3`, `6`, `10` külön sorokban.

  Tipp: a `Ki:` a ciklus belsejében van, ezért minden lépésben kiír egy számot.
