  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            Dictionary<int, int> db = new Dictionary<int, int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (db.ContainsKey(szam))
                {
                    db[szam] = db[szam] + 1;
                }
                else
                {
                    db[szam] = 1;
                }
            }
            int legjobb = 0;
            int legjobbDb = 0;
            foreach (int kulcs in db.Keys)
            {
                if (db[kulcs] > legjobbDb || (db[kulcs] == legjobbDb && kulcs < legjobb))
                {
                    legjobb = kulcs;
                    legjobbDb = db[kulcs];
                }
            }
            Console.WriteLine("Szam: " + legjobb);
            Console.WriteLine("Darab: " + legjobbDb);
        }
    }
