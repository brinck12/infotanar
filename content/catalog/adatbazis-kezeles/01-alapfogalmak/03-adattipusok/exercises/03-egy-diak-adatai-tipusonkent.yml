slug: egy-diak-adatai-tipusonkent
title: Egy diák adatai típusonként
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A `diak` tábla vegyes típusú mezőket tárol: szöveg (`nev`, `osztaly`), egész (`pont`), dátum (`szuletes`).

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki a diákok **születési dátumát, pontszámát és nevét**, ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: a mezők sorrendjét a lekérdezés határozza meg, nem a tábla felépítése.
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT szuletes, pont, nev
    FROM diak;
