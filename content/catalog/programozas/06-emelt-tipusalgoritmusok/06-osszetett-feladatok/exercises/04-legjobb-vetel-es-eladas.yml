  csharp: |
    using System;
    using System.Collections.Generic;

    class Nap
    {
        public string Datum;
        public int Ar;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var napok = new List<Nap>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                napok.Add(new Nap { Datum = resz[0], Ar = int.Parse(resz[1]) });
            }
            // keresd a legjobb vételi és eladási napot
        }
    }
