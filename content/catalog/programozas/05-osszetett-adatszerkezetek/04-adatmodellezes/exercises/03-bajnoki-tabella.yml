description: |
  Egy labdarúgó-bajnokság mérkőzései: az első sor a mérkőzések száma (N, legalább 1), majd N sor: `hazai;vendeg;hazai_gol;vendeg_gol`. A győztes 3 pontot, a döntetlen mindkét csapat 1-1 pontot kap, a vesztes 0-t.

  Írd ki minden csapat sorát az első előfordulás sorrendjében: `csapat pont gyozelem dontetlen vereseg` (szóközzel elválasztva). Utána egy sor: `Vezeto: csapat` (a legtöbb pontú csapat; egyenlő pontnál az, amelyik előbb szerepel a kiírásban).

  Példa bemenet:

  ```
  3
  Alfa;Beta;2;1
  Gamma;Alfa;0;0
  Beta;Gamma;3;1
  ```

  Kimenet:

  ```
  Alfa 4 1 1 0
  Beta 3 1 0 1
  Gamma 1 0 1 1
  Vezeto: Alfa
  ```

  Tipp: a csapat legyen rekord (név, pont, győzelem, döntetlen, vereség), a csapatokat pedig szótár tartsa nyilván név szerint, az első előfordulás sorrendjét pedig egy lista.
