slug: parosak-es-paratlanok
title: "Párosak és páratlanok"
position: 0
kind: code
level: emelt
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Válogasd szét őket párosakra és páratlanokra, az eredeti sorrendet megtartva. Két sort írj ki: `Paros: ...` és `Paratlan: ...` (a számok szóközzel elválasztva). Ha egy csoport üres, a kettőspont után egy `-` jel álljon.

  Példa bemenet:

  ```
  5
  4 7 10 3 8
  ```

  Kimenet:

  ```
  Paros: 4 10 8
  Paratlan: 7 3
  ```

  Tipp: egy bejárás, két lista; a nulla és a negatív számok is párosak vagy páratlanok lehetnek (a `-3 % 2` Pythonban 1, C#-ban -1, ezért a párosságot a `% 2 == 0` próbával döntsd el).
starter_code:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    # válogasd szét a számokat
