sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    db = 0
    for i in range(n):
        szam = int(input())
        if szam > 0:
            osszeg = osszeg + szam
            db = db + 1
    print(osszeg)
    print(db)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            int db = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > 0)
                {
                    osszeg = osszeg + szam;
                    db = db + 1;
                }
            }
            Console.WriteLine(osszeg);
            Console.WriteLine(db);
        }
    }
