description: |
  Az osztályok jegyei külön fájlokban vannak, az osztály jelével nevezve: `9a.txt`, `9b.txt`. A fájl tabulátorral tagolt, az első sora fejléc (`nev`, `jegy`). A felhasználó megadja az osztály jelét (pl. `9a`). Készítsd el a `jel_jo.txt` nevű fájlt (pl. `9a_jo.txt`), amelybe a fejléc után azok a sorok kerülnek, ahol a jegy legalább 4, az eredeti sorrendben. Ezután olvasd vissza az új fájlt, írd ki a tartalmát, a végén pedig a jó tanulók számát:

  ```
  nev<TAB>jegy
  Anna<TAB>5
  Csilla<TAB>4
  Jo tanulok: 2
  ```

  Tipp: két fájlnevet kell összeállítanod: `jel + ".txt"` az olvasáshoz és `jel + "_jo.txt"` az íráshoz.
starter_code:
  python: |
    jel = input()
    with open(jel + ".txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    # ide írd az új fájl készítését és a kiírást
