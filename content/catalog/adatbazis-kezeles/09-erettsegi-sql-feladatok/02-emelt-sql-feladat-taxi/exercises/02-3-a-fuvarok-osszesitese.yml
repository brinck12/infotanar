slug: 3-a-fuvarok-osszesitese
title: 3. A fuvarok összesítése
position: 1
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletes` | egész, a születési év |
  | `angol` | egész: 1, ha beszél angolul, különben 0 |
  | `nemet` | egész: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | egész, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `sofor_id` | egész, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | szöveg, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `km` | egész, a megtett út kilométerben |
  | `ar` | egész, a fuvar ára forintban |
  | `fizetes` | szöveg: `kartya` vagy `keszpenz` |

  **3. feladat.** Adja meg lekérdezéssel, hogy összesen hány fuvar volt, mennyi volt a **megtett kilométerek összege**, és mennyi az **összes bevétel**! A lekérdezés három oszlopot adjon ebben a sorrendben: `fuvarok`, `osszkm`, `bevetel`.
starter_code:
  sql: |
    SELECT  AS fuvarok, AS osszkm, AS bevetel
    FROM fuvar;
sample_solutions:
  sql: |
    SELECT COUNT(*) AS fuvarok, SUM(km) AS osszkm, SUM(ar) AS bevetel
    FROM fuvar;
