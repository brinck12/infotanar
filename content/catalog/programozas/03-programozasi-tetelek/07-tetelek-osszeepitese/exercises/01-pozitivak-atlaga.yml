description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a **pozitív számok átlagát** két tizedesjegyre kerekítve. Ha egyetlen pozitív szám sincs, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban az átlag két tizedesjeggyel, vagy `NINCS`.

  ### Példa

  Bemenet: `4`, majd `6`, `-2`, `3`, `-1`. Kimenet: `4.50`

  Tipp: egy ciklusban két tételt építs össze: a pozitívak összegét és darabszámát. A végén az osztás előtt ellenőrizd, hogy a darabszám nem nulla.
