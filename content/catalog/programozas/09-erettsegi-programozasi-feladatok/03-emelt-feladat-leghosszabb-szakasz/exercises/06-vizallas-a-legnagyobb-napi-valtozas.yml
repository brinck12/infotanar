        print("Nincs eleg meres.")
    else:
        legjobb = abs(meresek[1].allas - meresek[0].allas)
        hely = 1
        for i in range(2, len(meresek)):
            valtozas = abs(meresek[i].allas - meresek[i - 1].allas)
            if valtozas > legjobb:
                legjobb = valtozas
                hely = i
        print(f"Legnagyobb valtozas: {legjobb} cm ({meresek[hely - 1].datum} -> {meresek[hely].datum})")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("6. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            if (meresek.Count < 2)
            {
                Console.WriteLine("Nincs eleg meres.");
            }
            else
            {
                int legjobb = Math.Abs(meresek[1].Allas - meresek[0].Allas);
                int hely = 1;
                for (int i = 2; i < meresek.Count; i++)
                {
                    int valtozas = Math.Abs(meresek[i].Allas - meresek[i - 1].Allas);
                    if (valtozas > legjobb)
                    {
                        legjobb = valtozas;
                        hely = i;
                    }
                }
                Console.WriteLine("Legnagyobb valtozas: " + legjobb + " cm (" + meresek[hely - 1].Datum + " -> " + meresek[hely].Datum + ")");
            }
        }
    }
