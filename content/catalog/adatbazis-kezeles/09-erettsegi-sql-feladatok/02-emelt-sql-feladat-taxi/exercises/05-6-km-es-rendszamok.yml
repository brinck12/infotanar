slug: 6-km-es-rendszamok
title: 6. KM-es rendszámok
position: 4
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `szuletes` | `INT`, a születési év |
  | `angol` | `INT`: 1, ha beszél angolul, különben 0 |
  | `nemet` | `INT`: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | `INT`, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `sofor_id` | `INT`, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | `VARCHAR(10)`, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | `DATE` |
  | `km` | `INT`, a megtett út kilométerben |
  | `ar` | `INT`, a fuvar ára forintban |
  | `fizetes` | `VARCHAR(10)`: `kartya` vagy `keszpenz` |

  **6. feladat.** A rendszámok formátuma: két betű, egy betű, kötőjel, három számjegy (pl. `KMB-217`). Adja meg lekérdezéssel azokat a **különböző rendszámokat** (**rendszam**), amelyek **KM betűkkel kezdődnek**, és a számrészük **2-essel kezdődik** (pl. `KMA-2xx`)!
starter_code:
  sql: "SELECT \nFROM fuvar\nWHERE rendszam LIKE ;\n"
sample_solutions:
  sql: |
    SELECT DISTINCT rendszam
    FROM fuvar
    WHERE rendszam LIKE 'KM_-2%';
