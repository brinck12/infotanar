slug: 5-mufajonkenti-darabszam
title: 5. Műfajonkénti darabszám
position: 4
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy filmadatbázis két táblából áll.

  A `mufaj` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg (pl. `vigjatek`, `drama`, `akcio`, `scifi`, `animacio`) |

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `ev` | egész, a bemutató éve |
  | `hossz` | egész, a játékidő percben |
  | `mufaj_id` | egész, a `mufaj` tábla `id` oszlopára mutat |
  | `ertekeles` | egész, 1 és 10 között |

  **5. feladat.** Adja meg lekérdezéssel műfajonként a filmek számát (**nev, darab**)! A `nev` a műfaj neve legyen. Csak azok a műfajok szerepeljenek, amelyekből **van film**. A találatokat rendezze a darabszám szerint **csökkenő**, azonos darabszámnál a műfajnév szerint ábécérendbe!
starter_code:
  sql: "SELECT mufaj.nev, COUNT(*) AS darab\nFROM film INNER JOIN mufaj ON \nGROUP BY \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT mufaj.nev, COUNT(*) AS darab
    FROM film INNER JOIN mufaj ON film.mufaj_id = mufaj.id
    GROUP BY mufaj.id, mufaj.nev
    ORDER BY darab DESC, mufaj.nev;
