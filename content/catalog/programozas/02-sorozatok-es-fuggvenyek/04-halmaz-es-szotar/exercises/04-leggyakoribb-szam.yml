description: |
  Az első sorban egy `N` egész szám áll (`N >= 1`), utána `N` egész szám következik, mindegyik külön sorban. Keresd meg a leggyakrabban előforduló számot. Ha több szám is ugyanannyiszor fordul elő legtöbbször, a **kisebbet** kérjük. Írd ki két sorban:

  ```
  Szam: <a leggyakoribb szám>
  Darab: <hányszor fordul elő>
  ```

  Példa: a `6`, `1`, `2`, `2`, `3`, `3`, `3` bemenetre (külön sorokban):

  ```
  Szam: 3
  Darab: 3
  ```

  Tipp: előbb készíts gyakorisági szótárat (kulcs a szám, érték a darabszám), aztán járd be a kulcsokat, és tartsd számon az eddigi legjobb párt. Egyenlő darabszámnál a kisebb kulcs nyer, ezt a bejárási sorrendtől függetlenül is biztosítsd.
