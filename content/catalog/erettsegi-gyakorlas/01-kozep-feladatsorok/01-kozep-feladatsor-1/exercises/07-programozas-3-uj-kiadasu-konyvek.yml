sample_solutions:
  python: |
    with open("konyvek.txt", encoding="utf-8") as f:
        konyvek = [sor.split(";") for sor in f.read().splitlines()]
    ev = int(input())
    print("3. feladat: Darab:", sum(1 for k in konyvek if int(k[2]) >= ev))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("konyvek.txt");
            int ev = int.Parse(Console.ReadLine());
            int db = 0;
            foreach (string sor in sorok)
            {
                if (int.Parse(sor.Split(';')[2]) >= ev)
                {
                    db++;
                }
            }
            Console.WriteLine("3. feladat: Darab: " + db);
        }
    }
