slug: atlag-ures-lista-eseten
title: "Átlag üres lista esetén"
position: 0
kind: code
level: emelt
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Olvass be egy `N` számot (`0 ≤ N ≤ 100`), majd `N` egész számot külön sorban. Írd ki az átlagukat két tizedesjeggyel. Ha `N = 0`, a kimenet `nincs adat` (nullával osztás nélkül!).

  Példa: `3`, majd `1`, `2`, `4` esetén a kimenet `2.33`. `N = 0` esetén `nincs adat`.

  Tipp: Pythonban `f"{x:.2f}"`, C#-ban `x.ToString("F2", System.Globalization.CultureInfo.InvariantCulture)` adja a két tizedesjegyű alakot (a tizedespont miatt kell az invariáns kultúra).
starter_code:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        osszeg += int(input())
    # TODO: n == 0 esetén "nincs adat", különben az átlag két tizedesjeggyel
    print(osszeg / n)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                osszeg += int.Parse(Console.ReadLine());
            }
            // TODO: n == 0 esetén "nincs adat", különben az átlag két tizedesjeggyel
            Console.WriteLine((double)osszeg / n);
        }
    }
sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        osszeg += int(input())
    if n == 0:
        print("nincs adat")
    else:
        print(f"{osszeg / n:.2f}")
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                osszeg += int.Parse(Console.ReadLine());
            }
            if (n == 0)
            {
                Console.WriteLine("nincs adat");
            }
            else
            {
                double atlag = (double)osszeg / n;
                Console.WriteLine(atlag.ToString("F2", System.Globalization.CultureInfo.InvariantCulture));
            }
        }
    }
tests:
  - { stdin: "3\n1\n2\n4\n", expected: "2.33\n", hidden: false }
  - { stdin: "0\n", expected: "nincs adat\n", hidden: true }
  - { stdin: "1\n-7\n", expected: "-7.00\n", hidden: true }
  - { stdin: "4\n1\n2\n3\n4\n", expected: "2.50\n", hidden: true }
  - { stdin: "2\n-1\n-2\n", expected: "-1.50\n", hidden: true }
