slug: adatbazis-7-tobb-tarsasag-kozos-celallomasai
title: Adatbázis 7 - Több társaság közös célállomásai
position: 6
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Az adatbázis négy táblából áll.

  A `legitarsasag` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)`, a légitársaság neve |
  | `orszag` | `VARCHAR(50)`, a székhely országa |

  A `gep` tábla (a repülőgéptípusok):

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `tipus` | `VARCHAR(20)`, a gép típusa |
  | `ferohely` | `INT`, az ülőhelyek száma |

  A `jarat` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `szam` | `VARCHAR(10)`, a járatszám (pl. `MA1017`) |
  | `legitarsasag_id` | `INT`, a `legitarsasag` tábla `id` oszlopára mutat |
  | `cel` | `VARCHAR(50)`, a célállomás neve |
  | `tav` | `INT`, a távolság kilométerben |

  Az `indulas` tábla (egy hónap tényleges indulásai):

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `jarat_id` | `INT`, a `jarat` tábla `id` oszlopára mutat |
  | `gep_id` | `INT`, a `gep` tábla `id` oszlopára mutat |
  | `nap` | `INT`, a hónap napja (1–30) |
  | `ido` | `VARCHAR(5)`, az indulás `ÓÓ:PP` alakban |
  | `utas` | `INT`, a felszálló utasok száma |
  | `keses` | `INT`, a késés percben (0, ha pontosan indult) |

  **7. feladat.** Adja meg azokat a célállomásokat, ahová a hónapban **legalább két különböző légitársaság** indított járatot (tényleges indulás alapján)! A lekérdezés három oszlopot adjon `cel`, `tarsasagok` és `indulasok` néven (a különböző társaságok és az összes indulás száma), a sorok társaságok száma szerint csökkenő, azonos értéknél célállomás szerint növekvő sorrendben jöjjenek!

  Tipp: `COUNT(DISTINCT ...)`; a csoportra vonatkozó szűrés a `HAVING`.
starter_code:
  sql: "SELECT jarat.cel AS cel, COUNT(DISTINCT ) AS tarsasagok, COUNT(*) AS indulasok\nFROM jarat JOIN indulas ON \nGROUP BY \nHAVING \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT jarat.cel AS cel, COUNT(DISTINCT jarat.legitarsasag_id) AS tarsasagok, COUNT(*) AS indulasok
    FROM jarat JOIN indulas ON indulas.jarat_id = jarat.id
    GROUP BY jarat.cel
    HAVING COUNT(DISTINCT jarat.legitarsasag_id) >= 2
    ORDER BY tarsasagok DESC, cel;
