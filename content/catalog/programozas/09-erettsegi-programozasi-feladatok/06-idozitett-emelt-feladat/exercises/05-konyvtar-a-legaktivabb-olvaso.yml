description: |
  A városi könyvtár kölcsönzéseit a `kolcsonzes.txt` fájl tartalmazza. Az első sor fejléc (`olvaso`, `kod`, `ki`, `be`), utána minden sor egy kölcsönzés, tabulátorral tagolva: az olvasó neve (ékezet nélkül, szóközt tartalmazhat), a könyv kódja (pl. `K101`), a kikölcsönzés napja és a visszahozás napja az év napjaként számozva (1–365, az év nem szökőév). A visszahozás napja mindig nagyobb a kikölcsönzés napjánál. Egy olvasó és egy könyv többször is szerepelhet. A fájl legalább egy kölcsönzést tartalmaz. Egy kölcsönzés időtartama `be - ki` nap; a kölcsönzési határidő 14 nap. A programban egy kölcsönzést rekordként (osztályként) érdemes tárolni. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  **(7 pont)** Állapítsd meg, melyik olvasónak van a legtöbb kölcsönzése, és írd ki a nevét és a kölcsönzései számát. Holtversenynél az az olvasó számít, aki a fájlban előbb szerepel.

  ```
  Legaktivabb: <nev> (<db>)
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  5. feladat
  Legaktivabb: Kiss Anna (4)
  ```

  Tipp: Szótárban (C#-ban `Dictionary`) számold olvasónként a kölcsönzéseket, de a holtverseny miatt a nevek első előfordulási sorrendjét külön listában is tartsd meg.
