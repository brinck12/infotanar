  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Eredmeny
    {
        public string Nev;
        public string Orszag;
        public int Tav;
        public double Ido;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("verseny.txt");
            List<Eredmeny> eredmenyek = new List<Eredmeny>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Eredmeny e = new Eredmeny();
                e.Nev = r[0];
                e.Orszag = r[1];
                e.Tav = int.Parse(r[2]);
                e.Ido = double.Parse(r[3], CultureInfo.InvariantCulture);
                eredmenyek.Add(e);
            }
            Eredmeny legjobb = null;
            foreach (Eredmeny e in eredmenyek)
            {
                if (e.Tav == 100 && (legjobb == null || e.Ido < legjobb.Ido))
                {
                    legjobb = e;
                }
            }
            if (legjobb == null)
            {
                Console.WriteLine("Nincs 100 m-es eredmeny.");
            }
            else
            {
                Console.WriteLine("Legjobb 100 m-es ido: " + legjobb.Ido.ToString("F2", CultureInfo.InvariantCulture) + " mp (" + legjobb.Nev + ", " + legjobb.Orszag + ")");
            }
        }
    }
