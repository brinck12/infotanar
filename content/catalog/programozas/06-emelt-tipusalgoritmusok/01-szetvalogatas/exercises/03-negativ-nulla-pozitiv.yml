sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    neg = []
    nulla = []
    poz = []
    for x in a:
        if x < 0:
            neg.append(x)
        elif x == 0:
            nulla.append(x)
        else:
            poz.append(x)

    def sor(lista):
        if len(lista) == 0:
            return "-"
        return " ".join(str(x) for x in lista)

    print("Negativ: " + sor(neg))
    print("Nulla: " + sor(nulla))
    print("Pozitiv: " + sor(poz))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static string Sor(List<int> lista)
        {
            if (lista.Count == 0)
            {
                return "-";
            }
            return string.Join(" ", lista);
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            var neg = new List<int>();
            var nulla = new List<int>();
            var poz = new List<int>();
            foreach (int x in a)
            {
                if (x < 0)
                {
                    neg.Add(x);
                }
                else if (x == 0)
                {
                    nulla.Add(x);
                }
                else
                {
                    poz.Add(x);
                }
            }
            Console.WriteLine("Negativ: " + Sor(neg));
            Console.WriteLine("Nulla: " + Sor(nulla));
            Console.WriteLine("Pozitiv: " + Sor(poz));
        }
    }
