description: |
  Olvass be két pozitív egész számot külön sorban, és írd ki a legnagyobb közös osztójukat **Euklidész algoritmusával, rekurzívan**.

  A leírás: `lnko(a, b)` értéke `a`, ha `b = 0`; különben `lnko(b, a mod b)`.

  Példa: `48` és `18` esetén a kimenet `6`; `7` és `13` esetén `1`.

  Tipp: a maradékos osztás jele `%`.
