description: |
  Az első sorban egy `N` egész szám áll (`N >= 1`), utána `N` szó következik (csak kisbetűs, ékezet nélküli betűk), mindegyik külön sorban. Írd ki ábécé sorrendben minden különböző szót és azt, hogy hányszor szerepelt, `szó: darab` alakban, külön sorokban.

  Példa: a `4`, `alma`, `korte`, `alma`, `alma` bemenetre (külön sorokban):

  ```
  alma: 3
  korte: 1
  ```

  Tipp: a szótár kulcsa a szó, értéke a darabszám. A kulcsokat a kiírás előtt rendezd.
