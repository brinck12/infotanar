slug: a-harom-legdragabb-konyv
title: A három legdrágább könyv
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
  A `LIMIT n` csak az első `n` sort adja vissza, ezért rendezéssel együtt használva "a legnagyobb/legkisebb n" lekérdezhető. (MariaDB-ben is `LIMIT`, SQL Serverben `TOP`.)

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `szerzo` | szöveg |
  | `ev` | egész (a kiadás éve) |
  | `oldal` | egész |
  | `ar` | egész (Ft) |
  | `mufaj` | szöveg |

  Listázd ki a **három legdrágább** könyv **címét és árát**, ár szerint csökkenő sorrendben! (Az árak mind különbözők.) A sorok sorrendje számít.

  Tipp: előbb rendezz csökkenőre, utána korlátozd a sorok számát: `ORDER BY ... DESC LIMIT 3`.
starter_code:
  sql: |
    SELECT cim, ar
    FROM konyv
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT cim, ar
    FROM konyv
    ORDER BY ar DESC
    LIMIT 3;
