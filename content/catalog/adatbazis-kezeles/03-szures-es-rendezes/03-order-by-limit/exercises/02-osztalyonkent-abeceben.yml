slug: osztalyonkent-abeceben
title: Osztályonként ábécében
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
  Az `ORDER BY` után több mezőt is megadhatunk vesszővel: az első azonos értékei között a második dönt.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki a diákok **osztályát és nevét**, **osztály szerint**, azon belül **név szerint** növekvő sorrendben! A sorok sorrendje számít.

  Tipp: `ORDER BY osztaly, nev`
starter_code:
  sql: |
    SELECT osztaly, nev
    FROM diak
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT osztaly, nev
    FROM diak
    ORDER BY osztaly, nev;
