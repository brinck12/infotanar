description: |
  Egy atlétikai versenyen a futók eredményeit a `verseny.txt` fájl tartalmazza. Az első sor fejléc (`nev`, `orszag`, `tav`, `ido`), utána minden sor egy eredmény, tabulátorral tagolva: a versenyző neve (ékezet nélkül, szóközt tartalmazhat), az országkód (három nagybetű), a táv méterben (100, 200 vagy 400) és az elért idő másodpercben, két tizedesjegyes tizedestörtként (pontokkal, pl. `11.52`). Egy versenyző több távon is indulhatott, ezért a neve többször szerepelhet, mindig ugyanazzal az országkóddal és különböző távval. A fájl legalább egy eredményt tartalmaz.

  A programban egy eredményt rekordként (osztályként) érdemes tárolni: név, ország, táv, idő. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Melyik versenyző indult a legtöbb különböző távon? Írd ki a nevét és a távok számát. Holtverseny esetén az számít, aki a fájlban előbb szerepel először.

  ```
  Legtobb tavon indult: <nev> (<db> tav)
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  6. feladat
  Legtobb tavon indult: Kovacs Adam (3 tav)
  ```

  Tipp: szótár: kulcs a név, érték a távok halmaza. C#-ban a névsorrendet külön listában tartsd, mert a szótár sorrendjére nem számíthatsz.
