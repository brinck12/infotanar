slug: adatbazis-8-napszakok-forgalma
title: Adatbázis 8 - Napszakok forgalma
position: 7
kind: sql
level: emelt
difficulty: 5
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |-
  Az adatbázis négy táblából áll.

  A `allomas` tábla (a kölcsönző állomásai):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg, az állomás neve |
  | `varos_resz` | szöveg, a városrész neve |
  | `ferohely` | egész, az állomás férőhelyeinek száma |

  A `bicikli` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `tipus` | szöveg (`varosi`, `trekking`, `hegyi`, `elektromos`) |
  | `vasarlas_ev` | egész, a vásárlás éve |

  A `berlo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg, a bérlő neve |

  A `berles` tábla (egy sor egy bérlés; a bicikli az indulási állomásról indul, az érkezési állomáson adják le):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `bicikli_id` | egész, a `bicikli` tábla `id` oszlopára mutat |
  | `berlo_id` | egész, a `berlo` tábla `id` oszlopára mutat |
  | `indulo_allomas_id` | egész, az `allomas` tábla `id` oszlopára mutat |
  | `erkezo_allomas_id` | egész, az `allomas` tábla `id` oszlopára mutat |
  | `kezdet` | szöveg, `ÉÉÉÉ-HH-NN ÓÓ:PP` alakban (pl. `2025-06-14 08:15`) |
  | `km` | egész, a megtett út kilométerben |
  | `perc` | egész, a bérlés hossza percben |

  **8. feladat.** Osztályozza a bérléseket a `kezdet` időpont **órája** szerint: 12 óra előtt `delelott`, 12 és 17 óra között (a 17:59-ig) `delutan`, 18 órától `este`. Adja meg napszakonként a bérlések számát és a megtett kilométerek összegét! Az eredmény három oszlopa: `napszak`, `berlesek` és `osszes_km`. A sorrend: bérlések száma szerint csökkenően, azonos számnál napszak szerint növekvően.

  Tipp: az óra a `kezdet` szöveg 12-13. karaktere: `CAST(SUBSTR(kezdet, 12, 2) AS INTEGER)`; az osztályozást `CASE WHEN ... THEN ... END` adja. MariaDB-ben az órát a `HOUR(kezdet)` adná, a `CASE` ugyanúgy működik.
starter_code:
  sql: |
    SELECT CASE
             WHEN CAST(SUBSTR(kezdet, 12, 2) AS INTEGER) < 12 THEN 'delelott'
             WHEN  THEN 'delutan'
             ELSE 'este'
           END AS napszak,
           COUNT(*) AS berlesek, SUM(km) AS osszes_km
    FROM berles
    GROUP BY napszak
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT CASE
             WHEN CAST(SUBSTR(kezdet, 12, 2) AS INTEGER) < 12 THEN 'delelott'
             WHEN CAST(SUBSTR(kezdet, 12, 2) AS INTEGER) < 18 THEN 'delutan'
             ELSE 'este'
           END AS napszak,
           COUNT(*) AS berlesek, SUM(km) AS osszes_km
    FROM berles
    GROUP BY napszak
    ORDER BY berlesek DESC, napszak;
