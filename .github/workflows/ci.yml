name: CI

on:
  push:
  pull_request:

# Ugyanarra az ágra érkező újabb push szakítsa félbe a korábbi futást.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend (Pint, Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 beállítása
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, curl, zip, intl, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Függőségek telepítése
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Kódstílus (Pint)
        run: composer lint

      - name: Statikus analízis (Larastan, max szint)
        run: composer analyse

      # Egy már lefutott migráció szerkesztése az éles adatbázison nem fut le
      # újra: a séma csak új migrációval változhat. A PR merge-commitját
      # hasonlítjuk a célághoz, így a célág újabb migrációi nem zavarnak be.
      # Kivétel a `migration-edit` címkés PR: csak a down() javítására való,
      # az up() ilyenkor sem változhat (ezt a reviewer ellenőrzi).
      - name: Kiadott migráció nem módosítható
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'migration-edit')
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only --diff-filter=MDR FETCH_HEAD HEAD -- backend/database/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Már kiadott migráció módosult vagy törlődött. Adj hozzá új migrációt helyette:"
            echo "$changed"
            exit 1
          fi

  # A deploy/nginx alatti referencia-konfigurációt kézzel másoljuk a szerverre;
  # itt derül ki, ha szintaktikailag hibás (#128). Eldobható, önaláírt
  # tanúsítvánnyal töltjük be, a <domain> helyére teszt-nevet írva.
  nginx-config:
    name: nginx konfiguráció (szintaxis)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: nginx -t
        run: |
          work="$RUNNER_TEMP/nginx"
          cert="$work/letsencrypt/live/example.test"
          mkdir -p "$cert"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.test" \
            -keyout "$cert/privkey.pem" -out "$cert/fullchain.pem" 2>/dev/null
          sed 's/<domain>/example.test/g' deploy/nginx/infotanar.conf > "$work/infotanar.conf"

          docker run --rm \
            -v "$work/infotanar.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$work/letsencrypt:/etc/letsencrypt:ro" \
            nginx:stable nginx -t

  # Az éles adatbázis MySQL 8, a többi job sqlite-on fut. Itt derül ki, ha egy
  # migráció vagy lekérdezés csak sqlite-on működik (#126).
  backend-mysql:
    name: Backend MySQL 8-on (migrációk, API tesztek)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: infotanar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      # Csak az eldobható CI-adatbázishoz; nem titok.
      APP_KEY: base64:IuoO2O2E2ePTfNKZ3XNlVF5ZfvMJM5zld0sDIFlKhQ8=
      DB_CONNECTION: mysql
      DB_URL: mysql://root:root@127.0.0.1:3306/infotanar_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: PHP 8.3 beállítása
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, curl, zip, intl, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Backend függőségek telepítése
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Migráció üres adatbázisra
        working-directory: backend
        run: php artisan migrate --force

      # Friss migrálás után minden migráció egy batch-ben van, így ez minden down()-t lefuttat.
      - name: Minden migráció visszagörgethető
        working-directory: backend
        run: php artisan migrate:rollback --force

      - name: Újramigrálás és seed
        working-directory: backend
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Teszt függőségek telepítése
        working-directory: tests
        run: npm ci

      - name: API tesztek MySQL-en
        working-directory: tests
        env:
          API_DATABASE_URL: mysql://root:root@127.0.0.1:3306/infotanar_test
        run: npm run test:api -- --reporter=list,github

      - name: Hibás teszt eredmények feltöltése
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-mysql
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  tests-check:
    name: Tesztkód (typecheck, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Teszt függőségek telepítése
        run: npm ci

      - name: Típusellenőrzés és lint
        run: npm run check

  # Egyetlen konfiguráció (tests/playwright.config.ts), három projekt:
  #   e2e-mocked      - buildelt frontend, route interceptionnel mockolt API
  #   api             - valódi helyi backend (sqlite fixture) + Judge0 mock
  #   api-rate-limit  - az "api" után, mert kimeríti a közös kvótát
  #
  # Az E2E projekt állapotmentes, ezért több gépre szétosztjuk (shard). Az API
  # projektek közös, állapottal bíró backenden futnak, ezért egy gépen,
  # sorosan maradnak. Minden job blob riportot tölt fel, a "report" job ezekből
  # egyetlen közös HTML + JUnit riportot fűz össze, ahogy egy teljes
  # "npm test" futás adná. A config/web-servers.ts a --project alapján csak a
  # szükséges szervereket indítja (E2E: frontend, API: backend + Judge0 mock).
  e2e:
    name: E2E tesztek (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Egy elbukó shard ne állítsa le a többit: a teljes képet akarjuk látni.
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: Frontend függőségek telepítése
        working-directory: frontend
        run: npm ci

      - name: Teszt függőségek telepítése
        run: npm ci

      # A böngésző binárisok a telepített Playwright verzióhoz tartoznak,
      # ezért a verzió a cache kulcs része: verzióváltáskor új cache épül.
      - name: Playwright verzió lekérdezése
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright böngésző cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Playwright böngésző telepítése
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache találatnál a bináris megvan, de a rendszerkönyvtárak (apt)
      # nincsenek a cache-ben, azokat mindig telepíteni kell.
      - name: Playwright rendszerfüggőségek telepítése
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Az újrafuttatás (retries) és a trace gyűjtés (trace: on-first-retry)
      # a playwright.config.ts-ben csak CI-ban aktív.
      - name: E2E tesztek futtatása
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob,github

      - name: Blob riport feltöltése
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-e2e-${{ matrix.shardIndex }}
          path: tests/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Trace-ek és hibás teszt eredmények feltöltése
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e-${{ matrix.shardIndex }}
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Böngésző nem kell hozzájuk, csak nyers HTTP hívások az APIRequestContext-tel.
  api:
    name: API tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: PHP 8.3 beállítása
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, zip, intl, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Backend függőségek telepítése
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Teszt függőségek telepítése
        run: npm ci

      - name: API tesztek futtatása
        run: npm run test:api -- --reporter=blob,github

      - name: Blob riport feltöltése
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: tests/blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Hibás teszt eredmények feltöltése
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Az összes job blob riportjából egyetlen közös HTML + JUnit riport.
  report:
    name: Közös Playwright riport
    needs: [e2e, api]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Teszt függőségek telepítése
        run: npm ci

      - name: Blob riportok letöltése
        uses: actions/download-artifact@v4
        with:
          path: tests/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Riportok összefűzése
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
        run: npx playwright merge-reports --reporter=html,junit ./all-blob-reports

      - name: Riport feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/junit.xml
          retention-days: 14
