sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    for i in range(1, n + 1):
        szam = int(input())
        osszeg += szam
        print(i, szam, osszeg)
    print("Vege:", osszeg)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 1; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                osszeg += szam;
                Console.WriteLine(i + " " + szam + " " + osszeg);
            }
            Console.WriteLine("Vege: " + osszeg);
        }
    }
