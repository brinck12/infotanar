slug: hova-mentek-a-taxik
title: Hova mentek a taxik
position: 1
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A taxis nyilvántartásban ugyanaz az úti cél sokszor előfordul.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki az úti célokat (`cel`) úgy, hogy minden város csak egyszer szerepeljen! A sorok sorrendje nem számít.

  Tipp: ugyanazt kell csinálnod, mint az osztályoknál, csak más mezőre.
starter_code:
  sql: |
    SELECT
    FROM taxi;
sample_solutions:
  sql: |
    SELECT DISTINCT cel
    FROM taxi;
tests:
