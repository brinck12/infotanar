slug: kifuto-termekek
title: Kifutó termékek
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `kategoria` | `VARCHAR(20)` |
  | `ar` | `INT` (Ft) |
  | `keszlet` | `INT` (darab) |

  Azokat a termékeket, amelyekből **legfeljebb 5 darab** van készleten, sorold át a `kifuto` kategóriába, és az áruk **csökkenjen 100 Ft-tal**. Egyetlen `UPDATE` utasítással, két oszlopot módosítva oldd meg!

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: több oszlopot vesszővel elválasztva állíthatsz: `SET kategoria = ..., ar = ...`. A jobb oldalon az `ar` még a régi értéket jelenti.
starter_code:
  sql: |
    -- Ide írd az UPDATE utasítást.

    SELECT id, nev, kategoria, ar, keszlet FROM termek ORDER BY id;
sample_solutions:
  sql: |
    UPDATE termek SET kategoria = 'kifuto', ar = ar - 100 WHERE keszlet <= 5;

    SELECT id, nev, kategoria, ar, keszlet FROM termek ORDER BY id;
