slug: korai-kilepes
title: "Korai kilépés"
position: 2
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Az alábbi program eldönti, hogy a listában szerepel-e a keresett szám, de akkor is végigmegy az összes elemen, amikor már megtalálta. Alakítsd át úgy, hogy az **első találatnál megálljon**, és a döntést egy `szerepel(lista, x)` függvény adja. A kimenet ne változzon.

  Bemenet: az első sorban `N` (`0 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám, végül egy sorban a keresett `X` szám. Kimenet: `igen` vagy `nem`.

  Példa: `4`, majd `5`, `8`, `3`, `8`, végül `3` esetén `igen`. Üres listában (`N = 0`) bármely keresett szám esetén `nem` a válasz.

  Tipp: a `return` azonnal kilép a függvényből, ezért az első találatnál visszaadhatod, hogy igaz.
starter_code:
  python: |
    n = int(input())
    lista = []
    for i in range(n):
        lista.append(int(input()))
    x = int(input())
    db = 0
    for i in range(n):
        if lista[i] == x:
            db = db + 1
    if db > 0:
        print("igen")
    else:
        print("nem")
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] lista = new int[n];
            for (int i = 0; i < n; i++)
            {
                lista[i] = int.Parse(Console.ReadLine());
            }
            int x = int.Parse(Console.ReadLine());
            int db = 0;
            for (int i = 0; i < n; i++)
            {
                if (lista[i] == x)
                {
                    db = db + 1;
                }
            }
            if (db > 0)
            {
                Console.WriteLine("igen");
            }
            else
            {
                Console.WriteLine("nem");
            }
        }
    }
sample_solutions:
  python: |
    def szerepel(lista, x):
        for elem in lista:
            if elem == x:
                return True
        return False

    n = int(input())
    lista = []
    for _ in range(n):
        lista.append(int(input()))
    x = int(input())
    print("igen" if szerepel(lista, x) else "nem")
  csharp: |
    using System;

    class Program
    {
        static bool Szerepel(int[] lista, int x)
        {
            foreach (int elem in lista)
            {
                if (elem == x)
                {
                    return true;
                }
            }
            return false;
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] lista = new int[n];
            for (int k = 0; k < n; k++)
            {
                lista[k] = int.Parse(Console.ReadLine());
            }
            int x = int.Parse(Console.ReadLine());
            Console.WriteLine(Szerepel(lista, x) ? "igen" : "nem");
        }
    }
tests:
