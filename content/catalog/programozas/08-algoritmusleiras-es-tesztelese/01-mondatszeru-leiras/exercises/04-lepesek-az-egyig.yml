description: |
  Kódold le az alábbi algoritmust.

  ```text
  Algoritmus Lepesek
    Be: N
    db := 0
    Ciklus amíg N > 1
      Elágazás
        N páros esetén: N := N / 2
        különben: N := 3 * N + 1
      Elágazás vége
      db := db + 1
    Ciklus vége
    Ki: db
  Algoritmus vége
  ```

  Bemenet: egy `N` pozitív egész (`1 ≤ N ≤ 100000`). Kimenet: a `db` értéke.

  Példa: `N = 6` esetén a kimenet `8`; `N = 1` esetén `0`.

  Tipp: a páros számot egész osztással (`//`, illetve C#-ban `/`) oszd el kettővel.
