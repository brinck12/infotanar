slug: atlag-feletti-napok
title: Átlag feletti napok
position: 3
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
description: |
  Az `eladas` tábla egy bolt eladásait tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `db` | egész, az eladott darabszám |
  | `egysegar` | egész (Ft) |

  Egy eladás értéke `db * egysegar`.

  Hány olyan nap volt, amelyen a napi bevétel **nagyobb volt a napi bevételek átlagánál**? Egyetlen számot adj vissza (**darab**)! A napi összegek átlagát ne kerekítsd.

  Tipp: a `WHERE napi > (SELECT AVG(napi) FROM (...))` feltételben az átlag is egy származtatott táblából készül.
starter_code:
  sql: |
    SELECT COUNT(*) AS darab
    FROM (SELECT datum, SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS n
    WHERE napi > (SELECT AVG(napi) FROM (  ) AS m);
sample_solutions:
  sql: |
    SELECT COUNT(*) AS darab
    FROM (SELECT datum, SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS n
    WHERE napi > (SELECT AVG(napi) FROM (SELECT SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS m);
