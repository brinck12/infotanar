slug: 4-kartyas-fuvart-teljesito-soforok
title: 4. Kártyás fuvart teljesítő sofőrök
position: 2
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletes` | egész, a születési év |
  | `angol` | egész: 1, ha beszél angolul, különben 0 |
  | `nemet` | egész: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | egész, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `sofor_id` | egész, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | szöveg, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `km` | egész, a megtett út kilométerben |
  | `ar` | egész, a fuvar ára forintban |
  | `fizetes` | szöveg: `kartya` vagy `keszpenz` |

  **4. feladat.** Adja meg lekérdezéssel azoknak a sofőröknek a nevét (**nev**), akiknek volt **legalább egy kártyával fizetett fuvaruk**! Minden név csak egyszer szerepeljen, akkor is, ha a sofőrnek több ilyen fuvara volt!
starter_code:
  sql: "SELECT \nFROM sofor INNER JOIN fuvar ON \nWHERE ;\n"
sample_solutions:
  sql: |
    SELECT DISTINCT sofor.nev
    FROM sofor INNER JOIN fuvar ON fuvar.sofor_id = sofor.id
    WHERE fuvar.fizetes = 'kartya';
