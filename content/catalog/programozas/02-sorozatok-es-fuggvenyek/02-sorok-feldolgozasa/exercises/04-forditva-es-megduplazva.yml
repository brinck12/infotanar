description: |
  A bemenet egyetlen sor, amelyben szóközzel elválasztva egész számok állnak (legalább egy). Írd ki egyetlen sorban, szóközzel elválasztva a számok **kétszeresét fordított sorrendben**.

  Példa: az `1 2 3` bemenetre a kimenet `6 4 2`.

  Tipp: alakítsd a darabokat számmá, szorozd meg kettővel és tedd új listába, majd fordított sorrendben fűzd össze az elemeket (`join` / `string.Join`). A végén ne maradjon felesleges szóköz.
