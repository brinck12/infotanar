description: |
  A `terkep.txt` fájl egy tenger térképét tartalmazza. Az első sorban két egész szám áll szóközzel elválasztva: a sorok száma (`n`) és az oszlopok száma (`m`). Ezután `n` sor következik, mindegyik pontosan `m` karakter: `#` a szárazföld, `.` a víz. Egy **sziget** a vízszintesen vagy függőlegesen (átlósan nem) szomszédos `#` mezők összefüggő csoportja. A sorokat és az oszlopokat a kimenetben 1-től számozd. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  A program kérjen be egy sor- és egy oszlopszámot (`Add meg a sort es az oszlopot:` felirattal, egy sorban, szóközzel elválasztva, 1-től számozva). Írja ki, hány mezőből áll az a sziget, amelyhez a megadott mező tartozik. Ha a mező víz, a kimenet `Viz.`, ha kívül esik a térképen, `Terkepen kivul.`.

  A sziget méretét **rekurzív függvénnyel** számold: egy szárazföldi mezőhöz tartozó sziget mérete 1 plusz a négy szomszédja felől számolt új mezők száma. Jegyezd meg a már bejárt mezőket, különben a rekurzió végtelen ciklusba fut.

  ```
  Sziget merete: <db>
  ```

  Bemenet a mintaadatokhoz (amit a felhasználó begépel):

  ```
  2 3
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  5. feladat
  Add meg a sort es az oszlopot:
  Sziget merete: 5
  ```

  Tipp: A függvény alapesetei: a mező a térképen kívül van, víz, vagy már bejártad. Egyébként jelöld meg bejártnak, és add össze a négy szomszéd hívásának eredményét.
