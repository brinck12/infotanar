slug: akik-mar-rendeltek
title: Akik már rendeltek
position: 0
kind: sql
level: emelt
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `vevo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `varos` | szöveg |

  A `rendeles` tábla (a `vevo_id` a `vevo` tábla `id` oszlopára mutat):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `vevo_id` | egész, idegen kulcs |
  | `osszeg` | egész (Ft) |

  Listázd ki azoknak a vevőknek a nevét (**nev**), akik **legalább egy rendelést** leadtak! Használj `IN` operátort és a `rendeles` táblából választó allekérdezést, nem `JOIN`-t. A sorok sorrendje nem számít.

  Tipp: `WHERE id IN (SELECT vevo_id FROM rendeles)`
starter_code:
  sql: |
    SELECT nev
    FROM vevo
    WHERE id IN (SELECT );
sample_solutions:
  sql: |
    SELECT nev
    FROM vevo
    WHERE id IN (SELECT vevo_id FROM rendeles);
