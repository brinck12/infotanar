sample_solutions:
  python: |
    n = int(input())
    negativ = []
    nemnegativ = []
    for _ in range(n):
        szam = int(input())
        if szam < 0:
            negativ.append(szam)
        else:
            nemnegativ.append(szam)
    print("Negativ:", " ".join(map(str, negativ)))
    print("Nemnegativ:", " ".join(map(str, nemnegativ)))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> negativ = new List<int>();
            List<int> nemnegativ = new List<int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam < 0)
                {
                    negativ.Add(szam);
                }
                else
                {
                    nemnegativ.Add(szam);
                }
            }
            Console.WriteLine("Negativ: " + string.Join(" ", negativ));
            Console.WriteLine("Nemnegativ: " + string.Join(" ", nemnegativ));
        }
    }
