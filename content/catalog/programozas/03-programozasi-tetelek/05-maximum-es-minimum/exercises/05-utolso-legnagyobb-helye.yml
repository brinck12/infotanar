sample_solutions:
  python: |
    n = int(input())
    legnagyobb = int(input())
    hely = 1
    for i in range(2, n + 1):
        szam = int(input())
        if szam >= legnagyobb:
            legnagyobb = szam
            hely = i
    print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int legnagyobb = int.Parse(Console.ReadLine());
            int hely = 1;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam >= legnagyobb)
                {
                    legnagyobb = szam;
                    hely = i;
                }
            }
            Console.WriteLine(hely);
        }
    }
