sample_solutions:
  python: |
    sor = input()
    szamok = []
    for resz in sor.split():
        szamok.append(int(resz))
    eredmeny = []
    for i in range(len(szamok) - 1, -1, -1):
        eredmeny.append(szamok[i] * 2)
    print(" ".join(map(str, eredmeny)))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            string sor = Console.ReadLine();
            string[] reszek = sor.Split(new char[] { ' ' }, StringSplitOptions.RemoveEmptyEntries);
            List<int> szamok = new List<int>();
            foreach (string resz in reszek)
            {
                szamok.Add(int.Parse(resz));
            }
            List<int> eredmeny = new List<int>();
            for (int i = szamok.Count - 1; i >= 0; i--)
            {
                eredmeny.Add(szamok[i] * 2);
            }
            Console.WriteLine(string.Join(" ", eredmeny));
        }
    }
