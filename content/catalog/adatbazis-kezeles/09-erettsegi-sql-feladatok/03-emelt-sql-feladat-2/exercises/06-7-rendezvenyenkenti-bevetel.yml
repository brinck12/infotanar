slug: 7-rendezvenyenkenti-bevetel
title: 7. Rendezvényenkénti bevétel
position: 5
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `helyszin` | `VARCHAR(30)` (város) |
  | `datum` | `DATE` |
  | `kapacitas` | `INT`, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `rendezveny_id` | `INT`, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | `VARCHAR(50)`, a vásárló neve |
  | `kategoria` | `VARCHAR(20)`: `allo`, `ules` vagy `vip` |
  | `ar` | `INT`, a jegy ára forintban |
  | `vasarlas` | `DATE`, a vásárlás napja |

  **7. feladat.** Adja meg lekérdezéssel rendezvényenként az eladott jegyek számát és a jegyekből származó bevételt (**nev, db, bevetel**)! Csak azok a rendezvények szerepeljenek, amelyekre **eladtak legalább egy jegyet**. A találatokat rendezze **bevétel szerint csökkenően**, azonos bevételnél a név szerint ábécérendbe!
starter_code:
  sql: "SELECT rendezveny.nev, COUNT(*) AS db, SUM(jegy.ar) AS bevetel\nFROM rendezveny INNER JOIN jegy ON \nGROUP BY \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT rendezveny.nev, COUNT(*) AS db, SUM(jegy.ar) AS bevetel
    FROM rendezveny INNER JOIN jegy ON jegy.rendezveny_id = rendezveny.id
    GROUP BY rendezveny.id, rendezveny.nev
    ORDER BY bevetel DESC, rendezveny.nev;
