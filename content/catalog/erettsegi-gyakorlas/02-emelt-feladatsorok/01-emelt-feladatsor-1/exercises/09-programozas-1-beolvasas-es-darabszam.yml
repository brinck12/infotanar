  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Ut
    {
        public string Bicikli;
        public int Nap;
        public string Indulas;
        public string Erkezes;
        public int Tav;

        public Ut(string sor)
        {
            string[] r = sor.Split(';');
            Bicikli = r[0];
            Nap = int.Parse(r[1]);
            Indulas = r[2];
            Erkezes = r[3];
            Tav = int.Parse(r[4]);
        }

        public static int Percben(string ido)
        {
            string[] r = ido.Split(':');
            return int.Parse(r[0]) * 60 + int.Parse(r[1]);
        }

        public int Perc()
        {
            return Percben(Erkezes) - Percben(Indulas);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Ut> utak = new List<Ut>();
            foreach (string sor in File.ReadAllLines("utak.txt"))
            {
                utak.Add(new Ut(sor));
            }
            Console.WriteLine("1. feladat: Utak szama: " + utak.Count);
            HashSet<string> biciklik = new HashSet<string>();
            foreach (Ut u in utak)
            {
                biciklik.Add(u.Bicikli);
            }
            Console.WriteLine("Kulonbozo bicikli: " + biciklik.Count);
        }
    }
