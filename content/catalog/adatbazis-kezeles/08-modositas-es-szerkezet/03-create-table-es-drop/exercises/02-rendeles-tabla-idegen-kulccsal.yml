slug: rendeles-tabla-idegen-kulccsal
title: Rendelés tábla idegen kulccsal
position: 1
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  A `vevo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `varos` | `VARCHAR(30)` |


  A `rendeles` tábla még nem létezik. Hozd létre ezzel a szerkezettel:

  | oszlop | típus | megkötés |
  |---|---|---|
  | `id` | `INT` | elsődleges kulcs, `AUTO_INCREMENT` |
  | `vevo_id` | `INT` | `NOT NULL`, idegen kulcs a `vevo(id)` oszlopra |
  | `osszeg` | `INT` | |

  A tábla `ENGINE=InnoDB` motorral készüljön. Majd vigyél fel három rendelést az `id` megadása nélkül, a `vevo_id` és az `osszeg` sorrendjében: (1, 5000), (1, 7000), (2, 3000). Az ellenőrző lekérdezés vevőnként összegzi a rendelések értékét.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: az idegen kulcs a tábla definíciójában adható meg: `FOREIGN KEY (vevo_id) REFERENCES vevo(id)`. A záró zárójel után jön az `ENGINE=InnoDB`.
starter_code:
  sql: |
    -- Ide írd a CREATE TABLE és az INSERT utasítást.

    SELECT vevo.nev, SUM(rendeles.osszeg) AS osszesen
    FROM vevo INNER JOIN rendeles ON rendeles.vevo_id = vevo.id
    GROUP BY vevo.id, vevo.nev
    ORDER BY vevo.id;
sample_solutions:
  sql: |
    CREATE TABLE rendeles (
      id INT AUTO_INCREMENT PRIMARY KEY,
      vevo_id INT NOT NULL,
      osszeg INT,
      FOREIGN KEY (vevo_id) REFERENCES vevo(id)
    ) ENGINE=InnoDB;

    INSERT INTO rendeles (vevo_id, osszeg) VALUES (1, 5000), (1, 7000), (2, 3000);

    SELECT vevo.nev, SUM(rendeles.osszeg) AS osszesen
    FROM vevo INNER JOIN rendeles ON rendeles.vevo_id = vevo.id
    GROUP BY vevo.id, vevo.nev
    ORDER BY vevo.id;
