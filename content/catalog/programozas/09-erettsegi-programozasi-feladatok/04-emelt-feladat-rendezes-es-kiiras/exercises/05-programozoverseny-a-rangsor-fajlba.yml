description: "Egy iskolai programozóversenyen a csapatok eredményeit a `csapatok.txt` fájl tartalmazza. Az első sor fejléc (`csapat`, `varos`, `megoldott`, `buntetes`), utána minden sor egy csapat, tabulátorral tagolva: a csapat neve (ékezet nélkül, szóközt tartalmazhat), a város neve (ékezet nélkül, egyetlen szó), a megoldott feladatok száma és a büntetőpercek száma (mindkettő egész szám). Egy csapat egyszer szerepel. A fájl legalább egy csapatot tartalmaz.\n\nA **rangsorban** az a csapat áll előbb, amelyik több feladatot oldott meg; azonos számú megoldás esetén a kevesebb büntetőperces; ha ez is azonos, a fájlban előbb szereplő. A programban egy csapatot rekordként (osztályként) érdemes tárolni. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.\n\nÍrd a teljes rangsort a `rangsor.txt` fájlba, soronként egy csapat: helyezés, csapat neve, megoldott feladatok,\
  \ büntetőpercek, tabulátorral elválasztva. A helyezés **versenyhelyezés**: az azonos megoldásszámú és azonos büntetésű csapatok ugyanazt a helyezést kapják, a következő csapat helyezése pedig a rangsorbeli pozíciója (pl. 1, 2, 2, 4). Fejlécsor nincs. Olvasd vissza a fájlt, és írd ki a tartalmát a képernyőre.\n\n```\nrangsor.txt tartalma:\n<helyezes><TAB><nev><TAB><megoldott><TAB><buntetes>\n...\n```\n\nKimenet egy kisebb példafájllal (`Kek` 5/100, `Piros` 7/90, `Zold` 5/100, `Sarga` 2/10):\n\n```\n5. feladat\nrangsor.txt tartalma:\n1\tPiros\t7\t90\n2\tKek\t5\t100\n2\tZold\t5\t100\n4\tSarga\t2\t10\n```\n\nTipp: a rendezett listán haladva a helyezés csak akkor változik, ha az eredmény különbözik az előző csapatétól: ilyenkor az új helyezés `i + 1`.\n"
