allowed_languages: [python, csharp]
description: |
  Az első sorban egy `N` egész szám áll, utána `N` egész szám következik, mindegyik külön sorban. Gyűjtsd a **páros** számokat egy másik listába (az eredeti sorrendben), majd írd ki a gyűjtött listát: először az elemek számát `Darab: <db>` alakban, utána a számokat külön sorokba.

  Ha nincs páros szám, a kimenet egyetlen sor: `Nincs paros szam`.

  Példa: az `5`, `1`, `2`, `3`, `4`, `6` bemenetre (külön sorokban):

  ```
  Darab: 3
  2
  4
  6
  ```

  Tipp: a páros számokat a `% 2 == 0` feltétellel ismered fel; a másik listát üresen hozd létre, és ciklusban bővítsd.
