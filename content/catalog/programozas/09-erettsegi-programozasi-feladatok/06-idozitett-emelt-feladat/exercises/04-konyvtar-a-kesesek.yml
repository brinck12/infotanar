  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Kolcsonzes
    {
        public string Olvaso;
        public string Kod;
        public int Ki;
        public int Be;
    }

    class Program
    {
        static List<Kolcsonzes> kolcsonzesek = new List<Kolcsonzes>();

        static void Main()
        {
            string[] sorok = File.ReadAllLines("kolcsonzes.txt");
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Kolcsonzes k = new Kolcsonzes();
                k.Olvaso = r[0];
                k.Kod = r[1];
                k.Ki = int.Parse(r[2]);
                k.Be = int.Parse(r[3]);
                kolcsonzesek.Add(k);
            }
            Console.WriteLine("4. feladat");
            int db = 0;
            int osszes = 0;
            foreach (Kolcsonzes k in kolcsonzesek)
            {
                int ido = k.Be - k.Ki;
                if (ido > 14)
                {
                    db++;
                    osszes += ido - 14;
                }
            }
            Console.WriteLine("Keso kolcsonzesek: " + db);
            Console.WriteLine("Osszes keses: " + osszes);
        }
    }
