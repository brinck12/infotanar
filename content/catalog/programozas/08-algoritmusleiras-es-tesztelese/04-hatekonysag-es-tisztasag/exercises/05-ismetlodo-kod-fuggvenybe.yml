allowed_languages: [python, csharp]
description: |
  Az alábbi program három számról dönti el, hogy prímszám-e, de a vizsgálat kódja háromszor szerepel szinte szó szerint. Írd át úgy, hogy egyetlen `prim(n)` függvény végezze a vizsgálatot, és a főprogram **ciklusban** hívja háromszor. A kimenet ne változzon.

  Bemenet: három egész szám (`1 ≤ N ≤ 100000`) külön sorban. Kimenet: három sor, mindegyikben `igen` vagy `nem` aszerint, hogy a megfelelő szám prímszám-e. Az 1 nem prímszám.

  Példa: `7`, `10`, `1` esetén `igen`, `nem`, `nem` külön sorokban.

  Tipp: a vizsgálat elég `2`-től a szám négyzetgyökéig (`i * i <= n`) elvégezni.
