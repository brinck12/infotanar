description: |
  Az `ut.txt` fájl egy fuvarozó cég útjait tartalmazza, tabulátorral tagolva. Az első sor fejléc (`datum`, `sofor`, `km`, `perc`); minden további sor egy út: a dátum (`EEEE-HH-NN` alakban), a sofőr neve (ékezet nélkül, szóköz nélkül), a megtett kilométerek és az út ideje percben (egész számok). A fájl legalább egy utat tartalmaz.

  Írd ki a `4. feladat` szöveget, majd sorban (a fájlbeli sorrendben) minden olyan út dátumát, sofőrjét és kilométerét, amely legalább 100 km hosszú, szóközzel elválasztva. A végén a `Darab:` sorban a találatok száma szerepeljen:

  ```
  4. feladat
  2024-03-01 Kovacs 120
  2024-03-03 Szabo 210
  2024-03-05 Kovacs 105
  2024-03-07 Nagy 160
  Darab: 4
  ```

  Tipp: kiválogatás; közben számláld is a találatokat.
