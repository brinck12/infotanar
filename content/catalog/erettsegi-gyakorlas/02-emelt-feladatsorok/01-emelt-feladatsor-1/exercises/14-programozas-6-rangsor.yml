description: |-
  Az `utak.txt` a kerékpárkölcsönző egy havi (30 napos) forgalmát tartalmazza, soronként egy úttal, pontosvesszővel elválasztva: `bicikli;nap;indulás;érkezés;távolság`. A bicikli azonosítója `B-01` alakú, a nap a hónap napja (1–30), az indulás és az érkezés `ÓÓ:PP` alakú időpont (ugyanazon a napon belül, az érkezés mindig az indulás után van), a távolság méterben egész szám. A sorok nem rendezettek. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **6. feladat.** Készítsen **rangsort** a biciklikről a megtett összes távolság szerint! Írja ki a legtöbbet futott legfeljebb öt biciklit, **csökkenő** sorrendben: a helyezést, az azonosítót, az összes távolságot méterben és az utak számát a minta szerint. Azonos távolság esetén az azonosító szerint növekvő sorrend dönt. Ha ötnél kevesebb bicikli szerepel az adatokban, mindet írja ki.

  A mintafájlra a kimenet:

  ```text
  6. feladat:
  1. B-02 134320 m (11 ut)
  2. B-03 129141 m (12 ut)
  3. B-04 123459 m (11 ut)
  4. B-01 62221 m (8 ut)
  5. B-07 39044 m (4 ut)
  ```

  Tipp: összegezd biciklinként a távolságot és az utak számát (szótárral vagy `Dictionary`-vel), majd rendezd a párokat két szempont szerint: előbb a távolság csökkenően, azonos értéknél az azonosító növekvően. Pythonban a `sorted(..., key=lambda ...)` kulcsa lehet egy `(-távolság, azonosító)` pár.
