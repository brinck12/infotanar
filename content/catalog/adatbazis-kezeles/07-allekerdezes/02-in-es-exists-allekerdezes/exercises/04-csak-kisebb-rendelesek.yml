slug: csak-kisebb-rendelesek
title: Csak kisebb rendelések
position: 3
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
description: |
  A `vevo` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `varos` | szöveg |

  A `rendeles` tábla (a `vevo_id` a `vevo` tábla `id` oszlopára mutat):

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `vevo_id` | egész, idegen kulcs |
  | `osszeg` | egész (Ft) |

  Listázd ki azoknak a vevőknek a nevét (**nev**), akik **rendeltek már**, de **egyik rendelésük sem érte el a 20 000 Ft-ot**! Vagyis legalább egy rendelésük van, és nincs köztük 20 000 Ft vagy annál nagyobb. A sorok sorrendje nem számít.

  Tipp: két feltétel kell: `EXISTS` (van rendelése) és `NOT EXISTS` (nincs nagy rendelése).
starter_code:
  sql: |
    SELECT nev
    FROM vevo
    WHERE EXISTS (SELECT 1 FROM rendeles WHERE rendeles.vevo_id = vevo.id)
      AND NOT EXISTS (SELECT 1 FROM rendeles WHERE );
sample_solutions:
  sql: |
    SELECT nev
    FROM vevo
    WHERE EXISTS (SELECT 1 FROM rendeles WHERE rendeles.vevo_id = vevo.id)
      AND NOT EXISTS (SELECT 1 FROM rendeles WHERE rendeles.vevo_id = vevo.id AND osszeg >= 20000);
