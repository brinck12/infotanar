sample_solutions:
  python: |
    r, c = input().split()
    r = int(r)
    c = int(c)
    k = int(input())
    foglalt = [[False] * c for _ in range(r)]
    for _ in range(k):
        sor, szek = input().split()
        foglalt[int(sor) - 1][int(szek) - 1] = True
    szabad = 0
    legjobb_sor = 0
    legjobb_db = -1
    for i in range(r):
        db = 0
        for j in range(c):
            if not foglalt[i][j]:
                db += 1
        szabad += db
        if db > legjobb_db:
            legjobb_db = db
            legjobb_sor = i + 1
    print("Szabad:", szabad)
    print("Legtobb szabad hely a(z) " + str(legjobb_sor) + ". sorban: " + str(legjobb_db))
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int k = int.Parse(Console.ReadLine());
            bool[,] foglalt = new bool[r, c];
            for (int i = 0; i < k; i++)
            {
                string[] resz = Console.ReadLine().Split(' ');
                foglalt[int.Parse(resz[0]) - 1, int.Parse(resz[1]) - 1] = true;
            }
            int szabad = 0;
            int legjobbSor = 0;
            int legjobbDb = -1;
            for (int i = 0; i < r; i++)
            {
                int db = 0;
                for (int j = 0; j < c; j++)
                {
                    if (!foglalt[i, j])
                    {
                        db++;
                    }
                }
                szabad += db;
                if (db > legjobbDb)
                {
                    legjobbDb = db;
                    legjobbSor = i + 1;
                }
            }
            Console.WriteLine("Szabad: " + szabad);
            Console.WriteLine("Legtobb szabad hely a(z) " + legjobbSor + ". sorban: " + legjobbDb);
        }
    }
