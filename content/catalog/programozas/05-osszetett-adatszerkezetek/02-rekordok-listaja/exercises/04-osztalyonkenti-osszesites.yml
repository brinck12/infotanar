description: |
  A bemenet első sora a tanulók száma (N, legalább 1), majd N sor: `nev;osztaly;pont` (a pont egész szám). Minden osztályhoz írj ki egy sort az osztályok **első előfordulásának sorrendjében**:

  `osztaly: K fo, osszpont P, legjobb: nev`

  ahol K az osztály létszáma, P a pontjaik összege, a `legjobb` pedig a legtöbb pontot elért tanuló (holtversenynél a bemenetben előbbi).

  Példa bemenet:

  ```
  5
  Anna;9A;42
  Bence;9B;37
  Csilla;9A;45
  David;9B;37
  Eszter;9A;10
  ```

  Kimenet:

  ```
  9A: 3 fo, osszpont 97, legjobb: Csilla
  9B: 2 fo, osszpont 74, legjobb: Bence
  ```

  Tipp: tárold a tanulókat osztályonként egy szótárban (a kulcs az osztály neve, az érték a tanulók listája), és az osztályok sorrendjét külön listában őrizd.
