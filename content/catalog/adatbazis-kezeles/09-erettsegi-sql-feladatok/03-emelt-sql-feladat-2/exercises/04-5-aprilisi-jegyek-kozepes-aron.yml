slug: 5-aprilisi-jegyek-kozepes-aron
title: 5. Áprilisi jegyek közepes áron
position: 3
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `helyszin` | szöveg (város) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `kapacitas` | egész, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendezveny_id` | egész, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | szöveg, a vásárló neve |
  | `kategoria` | szöveg: `allo`, `ules` vagy `vip` |
  | `ar` | egész, a jegy ára forintban |
  | `vasarlas` | szöveg, a vásárlás napja (ÉÉÉÉ-HH-NN) |

  **5. feladat.** Adja meg lekérdezéssel, hogy hány jegyet vásároltak **2026. április 1. és április 30. között** (a határnapokat is beleértve), **5000 és 10 000 Ft közötti áron** (a határokat is beleértve)! Az eredmény egyetlen oszlop legyen, `darab` néven.
starter_code:
  sql: "SELECT COUNT(*) AS darab\nFROM jegy\nWHERE  BETWEEN  AND \n  AND  BETWEEN  AND ;\n"
sample_solutions:
  sql: |
    SELECT COUNT(*) AS darab
    FROM jegy
    WHERE vasarlas BETWEEN '2026-04-01' AND '2026-04-30'
      AND ar BETWEEN 5000 AND 10000;
