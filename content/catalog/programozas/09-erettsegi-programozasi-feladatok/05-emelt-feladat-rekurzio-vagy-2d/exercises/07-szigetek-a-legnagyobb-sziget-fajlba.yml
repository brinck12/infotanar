sample_solutions:
  python: |
    with open("terkep.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meret = sorok[0].split()
    n = int(meret[0])
    m = int(meret[1])
    terkep = sorok[1:1 + n]
    def sziget_meret(i, j, latott):
        if i < 0 or i >= n or j < 0 or j >= m:
            return 0
        if terkep[i][j] != "#" or latott[i][j]:
            return 0
        latott[i][j] = True
        return (1 + sziget_meret(i - 1, j, latott) + sziget_meret(i + 1, j, latott)
                + sziget_meret(i, j - 1, latott) + sziget_meret(i, j + 1, latott))
    print("7. feladat")
    latott = [[False] * m for _ in range(n)]
    legnagyobb = 0
    kezdo_i = 0
    kezdo_j = 0
    for i in range(n):
        for j in range(m):
            if terkep[i][j] == "#" and not latott[i][j]:
                k = sziget_meret(i, j, latott)
                if k > legnagyobb:
                    legnagyobb = k
                    kezdo_i = i
                    kezdo_j = j
    if legnagyobb == 0:
        print("Nincs sziget.")
    else:
        jeloles = [[False] * m for _ in range(n)]
        sziget_meret(kezdo_i, kezdo_j, jeloles)
        with open("sziget.txt", "w", encoding="utf-8") as ki:
            for i in range(n):
                ki.write("".join("#" if jeloles[i][j] else "." for j in range(m)) + "\n")
        print("Meret:", legnagyobb)
        with open("sziget.txt", encoding="utf-8") as be:
            for sor in be.read().splitlines():
                print(sor)
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static int SzigetMeret(int i, int j, bool[,] latott)
        {
            if (i < 0 || i >= n || j < 0 || j >= m)
            {
                return 0;
            }
            if (terkep[i][j] != '#' || latott[i, j])
            {
                return 0;
            }
            latott[i, j] = true;
            return 1 + SzigetMeret(i - 1, j, latott) + SzigetMeret(i + 1, j, latott)
                + SzigetMeret(i, j - 1, latott) + SzigetMeret(i, j + 1, latott);
        }

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("7. feladat");
            bool[,] latott = new bool[n, m];
            int legnagyobb = 0;
            int kezdoI = 0;
            int kezdoJ = 0;
            for (int i = 0; i < n; i++)
            {
                for (int j = 0; j < m; j++)
                {
                    if (terkep[i][j] == '#' && !latott[i, j])
                    {
                        int k = SzigetMeret(i, j, latott);
                        if (k > legnagyobb)
                        {
                            legnagyobb = k;
                            kezdoI = i;
                            kezdoJ = j;
                        }
                    }
                }
            }
            if (legnagyobb == 0)
            {
                Console.WriteLine("Nincs sziget.");
            }
            else
            {
                bool[,] jeloles = new bool[n, m];
                SzigetMeret(kezdoI, kezdoJ, jeloles);
                string[] kiSorok = new string[n];
                for (int i = 0; i < n; i++)
                {
                    char[] sor = new char[m];
                    for (int j = 0; j < m; j++)
                    {
                        sor[j] = jeloles[i, j] ? '#' : '.';
                    }
                    kiSorok[i] = new string(sor);
                }
                File.WriteAllLines("sziget.txt", kiSorok);
                Console.WriteLine("Meret: " + legnagyobb);
                foreach (string sor in File.ReadAllLines("sziget.txt"))
                {
                    Console.WriteLine(sor);
                }
            }
        }
    }
