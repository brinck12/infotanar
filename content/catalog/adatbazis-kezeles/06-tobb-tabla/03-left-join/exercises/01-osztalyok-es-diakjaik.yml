slug: osztalyok-es-diakjaik
title: Osztályok és diákjaik
position: 0
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Listázd az összes osztályt (`osztaly`) és a diákjaikat (`diak`). Az az osztály is szerepeljen, amelyiknek nincs diákja; ilyenkor a `diak` oszlop üres (`NULL`).

    A `osztaly` tábla:

    | `id` | `nev` | `terem` |
    |---|---|---|
    | 1 | 10.A | 101 |
    | 2 | 10.B | 102 |
    | 3 | 11.A | 101 |
    | 4 | 11.B | 204 |

    A `diak` tábla:

    | `id` | `nev` | `osztaly_id` |
    |---|---|---|
    | 1 | Kiss Anna | 1 |
    | 2 | Nagy Bela | 1 |
    | 3 | Toth Csaba | 2 |
    | 4 | Szabo Dora | 3 |
    | 5 | Varga Fanni | NULL |
    | 6 | Horvath Erik | 3 |

    A `targy` tábla:

    | `id` | `nev` |
    |---|---|
    | 1 | matematika |
    | 2 | informatika |
    | 3 | tortenelem |

    A `jegy` tábla:

    | `id` | `diak_id` | `targy_id` | `jegy` | `datum` |
    |---|---|---|---|---|
    | 1 | 1 | 1 | 5 | 2025-02-10 |
    | 2 | 1 | 2 | 4 | 2025-02-12 |
    | 3 | 2 | 2 | 5 | 2025-02-12 |
    | 4 | 3 | 1 | 3 | 2025-02-15 |
    | 5 | 4 | 2 | 5 | 2025-03-01 |
    | 6 | 2 | 3 | 2 | 2025-03-03 |

    Az eredmény ezekre az adatokra:

    | `osztaly` | `diak` |
    |---|---|
    | 10.A | Kiss Anna |
    | 10.A | Nagy Bela |
    | 10.B | Toth Csaba |
    | 11.A | Horvath Erik |
    | 11.A | Szabo Dora |
    | 11.B | NULL |

    Tipp: a `LEFT JOIN` a bal oldali (a `FROM` után írt) tábla minden sorát megtartja, akkor is, ha nincs párja.
starter_code:
  sql: |
    SELECT osztaly.nev AS osztaly, diak.nev AS diak
    FROM osztaly
    LEFT JOIN diak ON ;
sample_solutions:
  sql: |
    SELECT osztaly.nev AS osztaly, diak.nev AS diak
    FROM osztaly
    LEFT JOIN diak ON diak.osztaly_id = osztaly.id;
