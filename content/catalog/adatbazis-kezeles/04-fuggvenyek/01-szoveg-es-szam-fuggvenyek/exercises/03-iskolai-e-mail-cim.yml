slug: iskolai-e-mail-cim
title: Iskolai e-mail-cím
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Készíts minden tanulónak e-mail-címet `vezeteknev.keresztnev@suli.hu` alakban, csupa kisbetűvel. Az oszlop neve `email` legyen.

    A `tanulo` tábla:

    | `id` | `vezeteknev` | `keresztnev` | `osztaly` |
    |---|---|---|---|
    | 1 | Kiss | Anna | 10.A |
    | 2 | Nagy | Bela | 10.B |
    | 3 | Toth | Csaba | 10.A |

    Az eredmény ezekre az adatokra:

    | `email` |
    |---|
    | kiss.anna@suli.hu |
    | nagy.bela@suli.hu |
    | toth.csaba@suli.hu |

    Tipp: előbb fűzd össze a darabokat `CONCAT`-tal (a pont és a `@suli.hu` is szöveg), aztán tedd az egészet az `LCASE` függvénybe.
starter_code:
  sql: |
    SELECT LCASE(CONCAT(...)) AS email
    FROM tanulo;
sample_solutions:
  sql: |
    SELECT LCASE(CONCAT(vezeteknev, '.', keresztnev, '@suli.hu')) AS email
    FROM tanulo;
tests:
  - stdin: |
      CREATE TABLE tanulo (id INT, vezeteknev VARCHAR(30), keresztnev VARCHAR(30), osztaly VARCHAR(5));
      INSERT INTO tanulo VALUES (1, 'Kiss', 'Anna', '10.A');
      INSERT INTO tanulo VALUES (2, 'Nagy', 'Bela', '10.B');
      INSERT INTO tanulo VALUES (3, 'Toth', 'Csaba', '10.A');
    expected: |
      email
      kiss.anna@suli.hu
      nagy.bela@suli.hu
      toth.csaba@suli.hu
    hidden: false
