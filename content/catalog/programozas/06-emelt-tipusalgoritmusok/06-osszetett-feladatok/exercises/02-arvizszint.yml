sample_solutions:
  python: |
    n, t = input().split()
    n = int(n)
    t = int(t)
    a = [int(x) for x in input().split()]
    elso = 0
    db = 0
    for i in range(1, n):
        if a[i - 1] <= t and a[i] > t:
            db += 1
            if elso == 0:
                elso = i + 1
    if elso == 0:
        print("Elso: nincs")
    else:
        print("Elso:", elso)
    print("Atlepes:", db)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            string[] fej = Console.ReadLine().Split(' ');
            int n = int.Parse(fej[0]);
            int t = int.Parse(fej[1]);
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            int elso = 0;
            int db = 0;
            for (int i = 1; i < n; i++)
            {
                if (a[i - 1] <= t && a[i] > t)
                {
                    db++;
                    if (elso == 0)
                    {
                        elso = i + 1;
                    }
                }
            }
            if (elso == 0)
            {
                Console.WriteLine("Elso: nincs");
            }
            else
            {
                Console.WriteLine("Elso: " + elso);
            }
            Console.WriteLine("Atlepes: " + db);
        }
    }
