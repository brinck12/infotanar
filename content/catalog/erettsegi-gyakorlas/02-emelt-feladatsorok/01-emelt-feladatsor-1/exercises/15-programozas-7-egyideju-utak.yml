  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Ut
    {
        public string Bicikli;
        public int Nap;
        public string Indulas;
        public string Erkezes;
        public int Tav;

        public Ut(string sor)
        {
            string[] r = sor.Split(';');
            Bicikli = r[0];
            Nap = int.Parse(r[1]);
            Indulas = r[2];
            Erkezes = r[3];
            Tav = int.Parse(r[4]);
        }

        public static int Percben(string ido)
        {
            string[] r = ido.Split(':');
            return int.Parse(r[0]) * 60 + int.Parse(r[1]);
        }

        public int Perc()
        {
            return Percben(Erkezes) - Percben(Indulas);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Ut> utak = new List<Ut>();
            foreach (string sor in File.ReadAllLines("utak.txt"))
            {
                utak.Add(new Ut(sor));
            }
            List<Ut> rendezett = new List<Ut>(utak);
            rendezett.Sort((a, b) =>
            {
                if (a.Nap != b.Nap)
                {
                    return a.Nap.CompareTo(b.Nap);
                }
                return string.CompareOrdinal(a.Indulas, b.Indulas);
            });
            int legjobb = 0;
            int legjobbNap = 0;
            string legjobbIdo = "";
            foreach (Ut u in rendezett)
            {
                int db = 0;
                foreach (Ut v in utak)
                {
                    if (v.Nap == u.Nap && string.CompareOrdinal(v.Indulas, u.Indulas) <= 0 && string.CompareOrdinal(u.Indulas, v.Erkezes) < 0)
                    {
                        db++;
                    }
                }
                if (db > legjobb)
                {
                    legjobb = db;
                    legjobbNap = u.Nap;
                    legjobbIdo = u.Indulas;
                }
            }
            Console.WriteLine("7. feladat: Egyszerre legfeljebb " + legjobb + " bicikli volt uton, eloszor a(z) " + legjobbNap + ". napon " + legjobbIdo + "-kor.");
        }
    }
