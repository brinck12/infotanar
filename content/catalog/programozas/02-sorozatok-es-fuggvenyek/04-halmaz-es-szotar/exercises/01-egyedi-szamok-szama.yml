description: |
  Az első sorban egy `N` egész szám áll, utána `N` egész szám következik, mindegyik külön sorban. Írd ki, hogy hány **különböző** érték szerepel közöttük.

  Példa: a `5`, `1`, `2`, `2`, `3`, `1` bemenetre (külön sorokban) a kimenet `3`, mert az értékek: 1, 2, 3.

  Tipp: tedd az értékeket egy halmazba, és nézd meg a halmaz méretét.
starter_code:
  python: |
    n = int(input())
    egyedi = set()
    for i in range(n):
        szam = int(input())
        # innen folytasd
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            HashSet<int> egyedi = new HashSet<int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                // innen folytasd
            }
        }
    }
sample_solutions:
  python: |
    n = int(input())
    egyedi = set()
    for i in range(n):
        szam = int(input())
        egyedi.add(szam)
    print(len(egyedi))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            HashSet<int> egyedi = new HashSet<int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                egyedi.Add(szam);
            }
            Console.WriteLine(egyedi.Count);
        }
    }
tests:
  - { stdin: "5\n1\n2\n2\n3\n1\n", expected: "3\n", hidden: false }
  - { stdin: "1\n42\n", expected: "1\n", hidden: true }
  - { stdin: "4\n7\n7\n7\n7\n", expected: "1\n", hidden: true }
  - { stdin: "6\n-1\n1\n-1\n0\n0\n5\n", expected: "4\n", hidden: true }
