sample_solutions:
  python: |
    n = int(input())
    szamok = []
    for i in range(n):
        szamok.append(int(input()))
    osszeg = 0
    for szam in szamok:
        osszeg = osszeg + szam
    felette = 0
    for szam in szamok:
        if szam * n > osszeg:
            felette = felette + 1
    print("Atlag:", osszeg // n)
    print("Felette:", felette)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> szamok = new List<int>();
            for (int i = 0; i < n; i++)
            {
                szamok.Add(int.Parse(Console.ReadLine()));
            }
            int osszeg = 0;
            foreach (int szam in szamok)
            {
                osszeg = osszeg + szam;
            }
            int felette = 0;
            foreach (int szam in szamok)
            {
                if (szam * n > osszeg)
                {
                    felette = felette + 1;
                }
            }
            Console.WriteLine("Atlag: " + osszeg / n);
            Console.WriteLine("Felette: " + felette);
        }
    }
