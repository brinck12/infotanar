sample_solutions:
  python: |
    print("3. feladat")
    nev = input()
    with open("ut.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = 0
    km = 0
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        if mezok[1] == nev:
            db += 1
            km += int(mezok[2])
    if db == 0:
        print("Nincs ilyen sofor")
    else:
        print("Utak szama:", db)
        print("Osszes km:", km)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("3. feladat");
            string nev = Console.ReadLine();
            string[] sorok = File.ReadAllLines("ut.txt");
            int db = 0;
            int km = 0;
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                if (mezok[1] == nev)
                {
                    db++;
                    km += int.Parse(mezok[2]);
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nincs ilyen sofor");
            }
            else
            {
                Console.WriteLine("Utak szama: " + db);
                Console.WriteLine("Osszes km: " + km);
            }
        }
    }
