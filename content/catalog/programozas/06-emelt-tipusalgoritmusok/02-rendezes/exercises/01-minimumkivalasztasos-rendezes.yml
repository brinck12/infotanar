sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    csere = 0
    for i in range(n - 1):
        m = i
        for j in range(i + 1, n):
            if a[j] < a[m]:
                m = j
        if m != i:
            a[i], a[m] = a[m], a[i]
            csere += 1
    print("Rendezve: " + " ".join(str(x) for x in a))
    print("Csere:", csere)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            int csere = 0;
            for (int i = 0; i < n - 1; i++)
            {
                int m = i;
                for (int j = i + 1; j < n; j++)
                {
                    if (a[j] < a[m])
                    {
                        m = j;
                    }
                }
                if (m != i)
                {
                    int seged = a[i];
                    a[i] = a[m];
                    a[m] = seged;
                    csere++;
                }
            }
            Console.WriteLine("Rendezve: " + string.Join(" ", a));
            Console.WriteLine("Csere: " + csere);
        }
    }
