description: |
  Egy folyó vízállását naponta egyszer mérik. A `vizallas.txt` fájl első sora fejléc (`datum`, `allas`), utána minden sor egy mérés, tabulátorral tagolva: a dátum (`ÉÉÉÉ-HH-NN` alakban) és a vízállás centiméterben (egész szám). A sorok időrendben, hézag nélkül követik egymást: minden sor az előző napot követő nap mérése. A fájl legalább egy mérést tartalmaz.

  A programban egy mérést rekordként (osztályként) érdemes tárolni: dátum, vízállás. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Kérj be egy küszöbértéket (egész szám, centiméter). **Árhullámnak** nevezzük a legalább 3 napos egybefüggő szakaszt, amelyben a vízállás minden napon nagyobb a küszöbnél; a szakasz akkor ér véget, ha egy nap nem nagyobb a küszöbnél (vagy elfogy a fájl). Írd ki az árhullámok számát, majd időrendben mindegyik első és utolsó napját és hosszát. Ha nem volt árhullám, csak a darabszám (`0`) szerepel.

  ```
  Arhullamok szama: <db>
  <elso nap> - <utolso nap> (<hossz> nap)
  ...
  ```

  Kimenet a mellékelt mintafájllal és `200` bemenettel:

  ```
  7. feladat
  Add meg a kuszobot (cm):
  Arhullamok szama: 1
  2024-03-20 - 2024-03-26 (7 nap)
  ```

  Tipp: külső ciklussal haladj a napokon; ha küszöb feletti napot találsz, egy belső ciklussal lépj a szakasz végéig, és a szakasz után ugorj. A szakaszok kezdő- és végindexét listában tárold.
