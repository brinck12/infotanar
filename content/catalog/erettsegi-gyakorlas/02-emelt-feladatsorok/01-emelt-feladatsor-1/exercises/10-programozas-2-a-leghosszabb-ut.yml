description: |-
  Az `utak.txt` a kerékpárkölcsönző egy havi (30 napos) forgalmát tartalmazza, soronként egy úttal, pontosvesszővel elválasztva: `bicikli;nap;indulás;érkezés;távolság`. A bicikli azonosítója `B-01` alakú, a nap a hónap napja (1–30), az indulás és az érkezés `ÓÓ:PP` alakú időpont (ugyanazon a napon belül, az érkezés mindig az indulás után van), a távolság méterben egész szám. A sorok nem rendezettek. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **2. feladat.** Keresse meg a **legtovább tartó** utat (az indulás és az érkezés között eltelt percek száma alapján)! Ha több ilyen is van, az **először** szereplőt adja meg. Írja ki a bicikli azonosítóját, a napot, az indulás és az érkezés idejét és az út hosszát percben a minta szerint.

  A mintafájlra a kimenet:

  ```text
  2. feladat: Leghosszabb ut: B-04, 2. nap, 06:49-08:27 (98 perc)
  ```

  Tipp: az időtartam kiszámítása az `Ut` rekordban kész (`perc()` / `Perc()`). Maximumkereséshez tartsd egy változóban az eddigi legjobb utat, és csak **szigorúan nagyobbnál** cseréld le.
