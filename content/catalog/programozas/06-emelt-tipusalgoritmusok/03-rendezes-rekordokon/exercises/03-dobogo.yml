sample_solutions:
  python: |
    n = int(input())
    versenyzok = []
    for _ in range(n):
        resz = input().split(";")
        versenyzok.append((resz[0], int(resz[1])))
    rang = sorted(versenyzok, key=lambda v: v[1])
    for i in range(min(3, n)):
        print(str(i + 1) + ". " + rang[i][0] + " " + str(rang[i][1]))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Linq;

    class Versenyzo
    {
        public string Nev;
        public int Ido;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var versenyzok = new List<Versenyzo>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                versenyzok.Add(new Versenyzo { Nev = resz[0], Ido = int.Parse(resz[1]) });
            }
            var rang = versenyzok.OrderBy(v => v.Ido).ToList();
            for (int i = 0; i < Math.Min(3, n); i++)
            {
                Console.WriteLine((i + 1) + ". " + rang[i].Nev + " " + rang[i].Ido);
            }
        }
    }
