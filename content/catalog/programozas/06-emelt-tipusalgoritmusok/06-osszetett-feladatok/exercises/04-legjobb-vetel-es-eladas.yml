description: |
  Egy részvény napi árfolyamát N napon át rögzítették. A bemenet első sora N (legalább 1), majd N sor: `datum;ar` (a dátum `éééé-hh-nn` alakú szöveg, az ár egész szám). Egyszer lehet venni, és egy **későbbi** napon eladni. Keresd meg a legnagyobb nyereséget hozó vételi és eladási napot. Írd ki három sorban: `Vetel: datum`, `Eladas: datum`, `Nyereseg: ...`. Ha nincs nyereséget hozó pár (az árfolyam végig csökken vagy állandó, vagy csak egy nap van), egyetlen sort írj ki: `Nincs nyereseg`. Ha több pár ad azonos legnagyobb nyereséget, az számít, amelyiknél az eladási nap korábbi, azon belül amelyiknél a vételi nap korábbi.

  Példa bemenet:

  ```
  6
  2024-03-01;50
  2024-03-02;40
  2024-03-03;70
  2024-03-04;65
  2024-03-05;90
  2024-03-06;30
  ```

  Kimenet:

  ```
  Vetel: 2024-03-02
  Eladas: 2024-03-05
  Nyereseg: 50
  ```

  Tipp: egy bejárás elég. Tartsd nyilván az eddigi legkisebb árat és a napját (az első legkisebbet), és minden napot nézz eladási napnak: a nyereség az ár és az eddigi minimum különbsége. A legnagyobb nyereséget szigorú összehasonlítással frissítsd.
