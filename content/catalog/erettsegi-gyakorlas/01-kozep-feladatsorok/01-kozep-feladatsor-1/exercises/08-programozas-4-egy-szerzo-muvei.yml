sample_solutions:
  python: |
    with open("konyvek.txt", encoding="utf-8") as f:
        konyvek = [sor.split(";") for sor in f.read().splitlines()]
    szerzo = input().strip()
    cimek = [k[1] for k in konyvek if k[0] == szerzo]
    if cimek:
        print("4. feladat:")
        for c in cimek:
            print(c)
    else:
        print("4. feladat: Nincs ilyen szerzo!")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("konyvek.txt");
            string szerzo = Console.ReadLine().Trim();
            List<string> cimek = new List<string>();
            foreach (string sor in sorok)
            {
                string[] r = sor.Split(';');
                if (r[0] == szerzo)
                {
                    cimek.Add(r[1]);
                }
            }
            if (cimek.Count > 0)
            {
                Console.WriteLine("4. feladat:");
                foreach (string c in cimek)
                {
                    Console.WriteLine(c);
                }
            }
            else
            {
                Console.WriteLine("4. feladat: Nincs ilyen szerzo!");
            }
        }
    }
