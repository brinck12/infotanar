  python: |
    n = int(input())
    napok = []
    for _ in range(n):
        resz = input().split(";")
        napok.append((resz[0], int(resz[1])))
    minimum = napok[0]
    legjobb = 0
    vetel = None
    eladas = None
    for i in range(1, n):
        if napok[i][1] - minimum[1] > legjobb:
            legjobb = napok[i][1] - minimum[1]
            vetel = minimum
            eladas = napok[i]
        if napok[i][1] < minimum[1]:
            minimum = napok[i]
    if legjobb == 0:
        print("Nincs nyereseg")
    else:
        print("Vetel: " + vetel[0])
        print("Eladas: " + eladas[0])
