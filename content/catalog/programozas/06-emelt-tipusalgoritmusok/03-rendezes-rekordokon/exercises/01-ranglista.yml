description: |
  Egy versenyen az első sor a versenyzők száma (N, legalább 1), majd N sor: `nev;pont` (a pont egész szám). Írd ki a ranglistát pont szerint csökkenő sorrendben, soronként `nev: pont` alakban. Egyenlő pontszámnál a bemenetben előbb szereplő versenyző áll előbb.

  Példa bemenet:

  ```
  4
  Anna;30
  Bence;45
  Csilla;30
  David;12
  ```

  Kimenet:

  ```
  Bence: 45
  Anna: 30
  Csilla: 30
  David: 12
  ```

  Tipp: a rendezésnek stabilnak kell lennie. Pythonban a `sorted(..., key=..., reverse=True)` az, C#-ban használd az `OrderByDescending`-et (a `List.Sort` nem stabil).
