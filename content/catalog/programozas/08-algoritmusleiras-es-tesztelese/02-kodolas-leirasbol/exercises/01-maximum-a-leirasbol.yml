description: |
  Kódold le az alábbi algoritmust.

  ```text
  Algoritmus Maximum
    Be: N
    Be: max
    Ciklus i := 2-től N-ig
      Be: szam
      Elágazás
        szam > max esetén: max := szam
      Elágazás vége
    Ciklus vége
    Ki: max
  Algoritmus vége
  ```

  Bemenet: az első sorban `N` (`1 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám (lehet negatív). Kimenet: a legnagyobb szám.

  Példa: `4`, majd `3`, `9`, `2`, `9` esetén a kimenet `9`.

  Tipp: ne használd a beépített maximumfüggvényt, a feladat a leírás lekódolása.
