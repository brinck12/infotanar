# InfoTanar - nginx referencia-konfiguracio (#128).
#
# Egyszeri telepites a szerveren (a <domain> es az utvonalak atirasa utan):
#   sudo cp deploy/nginx/snippets/infotanar-security-headers.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/infotanar.conf /etc/nginx/sites-available/infotanar
#   sudo ln -s /etc/nginx/sites-available/infotanar /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d <domain>
#   sudo nginx -t && sudo systemctl reload nginx
#
# A tanusitvany megszerzese elott a 443-as blokk nem toltheto be (hianyzo
# fajlok): elso korben csak a 80-as blokkal inditsd az nginx-et.

# HTTP: csak a tanusitvany megujitasa es az atiranyitas.
server {
    listen 80;
    listen [::]:80;
    server_name <domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # A "listen ... http2" forma a regebbi (1.25.1 elotti) nginx-en is mukodik;
    # ujabb verzion figyelmeztetest ad, ott "http2 on;" sorra cserelheto.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/infotanar/frontend;
    index index.html;

    # A legnagyobb API-keres a beadott forraskod (max. 64 KB) es az admin
    # tananyag-szerkeszto (max. ~100 KB). A videofeltoltes sajat location-t kap (#158).
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    # FIGYELEM: az nginx add_header NEM oroklodik olyan location-be, amelyik
    # sajat add_header-t ad. Ezert a biztonsagi fejleceket minden location
    # kulon include-olja, nem a server blokk.

    # Frontend: a Vite fajlnevei tartalom-hash-eltek, orokre cache-elhetok.
    location /assets/ {
        include snippets/infotanar-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Az index.html mindig ujraellenorzendo, kulonben deploy utan a regi
    # (mar torolt) hash-elt fajlokra hivatkozna.
    location = /index.html {
        include snippets/infotanar-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: minden ismeretlen utvonal az index.html-t kapja.
    location / {
        include snippets/infotanar-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Backend: Laravel.
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        include snippets/infotanar-security-headers.conf;

        root /var/www/infotanar/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/infotanar/backend/public/index.php;

        # A szinkron kodfuttatas akar 45 mp-ig tarthat (JUDGE0_EVALUATION_DEADLINE).
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
