  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Indulas
    {
        public string Jarat;
        public string Cel;
        public int Tav;
        public int Nap;
        public string Ido;
        public int Utas;
        public int Keses;

        public Indulas(string sor)
        {
            string[] r = sor.Split(';');
            Jarat = r[0];
            Cel = r[1];
            Tav = int.Parse(r[2]);
            Nap = int.Parse(r[3]);
            Ido = r[4];
            Utas = int.Parse(r[5]);
            Keses = int.Parse(r[6]);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Indulas> indulasok = new List<Indulas>();
            foreach (string sor in File.ReadAllLines("indulasok.txt"))
            {
                indulasok.Add(new Indulas(sor));
            }
            int osszes = 0;
            foreach (Indulas i in indulasok)
            {
                osszes += i.Utas;
            }
            Console.WriteLine("1. feladat: A fajlban " + indulasok.Count + " indulas szerepel, osszesen " + osszes + " utassal.");
        }
    }
