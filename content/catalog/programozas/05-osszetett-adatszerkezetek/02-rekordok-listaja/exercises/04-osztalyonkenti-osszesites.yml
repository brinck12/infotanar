sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Tanulo:
        nev: str
        osztaly: str
        pont: int

    n = int(input())
    csoport = {}
    for _ in range(n):
        resz = input().split(";")
        t = Tanulo(resz[0], resz[1], int(resz[2]))
        if t.osztaly not in csoport:
            csoport[t.osztaly] = []
        csoport[t.osztaly].append(t)
    for osztaly in csoport:
        lista = csoport[osztaly]
        osszeg = 0
        legjobb = lista[0]
        for t in lista:
            osszeg += t.pont
            if t.pont > legjobb.pont:
                legjobb = t
        print(osztaly + ": " + str(len(lista)) + " fo, osszpont " + str(osszeg) + ", legjobb: " + legjobb.nev)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Tanulo
    {
        public string Nev;
        public string Osztaly;
        public int Pont;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var csoport = new Dictionary<string, List<Tanulo>>();
            var sorrend = new List<string>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                var t = new Tanulo { Nev = resz[0], Osztaly = resz[1], Pont = int.Parse(resz[2]) };
                if (!csoport.ContainsKey(t.Osztaly))
                {
                    csoport[t.Osztaly] = new List<Tanulo>();
                    sorrend.Add(t.Osztaly);
                }
                csoport[t.Osztaly].Add(t);
            }
            foreach (string osztaly in sorrend)
            {
                var lista = csoport[osztaly];
                int osszeg = 0;
                var legjobb = lista[0];
                foreach (var t in lista)
                {
                    osszeg += t.Pont;
                    if (t.Pont > legjobb.Pont)
                    {
                        legjobb = t;
                    }
                }
                Console.WriteLine(osztaly + ": " + lista.Count + " fo, osszpont " + osszeg + ", legjobb: " + legjobb.Nev);
            }
        }
    }
