description: |
  Az első sor a személyek száma (N, legalább 1), majd N sor: `nev;kor` (a kor egész szám). Rendezd őket **kor szerint növekvő sorrendbe beszúró rendezéssel**, a beépített rendezés használata nélkül, a rendezés legyen **stabil** (az azonos korúak a bemeneti sorrendjüket megtartják). Írd ki soronként `nev kor` alakban a rendezett listát, majd egy sorban az elemmozgatások számát: `Mozgatas: k`. Egy mozgatás az, amikor egy elemet eggyel jobbra tolsz, mert az előtte lévő kora szigorúan nagyobb a beszúrt elem koránál.

  Példa bemenet:

  ```
  4
  Anna;30
  Bence;25
  Csilla;30
  David;20
  ```

  Kimenet:

  ```
  David 20
  Bence 25
  Anna 30
  Csilla 30
  Mozgatas: 4
  ```

  Tipp: a beszúrandó elemet vedd ki, told jobbra a nála szigorúan nagyobb korúakat (ezt számold), és az üres helyre tedd be.
