slug: percek-atvaltasa
title: Percek átváltása
position: 2
kind: code
level: kozep
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Olvass be egy nemnegatív egész számot: percek számát. Írd ki, hány óra és hány perc ez, ebben a formában: `<ora> ora <perc> perc`.

  Példa: a `135` bemenetre a kimenet `2 ora 15 perc`.

  Tipp: az órák számát egész osztással, a megmaradó perceket maradékkal kapod meg.
starter_code:
  python: |
    percek = int(input())
    # innen folytasd
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int percek = int.Parse(Console.ReadLine());
            // innen folytasd
        }
    }
sample_solutions:
  python: |
    percek = int(input())
    print(str(percek // 60) + " ora " + str(percek % 60) + " perc")
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int percek = int.Parse(Console.ReadLine());
            Console.WriteLine($"{percek / 60} ora {percek % 60} perc");
        }
    }
tests:
  - { stdin: "135\n", expected: "2 ora 15 perc\n", hidden: false }
  - { stdin: "0\n", expected: "0 ora 0 perc\n", hidden: true }
  - { stdin: "59\n", expected: "0 ora 59 perc\n", hidden: true }
  - { stdin: "60\n", expected: "1 ora 0 perc\n", hidden: true }
  - { stdin: "1000\n", expected: "16 ora 40 perc\n", hidden: true }
