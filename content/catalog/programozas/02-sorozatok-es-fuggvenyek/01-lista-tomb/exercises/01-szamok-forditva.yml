slug: szamok-forditva
title: Számok fordítva
position: 0
kind: code
level: kozep
difficulty: 1
published: false
allowed_languages: [python, csharp]
description: |
  Az első sorban egy `N` egész szám áll, utána `N` darab egész szám következik, mindegyik külön sorban. Olvasd be őket egy listába, majd írd ki a számokat **fordított sorrendben**, mindegyiket külön sorba.

  Példa: ha a bemenet `3`, `1`, `2`, `3` (külön sorokban), a kimenet `3`, `2`, `1` (külön sorokban).

  Tipp: az utolsó elem indexe a hossz mínusz egy; a bejárást hátulról kezdd, és az indexet csökkentsd nulláig.
starter_code:
  python: |
    n = int(input())
    szamok = []
    for i in range(n):
        szamok.append(int(input()))
    # innen folytasd: írd ki hátulról előre
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> szamok = new List<int>();
            for (int i = 0; i < n; i++)
            {
                szamok.Add(int.Parse(Console.ReadLine()));
            }
            // innen folytasd: írd ki hátulról előre
        }
    }
sample_solutions:
  python: |
    n = int(input())
    szamok = []
    for i in range(n):
        szamok.append(int(input()))
    for i in range(n - 1, -1, -1):
        print(szamok[i])
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> szamok = new List<int>();
            for (int i = 0; i < n; i++)
            {
                szamok.Add(int.Parse(Console.ReadLine()));
            }
            for (int i = n - 1; i >= 0; i--)
            {
                Console.WriteLine(szamok[i]);
            }
        }
    }
tests:
  - { stdin: "3\n1\n2\n3\n", expected: "3\n2\n1\n", hidden: false }
  - { stdin: "1\n7\n", expected: "7\n", hidden: true }
  - { stdin: "5\n10\n-2\n0\n8\n4\n", expected: "4\n8\n0\n-2\n10\n", hidden: true }
  - { stdin: "4\n5\n5\n5\n5\n", expected: "5\n5\n5\n5\n", hidden: true }
