slug: sokat-dolgozo-autok
title: Sokat dolgozó autók
position: 0
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Listázd azokat a rendszámokat (`rendszam`), amelyekkel legalább 3 fuvart teljesítettek, a fuvarok számával együtt (`darab`).

    A `fuvar` tábla:

    | `id` | `rendszam` | `indulas` | `km` | `dij` | `fizetes` | `ertekeles` |
    |---|---|---|---|---|---|---|
    | 1 | ABC-123 | 2025-01-05 08:15:00 | 5 | 2200 | keszpenz | 5 |
    | 2 | DEF-456 | 2025-01-05 21:40:00 | 12 | 4300 | kartya | 4 |
    | 3 | ABC-123 | 2025-01-17 23:05:00 | 20 | 6700 | kartya | NULL |
    | 4 | GHI-789 | 2025-02-03 06:30:00 | 8 | 3100 | keszpenz | 3 |
    | 5 | DEF-456 | 2025-02-14 19:55:00 | 3 | 1600 | kartya | 5 |
    | 6 | ABC-123 | 2025-02-20 02:10:00 | 15 | 5200 | kartya | NULL |
    | 7 | GHI-789 | 2025-01-28 12:00:00 | 10 | 3700 | kartya | 4 |
    | 8 | DEF-456 | 2025-01-30 10:20:00 | 7 | 2800 | keszpenz | 2 |

    Az eredmény ezekre az adatokra:

    | `rendszam` | `darab` |
    |---|---|
    | ABC-123 | 3 |
    | DEF-456 | 3 |

    Tipp: a csoportok összesített értékére a `HAVING` szűr, nem a `WHERE`.
starter_code:
  sql: |
    SELECT rendszam, COUNT(*) AS darab
    FROM fuvar
    GROUP BY rendszam
    HAVING ;
sample_solutions:
  sql: |
    SELECT rendszam, COUNT(*) AS darab
    FROM fuvar
    GROUP BY rendszam
    HAVING COUNT(*) >= 3;
