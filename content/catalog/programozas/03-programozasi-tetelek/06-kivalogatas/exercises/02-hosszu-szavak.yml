sample_solutions:
  python: |
    n = int(input())
    for _ in range(n):
        szo = input()
        if len(szo) >= 5:
            print(szo)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            for (int i = 0; i < n; i++)
            {
                string szo = Console.ReadLine();
                if (szo.Length >= 5)
                {
                    Console.WriteLine(szo);
                }
            }
        }
    }
