slug: elfogyott-termekek-torlese
title: Elfogyott termékek törlése
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `kategoria` | szöveg |
  | `ar` | egész (Ft) |
  | `keszlet` | egész (darab) |

  Töröld a táblából azokat a termékeket, amelyekből **elfogyott a készlet** (a `keszlet` értéke 0)! A többi sor maradjon érintetlen.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `DELETE FROM termek WHERE ...;` – a `DELETE` is sorokat töröl, nem oszlopokat, és `WHERE` nélkül minden sor eltűnik.
starter_code:
  sql: |
    -- Ide írd a DELETE utasítást.

    SELECT id, nev, keszlet FROM termek ORDER BY id;
sample_solutions:
  sql: |
    DELETE FROM termek WHERE keszlet = 0;

    SELECT id, nev, keszlet FROM termek ORDER BY id;
