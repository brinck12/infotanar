slug: osztalyok-jegyatlaga
title: Osztályok jegyátlaga
position: 1
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Add meg osztályonként (`osztaly`) a kapott jegyek átlagát két tizedesre kerekítve (`atlag`). Csak olyan osztály kerül a listába, amelynek van diákja jegyekkel. Az összekapcsolás útja: `osztaly` - `diak` - `jegy`.

    A `osztaly` tábla:

    | `id` | `nev` | `terem` |
    |---|---|---|
    | 1 | 10.A | 101 |
    | 2 | 10.B | 102 |
    | 3 | 11.A | 101 |
    | 4 | 11.B | 204 |

    A `diak` tábla:

    | `id` | `nev` | `osztaly_id` |
    |---|---|---|
    | 1 | Kiss Anna | 1 |
    | 2 | Nagy Bela | 1 |
    | 3 | Toth Csaba | 2 |
    | 4 | Szabo Dora | 3 |
    | 5 | Varga Fanni | NULL |
    | 6 | Horvath Erik | 3 |

    A `targy` tábla:

    | `id` | `nev` |
    |---|---|
    | 1 | matematika |
    | 2 | informatika |
    | 3 | tortenelem |

    A `jegy` tábla:

    | `id` | `diak_id` | `targy_id` | `jegy` | `datum` |
    |---|---|---|---|---|
    | 1 | 1 | 1 | 5 | 2025-02-10 |
    | 2 | 1 | 2 | 4 | 2025-02-12 |
    | 3 | 2 | 2 | 5 | 2025-02-12 |
    | 4 | 3 | 1 | 3 | 2025-02-15 |
    | 5 | 4 | 2 | 5 | 2025-03-01 |
    | 6 | 2 | 3 | 2 | 2025-03-03 |

    Az eredmény ezekre az adatokra:

    | `osztaly` | `atlag` |
    |---|---|
    | 10.A | 4.0 |
    | 10.B | 3.0 |
    | 11.A | 5.0 |

    Tipp: előbb kapcsold össze a táblákat, aztán csoportosíts: a `GROUP BY` már az összekapcsolt sorokon dolgozik.
starter_code:
  sql: |
    SELECT osztaly.nev AS osztaly, ROUND(AVG(jegy.jegy), 2) AS atlag
    FROM osztaly
    INNER JOIN diak ON
    INNER JOIN jegy ON
    GROUP BY ;
sample_solutions:
  sql: |
    SELECT osztaly.nev AS osztaly, ROUND(AVG(jegy.jegy), 2) AS atlag
    FROM osztaly
    INNER JOIN diak ON diak.osztaly_id = osztaly.id
    INNER JOIN jegy ON jegy.diak_id = diak.id
    GROUP BY osztaly.nev;
