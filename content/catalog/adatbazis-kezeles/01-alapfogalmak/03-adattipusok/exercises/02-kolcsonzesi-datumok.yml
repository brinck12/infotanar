slug: kolcsonzesi-datumok
title: Kölcsönzési dátumok
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A dátumot szövegként tároljuk `ÉÉÉÉ-HH-NN` alakban, ezért a kiolvasott érték is ilyen formájú lesz. A `visszahozas` mező üres (NULL) is lehet.

  A `kolcsonzes` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `olvaso` | szöveg |
  | `cim` | szöveg |
  | `kivetel` | szöveg (dátum) |
  | `visszahozas` | szöveg (dátum), üres (NULL), ha még nincs visszahozva |

  Listázd ki a kölcsönzések **olvasóját, kivételi dátumát és visszahozási dátumát**, ebben a sorrendben! A sorok sorrendje nem számít. Az üres dátum a kimenetben üres mezőként jelenik meg.

  Tipp: a három mezőt vesszővel válaszd el, a mezők sorrendje a `SELECT` utáni sorrend.
starter_code:
  sql: |
    SELECT
    FROM kolcsonzes;
sample_solutions:
  sql: |
    SELECT olvaso, kivetel, visszahozas
    FROM kolcsonzes;
