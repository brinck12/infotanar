description: "A `konyvek.txt` a könyvtár állományát tartalmazza, soronként egy könyvvel, pontosvesszővel elválasztva: `szerző;cím;kiadás éve;oldalszám`. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.\n\n**2. feladat.** Keresse meg a legtöbb oldalas könyvet (csak egy ilyen van), és írja ki a címét és oldalszámát a minta szerint.\n\nA mintafájlra a kimenet:\n\n```text\n2. feladat: Leghosszabb konyv: Holdfeny (552 oldal)\r\n```\n\nTipp: tartsd egy változóban az eddigi legnagyobb oldalszámot és a hozzá tartozó címet; az oldalszámot alakítsd számmá."
