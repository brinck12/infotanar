  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Eredmeny
    {
        public string Nev;
        public string Orszag;
        public int Tav;
        public double Ido;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("5. feladat");
            string[] sorok = File.ReadAllLines("verseny.txt");
            List<Eredmeny> eredmenyek = new List<Eredmeny>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Eredmeny e = new Eredmeny();
                e.Nev = r[0];
                e.Orszag = r[1];
                e.Tav = int.Parse(r[2]);
                e.Ido = double.Parse(r[3], CultureInfo.InvariantCulture);
                eredmenyek.Add(e);
            }
            double osszeg = 0;
            int db = 0;
            foreach (Eredmeny e in eredmenyek)
            {
                if (e.Tav == 200)
                {
                    osszeg += e.Ido;
                    db++;
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nincs 200 m-es eredmeny.");
            }
            else
            {
                Console.WriteLine("A 200 m-es eredmenyek atlaga: " + (osszeg / db).ToString("F2", CultureInfo.InvariantCulture) + " mp");
            }
        }
    }
