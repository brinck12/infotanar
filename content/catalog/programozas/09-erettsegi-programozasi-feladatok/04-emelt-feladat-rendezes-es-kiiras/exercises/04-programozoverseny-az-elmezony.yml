  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            // ide írd a megoldást
        }
    }
sample_solutions:
  python: |
    class Csapat:
        def __init__(self, nev, varos, megoldott, buntetes):
            self.nev = nev
            self.varos = varos
            self.megoldott = megoldott
            self.buntetes = buntetes
    print("4. feladat")
    with open("csapatok.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    csapatok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        csapatok.append(Csapat(r[0], r[1], int(r[2]), int(r[3])))
    rangsor = sorted(csapatok, key=lambda c: (-c.megoldott, c.buntetes))
    for i in range(min(3, len(rangsor))):
        c = rangsor[i]
        print(f"{i + 1}. {c.nev} ({c.megoldott} megoldott, {c.buntetes} perc)")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            List<Csapat> rangsor = csapatok.OrderByDescending(c => c.Megoldott).ThenBy(c => c.Buntetes).ToList();
            for (int i = 0; i < Math.Min(3, rangsor.Count); i++)
            {
                Csapat c = rangsor[i];
                Console.WriteLine((i + 1) + ". " + c.Nev + " (" + c.Megoldott + " megoldott, " + c.Buntetes + " perc)");
            }
        }
    }
