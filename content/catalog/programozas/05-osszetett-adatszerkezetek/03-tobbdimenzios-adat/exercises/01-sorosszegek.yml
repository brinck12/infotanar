  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int[,] matrix = new int[r, c];
            for (int i = 0; i < r; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < c; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            // írd ki a sorösszegeket
        }
    }
sample_solutions:
  python: |
    r, c = input().split()
    r = int(r)
    c = int(c)
    matrix = []
    for _ in range(r):
        matrix.append([int(x) for x in input().split()])
    for i in range(r):
        osszeg = 0
        for j in range(c):
            osszeg += matrix[i][j]
        print(osszeg)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int[,] matrix = new int[r, c];
            for (int i = 0; i < r; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < c; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            for (int i = 0; i < r; i++)
            {
                int osszeg = 0;
                for (int j = 0; j < c; j++)
                {
                    osszeg += matrix[i, j];
                }
                Console.WriteLine(osszeg);
            }
        }
    }
