sample_solutions:
  python: |
    with open("terkep.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meret = sorok[0].split()
    n = int(meret[0])
    m = int(meret[1])
    terkep = sorok[1:1 + n]
    def sziget_meret(i, j, latott):
        if i < 0 or i >= n or j < 0 or j >= m:
            return 0
        if terkep[i][j] != "#" or latott[i][j]:
            return 0
        latott[i][j] = True
        return (1 + sziget_meret(i - 1, j, latott) + sziget_meret(i + 1, j, latott)
                + sziget_meret(i, j - 1, latott) + sziget_meret(i, j + 1, latott))
    print("5. feladat")
    print("Add meg a sort es az oszlopot:")
    adat = input().split()
    s = int(adat[0])
    o = int(adat[1])
    if s < 1 or s > n or o < 1 or o > m:
        print("Terkepen kivul.")
    elif terkep[s - 1][o - 1] != "#":
        print("Viz.")
    else:
        latott = [[False] * m for _ in range(n)]
        print("Sziget merete:", sziget_meret(s - 1, o - 1, latott))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static int SzigetMeret(int i, int j, bool[,] latott)
        {
            if (i < 0 || i >= n || j < 0 || j >= m)
            {
                return 0;
            }
            if (terkep[i][j] != '#' || latott[i, j])
            {
                return 0;
            }
            latott[i, j] = true;
            return 1 + SzigetMeret(i - 1, j, latott) + SzigetMeret(i + 1, j, latott)
                + SzigetMeret(i, j - 1, latott) + SzigetMeret(i, j + 1, latott);
        }

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("5. feladat");
            Console.WriteLine("Add meg a sort es az oszlopot:");
            string[] adat = Console.ReadLine().Split(' ');
            int s = int.Parse(adat[0]);
            int o = int.Parse(adat[1]);
            if (s < 1 || s > n || o < 1 || o > m)
            {
                Console.WriteLine("Terkepen kivul.");
            }
            else if (terkep[s - 1][o - 1] != '#')
            {
                Console.WriteLine("Viz.");
            }
            else
            {
                bool[,] latott = new bool[n, m];
                Console.WriteLine("Sziget merete: " + SzigetMeret(s - 1, o - 1, latott));
            }
        }
    }
