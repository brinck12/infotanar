  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int szam = 0;
            for (int i = 1; i <= n; i++)
            {
                szam = szam + i;
                Console.WriteLine(szam);
            }
        }
    }
