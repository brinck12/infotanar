description: |
  A `terkep.txt` fájl egy tenger térképét tartalmazza. Az első sorban két egész szám áll szóközzel elválasztva: a sorok száma (`n`) és az oszlopok száma (`m`). Ezután `n` sor következik, mindegyik pontosan `m` karakter: `#` a szárazföld, `.` a víz. Egy **sziget** a vízszintesen vagy függőlegesen (átlósan nem) szomszédos `#` mezők összefüggő csoportja. A sorokat és az oszlopokat a kimenetben 1-től számozd. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.

  Keresd meg a legnagyobb szigetet (holtversenynél azt, amelyik a térképen előbb, sorfolytonos bejárásban elsőként kezdődik), és írj egy `sziget.txt` fájlt: ugyanakkora térkép, mint a bemenet (fejléc nélkül, csak az `n` sor), de benne csak ez a sziget marad meg `#` jelekkel, minden más mező `.`. Ezután írd ki a sziget méretét, majd olvasd vissza a `sziget.txt` fájlt, és írd ki a tartalmát soronként. Ha nincs sziget, csak a `Nincs sziget.` sort írd ki, és fájlt ne hozz létre.

  ```
  Meret: <db>
  <a sziget.txt sorai>
  ```

  Kimenet a mellékelt mintafájllal:

  ```
  7. feladat
  Meret: 5
  ..##......
  .###......
  ..........
  ..........
  ..........
  ..........
  ..........
  ..........
  ```

  Tipp: A legnagyobb sziget kezdőmezőjét jegyezd meg, aztán futtasd le a rekurzív függvényt egy új, üres `latott` táblán: utána ez a tábla pontosan a sziget mezőit jelöli.
