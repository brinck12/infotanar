name: CI

on:
  push:
  pull_request:

# Ugyanarra az ágra érkező újabb push szakítsa félbe a korábbi futást.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Típusellenőrzés
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  tests:
    name: Tesztek (Playwright E2E + API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json

      - name: PHP 8.3 beállítása
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, curl, zip, intl, fileinfo
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Backend függőségek telepítése
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Frontend függőségek telepítése
        working-directory: frontend
        run: npm ci

      - name: Teszt függőségek telepítése
        working-directory: tests
        run: npm ci

      - name: Playwright böngésző telepítése
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # Az E2E tesztek mockolt API ellen futnak (nem kell hozzájuk backend),
      # az API tesztek pedig egy valódi helyi backendet és egy hamis
      # Judge0-t indítanak (lásd tests/api/playwright.config.ts webServer).
      - name: E2E tesztek
        working-directory: tests
        run: npm run test:e2e

      - name: API tesztek
        working-directory: tests
        run: npm run test:api

      - name: Playwright riport feltöltése
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/api/playwright-report/
          retention-days: 7
