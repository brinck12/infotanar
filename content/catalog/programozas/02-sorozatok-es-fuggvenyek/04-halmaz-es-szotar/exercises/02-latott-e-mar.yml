sample_solutions:
  python: |
    n = int(input())
    latott = set()
    for i in range(n):
        szo = input()
        if szo in latott:
            print("mar volt")
        else:
            print("uj")
            latott.add(szo)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            HashSet<string> latott = new HashSet<string>();
            for (int i = 0; i < n; i++)
            {
                string szo = Console.ReadLine();
                if (latott.Contains(szo))
                {
                    Console.WriteLine("mar volt");
                }
                else
                {
                    Console.WriteLine("uj");
                    latott.Add(szo);
                }
            }
        }
    }
tests:
