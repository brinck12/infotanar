slug: adatbazis-7-atlag-feletti-napok
title: Adatbázis 7 - Átlag feletti napok
position: 6
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |-
  Az adatbázis két táblából áll.

  A `allomas` tábla az időjárás-állomásokat tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg, az állomás neve |
  | `telepules` | szöveg, a település neve |
  | `magassag` | egész, a tengerszint feletti magasság méterben |

  A `meres` tábla a napi méréseket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `allomas_id` | egész, az `allomas` tábla `id` oszlopára mutat |
  | `datum` | szöveg, `ÉÉÉÉ-HH-NN` alakban (pl. `2026-04-14`) |
  | `homerseklet` | valós szám, a napi középhőmérséklet °C-ban |
  | `csapadek` | valós szám, a napi csapadék mm-ben (0, ha nem esett) |
  | `szel` | egész, a legerősebb széllökés km/h-ban |

  **7. feladat.** Adja meg azokat a méréseket, amelyeken a hőmérséklet **magasabb volt az adott állomás összes mérésének átlagánál**! A lekérdezés az állomás nevét (`nev`), a dátumot (`datum`) és a hőmérsékletet (`homerseklet`) adja, név, majd dátum, majd mérésazonosító szerint rendezve! (4 pont)

  Tipp: az állomás átlagát korrelált allekérdezéssel kapod: `(SELECT AVG(x.homerseklet) FROM meres x WHERE x.allomas_id = m.allomas_id)`.
starter_code:
  sql: "SELECT a.nev AS nev, m.datum AS datum, m.homerseklet AS homerseklet\nFROM meres m JOIN allomas a ON \nWHERE m.homerseklet > (SELECT )\nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT a.nev AS nev, m.datum AS datum, m.homerseklet AS homerseklet
    FROM meres m JOIN allomas a ON m.allomas_id = a.id
    WHERE m.homerseklet > (SELECT AVG(x.homerseklet) FROM meres x WHERE x.allomas_id = m.allomas_id)
    ORDER BY a.nev, m.datum, m.id;
