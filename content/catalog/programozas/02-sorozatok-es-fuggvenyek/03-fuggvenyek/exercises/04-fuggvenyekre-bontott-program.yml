sample_solutions:
  python: |
    def beolvas(n):
        szamok = []
        for i in range(n):
            szamok.append(int(input()))
        return szamok

    def osszeg(lista):
        s = 0
        for x in lista:
            s = s + x
        return s

    def legnagyobb(lista):
        m = lista[0]
        for x in lista:
            if x > m:
                m = x
        return m

    n = int(input())
    adatok = beolvas(n)
    print("Osszeg:", osszeg(adatok))
    print("Legnagyobb:", legnagyobb(adatok))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<int> Beolvas(int n)
        {
            List<int> szamok = new List<int>();
            for (int i = 0; i < n; i++)
            {
                szamok.Add(int.Parse(Console.ReadLine()));
            }
            return szamok;
        }

        static int Osszeg(List<int> lista)
        {
            int s = 0;
            foreach (int x in lista)
            {
                s = s + x;
            }
            return s;
        }

        static int Legnagyobb(List<int> lista)
        {
            int m = lista[0];
            foreach (int x in lista)
            {
                if (x > m)
                {
                    m = x;
                }
            }
            return m;
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> adatok = Beolvas(n);
            Console.WriteLine("Osszeg: " + Osszeg(adatok));
            Console.WriteLine("Legnagyobb: " + Legnagyobb(adatok));
        }
    }
