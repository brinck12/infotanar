sample_solutions:
  python: |
    n = int(input())
    elozo = int(input())
    aktualis = 1
    leghosszabb = 1
    for _ in range(n - 1):
        szam = int(input())
        if szam > elozo:
            aktualis += 1
        else:
            aktualis = 1
        if aktualis > leghosszabb:
            leghosszabb = aktualis
        elozo = szam
    print(leghosszabb)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int elozo = int.Parse(Console.ReadLine());
            int aktualis = 1;
            int leghosszabb = 1;
            for (int i = 1; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > elozo)
                {
                    aktualis++;
                }
                else
                {
                    aktualis = 1;
                }
                if (aktualis > leghosszabb)
                {
                    leghosszabb = aktualis;
                }
                elozo = szam;
            }
            Console.WriteLine(leghosszabb);
        }
    }
