description: |
  A `meresek.csv` fájl pontosvesszővel (`;`) tagolt, az első sora fejléc (`datum;homerseklet`). Minden sor egy nap dátumát és a mért hőmérsékletet (egész fokban, lehet negatív) tartalmazza. Írd ki a legmelegebb és a leghidegebb napot, valamint a fagyos napok (0 foknál hidegebb) számát:

  ```
  Legmelegebb: 2024-07-02 31
  Leghidegebb: 2024-01-05 -8
  Fagyos napok: 2
  ```

  Holtverseny esetén a fájlban korábban szereplő nap számít.

  Tipp: tárold a legjobb értéket és a hozzá tartozó dátumot is; csak akkor cserélj, ha az új érték szigorúan jobb.
starter_code:
  python: |
    with open("meresek.csv", encoding="utf-8") as f:
