    }
sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    a.sort()
    kulonbozo = 1
    legjobb_ertek = a[0]
    legjobb_db = 1
    db = 1
    for i in range(1, n):
        if a[i] == a[i - 1]:
            db += 1
        else:
            kulonbozo += 1
            db = 1
        if db > legjobb_db:
            legjobb_db = db
            legjobb_ertek = a[i]
    print("Kulonbozo:", kulonbozo)
    print("Leggyakoribb: " + str(legjobb_ertek) + " (" + str(legjobb_db) + ")")
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            a.Sort();
            int kulonbozo = 1;
            int legjobbErtek = a[0];
            int legjobbDb = 1;
            int db = 1;
            for (int i = 1; i < n; i++)
            {
                if (a[i] == a[i - 1])
                {
                    db++;
                }
                else
                {
                    kulonbozo++;
                    db = 1;
                }
                if (db > legjobbDb)
                {
                    legjobbDb = db;
                    legjobbErtek = a[i];
                }
            }
            Console.WriteLine("Kulonbozo: " + kulonbozo);
            Console.WriteLine("Leggyakoribb: " + legjobbErtek + " (" + legjobbDb + ")");
        }
    }
