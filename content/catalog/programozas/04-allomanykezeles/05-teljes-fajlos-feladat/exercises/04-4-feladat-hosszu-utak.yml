sample_solutions:
  python: |
    print("4. feladat")
    with open("ut.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    darab = 0
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        if int(mezok[2]) >= 100:
            print(mezok[0], mezok[1], mezok[2])
            darab += 1
    print("Darab:", darab)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("ut.txt");
            int darab = 0;
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                if (int.Parse(mezok[2]) >= 100)
                {
                    Console.WriteLine(mezok[0] + " " + mezok[1] + " " + mezok[2]);
                    darab++;
                }
            }
            Console.WriteLine("Darab: " + darab);
        }
    }
