sample_solutions:
  python: |
    n = int(input())
    if n == 0:
        print("ures")
    else:
        kicsi = int(input())
        nagy = kicsi
        for _ in range(n - 1):
            szam = int(input())
            if szam < kicsi:
                kicsi = szam
            if szam > nagy:
                nagy = szam
        print(kicsi, nagy)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            if (n == 0)
            {
                Console.WriteLine("ures");
            }
            else
            {
                int kicsi = int.Parse(Console.ReadLine());
                int nagy = kicsi;
                for (int i = 1; i < n; i++)
                {
                    int szam = int.Parse(Console.ReadLine());
                    if (szam < kicsi)
                    {
                        kicsi = szam;
                    }
                    if (szam > nagy)
                    {
                        nagy = szam;
                    }
                }
                Console.WriteLine(kicsi + " " + nagy);
            }
        }
    }
tests:
