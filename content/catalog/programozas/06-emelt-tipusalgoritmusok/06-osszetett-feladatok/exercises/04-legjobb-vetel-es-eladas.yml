  csharp: |
    using System;
    using System.Collections.Generic;

    class Nap
    {
        public string Datum;
        public int Ar;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var napok = new List<Nap>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                napok.Add(new Nap { Datum = resz[0], Ar = int.Parse(resz[1]) });
            }
            Nap minimum = napok[0];
            int legjobb = 0;
            Nap vetel = null;
            Nap eladas = null;
            for (int i = 1; i < n; i++)
            {
                if (napok[i].Ar - minimum.Ar > legjobb)
                {
                    legjobb = napok[i].Ar - minimum.Ar;
                    vetel = minimum;
                    eladas = napok[i];
                }
                if (napok[i].Ar < minimum.Ar)
                {
                    minimum = napok[i];
                }
            }
            if (legjobb == 0)
            {
                Console.WriteLine("Nincs nyereseg");
            }
            else
            {
                Console.WriteLine("Vetel: " + vetel.Datum);
                Console.WriteLine("Eladas: " + eladas.Datum);
                Console.WriteLine("Nyereseg: " + legjobb);
            }
        }
    }
