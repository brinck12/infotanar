slug: 1-ujabb-filmek
title: 1. Újabb filmek
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Egy filmadatbázis két táblából áll.

  A `mufaj` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg (pl. `vigjatek`, `drama`, `akcio`, `scifi`, `animacio`) |

  A `film` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `cim` | szöveg |
  | `ev` | egész, a bemutató éve |
  | `hossz` | egész, a játékidő percben |
  | `mufaj_id` | egész, a `mufaj` tábla `id` oszlopára mutat |
  | `ertekeles` | egész, 1 és 10 között |

  **1. feladat.** Adja meg lekérdezéssel azoknak a filmeknek a címét és bemutatójuk évét (**cim, ev**), amelyeket **2000 után** (2000-et nem beleértve) mutattak be! A találatokat rendezze **bemutató éve szerint növekvő**, azonos évnél cím szerint ábécérendbe!
starter_code:
  sql: "SELECT cim, ev\nFROM film\nWHERE \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT cim, ev
    FROM film
    WHERE ev > 2000
    ORDER BY ev, cim;
