sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Csapat:
        nev: str
        pont: int = 0
        gy: int = 0
        d: int = 0
        v: int = 0

    def keres(csapatok, nev):
        if nev not in csapatok:
            csapatok[nev] = Csapat(nev)
        return csapatok[nev]

    n = int(input())
    csapatok = {}
    for _ in range(n):
        resz = input().split(";")
        hazai = keres(csapatok, resz[0])
        vendeg = keres(csapatok, resz[1])
        hg = int(resz[2])
        vg = int(resz[3])
        if hg > vg:
            hazai.pont += 3
            hazai.gy += 1
            vendeg.v += 1
        elif hg < vg:
            vendeg.pont += 3
            vendeg.gy += 1
            hazai.v += 1
        else:
            hazai.pont += 1
            vendeg.pont += 1
            hazai.d += 1
            vendeg.d += 1
    vezeto = None
    for nev in csapatok:
        cs = csapatok[nev]
        print(cs.nev, cs.pont, cs.gy, cs.d, cs.v)
        if vezeto is None or cs.pont > vezeto.pont:
            vezeto = cs
    print("Vezeto: " + vezeto.nev)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Csapat
    {
        public string Nev;
        public int Pont;
        public int Gy;
        public int D;
        public int V;
    }

    class Program
    {
        static Dictionary<string, Csapat> csapatok = new Dictionary<string, Csapat>();
        static List<string> sorrend = new List<string>();

        static Csapat Keres(string nev)
        {
            if (!csapatok.ContainsKey(nev))
            {
                csapatok[nev] = new Csapat { Nev = nev };
                sorrend.Add(nev);
            }
            return csapatok[nev];
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                var hazai = Keres(resz[0]);
                var vendeg = Keres(resz[1]);
                int hg = int.Parse(resz[2]);
                int vg = int.Parse(resz[3]);
                if (hg > vg)
                {
                    hazai.Pont += 3;
                    hazai.Gy++;
                    vendeg.V++;
                }
                else if (hg < vg)
                {
                    vendeg.Pont += 3;
                    vendeg.Gy++;
                    hazai.V++;
                }
                else
                {
                    hazai.Pont++;
                    vendeg.Pont++;
                    hazai.D++;
                    vendeg.D++;
                }
            }
            Csapat vezeto = null;
            foreach (string nev in sorrend)
            {
                var cs = csapatok[nev];
                Console.WriteLine(cs.Nev + " " + cs.Pont + " " + cs.Gy + " " + cs.D + " " + cs.V);
                if (vezeto == null || cs.Pont > vezeto.Pont)
                {
                    vezeto = cs;
                }
            }
            Console.WriteLine("Vezeto: " + vezeto.Nev);
        }
    }
