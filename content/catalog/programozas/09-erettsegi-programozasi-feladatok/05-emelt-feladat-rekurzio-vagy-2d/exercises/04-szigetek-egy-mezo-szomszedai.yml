  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Program
    {
        static string[] terkep;
        static int n;
        static int m;

        static void Main()
        {
            string[] sorok = File.ReadAllLines("terkep.txt");
            string[] meret = sorok[0].Split(' ');
            n = int.Parse(meret[0]);
            m = int.Parse(meret[1]);
            terkep = new string[n];
            for (int i = 0; i < n; i++)
            {
                terkep[i] = sorok[i + 1];
            }
            Console.WriteLine("4. feladat");
            // ide írd a megoldást
        }
    }
sample_solutions:
  python: |
    with open("terkep.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meret = sorok[0].split()
    n = int(meret[0])
    m = int(meret[1])
