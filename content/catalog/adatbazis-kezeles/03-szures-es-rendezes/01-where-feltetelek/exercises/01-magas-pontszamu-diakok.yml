slug: magas-pontszamu-diakok
title: Magas pontszámú diákok
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A `WHERE` feltétele szűri a sorokat: csak azok kerülnek az eredménybe, amelyekre a feltétel igaz. Összehasonlító jelek: `=`, `<>`, `<`, `>`, `<=`, `>=`.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki azoknak a diákoknak a **nevét és pontszámát**, akiknek legalább **80** pontjuk van! A sorok sorrendje nem számít.

  Tipp: a "legalább" jelentése `>=`, vagyis a 80 pont is megfelel.
starter_code:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE ;
sample_solutions:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont >= 80;
