description: |-
  Egy meteorológiai állomás egy hónapos napi adatait az `idojaras.txt` fájl tartalmazza (UTF-8, ékezet nélkül). Az első sor fejléc (`nap;min;max;csapadek;szel`), utána minden sor egy nap adatait tartalmazza, pontosvesszővel elválasztva: a nap sorszáma (1-től folyamatosan növekszik), a legalacsonyabb és a legmagasabb hőmérséklet °C-ban (egész számok, lehet negatív), a napi csapadék mm-ben (0, ha nem esett) és a legerősebb széllökés km/h-ban. A fájl legalább egy napot tartalmaz.

  A programban egy nap adatait rekordként (osztályként) érdemes tárolni. A kimenetben ne használjon ékezetes betűt, a szöveg pontosan egyezzen a mintával.

  **5. feladat** (8 pont). Egy napot **melegnek** nevezünk, ha a maximuma legalább 15 °C. Írjon **rekurzív** függvényt, amely megadja, hány egymást követő meleg nap végződik az adott sorszámú (a lista szerinti, 0-tól induló indexű) napnál: ha az adott nap nem meleg, az eredmény 0, egyébként 1 + az előző nap eredménye (az első nap előtt nincs előző nap, ott az eredmény 0). A függvény segítségével keresse meg a leghosszabb meleg sorozatot, és írja ki a hosszát és az utolsó napját! Holtversenynél a korábbi sorozat számít. Ha egyetlen meleg nap sem volt, a kimenet a `Nem volt meleg nap.` sor.

  A mintafájlra a kimenet:

  ```text
  5. feladat
  Leghosszabb meleg sorozat: 16 nap, az utolso napja: 23. nap
  ```

  Tipp: a rekurzió alapesete az, amikor a nap nem meleg (0), vagy nincs előző nap; a lépés `1 + sorozat(i - 1)`. A leghosszabbat egy ciklus keresi meg az összes index kipróbálásával; a függvényt a `main` előtt definiáld.
