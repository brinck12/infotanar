  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("5. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            Console.WriteLine("Add meg a kuszobot (cm):");
            int kuszob = int.Parse(Console.ReadLine());
            int legjobbHossz = 0;
            int legjobbKezdet = 0;
            int hossz = 0;
            for (int i = 0; i < meresek.Count; i++)
            {
                if (meresek[i].Allas > kuszob)
                {
                    hossz++;
                    if (hossz >= legjobbHossz)
                    {
                        legjobbHossz = hossz;
                        legjobbKezdet = i - hossz + 1;
                    }
                }
                else
                {
                    hossz = 0;
                }
            }
            if (legjobbHossz == 0)
            {
                Console.WriteLine("Nem volt kuszob feletti nap.");
            }
            else
            {
                int vege = legjobbKezdet + legjobbHossz - 1;
                Console.WriteLine("Leghosszabb magas szakasz: " + legjobbHossz + " nap (" + meresek[legjobbKezdet].Datum + " - " + meresek[vege].Datum + ")");
            }
        }
    }
