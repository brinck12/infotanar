  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Eredmeny
    {
        public string Nev;
        public string Orszag;
        public int Tav;
        public double Ido;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("3. feladat");
            string[] sorok = File.ReadAllLines("verseny.txt");
            List<Eredmeny> eredmenyek = new List<Eredmeny>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Eredmeny e = new Eredmeny();
                e.Nev = r[0];
                e.Orszag = r[1];
                e.Tav = int.Parse(r[2]);
                e.Ido = double.Parse(r[3], CultureInfo.InvariantCulture);
                eredmenyek.Add(e);
            }
            Console.WriteLine("Add meg az orszagkodot:");
            string kod = Console.ReadLine();
            int db = 0;
            HashSet<string> nevek = new HashSet<string>();
            foreach (Eredmeny e in eredmenyek)
            {
                if (e.Orszag == kod)
                {
                    db++;
                    nevek.Add(e.Nev);
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nincs ilyen orszag.");
            }
            else
            {
                Console.WriteLine("Eredmenyek: " + db);
                Console.WriteLine("Versenyzok: " + nevek.Count);
            }
        }
    }
