description: |
  A bemenet első sora `R C`, utána R sor, mindegyikben C egész szám szóközzel elválasztva. Írd ki minden sor összegét külön sorban.

  Példa bemenet:

  ```
  2 3
  5 1 4
  2 8 3
  ```

  Kimenet:

  ```
  10
  13
  ```

  Tipp: a külső ciklus a sorokon halad, az összeget minden sor elején nullázd.
