  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("1. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            Console.WriteLine("Meresek szama: " + meresek.Count);
            Meres e = meresek[0];
            Meres u = meresek[meresek.Count - 1];
            Console.WriteLine("Elso meres: " + e.Datum + ", " + e.Allas + " cm");
            Console.WriteLine("Utolso meres: " + u.Datum + ", " + u.Allas + " cm");
        }
    }
