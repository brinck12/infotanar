description: |
  Olvass be egy `N` számot (`0 ≤ N ≤ 100`), majd `N` egész számot külön sorban. Írd ki a legkisebbet és a legnagyobbat egy sorban, szóközzel elválasztva (a legkisebbet elöl). Ha `N = 0`, a kimenet `ures`.

  Példa: `4`, majd `3`, `-1`, `8`, `2` esetén a kimenet `-1 8`. Egyetlen szám esetén ugyanaz a szám áll kétszer: `1`, majd `5` bemenetre `5 5`. `N = 0` esetén `ures`.

  Tipp: a kezdőértéket az első beolvasott elemből állítsd be, és külön kezeld az üres esetet.
