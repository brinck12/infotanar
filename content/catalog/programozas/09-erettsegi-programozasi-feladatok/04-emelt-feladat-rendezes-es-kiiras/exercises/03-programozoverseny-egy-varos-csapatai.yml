  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("3. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            Console.WriteLine("Add meg a varost:");
            string varos = Console.ReadLine();
            int db = 0;
            Csapat legjobb = null;
            foreach (Csapat c in csapatok)
            {
                if (c.Varos == varos)
                {
                    db++;
                    if (legjobb == null || c.Megoldott > legjobb.Megoldott || (c.Megoldott == legjobb.Megoldott && c.Buntetes < legjobb.Buntetes))
                    {
                        legjobb = c;
                    }
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nincs ilyen varos.");
            }
            else
            {
                Console.WriteLine("Csapatok szama: " + db);
                Console.WriteLine("Legjobb csapat: " + legjobb.Nev + " (" + legjobb.Megoldott + " megoldott, " + legjobb.Buntetes + " perc)");
            }
        }
    }
