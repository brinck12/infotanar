  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("2. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            int maxAllas = meresek[0].Allas;
            foreach (Meres m in meresek)
            {
                if (m.Allas > maxAllas)
                {
                    maxAllas = m.Allas;
                }
            }
            string elso = null;
            string utolso = null;
            foreach (Meres m in meresek)
            {
                if (m.Allas == maxAllas)
                {
                    if (elso == null)
                    {
                        elso = m.Datum;
                    }
                    utolso = m.Datum;
                }
            }
            Console.WriteLine("Legmagasabb allas: " + maxAllas + " cm");
            Console.WriteLine("Eloszor: " + elso);
            Console.WriteLine("Utoljara: " + utolso);
        }
    }
