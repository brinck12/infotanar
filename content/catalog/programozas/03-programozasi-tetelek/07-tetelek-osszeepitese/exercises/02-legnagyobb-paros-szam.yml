            }
        }
    }
sample_solutions:
  python: |
    n = int(input())
    legnagyobb = None
    for _ in range(n):
        szam = int(input())
        if szam % 2 == 0:
            if legnagyobb is None or szam > legnagyobb:
                legnagyobb = szam
    if legnagyobb is None:
        print("NINCS")
    else:
        print(legnagyobb)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            bool volt = false;
            int legnagyobb = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam % 2 == 0)
                {
                    if (!volt || szam > legnagyobb)
                    {
                        legnagyobb = szam;
                        volt = true;
                    }
                }
            }
            if (!volt)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(legnagyobb);
            }
        }
    }
