slug: diak-cimke
title: Diák címke
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A szövegeket a `CONCAT(a, b, c)` függvénnyel fűzhetjük össze. A szövegrészeket aposztróf közé írjuk.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Állíts elő minden diákhoz egy `cimke` nevű szöveget `Név (osztály)` alakban, például `Anna (10.A)`! Az eredmény egyetlen oszlop legyen. A sorok sorrendje nem számít.

  Tipp: `CONCAT(nev, ' (', osztaly, ')')`
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT CONCAT(nev, ' (', osztaly, ')') AS cimke
    FROM diak;
