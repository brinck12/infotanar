slug: minimumkivalasztasos-rendezes
title: "Minimumkiválasztásos rendezés"
position: 0
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Rendezd a számokat **növekvő sorrendbe minimumkiválasztásos rendezéssel**, a beépített rendezés használata nélkül. Írd ki a rendezett sort (`Rendezve: ...`), majd a cserék számát (`Csere: ...`). Csere akkor történik, ha az `i`-edik helyre kerülő legkisebb elem helye (az első legkisebb) nem az `i`-edik hely.

  Példa bemenet:

  ```
  4
  5 2 9 1
  ```

  Kimenet:

  ```
  Rendezve: 1 2 5 9
  Csere: 2
  ```

  Tipp: a legkisebb elem helyének keresésekor a szigorú `<` az első legkisebbet adja. Csak akkor cserélj, ha a két hely különbözik.
