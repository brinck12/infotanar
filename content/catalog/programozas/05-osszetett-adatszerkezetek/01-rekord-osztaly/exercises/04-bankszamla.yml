description: |
  Egy bankszámla egyenlegét egy `Szamla` osztály tárolja. Két művelete van: `befizet(osszeg)` növeli az egyenleget; `kivesz(osszeg)` csak akkor csökkenti, ha az egyenleg legalább annyi, és visszaadja, hogy sikerült-e (igaz/hamis).

  A bemenet első sora a kezdő egyenleg, a másodiké a műveletek száma (N), majd N sor következik: `B 500` (befizetés 500 Ft) vagy `K 300` (kivétel 300 Ft). Hajtsd végre a műveleteket sorban, majd írd ki két sorban a végső egyenleget és az elutasított kivételek számát: `Egyenleg: ...`, `Elutasitott: ...`.

  Példa bemenet:

  ```
  1000
  4
  B 500
  K 2000
  K 300
  K 1200
  ```

  Kimenet:

  ```
  Egyenleg: 0
  Elutasitott: 1
  ```

  Tipp: a `kivesz` metódus ellenőrizzen, és csak sikeres esetben módosítsa az egyenleget. A hívó számolja az elutasítottakat.
