slug: ket-kivalasztott-varos
title: Két kiválasztott város
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  Az `IN (érték1, érték2, ...)` azt vizsgálja, szerepel-e a mező értéke a felsorolt értékek között. Hosszú `OR` láncot helyettesít; a `NOT IN` a tagadása.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki azokat a fuvarokat (**id, cel**), amelyek célja **Pecs vagy Gyor**! A sorok sorrendje nem számít.

  Tipp: `WHERE cel IN ('Pecs', 'Gyor')`
starter_code:
  sql: |
    SELECT id, cel
    FROM taxi
    WHERE ;
sample_solutions:
  sql: |
    SELECT id, cel
    FROM taxi
    WHERE cel IN ('Pecs', 'Gyor');
tests:
