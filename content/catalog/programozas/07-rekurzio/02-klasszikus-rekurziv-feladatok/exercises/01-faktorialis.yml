description: |
  Olvass be egy `N` egész számot (`0 ≤ N ≤ 20`), és számítsd ki az `N!` értékét **rekurzív** függvénnyel. Az eredményt írd ki.

  Példa: `N = 5` esetén a kimenet `120`; `N = 0` esetén `1`.

  Tipp: `0! = 1` az alapeset, `n! = n · (n-1)!`. C#-ban `long` típust használj.
