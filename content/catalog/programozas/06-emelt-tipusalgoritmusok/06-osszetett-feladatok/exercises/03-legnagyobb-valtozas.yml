sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    legjobb = abs(a[1] - a[0])
    hely = 1
    for i in range(2, n):
        kulonbseg = abs(a[i] - a[i - 1])
        if kulonbseg > legjobb:
            legjobb = kulonbseg
            hely = i
    print("Valtozas:", legjobb)
    print("Napok: " + str(hely) + "-" + str(hely + 1))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var a = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                a.Add(int.Parse(s));
            }
            int legjobb = Math.Abs(a[1] - a[0]);
            int hely = 1;
            for (int i = 2; i < n; i++)
            {
                int kulonbseg = Math.Abs(a[i] - a[i - 1]);
                if (kulonbseg > legjobb)
                {
                    legjobb = kulonbseg;
                    hely = i;
                }
            }
            Console.WriteLine("Valtozas: " + legjobb);
            Console.WriteLine("Napok: " + hely + "-" + (hely + 1));
        }
    }
