        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                // TODO: hasonlítsd az eddigi összeghez; találatnál jegyezd meg a helyet és lépj ki
                osszeg += szam;
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
sample_solutions:
  python: |
    n = int(input())
    osszeg = int(input())
    hely = 0
    for i in range(2, n + 1):
        szam = int(input())
        if szam > osszeg:
            hely = i
            break
        osszeg += szam
    if hely == 0:
        print("NINCS")
    else:
        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > osszeg)
                {
                    hely = i;
                    break;
                }
                osszeg += szam;
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
