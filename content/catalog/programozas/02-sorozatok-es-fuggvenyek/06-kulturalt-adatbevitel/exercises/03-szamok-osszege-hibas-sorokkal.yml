sample_solutions:
  python: |
    osszeg = 0
    hibas = 0
    while True:
        sor = input()
        if sor == "vege":
            break
        try:
            osszeg = osszeg + int(sor)
        except ValueError:
            hibas = hibas + 1
    print("Osszeg:", osszeg)
    print("Ervenytelen:", hibas)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int osszeg = 0;
            int hibas = 0;
            while (true)
            {
                string sor = Console.ReadLine();
                if (sor == "vege")
                {
                    break;
                }
                int szam;
                if (int.TryParse(sor, out szam))
                {
                    osszeg = osszeg + szam;
                }
                else
                {
                    hibas = hibas + 1;
                }
            }
            Console.WriteLine("Osszeg: " + osszeg);
            Console.WriteLine("Ervenytelen: " + hibas);
        }
    }
tests:
  - { stdin: "5\nabc\n7\nvege\n", expected: "Osszeg: 12\nErvenytelen: 1\n", hidden: false }
  - { stdin: "vege\n", expected: "Osszeg: 0\nErvenytelen: 0\n", hidden: true }
  - { stdin: "x\ny\nvege\n", expected: "Osszeg: 0\nErvenytelen: 2\n", hidden: true }
  - { stdin: "3.5\n-4\n10\nvege\n", expected: "Osszeg: 6\nErvenytelen: 1\n", hidden: true }
  - { stdin: "4\n\n6\nvege\n", expected: "Osszeg: 10\nErvenytelen: 1\n", hidden: true }
