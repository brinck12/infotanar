sample_solutions:
  python: |
    class Szamla:
        def __init__(self, egyenleg):
            self.egyenleg = egyenleg

        def befizet(self, osszeg):
            self.egyenleg += osszeg

        def kivesz(self, osszeg):
            if self.egyenleg >= osszeg:
                self.egyenleg -= osszeg
                return True
            return False

    szamla = Szamla(int(input()))
    n = int(input())
    elutasitott = 0
    for _ in range(n):
        resz = input().split()
        osszeg = int(resz[1])
        if resz[0] == "B":
            szamla.befizet(osszeg)
        elif not szamla.kivesz(osszeg):
            elutasitott += 1
    print("Egyenleg:", szamla.egyenleg)
    print("Elutasitott:", elutasitott)
  csharp: |
    using System;

    class Szamla
    {
        public int Egyenleg;

        public void Befizet(int osszeg)
        {
            Egyenleg += osszeg;
        }

        public bool Kivesz(int osszeg)
        {
            if (Egyenleg >= osszeg)
            {
                Egyenleg -= osszeg;
                return true;
            }
            return false;
        }
    }

    class Program
    {
        static void Main()
        {
            var szamla = new Szamla();
            szamla.Egyenleg = int.Parse(Console.ReadLine());
            int n = int.Parse(Console.ReadLine());
            int elutasitott = 0;
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(' ');
                int osszeg = int.Parse(resz[1]);
                if (resz[0] == "B")
                {
                    szamla.Befizet(osszeg);
                }
                else if (!szamla.Kivesz(osszeg))
                {
                    elutasitott++;
                }
            }
            Console.WriteLine("Egyenleg: " + szamla.Egyenleg);
            Console.WriteLine("Elutasitott: " + elutasitott);
        }
    }
