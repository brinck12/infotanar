sample_solutions:
  python: |
    k = int(input())
    szamlalo = {}
    for _ in range(k):
        halmaz = set(int(x) for x in input().split())
        for x in halmaz:
            if x in szamlalo:
                szamlalo[x] += 1
            else:
                szamlalo[x] = 1
    for x in sorted(szamlalo):
        print(str(x) + ": " + str(szamlalo[x]))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            int k = int.Parse(Console.ReadLine());
            var szamlalo = new Dictionary<int, int>();
            for (int i = 0; i < k; i++)
            {
                var halmaz = new HashSet<int>();
                foreach (string s in Console.ReadLine().Split(' '))
                {
                    halmaz.Add(int.Parse(s));
                }
                foreach (int x in halmaz)
                {
                    if (szamlalo.ContainsKey(x))
                    {
                        szamlalo[x]++;
                    }
                    else
                    {
                        szamlalo[x] = 1;
                    }
                }
            }
            var kulcsok = szamlalo.Keys.ToList();
            kulcsok.Sort();
            foreach (int x in kulcsok)
            {
                Console.WriteLine(x + ": " + szamlalo[x]);
            }
        }
    }
