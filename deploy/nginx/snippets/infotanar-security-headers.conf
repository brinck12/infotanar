# Biztonsagi fejlecek (#128). Az `always` miatt a hibavalaszokra is rakerulnek.

# Fel evig csak HTTPS. Az elso eles tesztnel erdemes rovid ertekkel (pl. 300)
# kezdeni: a bongeszok a megadott ideig nem engednek vissza HTTP-re.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy: ENFORCING (LAUNCH-6). A Monaco szerkeszto a sajat
# buildunkbol jon (#150: frontend/src/features/workspace/monaco.ts), a betutipusok
# a @fontsource csomagokbol, ezert nincs kulso CDN-host.
#
#  - style-src 'unsafe-inline': a Monaco es a React futasidoben stilust szur be (style attributum, <style>).
#  - worker-src 'self' blob:: a Monaco web workere (a build fajlja, fejlesztesben blob).
#  - pixel.barion.com: a Barion Pixel szkriptje es merese (#139); csak hozzajarulas utan toltodik be.
#    Ha a Barion tovabbi gazdakat hasznal, a bongeszo konzoljan "Refused to ..." hiba jelenik meg;
#    ilyenkor docs/runbooks/csp.md szerint kell boviteni.
#  - media-src / img-src blob:, data:: videolejatszo es beagyazott ikonok.
#  - connect-src 'self': az API ugyanazon az originen van (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://pixel.barion.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://pixel.barion.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://pixel.barion.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Szigorubb jelolt (pl. 'unsafe-inline' nelkuli style-src) kiprobalasa: ugyanez a sor
# Content-Security-Policy-Report-Only nevvel az enforcing MELLETT is kuldheto, ez nem tilt:
# add_header Content-Security-Policy-Report-Only "<jelolt policy>" always;
