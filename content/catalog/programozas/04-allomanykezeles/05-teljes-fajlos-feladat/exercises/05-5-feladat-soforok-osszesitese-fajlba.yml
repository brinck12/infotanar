sample_solutions:
  python: |
    print("5. feladat")
    with open("ut.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    nevek = []
    utak = {}
    km = {}
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        nev = mezok[1]
        if nev not in utak:
            nevek.append(nev)
            utak[nev] = 0
            km[nev] = 0
        utak[nev] += 1
        km[nev] += int(mezok[2])
    with open("soforok.txt", "w", encoding="utf-8") as ki:
        ki.write("sofor\tutak\tkm\n")
        for nev in nevek:
            ki.write(nev + "\t" + str(utak[nev]) + "\t" + str(km[nev]) + "\n")
    with open("soforok.txt", encoding="utf-8") as f:
        for sor in f:
            print(sor.rstrip("\n"))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("5. feladat");
            string[] sorok = File.ReadAllLines("ut.txt");
            List<string> nevek = new List<string>();
            Dictionary<string, int> utak = new Dictionary<string, int>();
            Dictionary<string, int> km = new Dictionary<string, int>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                string nev = mezok[1];
                if (!utak.ContainsKey(nev))
                {
                    nevek.Add(nev);
                    utak[nev] = 0;
                    km[nev] = 0;
                }
                utak[nev]++;
                km[nev] += int.Parse(mezok[2]);
            }
            using (StreamWriter ki = new StreamWriter("soforok.txt"))
            {
                ki.WriteLine("sofor\tutak\tkm");
                foreach (string nev in nevek)
                {
                    ki.WriteLine(nev + "\t" + utak[nev] + "\t" + km[nev]);
                }
            }
            foreach (string sor in File.ReadAllLines("soforok.txt"))
            {
                Console.WriteLine(sor);
            }
        }
    }
