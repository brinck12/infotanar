slug: konyvek-kolcsonzesi-szama
title: Könyvek kölcsönzési száma
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Add meg minden könyvhöz (`cim`), hányszor kölcsönözték ki (`kolcsonzesek`). Azok a könyvek is szerepeljenek, amelyeket még senki nem kölcsönzött: náluk az érték 0.

    A `konyv` tábla:

    | `id` | `cim` | `szerzo` |
    |---|---|---|
    | 1 | Egri csillagok | Gardonyi Geza |
    | 2 | A Pal utcai fiuk | Molnar Ferenc |
    | 3 | Abel a rengetegben | Tamasi Aron |
    | 4 | Tuskevar | Fekete Istvan |

    A `kolcsonzes` tábla:

    | `id` | `konyv_id` | `olvaso` | `datum` |
    |---|---|---|---|
    | 1 | 1 | Kiss Anna | 2025-02-03 |
    | 2 | 2 | Nagy Bela | 2025-02-03 |
    | 3 | 1 | Toth Csaba | 2025-02-10 |
    | 4 | 2 | Kiss Anna | 2025-02-17 |

    Az eredmény ezekre az adatokra:

    | `cim` | `kolcsonzesek` |
    |---|---|
    | Egri csillagok | 2 |
    | A Pal utcai fiuk | 2 |
    | Abel a rengetegben | 0 |
    | Tuskevar | 0 |

    Tipp: a `COUNT(*)` a párosítatlan könyvre is 1-et adna (egy `NULL`-os sor); a `COUNT(kolcsonzes.id)` viszont a `NULL`-okat nem számolja.
starter_code:
  sql: |
    SELECT konyv.cim AS cim, COUNT() AS kolcsonzesek
    FROM konyv
    LEFT JOIN kolcsonzes ON
    GROUP BY ;
sample_solutions:
  sql: |
    SELECT konyv.cim AS cim, COUNT(kolcsonzes.id) AS kolcsonzesek
    FROM konyv
    LEFT JOIN kolcsonzes ON kolcsonzes.konyv_id = konyv.id
    GROUP BY konyv.id, konyv.cim;
tests:
  - stdin: |
      CREATE TABLE konyv (id INTEGER PRIMARY KEY, cim TEXT, szerzo TEXT);
      CREATE TABLE kolcsonzes (id INTEGER PRIMARY KEY, konyv_id INTEGER, olvaso TEXT, datum TEXT);
      INSERT INTO konyv VALUES (1, 'Egri csillagok', 'Gardonyi Geza');
      INSERT INTO konyv VALUES (2, 'A Pal utcai fiuk', 'Molnar Ferenc');
      INSERT INTO konyv VALUES (3, 'Abel a rengetegben', 'Tamasi Aron');
      INSERT INTO konyv VALUES (4, 'Tuskevar', 'Fekete Istvan');
      INSERT INTO kolcsonzes VALUES (1, 1, 'Kiss Anna', '2025-02-03');
      INSERT INTO kolcsonzes VALUES (2, 2, 'Nagy Bela', '2025-02-03');
      INSERT INTO kolcsonzes VALUES (3, 1, 'Toth Csaba', '2025-02-10');
      INSERT INTO kolcsonzes VALUES (4, 2, 'Kiss Anna', '2025-02-17');
    expected: |
      cim,kolcsonzesek
      Egri csillagok,2
      A Pal utcai fiuk,2
      Abel a rengetegben,0
      Tuskevar,0
