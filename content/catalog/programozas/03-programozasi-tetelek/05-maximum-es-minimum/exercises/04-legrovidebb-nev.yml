description: |
  ## Feladat

  Olvass be egy `N` számot, majd `N` darab nevet (soronként egyet). Írd ki a **legrövidebb nevet**! Ha több azonos hosszúságú legrövidebb név van, az elsőt add meg.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy név (ékezet nélkül, szóköz nélkül).

  ### Kimenet

  Egyetlen sorban a legrövidebb név.

  ### Példa

  Bemenet: `4`, majd `Eszter`, `Bela`, `Anna`, `Ede`. Kimenet: `Ede`

  Tipp: a kiválasztás nem csak számokra működik: itt a nevek hosszát (`len`, illetve `.Length`) hasonlítod össze, de a nevet kell eltárolnod.
