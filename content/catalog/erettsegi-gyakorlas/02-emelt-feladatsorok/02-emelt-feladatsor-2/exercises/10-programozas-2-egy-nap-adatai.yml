  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("2. feladat");
            Console.WriteLine("Adja meg a nap sorszamat:");
            int keresett = int.Parse(Console.ReadLine());
            Nap talalt = null;
            foreach (Nap n in napok)
            {
                if (n.Sorszam == keresett)
                {
                    talalt = n;
                }
            }
            if (talalt == null)
            {
                Console.WriteLine("Nincs ilyen nap.");
            }
            else
            {
                Console.WriteLine(talalt.Sorszam + ". nap: min " + talalt.Min + " C, max " + talalt.Max + " C, ingadozas " + (talalt.Max - talalt.Min) + " C");
            }
            Nap legnagyobb = napok[0];
            foreach (Nap n in napok)
            {
                if (n.Max - n.Min > legnagyobb.Max - legnagyobb.Min)
                {
                    legnagyobb = n;
                }
            }
            Console.WriteLine("Legnagyobb ingadozas: " + legnagyobb.Sorszam + ". nap (" + (legnagyobb.Max - legnagyobb.Min) + " C)");
        }
    }
