allowed_languages: [python, csharp]
description: |
  Egy könyv adatai három sorban érkeznek: a cím, az oldalszám és az ár (forintban). Tárold őket egy `Konyv` rekordban, majd írd ki négy sorban: `Cim: ...`, `Oldalszam: ...`, `Ar: ... Ft`, és az oldalankénti árat egész osztással: `Oldalankenti ar: ... Ft`.

  Példa bemenet:

  ```
  Egri csillagok
  520
  3990
  ```

  Kimenet:

  ```
  Cim: Egri csillagok
  Oldalszam: 520
  Ar: 3990 Ft
  Oldalankenti ar: 7 Ft
  ```

  Tipp: a rekord osztálya a kezdőkódban már megvan, neked a beolvasás és a kiírás hiányzik. Az oldalszám és az ár szám, ezért alakítsd át őket.
