sample_solutions:
  python: |
    n = int(input())
    a = []
    for _ in range(n):
        a.append(input())
    m = int(input())
    b = []
    for _ in range(m):
        b.append(input())
    metszet = 0
    for nev in a:
        if nev in b:
            metszet += 1
    print("Unio:", n + m - metszet)
    print("Metszet:", metszet)
    print("Csak az elsoben:", n - metszet)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<string> Beolvas()
        {
            int n = int.Parse(Console.ReadLine());
            var lista = new List<string>();
            for (int i = 0; i < n; i++)
            {
                lista.Add(Console.ReadLine());
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            int metszet = 0;
            foreach (string nev in a)
            {
                if (b.Contains(nev))
                {
                    metszet++;
                }
            }
            Console.WriteLine("Unio: " + (a.Count + b.Count - metszet));
            Console.WriteLine("Metszet: " + metszet);
            Console.WriteLine("Csak az elsoben: " + (a.Count - metszet));
        }
    }
