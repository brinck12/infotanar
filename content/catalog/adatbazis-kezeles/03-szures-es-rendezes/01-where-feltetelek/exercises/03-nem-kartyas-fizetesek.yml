slug: nem-kartyas-fizetesek
title: Nem kártyás fizetések
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A `<>` jelentése: nem egyenlő (MariaDB-ben a `!=` is használható).

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki azokat a fuvarokat (**id, rendszam, fizetes**), amelyeket **nem kártyával** (`fizetes` nem `kartya`) fizettek ki! A sorok sorrendje nem számít.

  Tipp: `WHERE fizetes <> 'kartya'`
starter_code:
  sql: |
    SELECT id, rendszam, fizetes
    FROM taxi
    WHERE ;
sample_solutions:
  sql: |
    SELECT id, rendszam, fizetes
    FROM taxi
    WHERE fizetes <> 'kartya';
