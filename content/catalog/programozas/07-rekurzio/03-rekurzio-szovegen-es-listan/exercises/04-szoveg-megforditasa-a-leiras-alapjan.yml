description: |
  Kódold le az alábbi mondatszerű rekurzív algoritmust, és írd ki az eredményét a beolvasott szóra.

  `Fordit(s)`:
  - Ha `s` hossza legfeljebb 1, akkor az eredmény maga `s`.
  - Különben az eredmény: `Fordit(s második karakterétől a végéig)` után írva `s` első karaktere.

  Bemenet: egy szó (kisbetűs, szóköz nélkül) vagy üres sor. Kimenet: a megfordított szó (üres bemenetnél üres sor).

  Példa: `kutya` esetén a kimenet `aytuk`.

  Tipp: Pythonban `s[1:]` a második karaktertől a végéig tartó rész, C#-ban `s.Substring(1)`. Ciklust és a beépített megfordítást ne használd.
