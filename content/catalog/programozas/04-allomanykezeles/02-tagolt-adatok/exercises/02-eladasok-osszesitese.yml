description: |
  Az `eladas.txt` fájl tabulátorral tagolt, az első sora fejléc (`termek`, `darab`, `ar`). Minden sor egy eladott terméket ír le: a termék nevét, az eladott darabszámot és az egységárat (forintban, egész szám). Írd ki az eladott darabok összegét és a teljes bevételt (darab szorozva árral, soronként, majd összeadva):

  ```
  Darab: 12
  Bevetel: 3450
  ```

  Tipp: a darabot és az árat is számmá kell alakítani, mielőtt szorzol vagy összeadsz.
