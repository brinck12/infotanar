slug: a-leggyengebb-nap
title: A leggyengébb nap
position: 2
kind: sql
level: emelt
difficulty: 4
published: false
allowed_languages:
- sql
description: |
  Az `eladas` tábla egy bolt eladásait tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `db` | egész, az eladott darabszám |
  | `egysegar` | egész (Ft) |

  Egy eladás értéke `db * egysegar`.

  Melyik napon volt a **legkisebb a bevétel**? Add meg a napot és az összeget (**datum, napi**)! Ha több nap is azonos legkisebb összeggel zár, mindegyik jelenjen meg. A sorok sorrendje nem számít.

  Tipp: a napi összegeket két helyen is ki kell számolni: a külső lekérdezés forrásaként, és a `MIN` kiszámításához egy `WHERE` feltételben álló allekérdezésben.
starter_code:
  sql: |
    SELECT datum, napi
    FROM (SELECT datum, SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS n
    WHERE napi = (SELECT MIN(napi) FROM (  ) AS m);
sample_solutions:
  sql: |
    SELECT datum, napi
    FROM (SELECT datum, SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS n
    WHERE napi = (SELECT MIN(napi) FROM (SELECT SUM(db * egysegar) AS napi FROM eladas GROUP BY datum) AS m);
