description: |
  ## Feladat

  Olvass be egyetlen nemnegatív egész számot, és írd ki a **számjegyeinek összegét**!

  ### Bemenet

  Egyetlen sorban egy nemnegatív egész szám (legfeljebb 18 jegyű).

  ### Kimenet

  Egyetlen sorban a számjegyek összege.

  ### Példa

  Bemenet: `2024`. Kimenet: `8`

  Tipp: olvasd be a számot szövegként, és menj végig a karakterein; minden karaktert alakíts számjeggyé, mielőtt összeadod.
