sample_solutions:
  python: |
    n = int(input())
    szamok = []
    for i in range(n):
        szamok.append(int(input()))
    parosak = []
    for szam in szamok:
        if szam % 2 == 0:
            parosak.append(szam)
    if len(parosak) == 0:
        print("Nincs paros szam")
    else:
        print("Darab:", len(parosak))
        for szam in parosak:
            print(szam)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> szamok = new List<int>();
            for (int i = 0; i < n; i++)
            {
                szamok.Add(int.Parse(Console.ReadLine()));
            }
            List<int> parosak = new List<int>();
            foreach (int szam in szamok)
            {
                if (szam % 2 == 0)
                {
                    parosak.Add(szam);
                }
            }
            if (parosak.Count == 0)
            {
                Console.WriteLine("Nincs paros szam");
            }
            else
            {
                Console.WriteLine("Darab: " + parosak.Count);
                foreach (int szam in parosak)
                {
                    Console.WriteLine(szam);
                }
            }
        }
    }
