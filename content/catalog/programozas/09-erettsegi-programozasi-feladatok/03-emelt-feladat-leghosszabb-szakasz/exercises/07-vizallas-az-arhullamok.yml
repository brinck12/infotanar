sample_solutions:
  python: |
    class Meres:
        def __init__(self, datum, allas):
            self.datum = datum
            self.allas = allas
    print("7. feladat")
    with open("vizallas.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    meresek = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        meresek.append(Meres(r[0], int(r[1])))
    print("Add meg a kuszobot (cm):")
    kuszob = int(input())
    hullamok = []
    i = 0
    while i < len(meresek):
        if meresek[i].allas > kuszob:
            j = i
            while j + 1 < len(meresek) and meresek[j + 1].allas > kuszob:
                j += 1
            if j - i + 1 >= 3:
                hullamok.append((i, j))
            i = j + 1
        else:
            i += 1
    print(f"Arhullamok szama: {len(hullamok)}")
    for a, b in hullamok:
        print(f"{meresek[a].datum} - {meresek[b].datum} ({b - a + 1} nap)")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("7. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            Console.WriteLine("Add meg a kuszobot (cm):");
            int kuszob = int.Parse(Console.ReadLine());
            List<int[]> hullamok = new List<int[]>();
            int k = 0;
            while (k < meresek.Count)
            {
                if (meresek[k].Allas > kuszob)
                {
                    int j = k;
                    while (j + 1 < meresek.Count && meresek[j + 1].Allas > kuszob)
                    {
                        j++;
                    }
                    if (j - k + 1 >= 3)
                    {
                        hullamok.Add(new int[] { k, j });
                    }
                    k = j + 1;
                }
                else
                {
                    k++;
                }
            }
            Console.WriteLine("Arhullamok szama: " + hullamok.Count);
            foreach (int[] h in hullamok)
            {
                Console.WriteLine(meresek[h[0]].Datum + " - " + meresek[h[1]].Datum + " (" + (h[1] - h[0] + 1) + " nap)");
            }
        }
    }
