description: "A `konyvek.txt` a könyvtár állományát tartalmazza, soronként egy könyvvel, pontosvesszővel elválasztva: `szerző;cím;kiadás éve;oldalszám`. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.\n\n**5. feladat.** Készítsen statisztikát a kiadás évtizede szerint! Az `5. feladat:` sor után írja ki növekvő sorrendben minden olyan évtizedet, amelyből van könyv, a minta formájában (`1990-es evek: 3`). Az évtized az évszám tízesre lefelé kerekített értéke.\n\nA mintafájlra a kimenet:\n\n```text\n5. feladat:\r\n1960-es evek: 2\r\n1970-es evek: 4\r\n1990-es evek: 1\r\n2000-es evek: 1\r\n2010-es evek: 2\r\n2020-es evek: 2\r\n```\n\nTipp: az évtized `ev // 10 * 10` (C#-ban `ev / 10 * 10`). Szótárral (`Dictionary`) számolhatod a darabszámokat, kiíráskor a kulcsokat rendezd."
