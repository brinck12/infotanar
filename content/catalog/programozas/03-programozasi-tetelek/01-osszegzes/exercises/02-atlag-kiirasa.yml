sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        szam = int(input())
        osszeg += szam
    print(f"{osszeg / n:.2f}")
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                osszeg += szam;
            }
            double atlag = osszeg / (double)n;
            Console.WriteLine(atlag.ToString("F2", CultureInfo.InvariantCulture));
        }
    }
