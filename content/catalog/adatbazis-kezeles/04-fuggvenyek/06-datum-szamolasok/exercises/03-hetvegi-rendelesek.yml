slug: hetvegi-rendelesek
title: Hétvégi rendelések
position: 3
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Listázd azoknak a rendeléseknek az azonosítóját (`id`), a vevő nevét (`vevo`) és a rendelés napjának angol nevét (`nap`), amelyeket szombaton vagy vasárnap adtak le.

    A `rendeles` tábla:

    | `id` | `vevo` | `rendelve` | `hatarido` | `szallitva` |
    |---|---|---|---|---|
    | 1 | Kiss Anna | 2025-03-03 | 2025-03-10 | 2025-03-07 |
    | 2 | Nagy Bela | 2025-03-08 | 2025-03-15 | 2025-03-17 |
    | 3 | Toth Csaba | 2025-02-26 | 2025-03-05 | 2025-03-05 |
    | 4 | Szabo Dora | 2025-12-20 | 2026-01-02 | 2026-01-03 |
    | 5 | Varga Fanni | 2025-03-09 | 2025-03-16 | 2025-03-12 |

    Az eredmény ezekre az adatokra:

    | `id` | `vevo` | `nap` |
    |---|---|---|
    | 2 | Nagy Bela | Saturday |
    | 4 | Szabo Dora | Saturday |
    | 5 | Varga Fanni | Sunday |

    Tipp: a `DAYOFWEEK(dátum)` vasárnapra 1-et, szombatra 7-et ad, a többi nap között hétfő 2 ... péntek 6. A `DAYNAME(dátum)` a nap angol nevét adja.
starter_code:
  sql: |
    SELECT id, vevo, DAYNAME(rendelve) AS nap
    FROM rendeles
    WHERE ...;
sample_solutions:
  sql: |
    SELECT id, vevo, DAYNAME(rendelve) AS nap
    FROM rendeles
    WHERE DAYOFWEEK(rendelve) IN (1, 7);
