description: |
  Írj háromrészes, érettségi stílusú programot. A bevitt értékek mind egész számok. A program kimenete (a bevitt értékek nem látszanak benne):

  ```
  1. feladat
  Hany jegye van (1-5)?
  2. feladat
  1. jegy (1-5): 2. jegy (1-5): ...
  3. feladat
  Az atlag: <átlag két tizedesjeggyel>
  ```

  - **1. feladat:** kérd be a jegyek számát a `Hany jegye van (1-5)? ` kérdéssel. Csak 1 és 5 közötti szám jó; különben írd ki a `Hibas adat!` sort (új sorral), és kérdezd meg újra.
  - **2. feladat:** kérd be a jegyeket egyenként a `<sorszám>. jegy (1-5): ` kérdéssel (a sorszám 1-től indul). A jegy is csak 1 és 5 közötti lehet; hibás adatnál ugyanúgy `Hibas adat!` és újrakérdezés, a kérdést újra kiírva.
  - **3. feladat:** írd ki a jegyek átlagát: `Az atlag: <érték>` két tizedesjegyre kerekítve.

  Példa: a `3`, `5`, `4`, `4` bemenetre (külön sorokban) a kimenet:

  ```
  1. feladat
  Hany jegye van (1-5)? 2. feladat
  1. jegy (1-5): 2. jegy (1-5): 3. jegy (1-5): 3. feladat
  Az atlag: 4.33
  ```

  Tipp: a "kérdez, ellenőriz, újrakérdez" rész egy `beker(kerdes, also, felso)` függvénybe kerül, amelyet mindkét feladatrész használ. C#-ban az átlag kiírásához `CultureInfo.InvariantCulture` kell.
