sample_solutions:
  python: |
    n = int(input())
    a = []
    for _ in range(n):
        a.append(input())
    m = int(input())
    b = []
    for _ in range(m):
        b.append(input())
    kozos = []
    for nev in a:
        if nev in b:
            kozos.append(nev)
    print("Kozos tagok:", len(kozos))
    for nev in kozos:
        print(nev)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<string> Beolvas()
        {
            int n = int.Parse(Console.ReadLine());
            var lista = new List<string>();
            for (int i = 0; i < n; i++)
            {
                lista.Add(Console.ReadLine());
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            var kozos = new List<string>();
            foreach (string nev in a)
            {
                if (b.Contains(nev))
                {
                    kozos.Add(nev);
                }
            }
            Console.WriteLine("Kozos tagok: " + kozos.Count);
            foreach (string nev in kozos)
            {
                Console.WriteLine(nev);
            }
        }
    }
