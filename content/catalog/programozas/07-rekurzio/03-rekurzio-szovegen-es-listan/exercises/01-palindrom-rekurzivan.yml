sample_solutions:
  python: |
    def palindrom(s):
        if len(s) <= 1:
            return True
        if s[0] != s[-1]:
            return False
        return palindrom(s[1:-1])

    print("igen" if palindrom(input()) else "nem")
  csharp: |
    using System;

    class Program
    {
        static bool Palindrom(string s)
        {
            if (s.Length <= 1)
            {
                return true;
            }
            if (s[0] != s[s.Length - 1])
            {
                return false;
            }
            return Palindrom(s.Substring(1, s.Length - 2));
        }

        static void Main()
        {
            Console.WriteLine(Palindrom(Console.ReadLine()) ? "igen" : "nem");
        }
    }
