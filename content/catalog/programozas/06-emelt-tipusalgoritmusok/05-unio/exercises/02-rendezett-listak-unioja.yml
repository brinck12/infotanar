description: |
  Két **szigorúan növekvően rendezett** számsorozat érkezik négy sorban: az első elemszáma (N, legalább 1), maga a sorozat, a második elemszáma (M, legalább 1), majd az is. Fésüld össze őket két mutatóval úgy, hogy az unió növekvő sorrendben, ismétlődés nélkül jöjjön létre: `Unio: ...`. Írd ki, hány összehasonlítást végeztél: `Osszehasonlitas: k`. Összehasonlításnak a fő ciklus minden lépését számítjuk (a maradék elemek átmásolása nem számít bele).

  Példa bemenet:

  ```
  3
  1 3 5
  3
  2 3 6
  ```

  Kimenet:

  ```
  Unio: 1 2 3 5 6
  Osszehasonlitas: 4
  ```

  Tipp: a fő ciklus addig megy, amíg mindkét sorozatban van elem; utána a megmaradt elemeket másold át.
