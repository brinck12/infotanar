# Biztonsagi fejlecek (#128). Az `always` miatt a hibavalaszokra is rakerulnek.

# Fel evig csak HTTPS. Az elso eles tesztnel erdemes rovid ertekkel (pl. 300)
# kezdeni: a bongeszok a megadott ideig nem engednek vissza HTTP-re.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Egyelore csak jelent (Report-Only), nem tilt: a megsertesek a bongeszo
# konzoljan latszanak. Elesitesi sorrend: (1) a Monaco sajat originrol jon
# (#150), ekkor a cdn.jsdelivr.net sorok torolhetok; (2) nincs tobb jelentett
# megsertes; (3) a fejlec neve Content-Security-Policy-ra cserelheto.
#
#  - cdn.jsdelivr.net: a Monaco szerkeszto jelenleg innen toltodik (script, stilus, ikon-font).
#  - style-src 'unsafe-inline': a Monaco futasidoben szur be stilusokat.
#  - worker-src blob:: a Monaco web workerei.
#  - pixel.barion.com: a Barion Pixel szkriptje es a meresi kepei/keresei (#139).
#  - media-src / img-src blob:, data:: videolejatszo es beagyazott ikonok.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://pixel.barion.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://pixel.barion.com; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://pixel.barion.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
