description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Számold meg, hány szám osztható **3-mal vagy 5-tel, de 15-tel nem**!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy pozitív egész szám.

  ### Kimenet

  Egyetlen sorban a keresett számok darabszáma.

  ### Példa

  Bemenet: `6`, majd `3`, `5`, `15`, `7`, `9`, `10`. Kimenet: `4`

  Tipp: a `3`, `5`, `9`, `10` felel meg; a `15` osztható 15-tel, a `7` pedig egyikkel sem. Az összetett feltételben használd az `and`/`or` (C#-ban `&&`/`||`) műveleteket, és tegyél zárójelet, ahol kell.
