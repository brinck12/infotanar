  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Csapat
    {
        public string Nev;
        public string Varos;
        public int Megoldott;
        public int Buntetes;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("1. feladat");
            string[] sorok = File.ReadAllLines("csapatok.txt");
            List<Csapat> csapatok = new List<Csapat>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Csapat c = new Csapat();
                c.Nev = r[0];
                c.Varos = r[1];
                c.Megoldott = int.Parse(r[2]);
                c.Buntetes = int.Parse(r[3]);
                csapatok.Add(c);
            }
            Console.WriteLine("Csapatok szama: " + csapatok.Count);
            Csapat e = csapatok[0];
            Csapat u = csapatok[csapatok.Count - 1];
            Console.WriteLine("Elso csapat: " + e.Nev + " (" + e.Varos + ")");
            Console.WriteLine("Utolso csapat: " + u.Nev + " (" + u.Varos + ")");
        }
    }
