sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        szam = int(input())
        osszeg += szam
    print(osszeg)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                osszeg += szam;
            }
            Console.WriteLine(osszeg);
        }
    }
