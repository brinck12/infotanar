sample_solutions:
  python: |
    def maximum(lista, i):
        if i == len(lista) - 1:
            return lista[i]
        return max(lista[i], maximum(lista, i + 1))

    n = int(input())
    lista = []
    for _ in range(n):
        lista.append(int(input()))
    print(maximum(lista, 0))
  csharp: |
    using System;

    class Program
    {
        static int Maximum(int[] lista, int i)
        {
            if (i == lista.Length - 1)
            {
                return lista[i];
            }
            return Math.Max(lista[i], Maximum(lista, i + 1));
        }

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] lista = new int[n];
            for (int i = 0; i < n; i++)
            {
                lista[i] = int.Parse(Console.ReadLine());
            }
            Console.WriteLine(Maximum(lista, 0));
        }
    }
