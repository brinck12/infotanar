sample_solutions:
  python: |
    print("1. feladat")
    with open("ut.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    osszes = 0
    for sor in sorok[1:]:
        osszes += int(sor.split("\t")[2])
    print("Utak szama:", len(sorok) - 1)
    print("Osszes km:", osszes)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("1. feladat");
            string[] sorok = File.ReadAllLines("ut.txt");
            int osszes = 0;
            for (int i = 1; i < sorok.Length; i++)
            {
                osszes += int.Parse(sorok[i].Split('\t')[2]);
            }
            Console.WriteLine("Utak szama: " + (sorok.Length - 1));
            Console.WriteLine("Osszes km: " + osszes);
        }
    }
