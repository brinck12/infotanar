  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Indulas
    {
        public string Jarat;
        public string Cel;
        public int Tav;
        public int Nap;
        public string Ido;
        public int Utas;
        public int Keses;

        public Indulas(string sor)
        {
            string[] r = sor.Split(';');
            Jarat = r[0];
            Cel = r[1];
            Tav = int.Parse(r[2]);
            Nap = int.Parse(r[3]);
            Ido = r[4];
            Utas = int.Parse(r[5]);
            Keses = int.Parse(r[6]);
        }
    }

    class Program
    {
        static int Legnagyobb(int[] t, int also, int felso)
        {
            if (also == felso)
            {
                return also;
            }
            int kozep = (also + felso) / 2;
            int bal = Legnagyobb(t, also, kozep);
            int jobb = Legnagyobb(t, kozep + 1, felso);
            if (t[jobb] > t[bal])
            {
                return jobb;
            }
            return bal;
        }

        static void Main()
        {
            List<Indulas> indulasok = new List<Indulas>();
            foreach (string sor in File.ReadAllLines("indulasok.txt"))
            {
                indulasok.Add(new Indulas(sor));
            }
            int[] napi = new int[31];
            foreach (Indulas i in indulasok)
            {
                napi[i.Nap] += i.Utas;
            }
            int nap = Legnagyobb(napi, 1, 30);
            Console.WriteLine("5. feladat: A legforgalmasabb nap: " + nap + ". nap, " + napi[nap] + " utas.");
        }
    }
