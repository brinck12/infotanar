slug: a-taxi-fuvarjai
title: A taxi fuvarjai
position: 1
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Egy taxitársaság minden megtett fuvarját egy táblában rögzíti. Egy rekord egy fuvar.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Olvasd ki a `taxi` tábla teljes tartalmát: minden rekordot, minden mezővel! A sorok sorrendje nem számít.

  Tipp: ugyanaz a lekérdezés, mint az előző feladatban, csak a tábla neve más.
starter_code:
  sql: |
    SELECT
    FROM taxi;
sample_solutions:
  sql: |
    SELECT *
    FROM taxi;
