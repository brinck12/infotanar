description: |
  A `vetitesek.txt` a mozi vetítéseit tartalmazza, soronként egy vetítéssel, pontosvesszővel elválasztva: `cím;műfaj;játékidő percben;kezdés;eladott jegyek;jegyár`. A kezdés `ÓÓ:PP` alakú. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **5. feladat.** Készítsen statisztikát műfajonként! Írja ki a `5. feladat:` sort, alá műfajonként egy sort `műfaj: vetítések száma db, összes jegy db, átlagos jegyár Ft` alakban. A műfajok a fájlban **először előforduló** sorrendben következzenek, az átlagos jegyárat (a vetítések jegyárainak átlaga) egy tizedesjegyre kerekítve írja ki.

  A mintafájlra a kimenet:

  ```text
  5. feladat:
  animacio: 5 db, 389 jegy, atlagos jegyar 2180.0 Ft
  akcio: 5 db, 307 jegy, atlagos jegyar 2100.0 Ft
  scifi: 3 db, 130 jegy, atlagos jegyar 1933.3 Ft
  drama: 1 db, 114 jegy, atlagos jegyar 2200.0 Ft
  ```

  Tipp: tartson egy listát a már látott műfajokról; minden műfajra külön számolja a darabszámot, a jegyeket és a jegyárak összegét. A kerekítést formázással végezze (`{:.1f}` Pythonban, `ToString("0.0", CultureInfo.InvariantCulture)` C#-ban).
