description: |
  Az első sorban `N` áll (`0 ≤ N ≤ 100`), a következő `N` sorban egy-egy egész szám. Írd ki az összegüket **rekurzív** függvénnyel (ciklus csak a beolvasáshoz kell). Üres lista összege 0.

  Példa: `3`, majd `4`, `1`, `5` esetén a kimenet `10`.

  Tipp: az `osszeg(lista, i)` az `i`-edik elemtől a végéig összegez; az alapeset az `i == len(lista)`.
