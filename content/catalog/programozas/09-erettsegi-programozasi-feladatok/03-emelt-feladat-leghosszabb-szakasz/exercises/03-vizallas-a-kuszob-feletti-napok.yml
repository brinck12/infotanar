  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;
    using System.Linq;

    class Meres
    {
        public string Datum;
        public int Allas;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("3. feladat");
            string[] sorok = File.ReadAllLines("vizallas.txt");
            List<Meres> meresek = new List<Meres>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Meres m = new Meres();
                m.Datum = r[0];
                m.Allas = int.Parse(r[1]);
                meresek.Add(m);
            }
            Console.WriteLine("Add meg a kuszobot (cm):");
            int kuszob = int.Parse(Console.ReadLine());
            int db = 0;
            string elso = null;
            foreach (Meres m in meresek)
            {
                if (m.Allas > kuszob)
                {
                    db++;
                    if (elso == null)
                    {
                        elso = m.Datum;
                    }
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nem volt kuszob feletti nap.");
            }
            else
            {
                Console.WriteLine("Kuszob feletti napok: " + db);
                Console.WriteLine("Elso ilyen nap: " + elso);
            }
        }
    }
