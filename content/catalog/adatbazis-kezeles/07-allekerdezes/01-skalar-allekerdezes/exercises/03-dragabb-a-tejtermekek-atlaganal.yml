slug: dragabb-a-tejtermekek-atlaganal
title: Drágább a tejtermékek átlagánál
position: 2
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  A `termek` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `kategoria` | szöveg |
  | `ar` | egész (Ft) |
  | `keszlet` | egész (darab) |

  Listázd ki azokat a termékeket (**nev, ar**), amelyek **drágábbak a `tej` kategóriájú termékek átlagos áránál**, bármelyik kategóriába is tartoznak! Az allekérdezésben szűrj a kategóriára. A sorok sorrendje nem számít.

  Tipp: az allekérdezésnek saját `WHERE` feltétele is lehet: `(SELECT AVG(ar) FROM termek WHERE kategoria = 'tej')`.
starter_code:
  sql: |
    SELECT nev, ar
    FROM termek
    WHERE ar > (SELECT AVG(ar) FROM termek WHERE );
sample_solutions:
  sql: |
    SELECT nev, ar
    FROM termek
    WHERE ar > (SELECT AVG(ar) FROM termek WHERE kategoria = 'tej');
