slug: atlag-es-pontvaltozas
title: Átlag és pontváltozás
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Listázd minden diák nevét (`nev`), az átlagát egy tizedesre kerekítve (`kerekitett`), valamint azt, hogy a két dolgozat között hány ponttal változott az eredménye, előjel nélkül (`valtozas`). A változás a `pont_most` és a `pont_elozo` különbségének abszolút értéke.

    A `diak` tábla:

    | `id` | `nev` | `email` | `osztaly` | `atlag` | `pont_elozo` | `pont_most` |
    |---|---|---|---|---|---|---|
    | 1 | Kiss Anna | Kiss.Anna@SULI.hu | 10.A | 4.567 | 62 | 75 |
    | 2 | Nagy Bela | Nagy.Bela@SULI.hu | 10.B | 3.842 | 70 | 66 |
    | 3 | Toth Csaba | Toth.Csaba@SULI.hu | 10.A | 3.125 | 55 | 41 |
    | 4 | Szabo Dora | Szabo.Dora@SULI.hu | 11.A | 4.918 | 80 | 92 |

    Az eredmény ezekre az adatokra:

    | `nev` | `kerekitett` | `valtozas` |
    |---|---|---|
    | Kiss Anna | 4.6 | 13 |
    | Nagy Bela | 3.8 | 4 |
    | Toth Csaba | 3.1 | 14 |
    | Szabo Dora | 4.9 | 12 |

    Tipp: `ROUND(szam, 1)` egy tizedesre kerekít; az `ABS(...)` az előjelet elhagyja.
starter_code:
  sql: |
    SELECT nev,
      AS kerekitett,
      AS valtozas
    FROM diak;
sample_solutions:
  sql: |
    SELECT nev, ROUND(atlag, 1) AS kerekitett, ABS(pont_most - pont_elozo) AS valtozas
    FROM diak;
