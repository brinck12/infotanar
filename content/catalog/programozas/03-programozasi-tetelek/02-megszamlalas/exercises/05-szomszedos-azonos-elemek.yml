description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Számold meg, **hányszor egyezik meg egy szám az előtte álló számmal**!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a darabszám.

  ### Példa

  Bemenet: `6`, majd `1`, `1`, `2`, `2`, `2`, `3`. Kimenet: `3`

  Tipp: tárold el az előző számot egy külön változóban, és minden lépés végén frissítsd. Az első számnak nincs előzője, ezért ott ne hasonlíts.
