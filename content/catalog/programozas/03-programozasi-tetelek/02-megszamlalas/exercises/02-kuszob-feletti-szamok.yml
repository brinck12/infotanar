description: |
  ## Feladat

  Olvass be egy `N` és egy `K` egész számot, majd `N` darab egész számot. Írd ki, **hány szám nagyobb `K`-nál**!

  ### Bemenet

  - Az első sorban az `N` egész szám (`1 ≤ N ≤ 100`).
  - A második sorban a `K` küszöbérték.
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a `K`-nál szigorúan nagyobb számok darabszáma.

  ### Példa

  Bemenet: `5`, `10`, majd `4`, `12`, `10`, `30`, `11`. Kimenet: `3`

  Tipp: a `10` nem nagyobb 10-nél, ezért nem számít bele.
