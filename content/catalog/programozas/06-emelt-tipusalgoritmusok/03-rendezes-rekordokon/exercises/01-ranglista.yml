sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Versenyzo:
        nev: str
        pont: int

    n = int(input())
    lista = []
    for _ in range(n):
        resz = input().split(";")
        lista.append(Versenyzo(resz[0], int(resz[1])))
    rang = sorted(lista, key=lambda v: v.pont, reverse=True)
    for v in rang:
        print(v.nev + ": " + str(v.pont))
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Linq;

    class Versenyzo
    {
        public string Nev;
        public int Pont;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var lista = new List<Versenyzo>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                lista.Add(new Versenyzo { Nev = resz[0], Pont = int.Parse(resz[1]) });
            }
            var rang = lista.OrderByDescending(v => v.Pont).ToList();
            foreach (var v in rang)
            {
                Console.WriteLine(v.Nev + ": " + v.Pont);
            }
        }
    }
