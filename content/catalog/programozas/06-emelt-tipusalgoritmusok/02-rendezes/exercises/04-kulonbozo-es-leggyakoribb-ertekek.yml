slug: kulonbozo-es-leggyakoribb-ertekek
title: "Különböző és leggyakoribb értékek"
position: 3
kind: code
level: emelt
difficulty: 4
published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Írd ki, hány különböző érték szerepel a sorozatban (`Kulonbozo: ...`), és melyik érték fordul elő a legtöbbször, hányszor (`Leggyakoribb: ertek (db)`). Ha több érték is a legtöbbször fordul elő, a kisebbet írd ki.

  Példa bemenet:

  ```
  7
  3 1 3 2 1 3 2
  ```

  Kimenet:

  ```
  Kulonbozo: 3
  Leggyakoribb: 3 (3)
  ```

  Tipp: rendezd a számokat (beépített rendezéssel), így az egyforma elemek szakaszokat alkotnak. Egy menetben megszámolhatod a szakaszokat és a hosszukat.
starter_code:
