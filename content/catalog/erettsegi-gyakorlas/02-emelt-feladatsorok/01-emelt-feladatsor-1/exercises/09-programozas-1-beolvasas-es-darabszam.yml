    class Ut:
        def __init__(self, sor):
            r = sor.split(";")
            self.bicikli = r[0]
            self.nap = int(r[1])
            self.indulas = r[2]
            self.erkezes = r[3]
            self.tav = int(r[4])

        def perc(self):
            i = self.indulas.split(":")
            e = self.erkezes.split(":")
            return (int(e[0]) * 60 + int(e[1])) - (int(i[0]) * 60 + int(i[1]))


    with open("utak.txt", encoding="utf-8") as f:
        utak = [Ut(sor) for sor in f.read().splitlines()]
