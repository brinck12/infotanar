sample_solutions:
  python: |
    print("5. feladat")
    with open("homerseklet.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = int(sorok[0])
    napok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        napok.append((int(r[0]), int(r[1]), int(r[2]), int(r[3])))
    sorok_ki = []
    for nap in napok:
        if nap[1] < 0:
            sorok_ki.append(str(nap[0]) + "\t" + str(nap[1]))
    with open("fagyos.txt", "w", encoding="utf-8") as f:
        for s in sorok_ki:
            f.write(s + "\n")
    print("fagyos.txt tartalma:")
    with open("fagyos.txt", encoding="utf-8") as f:
        for s in f.read().splitlines():
            print(s)
    print("Osszesen:", len(sorok_ki), "nap")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("5. feladat");
            string[] sorok = File.ReadAllLines("homerseklet.txt");
            int db = int.Parse(sorok[0]);
            int[][] napok = new int[db][];
            for (int i = 0; i < db; i++)
            {
                string[] r = sorok[i + 1].Split('\t');
                napok[i] = new int[] { int.Parse(r[0]), int.Parse(r[1]), int.Parse(r[2]), int.Parse(r[3]) };
            }
            List<string> ki = new List<string>();
            foreach (int[] nap in napok)
            {
                if (nap[1] < 0)
                {
                    ki.Add(nap[0] + "\t" + nap[1]);
                }
            }
            File.WriteAllLines("fagyos.txt", ki);
            Console.WriteLine("fagyos.txt tartalma:");
            foreach (string s in File.ReadAllLines("fagyos.txt"))
            {
                Console.WriteLine(s);
            }
            Console.WriteLine("Osszesen: " + ki.Count + " nap");
        }
    }
