slug: az-osszes-diak
title: Az összes diák
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  Egy iskola nyilvántartása egyetlen táblában tárolja a diákokat. Egy sor egy diák (rekord), egy oszlop egy adat a diákról (mező).

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Írj lekérdezést, amely a `diak` tábla **minden sorát és minden oszlopát** kiolvassa! A sorok sorrendje nem számít.

  Tipp: a `*` jelentése: az összes oszlop.
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT *
    FROM diak;
