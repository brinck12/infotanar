slug: keszlet-allapota
title: Készlet állapota
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    Listázd a termékek nevét (`nev`) és a készlet állapotát (`allapot`): ha a készlet 0, az állapot `elfogyott`; ha 1 és 4 között van, `fogyoban`; ha legalább 5, `raktaron`.

    A `termek` tábla:

    | `id` | `nev` | `ar` | `keszlet` |
    |---|---|---|---|
    | 1 | Fuzet | 250 | 40 |
    | 2 | Hatizsak | 8900 | 0 |
    | 3 | Toll | 990 | 3 |
    | 4 | Szamologep | 4500 | 12 |

    Az eredmény ezekre az adatokra:

    | `nev` | `allapot` |
    |---|---|
    | Fuzet | raktaron |
    | Hatizsak | elfogyott |
    | Toll | fogyoban |
    | Szamologep | raktaron |

    Tipp: itt is számít a sorrend: ha a `keszlet < 5` ág állna elöl, a 0 is oda esne.
starter_code:
  sql: |
    SELECT nev,
      CASE
        -- ide jönnek az ágak
      END AS allapot
    FROM termek;
sample_solutions:
  sql: |
    SELECT nev,
      CASE
        WHEN keszlet = 0 THEN 'elfogyott'
        WHEN keszlet < 5 THEN 'fogyoban'
        ELSE 'raktaron'
      END AS allapot
    FROM termek;
tests:
  - stdin: |
      CREATE TABLE termek (id INTEGER PRIMARY KEY, nev TEXT, ar INTEGER, keszlet INTEGER);
      INSERT INTO termek VALUES (1, 'Fuzet', 250, 40);
      INSERT INTO termek VALUES (2, 'Hatizsak', 8900, 0);
      INSERT INTO termek VALUES (3, 'Toll', 990, 3);
      INSERT INTO termek VALUES (4, 'Szamologep', 4500, 12);
    expected: |
      nev,allapot
      Fuzet,raktaron
      Hatizsak,elfogyott
      Toll,fogyoban
      Szamologep,raktaron
