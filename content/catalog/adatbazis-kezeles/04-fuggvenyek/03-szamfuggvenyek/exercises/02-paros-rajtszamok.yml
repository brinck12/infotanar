      INSERT INTO versenyzo VALUES (2, 'Nagy Bela');
      INSERT INTO versenyzo VALUES (6, 'Horvath Erik');
      INSERT INTO versenyzo VALUES (8, 'Ho Eva');
      INSERT INTO versenyzo VALUES (10, 'Bo Li');
    expected: |
