slug: tobb-sor-egyszerre
title: Több sor egyszerre
position: 2
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  Egyetlen `INSERT` utasítással vedd fel az alábbi három diákot (az `id`-t hagyd az adatbázisra): Toth Csaba (`9.B`, 55 pont), Szabo Dora (`9.B`, 91 pont), Varga Emil (`10.A`, 68 pont).

  Az ellenőrző lekérdezés most a darabszámot és a pontok összegét mutatja.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: a `VALUES` után több zárójeles sort írhatsz vesszővel elválasztva.
starter_code:
  sql: |
    -- Ide írd az INSERT utasítást.

    SELECT COUNT(*) AS db, SUM(pont) AS osszeg FROM diak;
sample_solutions:
  sql: |
    INSERT INTO diak (nev, osztaly, pont) VALUES
    ('Toth Csaba', '9.B', 55),
    ('Szabo Dora', '9.B', 91),
    ('Varga Emil', '10.A', 68);

    SELECT COUNT(*) AS db, SUM(pont) AS osszeg FROM diak;
