sample_solutions:
  python: |
    n = int(input())
    db = 0
    for _ in range(n):
        szam = int(input())
        if szam % 2 == 0:
            db += 1
    print(db)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int db = 0;
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam % 2 == 0)
                {
                    db++;
                }
            }
            Console.WriteLine(db);
        }
    }
