slug: ideiglenes-tablak-eldobasa
title: Ideiglenes táblák eldobása
position: 3
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  Az adatbázisban négy tábla van: `diak`, `naplo`, `tmp_import` és `tmp_regi`. Takarítsd ki az adatbázist ebben a sorrendben:

  1. Töröld a `tmp_regi` táblát **teljesen**, a szerkezetével együtt (`DROP TABLE`).
  2. Töröld a `tmp_import` táblát is, majd hozz létre egy új, üres `tmp_import` táblát `id INT AUTO_INCREMENT PRIMARY KEY` és `adat VARCHAR(50)` oszlopokkal, `ENGINE=InnoDB` motorral. (A `CREATE TABLE` csak akkor sikerül, ha a régi már nincs meg: így derül ki, hogy tényleg eldobtad.)
  3. Ürítsd ki a `naplo` táblát úgy, hogy a tábla megmaradjon (`TRUNCATE TABLE`).
  4. A `diak` táblához ne nyúlj.

  Az ellenőrző lekérdezés a három tábla sorainak számát mutatja.

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `DROP TABLE tabla_neve;` – a tábla és minden adata végleg eltűnik. A `TRUNCATE TABLE tabla_neve;` csak a sorokat törli, a tábla marad.
starter_code:
  sql: |
    -- Ide írd a DROP TABLE, CREATE TABLE és TRUNCATE TABLE utasításokat.

    SELECT (SELECT COUNT(*) FROM diak) AS diakok,
           (SELECT COUNT(*) FROM naplo) AS naplo_sorok,
           (SELECT COUNT(*) FROM tmp_import) AS import_sorok;
sample_solutions:
  sql: |
    DROP TABLE tmp_regi;
    DROP TABLE tmp_import;

    CREATE TABLE tmp_import (
      id INT AUTO_INCREMENT PRIMARY KEY,
      adat VARCHAR(50)
    ) ENGINE=InnoDB;

    TRUNCATE TABLE naplo;

    SELECT (SELECT COUNT(*) FROM diak) AS diakok,
           (SELECT COUNT(*) FROM naplo) AS naplo_sorok,
           (SELECT COUNT(*) FROM tmp_import) AS import_sorok;
