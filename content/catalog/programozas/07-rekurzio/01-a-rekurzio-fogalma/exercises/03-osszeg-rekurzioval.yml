sample_solutions:
  python: |
    def osszeg(n):
        if n == 0:
            return 0
        return n + osszeg(n - 1)

    print(osszeg(int(input())))
  csharp: |
    using System;

    class Program
    {
        static int Osszeg(int n)
        {
            if (n == 0)
            {
                return 0;
            }
            return n + Osszeg(n - 1);
        }

        static void Main()
        {
            Console.WriteLine(Osszeg(int.Parse(Console.ReadLine())));
        }
    }
