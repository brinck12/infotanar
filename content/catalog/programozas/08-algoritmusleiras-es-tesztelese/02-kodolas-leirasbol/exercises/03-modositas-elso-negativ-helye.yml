sample_solutions:
  python: |
    n = int(input())
    lista = []
    for _ in range(n):
        lista.append(int(input()))
    i = 1
    while i <= n and lista[i - 1] >= 0:
        i = i + 1
    if i <= n:
        print(i)
    else:
        print(0)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int[] lista = new int[n];
            for (int k = 0; k < n; k++)
            {
                lista[k] = int.Parse(Console.ReadLine());
            }
            int i = 1;
            while (i <= n && lista[i - 1] >= 0)
            {
                i = i + 1;
            }
            if (i <= n)
            {
                Console.WriteLine(i);
            }
            else
            {
                Console.WriteLine(0);
            }
        }
    }
