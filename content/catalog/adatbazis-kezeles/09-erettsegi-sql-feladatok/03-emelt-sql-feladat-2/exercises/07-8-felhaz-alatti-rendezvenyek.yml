slug: 8-felhaz-alatti-rendezvenyek
title: 8. Félház alatti rendezvények
position: 6
kind: sql
level: emelt
difficulty: 5
published: false
allowed_languages:
- sql
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `helyszin` | szöveg (város) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `kapacitas` | egész, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendezveny_id` | egész, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | szöveg, a vásárló neve |
  | `kategoria` | szöveg: `allo`, `ules` vagy `vip` |
  | `ar` | egész, a jegy ára forintban |
  | `vasarlas` | szöveg, a vásárlás napja (ÉÉÉÉ-HH-NN) |

  **8. feladat.** Adja meg lekérdezéssel azoknak a rendezvényeknek a nevét és kapacitását (**nev, kapacitas**), amelyekre az **eladott jegyek száma nem éri el a kapacitás felét** (az eladott jegyek kétszerese kisebb a kapacitásnál)! Azok a rendezvények is szerepeljenek, amelyekre **egyetlen jegyet sem adtak el**.
starter_code:
  sql: |
    SELECT nev, kapacitas
    FROM rendezveny
    WHERE (SELECT COUNT(*) FROM jegy WHERE ) * 2 < ;
sample_solutions:
  sql: |
    SELECT nev, kapacitas
    FROM rendezveny
    WHERE (SELECT COUNT(*) FROM jegy WHERE jegy.rendezveny_id = rendezveny.id) * 2 < kapacitas;
