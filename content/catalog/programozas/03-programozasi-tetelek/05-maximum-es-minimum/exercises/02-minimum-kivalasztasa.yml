sample_solutions:
  python: |
    n = int(input())
    legkisebb = int(input())
    for _ in range(n - 1):
        szam = int(input())
        if szam < legkisebb:
            legkisebb = szam
    print(legkisebb)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int legkisebb = int.Parse(Console.ReadLine());
            for (int i = 1; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam < legkisebb)
                {
                    legkisebb = szam;
                }
            }
            Console.WriteLine(legkisebb);
        }
    }
