allowed_languages: [python, csharp]
description: |
  A Caesar-kód úgy titkosít, hogy minden betűt az ábécében `k` hellyel eltolva ír le; az ábécé végén körbefordul (`z` után ismét `a` jön). A szóközök változatlanok maradnak.

  Olvass be két sort: az első az eltolás mértéke (`k`, 0 és 25 közötti egész), a második a titkosítandó szöveg, amely csak az angol ábécé kisbetűiből és szóközökből áll. Írd ki a titkosított szöveget.

  Példa: a bemenet `3` és `abc xyz`, a kimenet `def abc`.

  Tipp: legyen egy `abc` nevű szöveg az ábécé 26 betűjével. Egy betű helyét a keresés adja; az új hely `(hely + k) % 26`. A szóközt, amely nincs az ábécében (a keresés `-1`), változatlanul másold át.
