description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki az **első negatív szám sorszámát** (az első szám sorszáma 1)! Ha nincs negatív szám, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a sorszám, vagy `NINCS`.

  ### Példa

  Bemenet: `4`, majd `5`, `3`, `-1`, `-2`. Kimenet: `3`

  Tipp: keresésnél lehet, hogy nincs találat. Legyen a hely kezdetben 0, ami "még nem találtam" jelentésű, és a végén ez alapján döntsd el, mit írj ki.
