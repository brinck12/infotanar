description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a számok **átlagát két tizedesjegyre kerekítve**!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban az átlag, tizedesponttal és pontosan két tizedesjeggyel.

  ### Példa

  Bemenet: `3`, majd `4`, `5`, `8`. Kimenet: `5.67`

  Tipp: az átlag az összeg osztva a darabszámmal. Előbb összegezz, és csak a végén oszd el; a kiíráshoz használd a kerekítő formázást (`:.2f`, illetve `F2`).
