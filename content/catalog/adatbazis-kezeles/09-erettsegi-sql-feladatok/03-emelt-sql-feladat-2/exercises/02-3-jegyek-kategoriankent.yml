slug: 3-jegyek-kategoriankent
title: 3. Jegyek kategóriánként
position: 1
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `helyszin` | szöveg (város) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `kapacitas` | egész, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendezveny_id` | egész, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | szöveg, a vásárló neve |
  | `kategoria` | szöveg: `allo`, `ules` vagy `vip` |
  | `ar` | egész, a jegy ára forintban |
  | `vasarlas` | szöveg, a vásárlás napja (ÉÉÉÉ-HH-NN) |

  **3. feladat.** Adja meg lekérdezéssel, hogy összesen hány jegyet adtak el, ezek közül hány volt `vip` és hány `allo` kategóriájú! Az eredmény három oszlop legyen ebben a sorrendben: `osszes`, `vip`, `allo`. A feltételes számláláshoz használja a `CASE` kifejezést.
starter_code:
  sql: |
    SELECT COUNT(*) AS osszes,
           SUM(CASE WHEN  THEN 1 ELSE 0 END) AS vip,
           SUM(CASE WHEN  THEN 1 ELSE 0 END) AS allo
    FROM jegy;
sample_solutions:
  sql: |
    SELECT COUNT(*) AS osszes,
           SUM(CASE WHEN kategoria = 'vip' THEN 1 ELSE 0 END) AS vip,
           SUM(CASE WHEN kategoria = 'allo' THEN 1 ELSE 0 END) AS allo
    FROM jegy;
