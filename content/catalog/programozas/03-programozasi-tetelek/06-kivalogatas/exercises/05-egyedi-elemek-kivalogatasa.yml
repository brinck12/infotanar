sample_solutions:
  python: |
    n = int(input())
    egyedi = []
    for _ in range(n):
        szam = int(input())
        if szam not in egyedi:
            egyedi.append(szam)
    print(" ".join(map(str, egyedi)))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            List<int> egyedi = new List<int>();
            for (int i = 0; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (!egyedi.Contains(szam))
                {
                    egyedi.Add(szam);
                }
            }
            Console.WriteLine(string.Join(" ", egyedi));
        }
    }
