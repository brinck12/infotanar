description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Válogasd szét őket két listába: a **negatívak** és a **nemnegatívak** (0 vagy pozitív) listájába, a beolvasás sorrendjét megtartva. Írd ki mindkét listát külön sorban, szóközzel elválasztva.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`2 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám. Mindkét csoportba esik legalább egy szám.

  ### Kimenet

  Két sor: `Negativ: ` és a negatív számok, majd `Nemnegativ: ` és a nemnegatív számok.

  ### Példa

  Bemenet: `5`, majd `4`, `-3`, `0`, `-1`, `7`. Kimenet:

  ```
  Negativ: -3 -1
  Nemnegativ: 4 0 7
  ```

  Tipp: egy ciklusban mindkét listát építheted: az `if` az egyikbe, az `else` ág a másikba tesz.
