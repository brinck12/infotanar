slug: kozos-elemek
title: "Közös elemek"
position: 0
kind: code
level: emelt
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Két számsorozat adatai négy sorban érkeznek: az első sorozat elemszáma (N, legalább 1), maga a sorozat szóközzel elválasztva, a második sorozat elemszáma (M, legalább 1), majd az is. Egy sorozatban egy érték többször is szerepelhet. Írd ki azokat az értékeket, amelyek mindkét sorozatban megvannak, **mindegyiket egyszer**, az első sorozat sorrendjében: `Kozos: ...`. Ha nincs közös elem, a kettőspont után `-` álljon.

  Példa bemenet:

  ```
  5
  4 1 7 4 9
  4
  9 4 6 1
  ```

  Kimenet:

  ```
  Kozos: 4 1 9
  ```

  Tipp: az első sorozat minden elemére döntsd el, hogy benne van-e a másodikban és az eredményben még nincs-e.
