sample_solutions:
  python: |
    n = int(input())
    maxi = int(input())
    for i in range(2, n + 1):
        szam = int(input())
        if szam > maxi:
            maxi = szam
    print(maxi)
  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int max = int.Parse(Console.ReadLine());
            for (int i = 2; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam > max)
                {
                    max = szam;
                }
            }
            Console.WriteLine(max);
        }
    }
