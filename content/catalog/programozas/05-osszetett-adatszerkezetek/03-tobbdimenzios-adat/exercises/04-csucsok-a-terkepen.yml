description: |
  Egy terep magasságait R × C-s táblázat adja: az első sor `R C`, utána R sor, soronként C egész szám. Egy mező **csúcs**, ha a magassága szigorúan nagyobb minden közvetlen (fel, le, balra, jobbra) szomszédjáénál. A szélső mezőknek kevesebb szomszédjuk van, azokat csak a létezőkhöz hasonlítjuk.

  Írd ki az első sorba a csúcsok számát (`Csucsok: k`), utána soronként a csúcsok helyét `sor oszlop` alakban, 1-től számozva, soronként balról jobbra, fentről lefelé haladva.

  Példa bemenet:

  ```
  3 4
  1 2 1 1
  1 9 2 3
  4 1 1 8
  ```

  Kimenet:

  ```
  Csucsok: 3
  2 2
  3 1
  3 4
  ```

  Tipp: a szomszéd indexét olvasás előtt ellenőrizd. Egy mező akkor csúcs, ha egyik létező szomszédja sem nagyobb vagy egyenlő nála.
