  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Nap
    {
        public int Sorszam;
        public int Min;
        public int Max;
        public int Csapadek;
        public int Szel;
    }

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("idojaras.txt");
            List<Nap> napok = new List<Nap>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split(';');
                Nap n = new Nap();
                n.Sorszam = int.Parse(r[0]);
                n.Min = int.Parse(r[1]);
                n.Max = int.Parse(r[2]);
                n.Csapadek = int.Parse(r[3]);
                n.Szel = int.Parse(r[4]);
                napok.Add(n);
            }
            Console.WriteLine("4. feladat");
            List<Nap> esos = napok.Where(n => n.Csapadek > 0).OrderByDescending(n => n.Csapadek).ToList();
            if (esos.Count == 0)
            {
                Console.WriteLine("Nem esett csapadek.");
            }
            else
            {
                Console.WriteLine("Legcsapadekosabb napok:");
                for (int i = 0; i < Math.Min(5, esos.Count); i++)
                {
                    Console.WriteLine((i + 1) + ". " + esos[i].Sorszam + ". nap: " + esos[i].Csapadek + " mm");
                }
            }
            Console.WriteLine("Osszes csapadek: " + napok.Sum(n => n.Csapadek) + " mm");
        }
    }
