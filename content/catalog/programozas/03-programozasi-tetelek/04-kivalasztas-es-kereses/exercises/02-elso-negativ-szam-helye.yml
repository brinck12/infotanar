sample_solutions:
  python: |
    n = int(input())
    hely = 0
    for i in range(1, n + 1):
        szam = int(input())
        if szam < 0:
            hely = i
            break
    if hely == 0:
        print('NINCS')
    else:
        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int hely = 0;
            for (int i = 1; i <= n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam < 0)
                {
                    hely = i;
                    break;
                }
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
