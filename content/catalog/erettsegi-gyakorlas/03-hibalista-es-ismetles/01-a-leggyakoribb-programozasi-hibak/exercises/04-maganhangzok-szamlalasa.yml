slug: maganhangzok-szamlalasa
title: "Magánhangzók számlálása"
position: 3
kind: code
level: kozep
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Az alábbi program egy ékezet nélküli szövegben megszámolná a magánhangzókat (`a`, `e`, `i`, `o`, `u`). Az `Alma Korte` bemenetre `2`-t ír ki, pedig a helyes válasz `4`. Javítsd a hibát!

  Bemenet: egyetlen sor, legfeljebb 100 karakter, ékezet nélküli betűk és szóközök. Kimenet: a magánhangzók száma, **kis- és nagybetűt egyaránt** számolva.

  Példa: `Alma Korte` esetén a kimenet `4`.

  Tipp: az `A` és az `a` a program szemében két különböző karakter.
starter_code:
  python: |
    szoveg = input()
    db = 0
    for betu in szoveg:
        if betu in "aeiou":
            db += 1
    print(db)
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            string szoveg = Console.ReadLine();
            int db = 0;
            foreach (char betu in szoveg)
            {
                if ("aeiou".IndexOf(betu) >= 0)
                {
                    db++;
                }
            }
            Console.WriteLine(db);
        }
    }
sample_solutions:
  python: |
    szoveg = input().lower()
    db = 0
    for betu in szoveg:
        if betu in "aeiou":
            db += 1
    print(db)
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            string szoveg = Console.ReadLine().ToLower();
            int db = 0;
            foreach (char betu in szoveg)
            {
                if ("aeiou".IndexOf(betu) >= 0)
                {
                    db++;
                }
            }
            Console.WriteLine(db);
        }
    }
