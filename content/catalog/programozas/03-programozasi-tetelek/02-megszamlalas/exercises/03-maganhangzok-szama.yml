sample_solutions:
  python: |
    szoveg = input().lower()
    db = 0
    for betu in szoveg:
        if betu in "aeiou":
            db += 1
    print(db)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            string szoveg = Console.ReadLine().ToLowerInvariant();
            int db = 0;
            foreach (char betu in szoveg)
            {
                if ("aeiou".IndexOf(betu) >= 0)
                {
                    db++;
                }
            }
            Console.WriteLine(db);
        }
    }
