slug: adatbazis-4-gyakran-kolcsonzott-konyvek
title: Adatbázis 4 - Gyakran kölcsönzött könyvek
position: 3
kind: sql
level: kozep
difficulty: 4
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |-
  Az adatbázis két táblából áll.

  A `konyv` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `cim` | `VARCHAR(50)`, a könyv címe |
  | `szerzo` | `VARCHAR(50)` |
  | `ev` | `INT`, a kiadás éve |
  | `oldal` | `INT`, az oldalszám |
  | `mufaj` | `VARCHAR(20)` (`regeny`, `ifjusagi`, `ismeretterjeszto`, `mese`, `vers`) |

  A `kolcsonzes` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `konyv_id` | `INT`, a `konyv` tábla `id` oszlopára mutat |
  | `olvaso` | `VARCHAR(50)`, az olvasó neve |
  | `datum` | `DATE` (pl. `2025-10-14`) |
  | `napok` | `INT`, a kölcsönzési idő napokban |

  **4. feladat.** Adja meg azokat a könyveket, amelyeket **legalább háromszor** kölcsönöztek ki! Az eredmény két oszlopa: a könyv címe `cim` néven és a kölcsönzések száma `alkalom` néven. A sorrend: alkalom szerint csökkenően, azonos számnál cím szerint növekvően.

  Tipp: csoportosíts a könyv szerint, és a csoportokra szóló feltételt `HAVING`-gel add meg.
starter_code:
  sql: "SELECT b.cim AS cim, COUNT(*) AS alkalom\nFROM kolcsonzes k\nJOIN konyv b ON k.konyv_id = b.id\nGROUP BY b.id, b.cim\nHAVING \nORDER BY ;\n"
sample_solutions:
  sql: |
    SELECT b.cim AS cim, COUNT(*) AS alkalom
    FROM kolcsonzes k
    JOIN konyv b ON k.konyv_id = b.id
    GROUP BY b.id, b.cim
    HAVING COUNT(*) >= 3
    ORDER BY alkalom DESC, b.cim;
