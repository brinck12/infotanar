            using (StreamWriter iro = new StreamWriter("negyzetek.txt"))
            {
                // ide írd az írást
            }
            string[] sorok = File.ReadAllLines("negyzetek.txt");
            // ide írd a kiírást
        }
    }
sample_solutions:
  python: |
    n = int(input())
    with open("negyzetek.txt", "w", encoding="utf-8") as f:
        for i in range(1, n + 1):
            f.write(str(i * i) + "\n")
    with open("negyzetek.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    for sor in sorok:
        print(sor)
    print("Sorok:", len(sorok))
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            using (StreamWriter iro = new StreamWriter("negyzetek.txt"))
            {
                for (int i = 1; i <= n; i++)
                {
                    iro.WriteLine(i * i);
                }
            }
            string[] sorok = File.ReadAllLines("negyzetek.txt");
            foreach (string sor in sorok)
            {
                Console.WriteLine(sor);
            }
            Console.WriteLine("Sorok: " + sorok.Length);
        }
    }
