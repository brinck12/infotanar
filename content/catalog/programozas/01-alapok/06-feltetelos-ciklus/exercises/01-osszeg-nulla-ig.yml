slug: osszeg-nullaig
title: Összeg nulláig
position: 0
kind: code
level: kozep
difficulty: 1
published: false
allowed_languages: [python, csharp]
description: |
  Olvass be egész számokat soronként, amíg `0`-t nem kapsz. A nulla már nem tartozik az összegbe. Írd ki az összeget ebben a formában:

  `Osszeg: 10`

  Példa: a bemenet `4`, `6`, `0` (külön sorokban), a kimenet `Osszeg: 10`.

  Tipp: az első számot a ciklus előtt olvasd be, a következőt a ciklusmag végén.
starter_code:
  python: |
    osszeg = 0
    szam = int(input())
    while szam != 0:
        pass  # ide írd a ciklusmagot
    print("Osszeg: " + str(osszeg))
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            var osszeg = 0;
            var szam = int.Parse(Console.ReadLine());
            while (szam != 0)
            {
                // ide írd a ciklusmagot
            }
            Console.WriteLine("Osszeg: " + osszeg);
        }
    }
sample_solutions:
  python: |
    osszeg = 0
    szam = int(input())
    while szam != 0:
        osszeg = osszeg + szam
        szam = int(input())
    print("Osszeg: " + str(osszeg))
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            var osszeg = 0;
            var szam = int.Parse(Console.ReadLine());
            while (szam != 0)
            {
                osszeg = osszeg + szam;
                szam = int.Parse(Console.ReadLine());
            }
            Console.WriteLine("Osszeg: " + osszeg);
        }
    }
tests:
  - { stdin: "4\n6\n0\n", expected: "Osszeg: 10\n", hidden: false }
  - { stdin: "0\n", expected: "Osszeg: 0\n", hidden: true }
  - { stdin: "-3\n8\n-1\n0\n", expected: "Osszeg: 4\n", hidden: true }
  - { stdin: "100\n200\n300\n0\n", expected: "Osszeg: 600\n", hidden: true }
