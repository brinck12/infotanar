description: |
  Egy futóversenyen az első sor a versenyzők száma (N, legalább 1), majd N sor: `nev;ido` (az idő egész szám, századmásodpercben). A legkisebb idő a legjobb. Írd ki a dobogósokat (legfeljebb az első hármat) soronként `helyezes. nev ido` alakban. Egyenlő időnél a bemenetben előbb szereplő versenyző jobb helyezést kap, a helyezések pedig egyesével nőnek (1., 2., 3.). Ha háromnál kevesebb versenyző van, annyit írj ki, amennyi van.

  Példa bemenet:

  ```
  5
  Anna;1250
  Bence;1190
  Csilla;1301
  David;1190
  Emil;1220
  ```

  Kimenet:

  ```
  1. Bence 1190
  2. David 1190
  3. Emil 1220
  ```

  Tipp: stabil rendezés idő szerint növekvő sorrendbe, utána az első három elem kiírása (a lista hosszától függően).
