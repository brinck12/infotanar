description: |
  ## Feladat

  Olvass be egy `N` egész számot, és írd ki a **legkisebb 1-nél nagyobb osztóját**! Egy prímszám legkisebb 1-nél nagyobb osztója önmaga.

  ### Bemenet

  Egyetlen sorban egy `N` egész szám (`2 ≤ N ≤ 1000000`).

  ### Kimenet

  Egyetlen sorban a legkisebb 1-nél nagyobb osztó.

  ### Példa

  Bemenet: `15`. Kimenet: `3`. Bemenet: `13`. Kimenet: `13`.

  Tipp: ez kiválasztás: biztosan van találat (legrosszabb esetben `N` maga). Indulj 2-től, és az első olyan `d`-nél állj meg, amelyre `N % d == 0`.
