sample_solutions:
  python: |
    n = int(input())
    legrovidebb = input()
    for _ in range(n - 1):
        nev = input()
        if len(nev) < len(legrovidebb):
            legrovidebb = nev
    print(legrovidebb)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            string legrovidebb = Console.ReadLine();
            for (int i = 1; i < n; i++)
            {
                string nev = Console.ReadLine();
                if (nev.Length < legrovidebb.Length)
                {
                    legrovidebb = nev;
                }
            }
            Console.WriteLine(legrovidebb);
        }
    }
