  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Kolcsonzes
    {
        public string Olvaso;
        public string Kod;
        public int Ki;
        public int Be;
    }

    class Program
    {
        static List<Kolcsonzes> kolcsonzesek = new List<Kolcsonzes>();

        static void Main()
        {
            string[] sorok = File.ReadAllLines("kolcsonzes.txt");
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Kolcsonzes k = new Kolcsonzes();
                k.Olvaso = r[0];
                k.Kod = r[1];
                k.Ki = int.Parse(r[2]);
                k.Be = int.Parse(r[3]);
                kolcsonzesek.Add(k);
            }
            Console.WriteLine("3. feladat");
            Console.WriteLine("Add meg a konyv kodjat:");
            string kod = Console.ReadLine();
            int db = 0;
            int osszeg = 0;
            foreach (Kolcsonzes k in kolcsonzesek)
            {
                if (k.Kod == kod)
                {
                    db++;
                    osszeg += k.Be - k.Ki;
                }
            }
            if (db == 0)
            {
                Console.WriteLine("Nincs ilyen konyv.");
            }
            else
            {
                Console.WriteLine("Kolcsonzesek: " + db);
                Console.WriteLine("Atlagos ido: " + ((double)osszeg / db).ToString("F2", CultureInfo.InvariantCulture) + " nap");
            }
        }
    }
