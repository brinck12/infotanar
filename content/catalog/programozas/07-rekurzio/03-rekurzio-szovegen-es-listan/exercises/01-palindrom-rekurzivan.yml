description: |
  Olvass be egy kisbetűs szót (nincs benne szóköz). Rekurzív függvénnyel döntsd el, hogy palindrom-e, és írd ki: `igen` vagy `nem`.

  Példa: `kajak` esetén a kimenet `igen`; `alma` esetén `nem`. Az egybetűs szó palindrom.

  Tipp: ha az első és utolsó betű különbözik, a válasz `nem`; különben vizsgáld a két szélső betű nélküli részt.
