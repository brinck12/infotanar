slug: fuvarok-rovid-fejleccel
title: Fuvarok rövid fejléccel
position: 3
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  Az alias segít olvashatóbb fejlécet adni az eredménynek, különösen ha a mező neve rövidítés.

  A `taxi` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `rendszam` | szöveg |
  | `indulas` | szöveg |
  | `cel` | szöveg |
  | `km` | egész |
  | `dij` | egész (Ft) |
  | `fizetes` | szöveg (`keszpenz` vagy `kartya`) |

  Listázd ki a fuvarok rendszámát `auto`, megtett távolságát `tavolsag`, díját `fizetendo` néven, ebben a sorrendben! A sorok sorrendje nem számít.

  Tipp: három oszlop kell, mindegyik mellé írj `AS` aliast.
starter_code:
  sql: |
    SELECT
    FROM taxi;
sample_solutions:
  sql: |
    SELECT rendszam AS auto, km AS tavolsag, dij AS fizetendo
    FROM taxi;
