slug: buborekrendezes
title: "Buborékrendezés"
position: 1
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  A bemenet első sora az elemek száma (N, legalább 1), a másodikban N egész szám áll szóközzel elválasztva. Rendezd a számokat **növekvő sorrendbe cserés (buborék) rendezéssel**, a beépített rendezés használata nélkül: a szomszédos, rossz sorrendű elempárokat cseréld meg, amíg egy menetben már nem volt csere. Írd ki a rendezett sort (`Rendezve: ...`) és az elvégzett cserék számát (`Csere: ...`).

  Példa bemenet:

  ```
  4
  5 2 9 1
  ```

  Kimenet:

  ```
  Rendezve: 1 2 5 9
  Csere: 4
  ```

  Tipp: egy csere pontosan egy rossz sorrendű párt szüntet meg, ezért a cserék száma nem függ attól, hogyan szervezed a menetet. Az egyenlő szomszédokat ne cseréld.
