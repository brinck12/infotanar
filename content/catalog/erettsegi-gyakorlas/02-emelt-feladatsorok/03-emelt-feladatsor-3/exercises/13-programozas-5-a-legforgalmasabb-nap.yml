description: |
  Az `indulasok.txt` a repülőtér egy havi (30 napos) forgalmát tartalmazza, soronként egy indulással, pontosvesszővel elválasztva: `járatszám;célállomás;távolság km;nap;indulás;utasok;késés`. A járatszám két betűből és négy számjegyből áll (pl. `MA1017`), a nap a hónap napja (1–30), az indulás `ÓÓ:PP` alakú, a késés percben értendő (0, ha pontosan indult). Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz, a sorok nincsenek sorrendben, és egy járat egy napon egy időpontban legfeljebb egyszer szerepel.

  **5. feladat.** Számolja ki napokra bontva (1–30) az utasok számát, majd **rekurzív függvénnyel** keresse meg a legforgalmasabb napot! A függvény a tömb egy `[also, felso]` szakaszában keresse a legnagyobb értékű elem indexét: ha a szakasz egyelemű, azt adja vissza; különben felezze a szakaszt, oldja meg mindkét felet rekurzívan, és a két eredmény közül a nagyobb értékűt adja. Azonos napi utasszámnál a **korábbi nap** számít.

  A mintafájlra a kimenet:

  ```text
  5. feladat: A legforgalmasabb nap: 16. nap, 505 utas.
  ```

  Tipp: a napi összegeket a `t[1]..t[30]` elemekben gyűjtsd, a rekurzív hívás `legnagyobb(t, 1, 30)`. Egyenlőségnél a bal fél eredményét tartsd meg, így az első nap nyer.
