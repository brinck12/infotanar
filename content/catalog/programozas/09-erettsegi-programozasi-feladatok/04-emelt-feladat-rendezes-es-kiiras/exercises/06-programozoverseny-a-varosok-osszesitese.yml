description: "Egy iskolai programozóversenyen a csapatok eredményeit a `csapatok.txt` fájl tartalmazza. Az első sor fejléc (`csapat`, `varos`, `megoldott`, `buntetes`), utána minden sor egy csapat, tabulátorral tagolva: a csapat neve (ékezet nélkül, szóközt tartalmazhat), a város neve (ékezet nélkül, egyetlen szó), a megoldott feladatok száma és a büntetőpercek száma (mindkettő egész szám). Egy csapat egyszer szerepel. A fájl legalább egy csapatot tartalmaz.\n\nA **rangsorban** az a csapat áll előbb, amelyik több feladatot oldott meg; azonos számú megoldás esetén a kevesebb büntetőperces; ha ez is azonos, a fájlban előbb szereplő. A programban egy csapatot rekordként (osztályként) érdemes tárolni. Minden részfeladat kimenete a sorszámával kezdődik (`N. feladat`), a kimenetben ne használj ékezetes betűt. Ahol a feladat bevitelt kér, a kérdést külön sorban írd ki, csak utána olvass be.\n\nKészíts városonkénti összesítést a `varosok.txt` fájlba: soronként egy város, a város neve, az onnan indult\
  \ csapatok száma és a csapataik által megoldott feladatok összege, tabulátorral elválasztva. A sorrend: az összes megoldott feladat szerint csökkenő, azonos összegnél a városnév szerinti betűrend (a nevek ékezet nélküliek, a sima karakterkód-sorrend jó). Fejlécsor nincs. Olvasd vissza a fájlt, és írd ki a tartalmát.\n\n```\nvarosok.txt tartalma:\n<varos><TAB><csapatok szama><TAB><osszes megoldott>\n...\n```\n\nKimenet a mellékelt mintafájllal:\n\n```\n6. feladat\nvarosok.txt tartalma:\nSzeged\t3\t22\nDebrecen\t3\t15\nGyor\t2\t15\nPecs\t2\t12\nMiskolc\t2\t7\n```\n\nTipp: szótárban gyűjtsd városonként a darabszámot és az összeget, aztán a szótár elemeit rendezd két kulccsal. C#-ban a szövegek rendezéséhez `StringComparer.Ordinal` kell, hogy a sorrend ne függjön a nyelvi beállítástól.\n"
