description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki, hogy a **legnagyobb szám utolsó előfordulása** hányadik helyen áll (az első szám sorszáma 1)!

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a sorszám.

  ### Példa

  Bemenet: `5`, majd `4`, `9`, `2`, `9`, `1`. Kimenet: `4`

  Tipp: az első előfordulás helyét a szigorú `>` adja; az utolsóét az, ha egyenlőségnél is frissítesz (`>=`).
