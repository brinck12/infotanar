description: |
  Olvass be egy `N` egész számot (`0 ≤ N ≤ 5`): ennyi korong van az `A` rúdon. Írd ki a Hanoi tornyai megoldásának lépéseit, hogy az összes korong az `A` rúdról a `C` rúdra kerüljön a `B` rúd segítségével. Minden lépés egy sor: `X -> Y` (korong mozgatása az `X` rúdról az `Y` rúdra).

  A rekurzív leírás `Hanoi(n, honnan, hova, seged)`:
  - Ha `n = 0`, nincs teendő.
  - Különben: `Hanoi(n-1, honnan, seged, hova)`, aztán kiírni: `honnan -> hova`, aztán `Hanoi(n-1, seged, hova, honnan)`.

  Példa: `N = 2` esetén a kimenet: `A -> B`, `A -> C`, `B -> C` külön sorokban. `N = 0` esetén a kimenet üres.

  Tipp: a két rekurzív hívás között írd ki a lépést; a paraméterek sorrendjére figyelj.
