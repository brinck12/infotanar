sample_solutions:
  python: |
    def lepes(n):
        if n <= 1:
            return 0
        return 1 + lepes(n // 2)

    print(lepes(int(input())))
  csharp: |
    using System;

    class Program
    {
        static int Lepes(int n)
        {
            if (n <= 1)
            {
                return 0;
            }
            return 1 + Lepes(n / 2);
        }

        static void Main()
        {
            Console.WriteLine(Lepes(int.Parse(Console.ReadLine())));
        }
    }
