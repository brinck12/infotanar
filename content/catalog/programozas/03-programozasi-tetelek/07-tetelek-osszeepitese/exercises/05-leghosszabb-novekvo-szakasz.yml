description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Add meg a leghosszabb **szigorúan növekvő, egymás melletti számokból álló szakasz** hosszát! Egyetlen szám is szakasz.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a leghosszabb szigorúan növekvő szakasz hossza.

  ### Példa

  Bemenet: `7`, majd `1`, `2`, `3`, `1`, `2`, `3`, `4`. Kimenet: `4` (az utolsó négy szám)

  Tipp: két számlálót vezess: az éppen futó szakasz hosszát és az eddigi legnagyobbat. Ha a szám nagyobb az előzőnél, a futó hossz nő, különben újraindul 1-ről; minden lépés után a maximumot is frissítsd.
