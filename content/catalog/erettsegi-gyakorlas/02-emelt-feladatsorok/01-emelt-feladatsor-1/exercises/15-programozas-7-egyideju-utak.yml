description: |-
  Az `utak.txt` a kerékpárkölcsönző egy havi (30 napos) forgalmát tartalmazza, soronként egy úttal, pontosvesszővel elválasztva: `bicikli;nap;indulás;érkezés;távolság`. A bicikli azonosítója `B-01` alakú, a nap a hónap napja (1–30), az indulás és az érkezés `ÓÓ:PP` alakú időpont (ugyanazon a napon belül, az érkezés mindig az indulás után van), a távolság méterben egész szám. A sorok nem rendezettek. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **7. feladat.** Egy bicikli az indulás percétől az érkezés **előtti** percig számít úton lévőnek (az érkezés percében már nem). Határozza meg, **legfeljebb hány bicikli volt egyszerre úton**, és mikor történt ez **először**! Elég az utak indulási időpontjait vizsgálni, mert a darabszám csak új indulásnál nőhet. Írja ki a maximumot, a napot és az időpontot a minta szerint.

  A mintafájlra a kimenet:

  ```text
  7. feladat: Egyszerre legfeljebb 3 bicikli volt uton, eloszor a(z) 26. napon 07:07-kor.
  ```

  Tipp: rendezd az utakat nap, majd indulási idő szerint (az `ÓÓ:PP` szöveg ábécérendje megegyezik az időrenddel). Minden indulásnál számold meg, hány azonos napi út van úton: `indulas <= t < erkezes`. Csak szigorúan nagyobb darabszámnál frissítsd a legjobbat, így az első előfordulás marad meg.
