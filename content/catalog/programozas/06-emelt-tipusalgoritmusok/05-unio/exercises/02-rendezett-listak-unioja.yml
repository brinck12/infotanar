sample_solutions:
  python: |
    n = int(input())
    a = [int(x) for x in input().split()]
    m = int(input())
    b = [int(x) for x in input().split()]
    i = 0
    j = 0
    osszehasonlitas = 0
    unio = []
    while i < n and j < m:
        osszehasonlitas += 1
        if a[i] == b[j]:
            unio.append(a[i])
            i += 1
            j += 1
        elif a[i] < b[j]:
            unio.append(a[i])
            i += 1
        else:
            unio.append(b[j])
            j += 1
    while i < n:
        unio.append(a[i])
        i += 1
    while j < m:
        unio.append(b[j])
        j += 1
    print("Unio: " + " ".join(str(x) for x in unio))
    print("Osszehasonlitas:", osszehasonlitas)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static List<int> Beolvas()
        {
            Console.ReadLine();
            var lista = new List<int>();
            foreach (string s in Console.ReadLine().Split(' '))
            {
                lista.Add(int.Parse(s));
            }
            return lista;
        }

        static void Main()
        {
            var a = Beolvas();
            var b = Beolvas();
            int i = 0;
            int j = 0;
            int osszehasonlitas = 0;
            var unio = new List<int>();
            while (i < a.Count && j < b.Count)
            {
                osszehasonlitas++;
                if (a[i] == b[j])
                {
                    unio.Add(a[i]);
                    i++;
                    j++;
                }
                else if (a[i] < b[j])
                {
                    unio.Add(a[i]);
                    i++;
                }
                else
                {
                    unio.Add(b[j]);
                    j++;
                }
            }
            while (i < a.Count)
            {
                unio.Add(a[i]);
                i++;
            }
            while (j < b.Count)
            {
                unio.Add(b[j]);
                j++;
            }
            Console.WriteLine("Unio: " + string.Join(" ", unio));
            Console.WriteLine("Osszehasonlitas: " + osszehasonlitas);
        }
    }
