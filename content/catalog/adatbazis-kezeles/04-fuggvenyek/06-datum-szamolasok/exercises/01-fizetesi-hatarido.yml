slug: fizetesi-hatarido
title: Fizetési határidő
position: 1
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
    A számlát a rendelés napjától számított 14 napon belül kell kifizetni. Listázd a vevő nevét (`vevo`) és a fizetési határidőt (`fizetesi_hatarido`).

    A `rendeles` tábla:

    | `id` | `vevo` | `rendelve` | `hatarido` | `szallitva` |
    |---|---|---|---|---|
    | 1 | Kiss Anna | 2025-03-03 | 2025-03-10 | 2025-03-07 |
    | 2 | Nagy Bela | 2025-03-08 | 2025-03-15 | 2025-03-17 |
    | 3 | Toth Csaba | 2025-02-26 | 2025-03-05 | 2025-03-05 |

    Az eredmény ezekre az adatokra:

    | `vevo` | `fizetesi_hatarido` |
    |---|---|
    | Kiss Anna | 2025-03-17 |
    | Nagy Bela | 2025-03-22 |
    | Toth Csaba | 2025-03-12 |

    Tipp: az `ADDDATE(dátum, napok)` a dátumhoz napokat ad. A hónap- és évváltást és a szökőévet a függvény intézi.
starter_code:
  sql: |
    SELECT vevo, ... AS fizetesi_hatarido
    FROM rendeles;
sample_solutions:
  sql: |
    SELECT vevo, ADDDATE(rendelve, 14) AS fizetesi_hatarido
    FROM rendeles;
tests:
  - stdin: |
      CREATE TABLE rendeles (id INT, vevo VARCHAR(30), rendelve DATE, hatarido DATE, szallitva DATE);
      INSERT INTO rendeles VALUES (1, 'Kiss Anna', '2025-03-03', '2025-03-10', '2025-03-07');
      INSERT INTO rendeles VALUES (2, 'Nagy Bela', '2025-03-08', '2025-03-15', '2025-03-17');
      INSERT INTO rendeles VALUES (3, 'Toth Csaba', '2025-02-26', '2025-03-05', '2025-03-05');
    expected: |
      vevo,fizetesi_hatarido
      Kiss Anna,2025-03-17
      Nagy Bela,2025-03-22
      Toth Csaba,2025-03-12
