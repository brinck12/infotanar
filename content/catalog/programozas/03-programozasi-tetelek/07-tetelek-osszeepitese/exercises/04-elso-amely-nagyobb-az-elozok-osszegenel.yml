  python: |
    n = int(input())
    osszeg = int(input())
    hely = 0
    for i in range(2, n + 1):
        szam = int(input())
        # TODO: hasonlítsd az eddigi összeghez; találatnál jegyezd meg a helyet és lépj ki
        osszeg += szam
    if hely == 0:
        print("NINCS")
