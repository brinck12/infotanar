    }
sample_solutions:
  python: |
    with open("meresek.csv", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    elso = sorok[1].split(";")
    meleg_datum = elso[0]
    meleg = int(elso[1])
    hideg_datum = elso[0]
    hideg = int(elso[1])
    fagyos = 0
    for sor in sorok[1:]:
        mezok = sor.split(";")
        ho = int(mezok[1])
        if ho > meleg:
            meleg = ho
            meleg_datum = mezok[0]
        if ho < hideg:
            hideg = ho
            hideg_datum = mezok[0]
        if ho < 0:
            fagyos += 1
    print("Legmelegebb:", meleg_datum, meleg)
    print("Leghidegebb:", hideg_datum, hideg)
    print("Fagyos napok:", fagyos)
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string[] sorok = File.ReadAllLines("meresek.csv");
            string[] elso = sorok[1].Split(';');
            string melegDatum = elso[0];
            int meleg = int.Parse(elso[1]);
            string hidegDatum = elso[0];
            int hideg = int.Parse(elso[1]);
            int fagyos = 0;
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split(';');
                int ho = int.Parse(mezok[1]);
                if (ho > meleg)
                {
                    meleg = ho;
                    melegDatum = mezok[0];
                }
                if (ho < hideg)
                {
                    hideg = ho;
                    hidegDatum = mezok[0];
                }
                if (ho < 0)
                {
                    fagyos++;
                }
            }
            Console.WriteLine("Legmelegebb: " + melegDatum + " " + meleg);
            Console.WriteLine("Leghidegebb: " + hidegDatum + " " + hideg);
            Console.WriteLine("Fagyos napok: " + fagyos);
        }
    }
