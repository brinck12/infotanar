slug: uj-oszlop-az-e-mail-cimnek
title: Új oszlop az e-mail címnek
position: 2
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
sql_order_sensitive: true
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  A diákoknak e-mail címet is nyilván akarunk tartani. Bővítsd a `diak` táblát egy `email` nevű szöveges oszloppal (`ALTER TABLE ... ADD COLUMN ...`), majd töltsd ki minden diáknál úgy, hogy az e-mail cím a **diák neve kisbetűsen, a szóköz helyett ponttal, utána `@suli.hu`** legyen. Például a `Kiss Anna` nevű diáké `kiss.anna@suli.hu`.

  (Az `ALTER TABLE` nem szerepel az érettségi követelményei között, de a gyakorlatban nagyon hasznos.)

  A kód végén álló `SELECT` sort **ne töröld és ne módosítsd**: az mutatja meg a tábla állapotát módosítás után, és a rendszer ezt az eredményt hasonlítja az elvárthoz. A saját utasításodat a `SELECT` **elé** írd, pontosvesszővel lezárva.

  Tipp: `REPLACE(LOWER(nev), ' ', '.') || '@suli.hu'` – az `||` jel összefűzi a szövegeket (MariaDB-ben `CONCAT`).
starter_code:
  sql: |
    -- Ide írd az ALTER TABLE és az UPDATE utasítást.

    SELECT id, email FROM diak ORDER BY id;
sample_solutions:
  sql: |
    ALTER TABLE diak ADD COLUMN email TEXT;

    UPDATE diak SET email = REPLACE(LOWER(nev), ' ', '.') || '@suli.hu';

    SELECT id, email FROM diak ORDER BY id;
