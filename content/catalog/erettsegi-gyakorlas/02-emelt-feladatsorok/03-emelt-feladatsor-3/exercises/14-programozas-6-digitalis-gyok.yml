  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Indulas
    {
        public string Jarat;
        public string Cel;
        public int Tav;
        public int Nap;
        public string Ido;
        public int Utas;
        public int Keses;

        public Indulas(string sor)
        {
            string[] r = sor.Split(';');
            Jarat = r[0];
            Cel = r[1];
            Tav = int.Parse(r[2]);
            Nap = int.Parse(r[3]);
            Ido = r[4];
            Utas = int.Parse(r[5]);
            Keses = int.Parse(r[6]);
        }
    }

    class Program
    {
        static int Gyok(int n)
        {
            if (n < 10)
            {
                return n;
            }
            int osszeg = 0;
            while (n > 0)
            {
                osszeg += n % 10;
                n = n / 10;
            }
            return Gyok(osszeg);
        }

        static void Main()
        {
            List<Indulas> indulasok = new List<Indulas>();
            foreach (string sor in File.ReadAllLines("indulasok.txt"))
            {
                indulasok.Add(new Indulas(sor));
            }
            string legjobb = "";
            int legjobbGyok = -1;
            foreach (Indulas i in indulasok)
            {
                int g = Gyok(int.Parse(i.Jarat.Substring(2)));
                if (g > legjobbGyok)
                {
                    legjobbGyok = g;
                    legjobb = i.Jarat;
                }
            }
            Console.WriteLine("6. feladat: A legnagyobb digitalis gyoku jaratszam: " + legjobb + " (gyok: " + legjobbGyok + ")");
        }
    }
