slug: az-osztalyok-listaja
title: Az osztályok listája
position: 0
kind: sql
level: kozep
difficulty: 1
published: false
allowed_languages: [sql]
description: |
  A `diak` táblában egy osztály többször is szerepel, hiszen több diák jár bele. A `DISTINCT` kulcsszó kiszűri az ismétlődő sorokat.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki, mely osztályokba járnak diákok! Mindegyik osztály **csak egyszer** szerepeljen, az oszlop neve maradjon `osztaly`. A sorok sorrendje nem számít.

  Tipp: a `DISTINCT` közvetlenül a `SELECT` után áll: `SELECT DISTINCT mezo`.
starter_code:
  sql: |
    SELECT
    FROM diak;
sample_solutions:
  sql: |
    SELECT DISTINCT osztaly
    FROM diak;
