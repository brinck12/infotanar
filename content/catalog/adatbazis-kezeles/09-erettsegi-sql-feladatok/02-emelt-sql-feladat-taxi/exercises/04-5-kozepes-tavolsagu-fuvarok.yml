slug: 5-kozepes-tavolsagu-fuvarok
title: 5. Közepes távolságú fuvarok
position: 3
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy taxitársaság nyilvántartása két táblából áll.

  A `sofor` tábla a sofőröket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `szuletes` | egész, a születési év |
  | `angol` | egész: 1, ha beszél angolul, különben 0 |
  | `nemet` | egész: 1, ha beszél németül, különben 0 |
  | `engedely_ev` | egész, a taxis engedély megszerzésének éve |

  A `fuvar` tábla a megtett fuvarokat:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `sofor_id` | egész, a `sofor` tábla `id` oszlopára mutat |
  | `rendszam` | szöveg, az autó rendszáma (pl. `KMB-217`) |
  | `datum` | szöveg (ÉÉÉÉ-HH-NN) |
  | `km` | egész, a megtett út kilométerben |
  | `ar` | egész, a fuvar ára forintban |
  | `fizetes` | szöveg: `kartya` vagy `keszpenz` |

  **5. feladat.** Adja meg lekérdezéssel, hogy hány olyan fuvar volt **2026. március 3. és március 6. között** (a határnapokat is beleértve), amelynek hossza **5 és 15 kilométer között** volt (a határokat is beleértve)! Az eredmény egyetlen oszlop legyen, `darab` néven.
starter_code:
  sql: "SELECT COUNT(*) AS darab\nFROM fuvar\nWHERE  BETWEEN  AND \n  AND  BETWEEN  AND ;\n"
sample_solutions:
  sql: |
    SELECT COUNT(*) AS darab
    FROM fuvar
    WHERE datum BETWEEN '2026-03-03' AND '2026-03-06'
      AND km BETWEEN 5 AND 15;
