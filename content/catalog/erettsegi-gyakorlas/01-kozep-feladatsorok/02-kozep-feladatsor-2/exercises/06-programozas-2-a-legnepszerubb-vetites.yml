description: |
  A `vetitesek.txt` a mozi vetítéseit tartalmazza, soronként egy vetítéssel, pontosvesszővel elválasztva: `cím;műfaj;játékidő percben;kezdés;eladott jegyek;jegyár`. A kezdés `ÓÓ:PP` alakú. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **2. feladat.** Keresse meg azt a vetítést, amelyre a legtöbb jegyet adták el! Írja ki a jegyek számát és a film címét. Ha több ilyen is van, az **első** számít.

  A mintafájlra a kimenet:

  ```text
  2. feladat: A legtobb jegyet (116 db) a(z) Az ejszaka kiralya vetitesen adtak el.
  ```

  Tipp: maximumkiválasztás; csak szigorúan nagyobb érték cserélje le az eddigi legjobbat.
