title: "Többszempontú névsor"
position: 1
kind: code
level: emelt
difficulty: 3
published: false
allowed_languages: [python, csharp]
description: |
  Diákok adatai: az első sor a diákok száma (N, legalább 1), majd N sor: `nev;osztaly;pont` (ékezet nélküli nevek és osztályok, a pont egész szám). Rendezd őket: **osztály szerint növekvő** (a szöveg karakterkódja szerint), azon belül **pont szerint csökkenő**, azon belül **név szerint növekvő** sorrendbe. Soronként `osztaly nev pont` alakban írd ki őket.

  Példa bemenet:

  ```
  5
  Anna;9B;40
  Bence;9A;30
  Csilla;9B;40
  David;9A;35
  Emil;9B;50
  ```

  Kimenet:

  ```
  9A David 35
  9A Bence 30
  9B Emil 50
  9B Anna 40
  9B Csilla 40
  ```

  Tipp: Pythonban a kulcs lehet egy `(osztaly, -pont, nev)` n-es. C#-ban az `OrderBy`, `ThenByDescending`, `ThenBy` lánc kell, a szövegekhez `StringComparer.Ordinal`-lal.
