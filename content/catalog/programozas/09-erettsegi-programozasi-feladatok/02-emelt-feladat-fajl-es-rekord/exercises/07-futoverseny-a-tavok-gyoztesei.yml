  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Eredmeny
    {
        public string Nev;
        public string Orszag;
        public int Tav;
        public double Ido;
    }

    class Program
    {
        static void Main()
        {
            Console.WriteLine("7. feladat");
            string[] sorok = File.ReadAllLines("verseny.txt");
            List<Eredmeny> eredmenyek = new List<Eredmeny>();
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] r = sorok[i].Split('\t');
                Eredmeny e = new Eredmeny();
                e.Nev = r[0];
                e.Orszag = r[1];
                e.Tav = int.Parse(r[2]);
                e.Ido = double.Parse(r[3], CultureInfo.InvariantCulture);
                eredmenyek.Add(e);
            }
            List<int> tavok = new List<int>();
            Dictionary<int, Eredmeny> gyoztes = new Dictionary<int, Eredmeny>();
            foreach (Eredmeny e in eredmenyek)
            {
                if (!gyoztes.ContainsKey(e.Tav))
                {
                    gyoztes[e.Tav] = e;
                    tavok.Add(e.Tav);
                }
                else if (e.Ido < gyoztes[e.Tav].Ido)
                {
                    gyoztes[e.Tav] = e;
                }
            }
            List<string> ki = new List<string>();
            foreach (int tav in tavok)
            {
                Eredmeny g = gyoztes[tav];
                ki.Add(tav + "\t" + g.Nev + "\t" + g.Orszag + "\t" + g.Ido.ToString("F2", CultureInfo.InvariantCulture));
            }
            File.WriteAllLines("gyoztesek.txt", ki);
            Console.WriteLine("gyoztesek.txt tartalma:");
            foreach (string sor in File.ReadAllLines("gyoztesek.txt"))
            {
                Console.WriteLine(sor);
            }
        }
    }
