slug: a-legjobb-eredmeny
title: A legjobb eredmény
position: 1
kind: sql
level: emelt
difficulty: 2
published: false
allowed_languages:
- sql
description: |
  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |

  Add meg annak a diáknak (vagy diákoknak, ha holtverseny van) a nevét és pontszámát (**nev, pont**), aki a **legtöbb pontot** érte el! Az `ORDER BY ... LIMIT 1` helyett használj allekérdezést, hogy holtverseny esetén mindenki megjelenjen.

  Tipp: a `MAX(pont)`-ot adó allekérdezés eredményével hasonlítsd össze a `pont` oszlopot.
starter_code:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont = ;
sample_solutions:
  sql: |
    SELECT nev, pont
    FROM diak
    WHERE pont = (SELECT MAX(pont) FROM diak);
