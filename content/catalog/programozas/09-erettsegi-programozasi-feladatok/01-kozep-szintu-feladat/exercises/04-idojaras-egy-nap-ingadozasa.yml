sample_solutions:
  python: |
    print("4. feladat")
    with open("homerseklet.txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    db = int(sorok[0])
    napok = []
    for sor in sorok[1:]:
        r = sor.split("\t")
        napok.append((int(r[0]), int(r[1]), int(r[2]), int(r[3])))
    print("Add meg a nap sorszamat:")
    kert = int(input())
    for nap in napok:
        if nap[0] == kert:
            print("Az ingadozas:", nap[2] - nap[1], "fok")
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Globalization;
    using System.IO;
    using System.Linq;

    class Program
    {
        static void Main()
        {
            Console.WriteLine("4. feladat");
            string[] sorok = File.ReadAllLines("homerseklet.txt");
            int db = int.Parse(sorok[0]);
            int[][] napok = new int[db][];
            for (int i = 0; i < db; i++)
            {
                string[] r = sorok[i + 1].Split('\t');
                napok[i] = new int[] { int.Parse(r[0]), int.Parse(r[1]), int.Parse(r[2]), int.Parse(r[3]) };
            }
            Console.WriteLine("Add meg a nap sorszamat:");
            int kert = int.Parse(Console.ReadLine());
            foreach (int[] nap in napok)
            {
                if (nap[0] == kert)
                {
                    Console.WriteLine("Az ingadozas: " + (nap[2] - nap[1]) + " fok");
                }
            }
        }
    }
