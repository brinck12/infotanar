description: |
  Az eredeti algoritmus eldöntést végez: van-e negatív szám a listában?

  ```text
  Algoritmus Van
    Be: N
    Be: lista[1..N]
    i := 1
    Ciklus amíg i ≤ N és lista[i] ≥ 0
      i := i + 1
    Ciklus vége
    Elágazás
      i ≤ N esetén: Ki: "igen"
      különben: Ki: "nem"
    Elágazás vége
  Algoritmus vége
  ```

  **Módosítsd** úgy, hogy ne igen/nem választ adjon, hanem az **első negatív szám sorszámát** (1-től számolva) írja ki; ha nincs negatív szám, a kimenet `0`. Kódold le a módosított algoritmust.

  Bemenet: az első sorban `N` (`0 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: a sorszám vagy `0`.

  Példa: `4`, majd `5`, `0`, `-2`, `-7` esetén a kimenet `3`.

  Tipp: a leírás indexe 1-től indul, a lista indexe 0-tól; a ciklus után az `i` éppen a keresett sorszám.
