description: |
  Két számsorozat érkezik négy sorban: az első elemszáma (N, legalább 1), maga a sorozat szóközzel elválasztva, a második elemszáma (M, legalább 1), majd az is. Egy sorozatban egy érték többször is szerepelhet. Írd ki a két sorozat **unióját** (azokat az értékeket, amelyek legalább az egyikben szerepelnek), mindegyiket egyszer, abban a sorrendben, ahogy először előfordulnak az első sorozat után a másodikat folytatva: `Unio: ...`.

  Példa bemenet:

  ```
  4
  4 1 7 4
  4
  9 4 6 1
  ```

  Kimenet:

  ```
  Unio: 4 1 7 9 6
  ```

  Tipp: először az első sorozat új elemei kerülnek az eredménybe, utána a másodikéi, mindig ellenőrizve, hogy az érték nincs-e még benne.
