slug: ejszakai-fuvarok
title: Éjszakai fuvarok
position: 4
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
description: |
    Éjszakainak számít az a fuvar, amely 22:00 után vagy 06:00 előtt indult (a 22:00 és a 05:59 is az). Listázd az azonosítóját (`id`), az indulás óráját (`ora`) és percét (`perc`).

    A `fuvar` tábla:

    | `id` | `rendszam` | `indulas` |
    |---|---|---|
    | 1 | ABC-123 | 2025-03-02 07:45:00 |
    | 2 | DEF-456 | 2025-03-02 22:10:00 |
    | 4 | ABC-123 | 2025-04-01 23:50:00 |
    | 5 | DEF-456 | 2025-04-03 09:05:00 |
    | 7 | GHI-789 | 2025-04-08 00:30:00 |

    Az eredmény ezekre az adatokra:

    | `id` | `ora` | `perc` |
    |---|---|---|
    | 2 | 22 | 10 |
    | 4 | 23 | 50 |
    | 7 | 0 | 30 |

    Tipp: két feltétel kell `OR`-ral összekötve: `HOUR(indulas) < 6 OR HOUR(indulas) >= 22`.
starter_code:
  sql: |
    SELECT id, HOUR(indulas) AS ora, MINUTE(indulas) AS perc
    FROM fuvar
    WHERE ...;
sample_solutions:
  sql: |
    SELECT id, HOUR(indulas) AS ora, MINUTE(indulas) AS perc
    FROM fuvar
    WHERE HOUR(indulas) < 6 OR HOUR(indulas) >= 22;
tests:
