description: |
  A `vetitesek.txt` a mozi vetítéseit tartalmazza, soronként egy vetítéssel, pontosvesszővel elválasztva: `cím;műfaj;játékidő percben;kezdés;eladott jegyek;jegyár`. A kezdés `ÓÓ:PP` alakú. Az adatokban nincs ékezet, a fájl legalább egy sort tartalmaz.

  **3. feladat.** Számolja meg az **esti** vetítéseket, vagyis azokat, amelyek kezdése 18:00 vagy későbbi! Írja ki a darabszámot és az esti vetítések jegybevételének összegét (az eladott jegyek és a jegyár szorzatainak összege).

  A mintafájlra a kimenet:

  ```text
  3. feladat: Esti vetitesek: 6 db, bevetel: 974200 Ft
  ```

  Tipp: a kezdés `ÓÓ:PP` alakú szöveg, az ábécérend megegyezik az időrenddel, ezért közvetlenül összehasonlítható a `"18:00"` szöveggel.
