sample_solutions:
  python: |
    n = int(input())
    elozo = int(input())
    rendezett = True
    for _ in range(n - 1):
        szam = int(input())
        if szam < elozo:
            rendezett = False
            break
        elozo = szam
    print('IGEN' if rendezett else 'NEM')
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int elozo = int.Parse(Console.ReadLine());
            bool rendezett = true;
            for (int i = 1; i < n; i++)
            {
                int szam = int.Parse(Console.ReadLine());
                if (szam < elozo)
                {
                    rendezett = false;
                    break;
                }
                elozo = szam;
            }
            Console.WriteLine(rendezett ? "IGEN" : "NEM");
        }
    }
