sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Konyv:
        cim: str
        oldal: int
        ar: int

    konyv = Konyv(input(), int(input()), int(input()))
    print("Cim: " + konyv.cim)
    print("Oldalszam:", konyv.oldal)
    print("Ar:", konyv.ar, "Ft")
    print("Oldalankenti ar:", konyv.ar // konyv.oldal, "Ft")
  csharp: |
    using System;

    class Konyv
    {
        public string Cim;
        public int Oldal;
        public int Ar;
    }

    class Program
    {
        static void Main()
        {
            var konyv = new Konyv();
            konyv.Cim = Console.ReadLine();
            konyv.Oldal = int.Parse(Console.ReadLine());
            konyv.Ar = int.Parse(Console.ReadLine());
            Console.WriteLine("Cim: " + konyv.Cim);
            Console.WriteLine("Oldalszam: " + konyv.Oldal);
            Console.WriteLine("Ar: " + konyv.Ar + " Ft");
            Console.WriteLine("Oldalankenti ar: " + (konyv.Ar / konyv.Oldal) + " Ft");
        }
    }
tests:
