  csharp: |
    using System;

    class Program
    {

        static void Main()
        {
            int a = int.Parse(Console.ReadLine());
            bool p1 = true;
            if (a < 2)
            {
                p1 = false;
            }
            for (int i = 2; i < a; i++)
            {
                if (a % i == 0)
                {
                    p1 = false;
                }
            }
            Console.WriteLine(p1 ? "igen" : "nem");
            int b = int.Parse(Console.ReadLine());
            bool p2 = true;
            if (b < 2)
