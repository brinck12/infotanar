sample_solutions:
  python: |
    from dataclasses import dataclass

    @dataclass
    class Diak:
        nev: str
        osztaly: str
        pont: int

    n = int(input())
    diakok = []
    for _ in range(n):
        resz = input().split(";")
        diakok.append(Diak(resz[0], resz[1], int(resz[2])))
    rang = sorted(diakok, key=lambda d: (d.osztaly, -d.pont, d.nev))
    for d in rang:
        print(d.osztaly, d.nev, d.pont)
  csharp: |
    using System;
    using System.Collections.Generic;
    using System.Linq;

    class Diak
    {
        public string Nev;
        public string Osztaly;
        public int Pont;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var diakok = new List<Diak>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                diakok.Add(new Diak { Nev = resz[0], Osztaly = resz[1], Pont = int.Parse(resz[2]) });
            }
            var rang = diakok
                .OrderBy(d => d.Osztaly, StringComparer.Ordinal)
                .ThenByDescending(d => d.Pont)
                .ThenBy(d => d.Nev, StringComparer.Ordinal)
                .ToList();
            foreach (var d in rang)
            {
                Console.WriteLine(d.Osztaly + " " + d.Nev + " " + d.Pont);
            }
        }
    }
