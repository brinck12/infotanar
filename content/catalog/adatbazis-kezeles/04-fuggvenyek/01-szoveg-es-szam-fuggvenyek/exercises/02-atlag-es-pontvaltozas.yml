      INSERT INTO diak VALUES (2, 'Nagy Bela', 'Nagy.Bela@SULI.hu', '10.B', 3.842, 70, 66);
      INSERT INTO diak VALUES (3, 'Toth Csaba', 'Toth.Csaba@SULI.hu', '10.A', 3.125, 55, 41);
      INSERT INTO diak VALUES (4, 'Szabo Dora', 'Szabo.Dora@SULI.hu', '11.A', 4.918, 80, 92);
