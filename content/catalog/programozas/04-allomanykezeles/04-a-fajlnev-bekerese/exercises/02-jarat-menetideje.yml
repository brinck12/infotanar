sample_solutions:
  python: |
    jarat = input()
    with open(jarat + ".txt", encoding="utf-8") as f:
        sorok = f.read().splitlines()
    osszes = 0
    leghosszabb = -1
    nev = ""
    for sor in sorok[1:]:
        mezok = sor.split("\t")
        perc = int(mezok[1])
        osszes += perc
        if perc > leghosszabb:
            leghosszabb = perc
            nev = mezok[0]
    print("Megallok:", len(sorok) - 1)
    print("Menetido:", osszes, "perc")
    print("Leghosszabb: " + nev + " (" + str(leghosszabb) + " perc)")
  csharp: |
    using System;
    using System.IO;

    class Program
    {
        static void Main()
        {
            string jarat = Console.ReadLine();
            string[] sorok = File.ReadAllLines(jarat + ".txt");
            int osszes = 0;
            int leghosszabb = -1;
            string nev = "";
            for (int i = 1; i < sorok.Length; i++)
            {
                string[] mezok = sorok[i].Split('\t');
                int perc = int.Parse(mezok[1]);
                osszes += perc;
                if (perc > leghosszabb)
                {
                    leghosszabb = perc;
                    nev = mezok[0];
                }
            }
            Console.WriteLine("Megallok: " + (sorok.Length - 1));
            Console.WriteLine("Menetido: " + osszes + " perc");
            Console.WriteLine("Leghosszabb: " + nev + " (" + leghosszabb + " perc)");
        }
    }
files:
  A.txt: A.txt
  B.txt: B.txt
