  csharp: |
    using System;
    using System.Collections.Generic;

    class Szemely
    {
        public string Nev;
        public int Kor;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var szemelyek = new List<Szemely>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                szemelyek.Add(new Szemely { Nev = resz[0], Kor = int.Parse(resz[1]) });
            }
            int mozgatas = 0;
            // beszúró rendezés kor szerint
        }
    }
sample_solutions:
  python: |
    n = int(input())
    szemelyek = []
    for _ in range(n):
        resz = input().split(";")
        szemelyek.append((resz[0], int(resz[1])))
    mozgatas = 0
    for i in range(1, n):
        x = szemelyek[i]
        j = i - 1
        while j >= 0 and szemelyek[j][1] > x[1]:
            szemelyek[j + 1] = szemelyek[j]
            mozgatas += 1
            j -= 1
        szemelyek[j + 1] = x
    for sz in szemelyek:
        print(sz[0], sz[1])
    print("Mozgatas:", mozgatas)
  csharp: |
    using System;
    using System.Collections.Generic;

    class Szemely
    {
        public string Nev;
        public int Kor;
    }

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            var szemelyek = new List<Szemely>();
            for (int i = 0; i < n; i++)
            {
                string[] resz = Console.ReadLine().Split(';');
                szemelyek.Add(new Szemely { Nev = resz[0], Kor = int.Parse(resz[1]) });
            }
            int mozgatas = 0;
            for (int i = 1; i < n; i++)
            {
                var x = szemelyek[i];
                int j = i - 1;
                while (j >= 0 && szemelyek[j].Kor > x.Kor)
                {
                    szemelyek[j + 1] = szemelyek[j];
                    mozgatas++;
                    j--;
                }
                szemelyek[j + 1] = x;
            }
            foreach (var sz in szemelyek)
            {
                Console.WriteLine(sz.Nev + " " + sz.Kor);
            }
            Console.WriteLine("Mozgatas: " + mozgatas);
        }
    }
