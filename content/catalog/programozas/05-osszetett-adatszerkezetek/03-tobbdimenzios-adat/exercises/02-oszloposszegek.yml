  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int[,] matrix = new int[r, c];
            for (int i = 0; i < r; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < c; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            // írd ki az oszlopösszegeket egy sorban
        }
    }
sample_solutions:
  python: |
    r, c = input().split()
    r = int(r)
    c = int(c)
    matrix = []
    for _ in range(r):
        matrix.append([int(x) for x in input().split()])
    osszegek = []
    for j in range(c):
        osszeg = 0
        for i in range(r):
            osszeg += matrix[i][j]
        osszegek.append(str(osszeg))
    print(" ".join(osszegek))
  csharp: |
    using System;
    using System.Collections.Generic;

    class Program
    {
        static void Main()
        {
            string[] meret = Console.ReadLine().Split(' ');
            int r = int.Parse(meret[0]);
            int c = int.Parse(meret[1]);
            int[,] matrix = new int[r, c];
            for (int i = 0; i < r; i++)
            {
                string[] sor = Console.ReadLine().Split(' ');
                for (int j = 0; j < c; j++)
                {
                    matrix[i, j] = int.Parse(sor[j]);
                }
            }
            var osszegek = new List<int>();
            for (int j = 0; j < c; j++)
            {
                int osszeg = 0;
                for (int i = 0; i < r; i++)
                {
                    osszeg += matrix[i, j];
                }
                osszegek.Add(osszeg);
            }
            Console.WriteLine(string.Join(" ", osszegek));
        }
    }
