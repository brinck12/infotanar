slug: b-betus-nevek
title: B betűs nevek
position: 3
kind: sql
level: kozep
difficulty: 2
published: false
allowed_languages: [sql]
description: |
  A `LIKE` mintával hasonlít össze szöveget: a `%` tetszőleges számú (akár nulla) karaktert, az `_` pontosan egy karaktert helyettesít. Például `'B%'`: B-vel kezdődő szöveg; `'%a'`: a-ra végződő.

  A `diak` tábla:

  | oszlop | típus |
  |---|---|
  | `id` | egész, elsődleges kulcs |
  | `nev` | szöveg |
  | `osztaly` | szöveg |
  | `pont` | egész |
  | `szuletes` | szöveg (dátum, ÉÉÉÉ-HH-NN) |

  Listázd ki azoknak a diákoknak a **nevét és osztályát**, akiknek a **neve B betűvel kezdődik**! A sorok sorrendje nem számít.

  Tipp: `WHERE nev LIKE 'B%'`
starter_code:
  sql: |
    SELECT nev, osztaly
    FROM diak
    WHERE ;
sample_solutions:
  sql: |
    SELECT nev, osztaly
    FROM diak
    WHERE nev LIKE 'B%';
