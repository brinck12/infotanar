slug: autok-atlagos-utja-es-legdragabb-fuvarja
title: Autók átlagos útja és legdrágább fuvarja
position: 2
kind: sql
level: kozep
difficulty: 3
published: false
allowed_languages: [sql]
sql_order_sensitive: true
description: |
    Rendszámonként (`rendszam`) add meg a fuvarok átlagos hosszát egy tizedesre kerekítve (`atlag_km`) és a legdrágább fuvar díját (`legdragabb`). Az eredmény rendszám szerint növekvő sorrendben legyen.

    A `fuvar` tábla:

    | `id` | `rendszam` | `indulas` | `km` | `dij` | `fizetes` | `ertekeles` |
    |---|---|---|---|---|---|---|
    | 1 | ABC-123 | 2025-01-05 08:15:00 | 5 | 2200 | keszpenz | 5 |
    | 2 | DEF-456 | 2025-01-05 21:40:00 | 12 | 4300 | kartya | 4 |
    | 3 | ABC-123 | 2025-01-17 23:05:00 | 20 | 6700 | kartya | NULL |
    | 4 | GHI-789 | 2025-02-03 06:30:00 | 8 | 3100 | keszpenz | 3 |
    | 5 | DEF-456 | 2025-02-14 19:55:00 | 3 | 1600 | kartya | 5 |
    | 6 | ABC-123 | 2025-02-20 02:10:00 | 15 | 5200 | kartya | NULL |
    | 7 | GHI-789 | 2025-01-28 12:00:00 | 10 | 3700 | kartya | 4 |
    | 8 | DEF-456 | 2025-01-30 10:20:00 | 7 | 2800 | keszpenz | 2 |

    Az eredmény ezekre az adatokra (a sorrend is számít):

    | `rendszam` | `atlag_km` | `legdragabb` |
    |---|---|---|
    | ABC-123 | 13.3 | 6700 |
    | DEF-456 | 7.3 | 4300 |
    | GHI-789 | 9.0 | 3700 |

    Tipp: a sorrendet az `ORDER BY` adja, és mindig a lekérdezés legvégén áll, a `GROUP BY` után.
starter_code:
  sql: |
    SELECT rendszam,
      AS atlag_km,
      AS legdragabb
    FROM fuvar
    GROUP BY rendszam
    ORDER BY ;
sample_solutions:
  sql: |
    SELECT rendszam, ROUND(AVG(km), 1) AS atlag_km, MAX(dij) AS legdragabb
    FROM fuvar
    GROUP BY rendszam
    ORDER BY rendszam;
