slug: 6-fesztivalok
title: 6. Fesztiválok
position: 4
kind: sql
level: emelt
difficulty: 3
published: false
allowed_languages:
- sql
description: |
  Egy jegyértékesítő rendszer két táblából áll.

  A `rendezveny` tábla a rendezvényeket tartalmazza:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `nev` | `VARCHAR(50)` |
  | `helyszin` | `VARCHAR(30)` (város) |
  | `datum` | `DATE` |
  | `kapacitas` | `INT`, a férőhelyek száma |

  A `jegy` tábla az eladott jegyeket:

  | oszlop | típus |
  |---|---|
  | `id` | `INT`, elsődleges kulcs |
  | `rendezveny_id` | `INT`, a `rendezveny` tábla `id` oszlopára mutat |
  | `vevo` | `VARCHAR(50)`, a vásárló neve |
  | `kategoria` | `VARCHAR(20)`: `allo`, `ules` vagy `vip` |
  | `ar` | `INT`, a jegy ára forintban |
  | `vasarlas` | `DATE`, a vásárlás napja |

  **6. feladat.** Adja meg lekérdezéssel azoknak a rendezvényeknek a nevét és helyszínét (**nev, helyszin**), amelyek **nevében szerepel a `fesztival` szó** (bárhol a névben), és **nem szegedi** rendezvények!
starter_code:
  sql: |
    SELECT nev, helyszin
    FROM rendezveny
    WHERE  AND ;
sample_solutions:
  sql: |
    SELECT nev, helyszin
    FROM rendezveny
    WHERE nev LIKE '%fesztival%' AND helyszin <> 'Szeged';
