description: |
  ## Feladat

  Olvass be egy `N` egész számot, majd `N` darab egész számot. Írd ki a **páros számok közül a legnagyobbat**! Ha nincs páros szám, a kiírandó szöveg `NINCS`.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy egész szám.

  ### Kimenet

  Egyetlen sorban a legnagyobb páros szám, vagy `NINCS`.

  ### Példa

  Bemenet: `5`, majd `3`, `8`, `5`, `12`, `7`. Kimenet: `12`

  Tipp: ez a feltételes maximum: a kiválogatás feltétele (páros) és a maximumkiválasztás egy ciklusban. Az első páros szám még nem kerülhet összehasonlításra, mert nincs mivel: ezt egy jelző (vagy `None`) mutatja.
