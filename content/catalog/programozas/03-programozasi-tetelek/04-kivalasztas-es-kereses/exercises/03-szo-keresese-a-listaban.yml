sample_solutions:
  python: |
    n = int(input())
    szavak = []
    for _ in range(n):
        szavak.append(input())
    keresett = input()
    hely = 0
    for i in range(n):
        if szavak[i] == keresett:
            hely = i + 1
            break
    if hely == 0:
        print('NINCS')
    else:
        print(hely)
  csharp: |
    using System;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            string[] szavak = new string[n];
            for (int i = 0; i < n; i++)
            {
                szavak[i] = Console.ReadLine();
            }
            string keresett = Console.ReadLine();
            int hely = 0;
            for (int i = 0; i < n; i++)
            {
                if (szavak[i] == keresett)
                {
                    hely = i + 1;
                    break;
                }
            }
            if (hely == 0)
            {
                Console.WriteLine("NINCS");
            }
            else
            {
                Console.WriteLine(hely);
            }
        }
    }
