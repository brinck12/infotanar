description: |
  Egy raktár készletlistájának első sora a tételek száma (N, legalább 1), majd N sor: `termek;db;egysegar` (a darabszám és az egységár egész szám, forintban). Egy tétel értéke a darabszám és az egységár szorzata.

  Írd ki a teljes készlet értékét (`Osszes ertek: ... Ft`), és a legnagyobb értékű tételt (`Legertekesebb: nev (... Ft)`). Egyenlő értéknél az előbb szereplő tétel számít.

  Példa bemenet:

  ```
  3
  alma;10;200
  korte;5;500
  szilva;20;100
  ```

  Kimenet:

  ```
  Osszes ertek: 6500 Ft
  Legertekesebb: korte (2500 Ft)
  ```

  Tipp: két tételt kell egyszerre kezelned: egy összegzést és egy maximumkiválasztást. Egyetlen ciklusban is megoldható.
