slug: az-atlag-ket-tizedessel
title: "Az átlag két tizedessel"
position: 2
kind: code
level: kozep
difficulty: 2
published: false
allowed_languages: [python, csharp]
description: |
  Az alábbi program a beolvasott számok átlagát írná ki két tizedesjeggyel. A `4`, majd `3`, `4`, `5`, `6` bemenetre `4`-et ír ki a helyes `4.50` helyett. Javítsd a hibát!

  Bemenet: az első sorban `N` (`1 ≤ N ≤ 100`), utána `N` sorban egy-egy egész szám. Kimenet: az átlag, pontosan két tizedesjeggyel, tizedesponttal (pl. `4.50`).

  Példa: `4`, majd `3`, `4`, `5`, `6` esetén a kimenet `4.50`.

  Tipp: két egész szám hányadosa lehet egész osztás eredménye is. Hogyan kapsz valódi (tizedestört) hányadost, és hogyan írod ki két tizedesre?
starter_code:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        osszeg += int(input())
    print(osszeg // n)
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                osszeg += int.Parse(Console.ReadLine());
            }
            Console.WriteLine(osszeg / n);
        }
    }
sample_solutions:
  python: |
    n = int(input())
    osszeg = 0
    for _ in range(n):
        osszeg += int(input())
    print(f"{osszeg / n:.2f}")
  csharp: |
    using System;
    using System.Globalization;

    class Program
    {
        static void Main()
        {
            int n = int.Parse(Console.ReadLine());
            int osszeg = 0;
            for (int i = 0; i < n; i++)
            {
                osszeg += int.Parse(Console.ReadLine());
            }
            double atlag = (double)osszeg / n;
            Console.WriteLine(atlag.ToString("F2", CultureInfo.InvariantCulture));
        }
    }
tests:
  - stdin: "4\n3\n4\n5\n6\n"
    expected: "4.50\n"
