allowed_languages: [python, csharp]
description: |
  Két szakkör névsora érkezik: az első szakkör létszáma (N, legalább 1), majd N sor, soronként egy név (ékezet nélkül); a második szakkör létszáma (M, legalább 1), majd M név. Egy névsorban a nevek különbözők. Írd ki a közös tagok számát (`Kozos tagok: k`), majd soronként a nevüket az első névsor sorrendjében.

  Példa bemenet:

  ```
  3
  Anna
  Bence
  Csilla
  3
  Csilla
  David
  Anna
  ```

  Kimenet:

  ```
  Kozos tagok: 2
  Anna
  Csilla
  ```

  Tipp: az első névsor minden nevére döntsd el, hogy szerepel-e a másodikban.
