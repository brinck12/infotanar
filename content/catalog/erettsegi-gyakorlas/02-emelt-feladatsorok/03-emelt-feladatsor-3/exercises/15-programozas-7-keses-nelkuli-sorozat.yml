  csharp: |
    using System;
    using System.Collections.Generic;
    using System.IO;

    class Indulas
    {
        public string Jarat;
        public string Cel;
        public int Tav;
        public int Nap;
        public string Ido;
        public int Utas;
        public int Keses;

        public Indulas(string sor)
        {
            string[] r = sor.Split(';');
            Jarat = r[0];
            Cel = r[1];
            Tav = int.Parse(r[2]);
            Nap = int.Parse(r[3]);
            Ido = r[4];
            Utas = int.Parse(r[5]);
            Keses = int.Parse(r[6]);
        }
    }

    class Program
    {
        static void Main()
        {
            List<Indulas> indulasok = new List<Indulas>();
            foreach (string sor in File.ReadAllLines("indulasok.txt"))
            {
                indulasok.Add(new Indulas(sor));
            }
            List<Indulas> rendezett = new List<Indulas>(indulasok);
            rendezett.Sort((a, b) =>
            {
                if (a.Nap != b.Nap)
                {
                    return a.Nap.CompareTo(b.Nap);
                }
                int c = string.CompareOrdinal(a.Ido, b.Ido);
                if (c != 0)
                {
                    return c;
                }
                return string.CompareOrdinal(a.Jarat, b.Jarat);
            });
            int legjobb = 0;
            int kezdet = -1;
            int aktualis = 0;
            for (int index = 0; index < rendezett.Count; index++)
            {
                if (rendezett[index].Keses == 0)
                {
                    aktualis++;
                    if (aktualis > legjobb)
                    {
                        legjobb = aktualis;
                        kezdet = index - aktualis + 1;
                    }
                }
                else
                {
                    aktualis = 0;
                }
            }
            if (legjobb == 0)
            {
                Console.WriteLine("7. feladat: Nem volt keses nelkuli indulas.");
            }
            else
            {
                Indulas elso = rendezett[kezdet];
                Indulas utolso = rendezett[kezdet + legjobb - 1];
                Console.WriteLine("7. feladat: A leghosszabb keses nelkuli sorozat " + legjobb + " indulas, " + elso.Jarat + " (" + elso.Nap + ". nap " + elso.Ido + ") es " + utolso.Jarat + " (" + utolso.Nap + ". nap " + utolso.Ido + ") kozott.");
            }
        }
    }
