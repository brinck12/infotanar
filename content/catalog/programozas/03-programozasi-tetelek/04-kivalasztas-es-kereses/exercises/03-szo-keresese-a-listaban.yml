description: |
  ## Feladat

  Olvass be egy `N` számot, majd `N` darab szót (soronként egyet), végül egy keresett szót. Írd ki, hogy a keresett szó **hányadik a listában** (az első szó sorszáma 1)! Ha többször is szerepel, az első előfordulás számít. Ha nincs a listában, a kiírandó szöveg `NINCS`. A kis- és nagybetű különbözik.

  ### Bemenet

  - Az első sorban egy `N` egész szám (`1 ≤ N ≤ 100`).
  - A következő `N` sorban egy-egy szó (ékezet nélkül, szóköz nélkül).
  - Az utolsó sorban a keresett szó.

  ### Kimenet

  Egyetlen sorban a sorszám, vagy `NINCS`.

  ### Példa

  Bemenet: `4`, majd `alma`, `korte`, `barack`, `szilva`, végül `barack`. Kimenet: `3`

  Tipp: előbb olvasd be az összes szót egy listába, és csak utána olvasd be a keresett szót; aztán a listán keress a ciklussal.
