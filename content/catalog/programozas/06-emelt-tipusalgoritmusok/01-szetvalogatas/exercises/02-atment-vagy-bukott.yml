published: false
allowed_languages: [python, csharp]
description: |
  Egy osztály félévi jegyei: az első sor a tanulók száma (N, legalább 1), majd N sor: `nev;jegy` (a jegy 1 és 5 közötti egész). A 2-es vagy jobb jegy átmenő. Írd ki két sorban, a bemenet sorrendjében, a neveket vesszővel és szóközzel (`, `) elválasztva: `Atment: ...` és `Bukott: ...`. Üres csoportnál a kettőspont után `-` álljon.

  Példa bemenet:

  ```
  4
  Anna;5
  Bence;1
  Csilla;2
  David;1
  ```

  Kimenet:

  ```
  Atment: Anna, Csilla
  Bukott: Bence, David
  ```

  Tipp: a rekordot (vagy legalább a nevet) tedd a megfelelő listába, a kiíráshoz a nevek listáját kell összefűznöd.
