description: |
  Készíts `Teglalap` osztályt két oldallal (`a`, `b`) és két metódussal: `terulet()` és `kerulet()`. A program olvasson be két egész számot (az oldalakat, külön sorban), hozzon létre egy téglalapot, és írja ki a `Terulet: ...` és `Kerulet: ...` sorokat.

  Példa bemenet:

  ```
  3
  4
  ```

  Kimenet:

  ```
  Terulet: 12
  Kerulet: 14
  ```

  Tipp: a számítás a metódusokba kerüljön, a kiírás pedig csak hívja őket.
